# cargo-nextest's settings, for the `rust` job in `.github/workflows/ci.yml`. A machine without
# nextest runs the same tests with `cargo test --workspace`; nothing here changes what a test does.

[profile.default]
# The whole suite's result, never its first red: what `cargo test --no-fail-fast` gave.
fail-fast = false

# nextest runs each test in a process of its own, so a lock a test binary holds in a static no
# longer orders tests against each other. The floods of `unread_answers` are run one at a time
# by such a lock so that they do not compete for the machine; this group keeps that.
[test-groups]
floods = { max-threads = 1 }
# The three loopback ports a GitLab sign-in comes back on are the machine's, and the sign-in's
# cases bind them for real. The `Mutex` in that file orders them only inside one process, and
# each test has a process of its own: one case's listener was bound under another's ("the
# listener was still bound after the redirect"), and one waited out its 300 s for a redirect on a
# port a sibling had left (#7557, #7572).
registered-ports = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(fake-harness) & binary(unread_answers)"
test-group = "floods"

[[profile.default.overrides]]
filter = "package(purlis-core) & binary(it) & test(/^a_gitlab_sign_in_through_the_browser::/)"
test-group = "registered-ports"

[profile.ci]
# A failed test is run once more before it counts. From 2026-10-22 to 10-27, 26 to 57 runs a day
# went green only on a rerun of the whole run (about 35 minutes each), most of them one test that
# failed once. Retried here, such a test costs seconds; it is still named, as a warning on the
# run with what its failed attempt said (`tools/slowest-tests.mjs`), so a flake stays visible
# and is filed, never silently absorbed. A test that fails both times fails the job as before.
retries = 1
# A test that failed prints its output again at the end of the run, where the job log ends.
final-status-level = "fail"
failure-output = "immediate-final"
# A test that hangs is ended after five minutes and fails by name, in the run's annotations,
# instead of holding its job until the job's own limit cancels it with nothing said. Every
# test but the one named below takes under a minute.
slow-timeout = { period = "60s", terminate-after = 5 }

# The one test that is long by what it does: the whole verdict on every hostile shape, at two
# depths and in two modes, each held to its own bound inside the test. Its sum grows with every
# shape added and has taken from 150 s to 275 s on a runner, so it is given fifteen minutes
# before it is called hung. The bound on each verdict is the test's own and is not this.
[[profile.ci.overrides]]
filter = "package(purlis-core) & binary(it) & test(/^every_guard_reads_a_hostile_command_in_linear_time::/)"
slow-timeout = { period = "60s", terminate-after = 15 }
# Not given `priority = 100`, though it starts 7.5 minutes into its part and ends the part alone,
# about 1.5 minutes that starting first would save (#4255). Tried on 2026-10-31: under load from the
# start it passed twice, then took 346 s and failed its 20 s bound at 24 s, on one attempt of three.
# Not retried: its bounds are a verdict on speed, and a retry of a hang would hold the job for
# thirty minutes of its forty-five.
retries = 0

# A person's whole way through a Docker pool: each step's real work, a harness fetched and a large
# settings folder sent three times over, with two runners made and one left to drain.
[[profile.ci.overrides]]
filter = "package(purlis-app) & test(/^behaviour::pool_journey::in_a_docker_pool$/)"
slow-timeout = { period = "60s", terminate-after = 15 }
retries = 0

# A runner's host kept by systemd, through a restart of its machine and then beside newer versions:
# an old version's host waits its minute idle before it stops itself, and the one with a live chat
# is watched past that minute to see that it does not (#6704). About four minutes of waiting that
# is the test's own, so it is given ten before it is called hung.
[[profile.ci.overrides]]
filter = "package(purlis-core) & binary(it) & test(/^an_ssh_runner_host_outlives_the_sign_out_and_a_restart::/)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The fault suite (#7188): a live chat on a machine with a fault put on it, each case waiting out
# its own limits (up to 90 s for the host to answer, 180 s for a first link, 90 s of drop, a
# machine's 60 s shutdown and boot), the worst about eight minutes. Without this a case is killed
# at the default five (60 s x 5), which reds `remote-parity` and every PR that touches remote code.
# Ten, as the systemd runner's test above: a hung case is called hung at ten.
[[profile.ci.overrides]]
filter = "package(purlis-core) & binary(it) & test(/^a_live_remote_chat_survives_the_faults_that_define_trust::/)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The remote start's step table (#7182) is this test's output, not a diagnosis: it prints what each
# step of a start cost over SSH, the baseline `docs/research/2026-11-remote-start-baseline.md` is
# read from. nextest keeps a passing test's output to itself and a job's summary cannot be read
# through the API, so on a pass the table was nowhere a person or a chat could fetch it (run
# 45681258419). Shown as the test ends, it is in the `remote-parity` job's log.
[[profile.ci.overrides]]
filter = "package(purlis-core) & binary(it) & test(/^a_remote_docker_pool_is_reached_over_ssh::a_start_on_a_remote_pool_times_each_of_its_steps$/)"
success-output = "immediate"

# What `cargo nextest archive --profile ci` keeps besides the test binaries and the programs they
# are built to run (`CARGO_BIN_EXE_*`) (`rust-build` in `.github/workflows/ci.yml`, spec #7324): the
# programs a test looks for beside its own binary and otherwise builds for itself, which the job
# builds first. Missing is an error, so a program the tests need is never quietly left out.
[profile.ci.archive]
include = [
    { path = "debug/extension-probe", relative-to = "target", on-missing = "error" },
    { path = "debug/check-probe", relative-to = "target", on-missing = "error" },
    { path = "debug/fake-harness", relative-to = "target", on-missing = "error" },
    { path = "debug/sandbox-probe", relative-to = "target", on-missing = "error" },
]

# The run's report, at `target/nextest/ci/junit.xml`: `tools/slowest-tests.mjs` reads each
# test's time from it and annotates the run with the slowest tests and binaries.
[profile.ci.junit]
path = "junit.xml"
