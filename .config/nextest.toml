# cargo-nextest's settings, for the `rust` job in `.github/workflows/ci.yml`. A machine without
# nextest runs the same tests with `cargo test --workspace`; nothing here changes what a test does.

[profile.default]
# The whole suite's result, never its first red: what `cargo test --no-fail-fast` gave.
fail-fast = false

# nextest runs each test in a process of its own, so a lock a test binary holds in a static no
# longer orders tests against each other. The floods of `unread_answers` are run one at a time
# by such a lock so that they do not compete for the machine; this group keeps that.
[test-groups]
floods = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(fake-harness) & binary(unread_answers)"
test-group = "floods"

[profile.ci]
# A failed test is run once more before it counts. From 2026-10-22 to 10-27, 26 to 57 runs a day
# went green only on a rerun of the whole run (about 35 minutes each), most of them one test that
# failed once. Retried here, such a test costs seconds; it is still named, as a warning on the
# run with what its failed attempt said (`tools/slowest-tests.mjs`), so a flake stays visible
# and is filed, never silently absorbed. A test that fails both times fails the job as before.
retries = 1
# A test that failed prints its output again at the end of the run, where the job log ends.
final-status-level = "fail"
failure-output = "immediate-final"
# A test that hangs is ended after five minutes and fails by name, in the run's annotations,
# instead of holding its job until the job's own limit cancels it with nothing said. Every
# test but the one named below takes under a minute.
slow-timeout = { period = "60s", terminate-after = 5 }

# The one test that is long by what it does: the whole verdict on every hostile shape, at two
# depths and in two modes, each held to its own bound inside the test. Its sum grows with every
# shape added and has taken from 150 s to 275 s on a runner, so it is given fifteen minutes
# before it is called hung. The bound on each verdict is the test's own and is not this.
[[profile.ci.overrides]]
filter = "package(purlis-core) & binary(it) & test(/^every_guard_reads_a_hostile_command_in_linear_time::/)"
slow-timeout = { period = "60s", terminate-after = 15 }
# Not retried: its bounds are a verdict on speed, and a retry of a hang would hold the job for
# thirty minutes of its forty-five.
retries = 0

# The run's report, at `target/nextest/ci/junit.xml`: `tools/slowest-tests.mjs` reads each
# test's time from it and annotates the run with the slowest tests and binaries.
[profile.ci.junit]
path = "junit.xml"
