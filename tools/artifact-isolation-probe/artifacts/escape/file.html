<html><head><meta charset="utf-8" /><title>file</title>
<script>
  // The page's channel: the port purlis hands a frame, or a native webview's /.purlis/say.
  let port = null;
  const queue = [];
  const framed = window.top !== window;
  addEventListener("message", (e) => {
    if (!port && e.data && e.data.purlis === "port" && e.ports[0]) {
      port = e.ports[0];
      queue.splice(0).forEach((m) => port.postMessage(m));
    }
  });
  function say(m) {
    if (port) port.postMessage(m);
    else if (framed) queue.push(m);
    else new Image().src = "/.purlis/say?m=" + encodeURIComponent(JSON.stringify(m));
  }
</script>
<script>
  // Test 4's file: case. Nothing a page could see says whether a file: load happened, so this
  // page alone asks with script, for a file the probe names in its fragment.
  const img = new Image();
  img.onload = () => say("loaded");
  img.onerror = () => say("blocked");
  img.src = decodeURIComponent(location.hash.slice(1));
</script>
</head><body>file</body></html>
