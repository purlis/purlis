<html><head><meta charset="utf-8" /><title>walk</title>
<script>
  // The page's channel: the port purlis hands a frame, or a native webview's /.purlis/say.
  let port = null;
  const queue = [];
  const framed = window.top !== window;
  addEventListener("message", (e) => {
    if (!port && e.data && e.data.purlis === "port" && e.ports[0]) {
      port = e.ports[0];
      queue.splice(0).forEach((m) => port.postMessage(m));
    }
  });
  function say(m) {
    if (port) port.postMessage(m);
    else if (framed) queue.push(m);
    else new Image().src = "/.purlis/say?m=" + encodeURIComponent(JSON.stringify(m));
  }
</script>
<script>
  // Test 5: requests that try to walk out of the folder. Only its own file may load.
  const TRIES = [
    "inside.png",
    "../outside/secret.png",
    "%2e%2e/outside/secret.png",
    "..%2foutside%2fsecret.png",
    "..%2Foutside%2Fsecret.png",
    "%2e%2e%2foutside%2fsecret.png",
    "sub/..%2f..%2foutside%2fsecret.png",
    "..%5coutside%5csecret.png",
    "..\\outside\\secret.png",
    "INSIDE.PNG",
    "Inside.png",
    "late.png",
  ];
  const loaded = [];
  Promise.all(
    TRIES.map(
      (path) =>
        new Promise((done) => {
          const img = new Image();
          img.onload = () => { loaded.push(path); done(); };
          img.onerror = () => done();
          img.src = path;
        }),
    ),
  ).then(() => say({ loaded: TRIES.filter((t) => loaded.includes(t)), tried: TRIES }));
</script>
</head><body>walk</body></html>
