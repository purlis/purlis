<html><head><meta charset="utf-8" /><title>intruder</title>
<script>
  // The page's channel: the port purlis hands a frame, or a native webview's /.purlis/say.
  let port = null;
  const queue = [];
  const framed = window.top !== window;
  addEventListener("message", (e) => {
    if (!port && e.data && e.data.purlis === "port" && e.ports[0]) {
      port = e.ports[0];
      queue.splice(0).forEach((m) => port.postMessage(m));
    }
  });
  function say(m) {
    if (port) port.postMessage(m);
    else if (framed) queue.push(m);
    else new Image().src = "/.purlis/say?m=" + encodeURIComponent(JSON.stringify(m));
  }
</script>
<script>
  // Test 3: a second artifact tries to be heard as the speaker.
  const forged = "forged by a second artifact";
  try { top.postMessage(forged, "*"); } catch {}
  try { for (let i = 0; i < top.frames.length; i++) top.frames[i].postMessage(forged, "*"); } catch {}
  new Image().src = "%ORIGIN:speaker%/.purlis/say?m=" + encodeURIComponent(JSON.stringify(forged));
  setTimeout(() => say("intruder, on its own channel"), 300);
</script>
</head><body>intruder</body></html>
