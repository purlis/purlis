{{/*
What the operator may do: this ClusterRole and nothing else. No value of the chart reaches it.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: purlis-cluster-operator
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
rules:
  # A team's pools and people's claims: read, and a claim's status written. Claims are read
  # from the operator's own watch; a pool is read by name when a claim names it.
  - apiGroups: [runners.purlis.dev]
    resources: [pools]
    verbs: [get, list, watch]
  - apiGroups: [runners.purlis.dev]
    resources: [claims]
    verbs: [list, watch]
  - apiGroups: [runners.purlis.dev]
    resources: [claims/status]
    verbs: [patch]
  # Each pool's status names the key the operator signs runners' link keys with, for a desktop
  # to pin as it adds the pool.
  - apiGroups: [runners.purlis.dev]
    resources: [pools/status]
    verbs: [patch]
  # The runner pod upstream made for a claim's sandbox, read by its name, for the link key its
  # first step published in its status, which the operator vouches for. Never made, changed,
  # deleted, listed, exec'd or attached to: upstream's controller makes it.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  # The sandbox upstream made for a claim, read by its name, so a claim is followed to its pod
  # by uid: the sandbox is the upstream claim's, and the pod the sandbox's. Patched in its
  # operating mode, to suspend a stopped claim's runner and run it again (#2058): RBAC cannot
  # narrow this to that field, so the policy in sandbox-policy.yaml (policy.yaml) does.
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, patch]
  # The policy's binding, by name only: the operator acts only on Claims admitted under it.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicybindings]
    resourceNames: [purlis-claims-use-their-pool]
    verbs: [get, list, watch]
  # Upstream's objects a claim becomes: watched, so a claim is looked at again when one of
  # them changes or goes; each read by name first, since the operator changes only objects it
  # made, then made or applied server-side. Deleting them is the cluster's garbage
  # collector's, through their owners: the operator holds no delete.
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims, sandboxtemplates, sandboxwarmpools]
    verbs: [create, get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: purlis-cluster-operator
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: purlis-cluster-operator
subjects:
  - kind: ServiceAccount
    name: purlis-cluster-operator
    namespace: {{ .Release.Namespace }}
