{{/*
What the operator may do: this ClusterRole, and only where forge.keySecretNames names a Secret,
the Role in forge-key-reader.yaml. No value of the chart reaches this one.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: purlis-cluster-operator
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
rules:
  # A team's pools and people's claims: read, and a claim's status written. Claims are read
  # from the operator's own watch; a pool is read by name when a claim names it. A claim is
  # patched only for its finalizer, runners.purlis.dev/runner, which keeps it until its runner
  # is removed (#2055). Deleted only once its retention has ended (#3981, ruled 2026-11-01), as
  # the policy in retention-policy.yaml (policy.yaml) holds it.
  - apiGroups: [runners.purlis.dev]
    resources: [pools]
    verbs: [get, list, watch]
  - apiGroups: [runners.purlis.dev]
    resources: [claims]
    verbs: [delete, get, list, patch, watch]
  - apiGroups: [runners.purlis.dev]
    resources: [claims/status]
    verbs: [patch]
  # Each pool's status names the key the operator signs runners' link keys with and its
  # cluster, for a desktop to pin as it adds the pool, and during a roll the next key (#3305).
  - apiGroups: [runners.purlis.dev]
    resources: [pools/status]
    verbs: [patch]
  # The runner pod upstream made for a claim's sandbox, read by its name, for the link key its
  # first step published in its status, which the operator vouches for. Never made, changed,
  # deleted, listed, exec'd or attached to: upstream's controller makes it.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  # The sandbox upstream made for a claim, read by its name, so a claim is followed to its pod
  # by uid: the sandbox is the upstream claim's, and the pod the sandbox's. Patched in its
  # operating mode, to suspend a stopped claim's runner and run it again (#2058): RBAC cannot
  # narrow this to that field, so the policy in sandbox-policy.yaml (policy.yaml) does.
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, patch]
  # The policies' bindings, by name only: the operator acts only on Claims admitted under the
  # policy on Claims, in runner namespaces made under the policy on runner namespaces, and mints
  # only under the policy on App keys, which it reads too (#4206).
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicybindings]
    resourceNames: [purlis-claims-use-their-pool, purlis-runner-namespaces, purlis-forge]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies]
    resourceNames: [purlis-forge]
    verbs: [get]
  # Asked before each mint: may this Claim's requester still use its Pool (#4206)? It answers
  # questions and grants nothing.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # A runner namespace's way to the mint port (#4206), for a Claim on an opted-in Pool, as the
  # policy on runner namespaces holds it: made, then read and brought back, by name only.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [purlis-forge-mint]
    verbs: [get, patch]
  # Upstream's objects a claim becomes, in its requester's runner namespace: watched, so a
  # claim is looked at again when one of them changes or goes; each read by name first, since
  # the operator changes only objects it made, then made or applied server-side, and deleted
  # by uid by a deleted claim's finalizer (#2055).
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims, sandboxtemplates, sandboxwarmpools]
    verbs: [create, delete, get, list, patch, watch]
  # Each person's runner namespace, purlis-runners-<hash> (#2055): made once, and read to
  # check it is the one the operator made for them. Never changed or deleted. kube-system is
  # read too, once as the operator starts, for its uid, which names the cluster on every Pool
  # and in every statement (#3305).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get]
  # In it, the binding that gives the person alone purlis-runner-owner, and their quota:
  # made, then read and brought back to what they should say, by name only.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    resourceNames: [purlis-runner-owner]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [create]
  - apiGroups: [""]
    resources: [resourcequotas]
    resourceNames: [purlis-person]
    verbs: [get, patch]
  # The one role it may bind, which it holds none of: a person's own runners.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [purlis-runner-owner]
    verbs: [bind]
---
{{- /*
What a person may do in their own runner namespace (#2055), bound there by the operator to
them alone: see their runners' pods, exec into them, as their desktop pairs and links over
kubectl exec, and read their logs. No value of the chart reaches it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: purlis-runner-owner
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # create, which kubectl exec asks for; get too, which a websocket exec asks for where the
  # cluster does not authorize it as create.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: purlis-cluster-operator
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: purlis-cluster-operator
subjects:
  - kind: ServiceAccount
    name: purlis-cluster-operator
    namespace: {{ .Release.Namespace }}
