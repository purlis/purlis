{{/*
Each person's runner namespace, purlis-runners-<hash> (#2055): only the cluster operator makes
one, or changes who it is for; and the operator binds purlis-runner-owner, and caps a person
with purlis-person, and opens the way to its mint port with purlis-forge-mint, only there, for the one person the namespace is for. Kept when the release is uninstalled, as the
policy on Claims is.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-runner-namespaces
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [namespaces, namespaces/status, namespaces/finalize, resourcequotas]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [rolebindings]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [networkpolicies]
  variables:
    - name: operator
      expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator'
    - name: runners
      expression: >-
        request.resource.resource == 'namespaces' ?
        object.metadata.name.startsWith('purlis-runners-') :
        request.namespace.startsWith('purlis-runners-')
    # Who a runner namespace is for, by the marks the operator puts on it.
    - name: marks
      expression: >-
        request.resource.resource != 'namespaces' ? [] :
        [has(object.metadata.labels) && 'app.kubernetes.io/managed-by' in object.metadata.labels ?
        object.metadata.labels['app.kubernetes.io/managed-by'] : '',
        has(object.metadata.annotations) && 'runners.purlis.dev/requester' in object.metadata.annotations ?
        object.metadata.annotations['runners.purlis.dev/requester'] : '']
    - name: oldMarks
      expression: >-
        request.resource.resource != 'namespaces' || request.operation != 'UPDATE' ? [] :
        [has(oldObject.metadata.labels) && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels ?
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] : '',
        has(oldObject.metadata.annotations) && 'runners.purlis.dev/requester' in oldObject.metadata.annotations ?
        oldObject.metadata.annotations['runners.purlis.dev/requester'] : '']
    # Who the runner namespace a role binding is made in is for: the one subject it may name.
    - name: requester
      expression: >-
        request.resource.resource == 'rolebindings' && namespaceObject != null &&
        has(namespaceObject.metadata.annotations) &&
        'runners.purlis.dev/requester' in namespaceObject.metadata.annotations ?
        namespaceObject.metadata.annotations['runners.purlis.dev/requester'] : ''
  validations:
    # A runner namespace is made by the operator alone, and who it is for is changed by no one
    # else.
    - expression: >-
        request.resource.resource != 'namespaces' || variables.operator || !variables.runners ||
        request.operation == 'UPDATE' && variables.marks == variables.oldMarks
      messageExpression: >-
        'Only the purlis cluster operator makes a runner namespace (purlis-runners-*), or changes who it is for.'
      reason: Forbidden
    # The operator's mark on a namespace opens its mint port to it (#4206), so no one else puts
    # it on a namespace that is not a runner namespace.
    - expression: >-
        request.resource.resource != 'namespaces' || variables.operator || variables.runners ||
        variables.marks[0] != 'purlis-cluster-operator'
      messageExpression: >-
        'Only the purlis cluster operator marks a namespace as its own, and only a runner namespace.'
      reason: Forbidden
    # The operator makes no other namespace.
    - expression: >-
        request.resource.resource != 'namespaces' || !variables.operator || variables.runners
      messageExpression: >-
        'The purlis cluster operator makes runner namespaces (purlis-runners-*) alone.'
      reason: Forbidden
    # The operator binds one role, purlis-runner-owner, in a runner namespace alone, to the one
    # person that namespace is for, who is not the operator itself.
    - expression: >-
        request.resource.resource != 'rolebindings' || !variables.operator ||
        variables.runners && variables.requester != '' &&
        variables.requester != 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' &&
        object.metadata.name == 'purlis-runner-owner' &&
        object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'purlis-runner-owner' &&
        has(object.subjects) && size(object.subjects) == 1 &&
        (object.subjects[0].kind == 'User' && !object.subjects[0].name.startsWith('system:') &&
        object.subjects[0].name == variables.requester ||
        object.subjects[0].kind == 'ServiceAccount' && has(object.subjects[0].namespace) &&
        'system:serviceaccount:' + object.subjects[0].namespace + ':' + object.subjects[0].name ==
        variables.requester)
      messageExpression: >-
        'The purlis cluster operator binds purlis-runner-owner alone, in a runner namespace alone, to the one person it is for, who is not the operator.'
      reason: Forbidden
    # The operator caps a person in their runner namespace alone, with purlis-person.
    - expression: >-
        request.resource.resource != 'resourcequotas' || !variables.operator ||
        variables.runners && object.metadata.name == 'purlis-person'
      messageExpression: >-
        'The purlis cluster operator makes the quota purlis-person, in a runner namespace alone.'
      reason: Forbidden
    # The operator makes one NetworkPolicy, in a runner namespace alone, and what it says is its
    # way to the mint port (#4206): a way out, to its own pods, on that port, and nothing else.
    - expression: >-
        request.resource.resource != 'networkpolicies' || !variables.operator ||
        variables.runners && object.metadata.name == 'purlis-forge-mint' &&
        object.spec.policyTypes == ['Egress'] && !has(object.spec.ingress) &&
        size(object.spec.egress) == 1 && size(object.spec.egress[0].to) == 1 &&
        object.spec.egress[0].to[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == '{{ .Release.Namespace }}' &&
        object.spec.egress[0].to[0].podSelector.matchLabels['app.kubernetes.io/name'] == 'purlis-cluster-operator' &&
        size(object.spec.egress[0].ports) == 1 && object.spec.egress[0].ports[0].port == 8443
      messageExpression: >-
        'The purlis cluster operator makes the NetworkPolicy purlis-forge-mint, in a runner namespace alone, to its own mint port alone.'
      reason: Forbidden
    # A runner namespace the operator makes admits only pods meeting the restricted Pod Security
    # Standard (#3824).
    - expression: >-
        request.resource.resource != 'namespaces' || !variables.operator ||
        request.operation != 'CREATE' ||
        has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'
      messageExpression: >-
        'The purlis cluster operator makes a runner namespace only under the restricted Pod Security Standard.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-runner-namespaces
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-runner-namespaces
  validationActions: [Deny]
