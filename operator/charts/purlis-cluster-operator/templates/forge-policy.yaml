{{/*
Who may spend a GitHub App key, and who says which repos a Claim's token covers (#4206). A policy
and binding of their own: the operator mints only for a Claim and a Pool made once this binding has
settled, so nothing written before these rules held can reach a token. Kept when the release is
uninstalled, as the policy on Claims is.

A Pool that names a key says who wrote its forge, in its annotation runners.purlis.dev/forge-writer,
set in the same write to the writer's own name: the operator asks before each mint whether that
person may still `use` the key, so revoking it stops minting for every Pool they wrote. Whether an
upstream claim in a runner namespace was born on a Pool naming a key
(runners.purlis.dev/born-minting) only the operator says, as it makes the claim, and nobody
changes it after.

On a Pool that mints, changing its image, turning its minting on and running it again once it is
stopped each take `use` on its key too: stopping is a gate on minting, and revoking `use` on the
key is what takes the key away from whoever may write the Pool.

A cluster admin grants `use` on one key, by its Secret's name. `forgekeys` names a right: the
cluster holds no such object.

  apiGroups: [runners.purlis.dev]
  resources: [forgekeys]
  resourceNames: [org-app]
  verbs: [use]
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-forge
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [pools]
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [claims]
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxclaims]
  variables:
    # Who a Pool says wrote its forge, as a list of at most one, so that none said matches none
    # said; and who it said before this write.
    - name: forgeWriter
      expression: >-
        has(object.metadata.annotations) &&
        'runners.purlis.dev/forge-writer' in object.metadata.annotations ?
        [object.metadata.annotations['runners.purlis.dev/forge-writer']] : []
    - name: heldForgeWriter
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.annotations) &&
        'runners.purlis.dev/forge-writer' in oldObject.metadata.annotations ?
        [oldObject.metadata.annotations['runners.purlis.dev/forge-writer']] : []
    # Whether an upstream claim says it was born on a Pool naming a key, the same way.
    - name: bornMinting
      expression: >-
        has(object.metadata.annotations) &&
        'runners.purlis.dev/born-minting' in object.metadata.annotations ?
        [object.metadata.annotations['runners.purlis.dev/born-minting']] : []
    - name: heldBornMinting
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.annotations) &&
        'runners.purlis.dev/born-minting' in oldObject.metadata.annotations ?
        [oldObject.metadata.annotations['runners.purlis.dev/born-minting']] : []
  validations:
    # Writing a Pool's spec.forge is spending the key it names, so the writer needs `use` on that
    # key. Any other change to a Pool, and taking its forge off, asks nothing.
    - expression: >-
        request.resource.resource != 'pools' || !has(object.spec.forge) ||
        (request.operation == 'UPDATE' && has(oldObject.spec.forge) &&
        object.spec.forge == oldObject.spec.forge) ||
        authorizer.group('runners.purlis.dev').resource('forgekeys')
        .name(object.spec.forge.appKeySecretRef.name).check('use').allowed()
      messageExpression: >-
        'You may not use the GitHub App key ' + object.spec.forge.appKeySecretRef.name + '. A cluster admin can grant use on it (forgekeys).'
      reason: Forbidden
    # On a Pool that mints, its image holds the link keys the operator vouches for, so changing
    # it is spending the key too, and so is turning minting on, which adopts the image the Pool
    # already names, whoever set it.
    - expression: >-
        request.resource.resource != 'pools' || request.operation != 'UPDATE' ||
        !has(object.spec.forge) || !object.spec.forge.mintInCluster ||
        (object.spec.image == oldObject.spec.image &&
        has(oldObject.spec.forge) && oldObject.spec.forge.mintInCluster) ||
        authorizer.group('runners.purlis.dev').resource('forgekeys')
        .name(object.spec.forge.appKeySecretRef.name).check('use').allowed()
      messageExpression: >-
        'This pool mints with the GitHub App key ' + object.spec.forge.appKeySecretRef.name + ', so changing its image, or turning its minting on, takes use on that key (forgekeys).'
      reason: Forbidden
    # A stopped Pool that mints gets no token minted for its runners, so running it again is
    # spending its key: whoever may write the Pool but holds no `use` on the key may stop it, and
    # no more. Revoking `use` on the key is what takes it away from a Pool's writers.
    - expression: >-
        request.resource.resource != 'pools' || request.operation != 'UPDATE' ||
        !oldObject.spec.stopped || object.spec.stopped ||
        !has(object.spec.forge) || !object.spec.forge.mintInCluster ||
        authorizer.group('runners.purlis.dev').resource('forgekeys')
        .name(object.spec.forge.appKeySecretRef.name).check('use').allowed()
      messageExpression: >-
        'This pool mints with the GitHub App key ' + object.spec.forge.appKeySecretRef.name + ', so running it again once it is stopped takes use on that key (forgekeys).'
      reason: Forbidden
    # The repos a claim names say what its runner's token may cover, within its Pool's allow-list.
    # Someone else who may patch claims in the namespace has no say in that, and nor has its
    # requester once they may no longer use the pool. Any other patch is left alone, so a
    # finalizer's removal never depends on the authorizer.
    - expression: >-
        request.resource.resource != 'claims' ||
        (has(object.spec.forge) ?
        has(oldObject.spec.forge) && object.spec.forge == oldObject.spec.forge :
        !has(oldObject.spec.forge)) ||
        (request.userInfo.username == object.spec.requester &&
        authorizer.group('runners.purlis.dev').resource('pools')
        .name(object.spec.pool).check('use').allowed())
      messageExpression: >-
        'Only ' + object.spec.requester + ', who asked for this claim, while they may use its pool, may change the repos it names.'
      reason: Forbidden
    # Whoever writes a Pool's forge, or who it says wrote it, says so in the same write, by their
    # own name: the operator asks before each mint whether that person may still use the key.
    # A Pool that names no key needs no writer, and taking its forge off asks nothing. Any other
    # change to a Pool leaves both as they were and asks nothing.
    - expression: >-
        request.resource.resource != 'pools' ||
        (request.operation == 'UPDATE' &&
        (has(object.spec.forge) ?
        has(oldObject.spec.forge) && object.spec.forge == oldObject.spec.forge :
        !has(oldObject.spec.forge)) &&
        variables.forgeWriter == variables.heldForgeWriter) ||
        variables.forgeWriter == [request.userInfo.username] ||
        (!has(object.spec.forge) &&
        (variables.forgeWriter == [] || variables.forgeWriter == variables.heldForgeWriter))
      messageExpression: >-
        'A pool that names a GitHub App key says who wrote its forge: set its annotation runners.purlis.dev/forge-writer to ' + request.userInfo.username + ' in the same write.'
      reason: Forbidden
    # Whether an upstream claim was born on a Pool naming a key is what a mint asks of it: only
    # the operator says it, as it makes the claim, and nobody adds, changes or removes it after.
    # The operator's own writes are held further by the policy on what it writes.
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        (request.operation == 'CREATE' ?
        variables.bornMinting == [] ||
        request.userInfo.username ==
        'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' :
        variables.bornMinting == variables.heldBornMinting)
      message: >-
        Only purlis's cluster operator says whether a claim is born minting
        (runners.purlis.dev/born-minting), as it makes the claim, and nobody changes it after.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-forge
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-forge
  validationActions: [Deny]
