# Kept when the release is uninstalled, as Helm keeps the definitions in crds/: a Claim is never
# admitted without it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-claims-use-their-pool
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [claims]
  validations:
    - expression: >-
        authorizer.group('runners.purlis.dev').resource('pools')
        .name(object.spec.pool).check('use').allowed()
      messageExpression: >-
        'You may not use the pool ' + object.spec.pool + '. A cluster admin can grant use on it.'
      reason: Forbidden
    # Who asked for a claim is stamped on it, as the cluster signed them in, and never changes
    # (crds.yaml): the operator vouches for it with the runner's link key (#2056).
    - expression: >-
        object.spec.requester == request.userInfo.username
      messageExpression: >-
        'A claim names who makes it: set spec.requester to ' + request.userInfo.username + '.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-claims-use-their-pool
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-claims-use-their-pool
  validationActions: [Deny]
