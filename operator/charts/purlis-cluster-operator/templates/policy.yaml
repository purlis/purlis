# Kept when the release is uninstalled, as Helm keeps the definitions in crds/: a Claim is never
# admitted without it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-claims-use-their-pool
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        # Who may change the repos a claim names is the policy purlis-forge's (#4206). An
        # update is held only when it runs a stopped claim again.
        operations: [CREATE, UPDATE]
        resources: [claims]
      # Upstream's objects, so that a runner from a purlis pool is had only through a Claim
      # (#2055): its warm pools and claims, on purlis's templates and warm pools, and purlis's
      # templates themselves.
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxclaims, sandboxtemplates, sandboxwarmpools]
  validations:
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'CREATE' ||
        authorizer.group('runners.purlis.dev').resource('pools')
        .name(object.spec.pool).check('use').allowed()
      messageExpression: >-
        'You may not use the pool ' + object.spec.pool + '. A cluster admin can grant use on it.'
      reason: Forbidden
    # Who asked for a claim is stamped on it, as the cluster signed them in, and never changes
    # (crds.yaml): the operator vouches for it with the runner's link key (#2056).
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'CREATE' ||
        object.spec.requester == request.userInfo.username
      messageExpression: >-
        'A claim names who makes it: set spec.requester to ' + request.userInfo.username + '.'
      reason: Forbidden
    # An upstream claim on a purlis pool's warm pool, or a warm pool of a purlis pool's template,
    # is made by the operator alone, for a Claim it acts on: one made directly would have a
    # runner without the checks above. Nor is one moved onto or off a purlis pool's object by
    # anyone else. Purlis's names start purlis-pool- (operator/src/upstream.rs).
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' ||
        (request.operation == 'UPDATE' ?
        oldObject.spec.warmPoolRef.name == object.spec.warmPoolRef.name ||
        !oldObject.spec.warmPoolRef.name.startsWith('purlis-pool-') &&
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-') :
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-'))
      messageExpression: >-
        'Runners from a purlis pool are claimed with a Claim (runners.purlis.dev): only the purlis
        cluster operator puts an upstream claim on the warm pool of a purlis pool, or takes one off it.'
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'sandboxwarmpools' ||
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' ||
        (request.operation == 'UPDATE' ?
        oldObject.spec.sandboxTemplateRef.name == object.spec.sandboxTemplateRef.name ||
        !oldObject.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') &&
        !object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') :
        !object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-'))
      messageExpression: >-
        'Runners from a purlis pool are claimed with a Claim (runners.purlis.dev): only the purlis
        cluster operator puts a warm pool on the template of a purlis pool, or takes one off it.'
      reason: Forbidden
    # Neither upstream nor the operator writes this label on a claim of a purlis pool.
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-') ||
        !has(object.metadata.labels) ||
        !('agents.x-k8s.io/created-by' in object.metadata.labels)
      message: An upstream claim on the warm pool of a purlis pool does not carry a created-by label.
      reason: Forbidden
    # Nor does either add env, a lifecycle, or labels or annotations for the pod on one, whoever
    # writes it: upstream copies additionalPodMetadata into the runner's pod. The empty
    # additionalPodMetadata upstream writes as it adopts a warm runner adds nothing, and passes.
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-') ||
        (!has(object.spec.env) && !has(object.spec.lifecycle) &&
        (!has(object.spec.additionalPodMetadata) ||
        (!has(object.spec.additionalPodMetadata.labels) &&
        !has(object.spec.additionalPodMetadata.annotations))))
      message: >-
        An upstream claim on the warm pool of a purlis pool sets no env, lifecycle, or pod labels or
        annotations: the purlis pool and its Claim say what the runner gets and how long it lives.
      reason: Forbidden
    # A purlis pool's template is made by the operator alone, and its spec changed by it alone.
    # Upstream's controller labels every template: an update that leaves the spec as it is passes.
    - expression: >-
        request.resource.resource != 'sandboxtemplates' ||
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' ||
        !object.metadata.name.startsWith('purlis-pool-') ||
        request.operation == 'UPDATE' && object.spec == oldObject.spec
      messageExpression: >-
        'Only the purlis cluster operator makes the template of a purlis pool, or changes what it
        runs: ' + object.metadata.name + ' is named as one.'
      reason: Forbidden
    # A stopped claim's runner gets no key vouched for and no token minted, so running it again
    # is its requester's alone: someone else who may patch claims in the namespace may stop it,
    # and no more. Any other update is left alone, so a finalizer's removal never depends on it.
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'UPDATE' ||
        !oldObject.spec.stopped || object.spec.stopped ||
        request.userInfo.username == object.spec.requester
      messageExpression: >-
        'Only ' + object.spec.requester + ', who asked for this claim, may run it again once it is stopped.'
      reason: Forbidden
    # In a runner namespace, upstream's claims, templates and warm pools are made by the operator
    # alone, so what it finds there under its own names, controlled by the namespace, is its own.
    - expression: >-
        request.resource.group != 'extensions.agents.x-k8s.io' || request.operation != 'CREATE' ||
        !request.namespace.startsWith('purlis-runners-') ||
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator'
      messageExpression: >-
        'Only the purlis cluster operator makes upstream objects in a runner namespace, and ' +
        request.namespace + ' is one.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-claims-use-their-pool
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-claims-use-their-pool
  validationActions: [Deny]
