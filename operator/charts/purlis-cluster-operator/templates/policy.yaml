# Kept when the release is uninstalled, as Helm keeps the definitions in crds/: a Claim is never
# admitted without it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-claims-use-their-pool
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        # Who may change the repos a claim names is the policy purlis-forge's (#4206).
        operations: [CREATE]
        resources: [claims]
      # Upstream's objects, so that a runner from a purlis pool is had only through a Claim
      # (#2055): its warm pools and claims, on purlis's templates and warm pools.
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxclaims, sandboxwarmpools]
  validations:
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'CREATE' ||
        authorizer.group('runners.purlis.dev').resource('pools')
        .name(object.spec.pool).check('use').allowed()
      messageExpression: >-
        'You may not use the pool ' + object.spec.pool + '. A cluster admin can grant use on it.'
      reason: Forbidden
    # Who asked for a claim is stamped on it, as the cluster signed them in, and never changes
    # (crds.yaml): the operator vouches for it with the runner's link key (#2056).
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'CREATE' ||
        object.spec.requester == request.userInfo.username
      messageExpression: >-
        'A claim names who makes it: set spec.requester to ' + request.userInfo.username + '.'
      reason: Forbidden
    # An upstream claim on a purlis pool's warm pool, or a warm pool of a purlis pool's template,
    # is made by the operator alone, for a Claim it acts on: one made directly would have a
    # runner without the checks above. Nor is one moved onto or off a purlis pool's object by
    # anyone else. Purlis's names start purlis-pool- (operator/src/upstream.rs).
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' ||
        (request.operation == 'UPDATE' ?
        oldObject.spec.warmPoolRef.name == object.spec.warmPoolRef.name ||
        !oldObject.spec.warmPoolRef.name.startsWith('purlis-pool-') &&
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-') :
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-'))
      messageExpression: >-
        'Runners from a purlis pool are claimed with a Claim (runners.purlis.dev): only the purlis
        cluster operator puts an upstream claim on the warm pool of a purlis pool, or takes one off it.'
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'sandboxwarmpools' ||
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator' ||
        (request.operation == 'UPDATE' ?
        oldObject.spec.sandboxTemplateRef.name == object.spec.sandboxTemplateRef.name ||
        !oldObject.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') &&
        !object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') :
        !object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-'))
      messageExpression: >-
        'Runners from a purlis pool are claimed with a Claim (runners.purlis.dev): only the purlis
        cluster operator puts a warm pool on the template of a purlis pool, or takes one off it.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-claims-use-their-pool
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-claims-use-their-pool
  validationActions: [Deny]
