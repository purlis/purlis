# What the operator's service account writes of upstream's objects, held by the cluster (#3754):
# only in runner namespaces, and a template's pod only in purlis's runner shape, so a mistake in
# the operator, or its token used as it is, can write nothing else of these. What it may change
# of a Sandbox is the policy in sandbox-policy.yaml's. It says nothing of what
# others write. The operator may not change policies or their bindings, so it cannot lift this.
# Kept when the release is uninstalled, as the policy on Claims is.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-operator-writes-only-a-runners-shape
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxclaims, sandboxtemplates, sandboxwarmpools]
  matchConditions:
    - name: by-the-operator
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator'
  variables:
    - name: template
      expression: request.resource.resource == 'sandboxtemplates'
    - name: pod
      expression: object.spec.podTemplate.spec
    - name: containers
      expression: >-
        variables.pod.containers +
        (has(variables.pod.initContainers) ? variables.pod.initContainers : [])
  validations:
    # Only a runner namespace, which keeps every system namespace out without a list to keep.
    - expression: request.namespace.startsWith('purlis-runners-')
      message: purlis's cluster operator writes upstream's objects in a runner namespace alone.
      reason: Forbidden
    # A claim as upstream writes it: its update as it adopts a warm runner leaves
    # additionalPodMetadata empty, which is present but adds nothing.
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        (object.spec.warmPoolRef.name.startsWith('purlis-pool-') &&
        !has(object.spec.env) &&
        (!has(object.spec.additionalPodMetadata) ||
        (!has(object.spec.additionalPodMetadata.labels) &&
        !has(object.spec.additionalPodMetadata.annotations))) &&
        !has(object.spec.lifecycle) &&
        (!has(object.spec.volumeClaimTemplates) ||
        (size(object.spec.volumeClaimTemplates) == 1 &&
        object.spec.volumeClaimTemplates[0].metadata.name == 'purlis-kept' &&
        object.spec.volumeClaimTemplates[0].spec.accessModes == ['ReadWriteOnce'] &&
        !has(object.spec.volumeClaimTemplates[0].spec.volumeName) &&
        !has(object.spec.volumeClaimTemplates[0].spec.dataSource) &&
        !has(object.spec.volumeClaimTemplates[0].spec.dataSourceRef) &&
        !has(object.spec.volumeClaimTemplates[0].spec.selector) &&
        !has(object.spec.volumeClaimTemplates[0].metadata.labels) &&
        !has(object.spec.volumeClaimTemplates[0].metadata.annotations) &&
        !has(object.spec.volumeClaimTemplates[0].spec.volumeAttributesClassName) &&
        !has(object.spec.volumeClaimTemplates[0].spec.volumeMode))))
      message: >-
        purlis's cluster operator claims a purlis pool's warm pool, with a kept volume at most and
        nothing added to the pod.
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'sandboxwarmpools' ||
        (object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') && object.spec.replicas <= 20 &&
        object.spec.updateStrategy.type == 'Recreate')
      message: purlis's cluster operator keeps a purlis pool's template warm, at most 20 of them.
      reason: Forbidden
    # Every field of the pinned upstream's template spec but the pod
    # (operator/tests/the_install_manifests.rs holds the list to the vendored definitions).
    - expression: >-
        !variables.template ||
        (!has(object.spec.networkPolicy) && !has(object.spec.service) &&
        !has(object.spec.volumeClaimTemplates) &&
        (!has(object.spec.networkPolicyManagement) || object.spec.networkPolicyManagement == 'Managed') &&
        (!has(object.spec.envVarsInjectionPolicy) || object.spec.envVarsInjectionPolicy == 'Disallowed') &&
        object.spec.volumeClaimTemplatesPolicy == 'Allowed')
      message: purlis's cluster operator's template sets nothing of upstream's but its pod.
      reason: Forbidden
    # The default service account, no token mounted, nothing of the node's: of every field of the
    # pinned upstream's pod spec, only what its template sets.
    - expression: >-
        !variables.template ||
        ((!has(object.spec.podTemplate.metadata) ||
        (!has(object.spec.podTemplate.metadata.labels) && !has(object.spec.podTemplate.metadata.annotations))) &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == 'default') &&
        (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == 'default') &&
        variables.pod.automountServiceAccountToken == false &&
        variables.pod.enableServiceLinks == false &&
        {{- range splitList " " (include "purlis-cluster-operator.pod-fields" .) }}
        !has(variables.pod.{{ . }}) &&
        {{- end }}
        {{- range list "appArmorProfile" "runAsGroup" "runAsNonRoot" "runAsUser" "seLinuxChangePolicy" "seLinuxOptions" "seccompProfile" "supplementalGroups" "supplementalGroupsPolicy" "sysctls" "windowsOptions" }}
        !has(variables.pod.securityContext.{{ . }}) &&
        {{- end }}
        variables.pod.securityContext.fsGroup == 10001 &&
        variables.pod.securityContext.fsGroupChangePolicy == 'OnRootMismatch')
      message: >-
        purlis's cluster operator's template runs as the default service account, with no token
        mounted and nothing of the node's.
      reason: Forbidden
    # Only purlis's volumes, each a folder of the pod's own.
    - expression: >-
        !variables.template ||
        (has(variables.pod.volumes) && variables.pod.volumes.all(v,
        v.name in ['purlis-link', 'purlis-kept'] && has(v.emptyDir)))
      message: purlis's cluster operator's template holds only purlis's own volumes.
      reason: Forbidden
    # The confinement the operator's template sets, on each container: of every field of the
    # pinned upstream's container, only what its template sets.
    - expression: >-
        !variables.template ||
        (size(variables.pod.containers) == 1 && variables.pod.containers[0].name == 'runner' &&
        variables.containers.all(c, c.name in ['runner', 'link-key'] &&
        c.securityContext.runAsNonRoot == true &&
        c.securityContext.allowPrivilegeEscalation == false &&
        c.securityContext.capabilities.drop == ['ALL'] && !has(c.securityContext.capabilities.add) &&
        c.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        {{- range list "appArmorProfile" "privileged" "procMount" "readOnlyRootFilesystem" "runAsGroup" "runAsUser" "seLinuxOptions" "windowsOptions" }}
        !has(c.securityContext.{{ . }}) &&
        {{- end }}
        {{- range splitList " " (include "purlis-cluster-operator.container-fields" .) }}
        !has(c.{{ . }}) &&
        {{- end }}
        (!has(c.resources) || !has(c.resources.claims)) &&
        (!has(c.env) || c.env.all(e, !has(e.valueFrom) || has(e.valueFrom.fieldRef))) &&
        (!has(c.volumeMounts) || c.volumeMounts.all(m, m.name in ['purlis-link', 'purlis-kept']))))
      message: purlis's cluster operator's template confines each container as purlis's runner is.
      reason: Forbidden
    # A claim's own labels and annotations: the operator adds its mark of the Claim once, and
    # leaves everything else as it is, neither adding, changing nor removing any of it. As it makes
    # a claim, and only then, it may also say the claim is born on a Pool naming an App's key,
    # which a mint asks of the claim: after that it is held as it was made, like the rest.
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        (request.operation == 'UPDATE' ?
        ((!has(object.metadata.labels) || object.metadata.labels.all(k,
        has(oldObject.metadata.labels) && k in oldObject.metadata.labels &&
        oldObject.metadata.labels[k] == object.metadata.labels[k])) &&
        (!has(oldObject.metadata.labels) || oldObject.metadata.labels.all(k,
        has(object.metadata.labels) && k in object.metadata.labels)) &&
        (!has(object.metadata.annotations) || object.metadata.annotations.all(k,
        has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations ?
        oldObject.metadata.annotations[k] == object.metadata.annotations[k] :
        k == 'runners.purlis.dev/claim-uid')) &&
        (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k,
        has(object.metadata.annotations) && k in object.metadata.annotations))) :
        (!has(object.metadata.labels) &&
        (!has(object.metadata.annotations) || object.metadata.annotations.all(k,
        k == 'runners.purlis.dev/claim-uid' ||
        (k == 'runners.purlis.dev/born-minting' &&
        object.metadata.annotations[k] == 'true')))))
      message: >-
        purlis's cluster operator writes only its own mark on a claim, and whether it is born
        minting only as it makes it.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-operator-writes-only-a-runners-shape
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-operator-writes-only-a-runners-shape
  validationActions: [Deny]
---
# What the operator writes of upstream's objects, held to what its Pool says: a pool's template
# runs the Pool's image in each of its containers, and a kept claim's volume is made in the
# storage class the Pool names, or in the cluster's default when it names none. A mistake in the
# operator, or its token used as it is, can neither swap a pool's image nor move a kept volume to
# another class. The Pool is the policy's parameter: the binding matches every Pool, so each
# write is judged once per Pool and each rule says nothing of a template or claim of another
# Pool's. The API server reads the Pools itself, so neither the operator nor anyone else needs a
# right on them for this to hold. With no Pool at all there is nothing to compare with, and a
# write is admitted. Kept when the release is uninstalled, as the policy on Claims is.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-operator-writes-what-its-pool-says
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: runners.purlis.dev/v1alpha1
    kind: Pool
  matchConstraints:
    resourceRules:
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxclaims, sandboxtemplates]
  matchConditions:
    - name: by-the-operator
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:{{ .Release.Namespace }}:purlis-cluster-operator'
  variables:
    # The name of this Pool's template and warm pool in a runner namespace.
    - name: pools
      expression: "'purlis-pool-' + params.metadata.name"
    - name: pod
      expression: object.spec.podTemplate.spec
    # A storage class as a list of at most one, so that none named matches none named. A class
    # the Pool sets to null is none named, as the operator reads it (dyn, since the Pool's schema
    # types it as a string, which is never null to the type checker).
    - name: poolsClass
      expression: >-
        has(params.spec.keptVolume) && has(params.spec.keptVolume.storageClassName) &&
        dyn(params.spec.keptVolume.storageClassName) != null ?
        [params.spec.keptVolume.storageClassName] : []
    - name: claimsClass
      expression: >-
        has(object.spec.volumeClaimTemplates) && size(object.spec.volumeClaimTemplates) > 0 &&
        has(object.spec.volumeClaimTemplates[0].spec.storageClassName) ?
        [object.spec.volumeClaimTemplates[0].spec.storageClassName] : []
    - name: heldClass
      expression: >-
        has(oldObject.spec.volumeClaimTemplates) && size(oldObject.spec.volumeClaimTemplates) > 0 &&
        has(oldObject.spec.volumeClaimTemplates[0].spec.storageClassName) ?
        [oldObject.spec.volumeClaimTemplates[0].spec.storageClassName] : []
  validations:
    # Every container of this Pool's template, the step that makes the link key among them, runs
    # the Pool's image as it is now.
    - expression: >-
        request.resource.resource != 'sandboxtemplates' ||
        object.metadata.name != variables.pools ||
        (variables.pod.containers +
        (has(variables.pod.initContainers) ? variables.pod.initContainers : []))
        .all(c, has(c.image) && c.image == params.spec.image)
      message: purlis's cluster operator's template runs its Pool's image.
      reason: Forbidden
    # A new kept volume is made in the class the Pool names now.
    - expression: >-
        request.resource.resource != 'sandboxclaims' || request.operation != 'CREATE' ||
        object.spec.warmPoolRef.name != variables.pools ||
        !has(object.spec.volumeClaimTemplates) ||
        variables.claimsClass == variables.poolsClass
      message: purlis's cluster operator makes a kept volume in the storage class its Pool names.
      reason: Forbidden
    # A kept volume keeps the class it was made in, whatever its Pool says since, since upstream
    # makes a sandbox's volumes once. The same for every Pool, so it needs no name.
    - expression: >-
        request.resource.resource != 'sandboxclaims' || request.operation != 'UPDATE' ||
        variables.claimsClass == variables.heldClass
      message: purlis's cluster operator keeps a kept volume in the storage class it was made in.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: purlis-operator-writes-what-its-pool-says
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: purlis-operator-writes-what-its-pool-says
  # Every Pool, each one the policy's parameter in turn. None at all admits the write.
  paramRef:
    selector: {}
    parameterNotFoundAction: Allow
  validationActions: [Deny]
