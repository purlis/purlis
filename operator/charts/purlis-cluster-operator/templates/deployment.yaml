{{/*
The one pod that runs the operator. It meets the restricted Pod Security Standard whatever the
values: only its image, pull secrets and resources come from them.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purlis-cluster-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "purlis-cluster-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One operator at a time: the old one stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: purlis-cluster-operator
  template:
    metadata:
      labels:
        {{- include "purlis-cluster-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: purlis-cluster-operator
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # The image's own group, so the signing key below is readable by the operator alone.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The key the operator signs runners' link keys with (#2056), made once by whoever
      # installs it (docs/cluster-operator.md) and mounted by the kubelet: the operator holds no
      # right to read it. The whole Secret is mounted, key.pem and, while a team admin
      # rolls the key, next.pem (#3305), and the kubelet refreshes it, so a roll needs no restart.
      volumes:
        - name: signing-key
          secret:
            secretName: purlis-cluster-operator-signing-key
            # 0440, in decimal: YAML readers disagree on a leading zero.
            defaultMode: 288
      containers:
        - name: operator
          image: {{ include "purlis-cluster-operator.image" . }}
          # Its metrics (#3737), served at /metrics; the Service purlis-cluster-operator-metrics
          # reaches them.
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            # Where a vouched runner asks for a GitHub App token (#4206).
            - name: mint
              containerPort: 8443
              protocol: TCP
          env:
            # What each person's runners may hold at once (#2055), as JSON.
            - name: PURLIS_PER_PERSON_QUOTA
              value: {{ .Values.perPerson.quota | toJson | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/purlis-cluster-operator/signing-key
              readOnly: true
