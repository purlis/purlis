# purlis's own definitions, Pool and Claim (runners.purlis.dev/v1alpha1), applied before the
# operator. Generated from operator/src/resources.rs; never edited by hand. Regenerate with
#   PURLIS_OPERATOR_BLESS=1 cargo test --test the_install_manifests
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pools.runners.purlis.dev
spec:
  group: runners.purlis.dev
  names:
    kind: Pool
    plural: pools
    singular: pool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Where a team's purlis runners come from (purlis's cluster operator).
        properties:
          spec:
            description: |-
              Where a team's runners come from. Cluster-wide, defined once for the team. Who may claim from
              it is the cluster's own access control: a Claim is admitted only for someone allowed to `use`
              the Pool (deploy/policy.yaml).
            properties:
              deleteSuspendedAfter:
                default: 720h
                description: |-
                  How long a kept Claim stays suspended before it is deleted, with its volume (#3737). A
                  whole number of `s`, `m` or `h`. 720h (30 days) unless the pool says otherwise. Not
                  acted on yet (#3981).
                maxLength: 12
                pattern: ^[1-9][0-9]*[smh]$
                type: string
              forge:
                description: |-
                  A team's GitHub App, for runners' forge tools (#4204). Left out, the operator reads no
                  Secret for this pool.
                nullable: true
                properties:
                  appKeySecretRef:
                    description: |-
                      The Secret in the operator's own namespace holding the App's client id (`app`) and its
                      private key (`key`). The chart's `forge.keySecretNames` must name it too, and whoever
                      writes this needs `use` on it (`forgekeys`).
                    properties:
                      name:
                        description: The Secret's name, never the operator's own signing key's.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                        x-kubernetes-validations:
                        - message: A pool cannot name the operator's own signing key.
                          rule: self != 'purlis-cluster-operator-signing-key'
                    required:
                    - name
                    type: object
                  mintInCluster:
                    default: false
                    description: |-
                      Whether the pool opts in to the operator minting tokens for its runners. Anyone who may use
                      the Pool can use these repos through it. False unless set.
                    type: boolean
                  repos:
                    description: |-
                      The most a token may cover: `owner/name` or `owner/*`. A token covers only these and the
                      repos of the Claim.
                    items:
                      maxLength: 140
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,38}/(\*|[A-Za-z0-9._-]*[A-Za-z0-9_-][A-Za-z0-9._-]*)$
                      type: string
                    maxItems: 256
                    minItems: 1
                    type: array
                required:
                - appKeySecretRef
                - repos
                type: object
              idleAfter:
                default: 30m
                description: |-
                  How long a runner of the pool is idle before it is suspended (#3737): no running chat, no
                  open stream, no forwarded request and no build (ADR 0089 §9); a runner a live chat owns,
                  or whose browser holds an Ask, is never idle. A whole number of `s`, `m` or `h`, a minute
                  at least. 30m unless the pool says otherwise. Not acted on yet (#3980).
                maxLength: 12
                pattern: ^[1-9][0-9]*[smh]$
                type: string
              image:
                description: |-
                  The runner image, by digest (`<repository>@sha256:<digest>`), since a tag can move. Any
                  image that keeps purlis's runner image contract (docs/runner-image.md).
                pattern: ^[^\s@]+@sha256:[0-9a-f]{64}$
                type: string
              keptVolume:
                default:
                  size: 10Gi
                description: |-
                  The volume each kept Claim's runner gets of its own (#2057): its home, holding its
                  checkout, conversation, profile sign-in, kept browser logins and its pairing, kept when
                  its pod is lost. A fresh Claim's runner keeps nothing.
                properties:
                  size:
                    default: 10Gi
                    description: How much it holds, in Mi, Gi or Ti. 10Gi unless the pool says otherwise.
                    pattern: ^[1-9][0-9]*(Mi|Gi|Ti)$
                    type: string
                  storageClassName:
                    description: 'The storage class it is made in: the cluster''s default class unless the pool names one.'
                    nullable: true
                    type: string
                type: object
              maxAge:
                default: 336h
                description: |-
                  A Claim's maximum age (#3737): past it, a kept Claim's runner starts again on the pool's
                  current image, and a fresh Claim's is made again. A whole number of `s`, `m` or `h`. 336h
                  (14 days) unless the pool says otherwise. Not acted on yet (#3982).
                maxLength: 12
                pattern: ^[1-9][0-9]*[smh]$
                type: string
              noticeBeforeDelete:
                default: 168h
                description: |-
                  How long before that deletion its requester is sent an Update (#3737). A whole number of
                  `s`, `m` or `h`, shorter than `deleteSuspendedAfter`. 168h (7 days) unless the pool says
                  otherwise. Not acted on yet (#3981).
                maxLength: 12
                pattern: ^[1-9][0-9]*[smh]$
                type: string
              stopped:
                default: false
                description: |-
                  Whether the pool is stopped (#2058): every runner of its Claims is suspended, never
                  destroyed (its pod ends; a kept Claim's volume, its home, stays), no runner is kept warm
                  for it, and a Claim made meanwhile gets no runner, until it is false again. False unless
                  set.
                type: boolean
              warmReplicas:
                default: 0
                description: |-
                  How many runners are kept warm for fresh Claims (#3737), in each runner namespace the
                  pool has a Claim in; none while the pool is stopped. The operator keeps the warm pool at
                  this count, 20 at most. They count toward each person's quota. Kept only for a person
                  with a fresh Claim on the pool that is not stopped. 0 unless the pool says otherwise.
                format: int32
                maximum: 20.0
                minimum: 0.0
                type: integer
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: 'noticeBeforeDelete must be shorter than deleteSuspendedAfter: the Update comes before the deletion.'
              rule: duration(self.noticeBeforeDelete) < duration(self.deleteSuspendedAfter)
            - message: idleAfter is a minute at least.
              rule: duration(self.idleAfter) >= duration('1m')
            - message: maxAge is too long to read as a duration.
              rule: duration(self.maxAge) > duration('0s')
          status:
            description: What the operator says about a Pool.
            nullable: true
            properties:
              cluster:
                description: |-
                  The cluster the Pool is in: the uid of its `kube-system` namespace. A desktop pins it with
                  the key, and refuses a statement made in any other cluster (#3305).
                nullable: true
                type: string
              nextSigningKey:
                description: |-
                  While a team admin rolls the operator's key, the key it rolls to, spelled as
                  `signingKey` (#3305). A desktop pinned to `signingKey` moves its pin here once
                  `nextSigningKeyVouch` checks.
                nullable: true
                type: string
              nextSigningKeyVouch:
                description: |-
                  The current key's word for the next one, signed by `signingKey` and holding for seven
                  days at most (#3305).
                nullable: true
                properties:
                  signature:
                    description: Its Ed25519 signature, 128 lower-case hex, by the key `signingKey` names.
                    type: string
                  statement:
                    description: |-
                      The statement, exactly as signed (crate::vouch::roll_statement): the cluster, the key it
                      rolls from, the key it rolls to, and until when it holds.
                    type: string
                required:
                - signature
                - statement
                type: object
              signingKey:
                description: |-
                  The public half of the key the operator signs each runner's link key with, `ed25519:`
                  and 64 lower-case hex. A desktop pins it when it adds the pool, and refuses a runner
                  whose link key it did not sign (#2056).
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Pool
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: claims.runners.purlis.dev
spec:
  group: runners.purlis.dev
  names:
    kind: Claim
    plural: claims
    singular: claim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A person's request for a purlis runner from a pool (purlis's cluster operator).
        properties:
          spec:
            description: One person's request for a runner from a pool, and the runner it is given.
            properties:
              forge:
                description: |-
                  The repos the runner works on (#4204). Changed only by who asked for the claim, while they
                  may use its pool (deploy/policy.yaml). A token covers only these and the Pool's allow-list.
                nullable: true
                properties:
                  repos:
                    description: 'Each repo, `owner/name`: never a wildcard, which only a Pool''s allow-list may hold.'
                    items:
                      maxLength: 140
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,38}/[A-Za-z0-9._-]*[A-Za-z0-9_-][A-Za-z0-9._-]*$
                      type: string
                    maxItems: 256
                    type: array
                required:
                - repos
                type: object
              kept:
                default: false
                description: |-
                  Whether the runner is kept (#2057): started cold with a volume of its own, its home,
                  which holds its work and its pairing through the loss of its pod. A fresh runner, the
                  default, comes warm from the pool where one is waiting and keeps nothing. It never
                  changes: the other kind is another claim.
                type: boolean
                x-kubernetes-validations:
                - message: Whether a claim is kept cannot change. Make a new claim for the other kind.
                  rule: self == oldSelf
              pool:
                description: |-
                  The name of the Pool the runner comes from. It never changes: another pool is another
                  claim.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: A claim's pool cannot change. Make a new claim for another pool.
                  rule: self == oldSelf
              requester:
                description: |-
                  Who asked for the claim, as the cluster signed them in: admitted only when it is the
                  person making the claim, and never changed after (deploy/policy.yaml). The operator
                  vouches for it with the runner's link key.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: A claim's requester cannot change.
                  rule: self == oldSelf
              stopped:
                default: false
                description: |-
                  Whether the claim is stopped (#2058): its runner is suspended, never destroyed (its pod
                  ends; a kept claim's volume, its home, stays), or not made yet, until it is false again.
                  Its pool's `stopped` stops it too. False unless set.
                type: boolean
            required:
            - pool
            - requester
            type: object
          status:
            description: What the operator says about a Claim.
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Ready`: whether the claim''s runner is running, and if not, why.'
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              linkKey:
                description: |-
                  The runner's link key, vouched for: the operator's statement of the claim, the pod, the
                  public link key the pod made as it started and who asked for the claim, and its
                  signature (#2056).
                nullable: true
                properties:
                  nextSignature:
                    description: |-
                      While the operator's key is rolled, the next key's signature over the same statement,
                      128 lower-case hex, for a desktop that has moved its pin to it (#3305).
                    nullable: true
                    type: string
                  signature:
                    description: Its Ed25519 signature, 128 lower-case hex, by the key the Pool's status names.
                    type: string
                  statement:
                    description: The statement, exactly as signed (crate::vouch).
                    type: string
                required:
                - signature
                - statement
                type: object
              mint:
                description: |-
                  Where the Claim's runner asks for a GitHub App token and the key it holds that port to
                  (#4207): written only for a Claim whose runner the operator vouches for, on a Pool that
                  opts in to minting. A desktop tells its runner these once, as it pairs it.
                nullable: true
                properties:
                  address:
                    description: |-
                      The mint port's address, `<ip>:<port>`, by the Service's cluster IP, since a runner's pod
                      is given public name servers.
                    type: string
                  operatorKey:
                    description: The operator's key the port's TLS is held to, spelled as a Pool's `signingKey`.
                    type: string
                required:
                - address
                - operatorKey
                type: object
            type: object
        required:
        - spec
        title: Claim
        type: object
    served: true
    storage: true
    subresources:
      status: {}
