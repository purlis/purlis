# purlis's cluster operator. Every value is here, and values.schema.json refuses any other:
# none of them changes what the operator may do (its ClusterRole) or how its pod is confined,
# but for forge.keySecretNames, which names the Secrets it may read.

image:
  # -- Where the operator's image is pulled from, without a tag or a digest.
  repository: ghcr.io/purlis/purlis-cluster-operator
  # -- The image's digest, `sha256:` and 64 hex digits. Required: the operator runs only an
  # image named by digest, since a tag can move. `.github/workflows/operator-image.yml` records
  # the digest of each image it publishes (docs/cluster-operator.md).
  digest: ""

# -- Secrets in the release's namespace that pull the image, as `[{name: ...}]`. The image is
# a private package until purlis publishes it, so pulling it needs one.
imagePullSecrets: []

# -- The operator's CPU and memory, as a container's `resources`.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 256Mi

# -- What each person's runners may hold at once (#2055): the quota purlis-person in their
# runner namespace, purlis-runners-<hash>. `claims` is a count; `cpu` and `memory` what their
# runners' pods ask for, and `storage` what their kept runners' volumes ask for, as Kubernetes
# quantities. A key left out is not limited. A Claim over it says OverQuota.
perPerson:
  quota:
    claims: 5
    cpu: "4"
    memory: 8Gi
    storage: 50Gi

metrics:
  # -- Who may scrape the operator's metrics (#3737) on its Service
  # purlis-cluster-operator-metrics, as a NetworkPolicy's `from` peers, such as
  # `[{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]`. The
  # NetworkPolicy purlis-cluster-operator lets nothing else reach its metrics port: left empty,
  # nothing may scrape it.
  allowFrom: []

forge:
  # -- The Secrets in the release's namespace holding a GitHub App's key (#4204), which a Pool
  # names as spec.forge.appKeySecretRef. The Role purlis-forge-key-reader lets the operator `get`
  # these and no other Secret, and its mint port opens to runner namespaces. Left empty, there is
  # no such Role, it may read no Secret and nothing reaches that port.
  keySecretNames: []
