# purlis's own definitions, Pool and Claim (runners.purlis.dev/v1alpha1), applied before the
# operator. Generated from operator/src/resources.rs; never edited by hand. Regenerate with
#   PURLIS_OPERATOR_BLESS=1 cargo test --test the_install_manifests
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pools.runners.purlis.dev
spec:
  group: runners.purlis.dev
  names:
    kind: Pool
    plural: pools
    singular: pool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Where a team's purlis runners come from (purlis's cluster operator).
        properties:
          spec:
            description: |-
              Where a team's runners come from. Cluster-wide, defined once for the team. Who may claim from
              it is the cluster's own access control: a Claim is admitted only for someone allowed to `use`
              the Pool (deploy/policy.yaml).
            properties:
              image:
                description: |-
                  The runner image, by digest (`<repository>@sha256:<digest>`), since a tag can move. Any
                  image that keeps purlis's runner image contract (docs/runner-image.md).
                pattern: ^[^\s@]+@sha256:[0-9a-f]{64}$
                type: string
              keptVolume:
                default:
                  size: 10Gi
                description: |-
                  The volume each kept Claim's runner gets of its own (#2057): its home, holding its
                  checkout, conversation, profile sign-in, kept browser logins and its pairing, kept when
                  its pod is lost. A fresh Claim's runner keeps nothing.
                properties:
                  size:
                    default: 10Gi
                    description: How much it holds, in Mi, Gi or Ti. 10Gi unless the pool says otherwise.
                    pattern: ^[1-9][0-9]*(Mi|Gi|Ti)$
                    type: string
                  storageClassName:
                    description: 'The storage class it is made in: the cluster''s default class unless the pool names one.'
                    nullable: true
                    type: string
                type: object
              stopped:
                default: false
                description: |-
                  Whether the pool is stopped (#2058): every runner of its Claims is suspended, never
                  destroyed (its pod ends; a kept Claim's volume, its home, stays), no runner is kept warm
                  for it, and a Claim made meanwhile gets no runner, until it is false again. False unless
                  set.
                type: boolean
            required:
            - image
            type: object
          status:
            description: What the operator says about a Pool.
            nullable: true
            properties:
              cluster:
                description: |-
                  The cluster the Pool is in: the uid of its `kube-system` namespace. A desktop pins it with
                  the key, and refuses a statement made in any other cluster (#3305).
                nullable: true
                type: string
              nextSigningKey:
                description: |-
                  While a team admin rolls the operator's key, the key it rolls to, spelled as
                  `signingKey` (#3305). A desktop pinned to `signingKey` moves its pin here once
                  `nextSigningKeyVouch` checks.
                nullable: true
                type: string
              nextSigningKeyVouch:
                description: |-
                  The current key's word for the next one, signed by `signingKey` and holding for seven
                  days at most (#3305).
                nullable: true
                properties:
                  signature:
                    description: Its Ed25519 signature, 128 lower-case hex, by the key `signingKey` names.
                    type: string
                  statement:
                    description: |-
                      The statement, exactly as signed (crate::vouch::roll_statement): the cluster, the key it
                      rolls from, the key it rolls to, and until when it holds.
                    type: string
                required:
                - signature
                - statement
                type: object
              signingKey:
                description: |-
                  The public half of the key the operator signs each runner's link key with, `ed25519:`
                  and 64 lower-case hex. A desktop pins it when it adds the pool, and refuses a runner
                  whose link key it did not sign (#2056).
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Pool
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: claims.runners.purlis.dev
spec:
  group: runners.purlis.dev
  names:
    kind: Claim
    plural: claims
    singular: claim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A person's request for a purlis runner from a pool (purlis's cluster operator).
        properties:
          spec:
            description: One person's request for a runner from a pool, and the runner it is given.
            properties:
              kept:
                default: false
                description: |-
                  Whether the runner is kept (#2057): started cold with a volume of its own, its home,
                  which holds its work and its pairing through the loss of its pod. A fresh runner, the
                  default, comes warm from the pool where one is waiting and keeps nothing. It never
                  changes: the other kind is another claim.
                type: boolean
                x-kubernetes-validations:
                - message: Whether a claim is kept cannot change. Make a new claim for the other kind.
                  rule: self == oldSelf
              pool:
                description: |-
                  The name of the Pool the runner comes from. It never changes: another pool is another
                  claim.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: A claim's pool cannot change. Make a new claim for another pool.
                  rule: self == oldSelf
              requester:
                description: |-
                  Who asked for the claim, as the cluster signed them in: admitted only when it is the
                  person making the claim, and never changed after (deploy/policy.yaml). The operator
                  vouches for it with the runner's link key.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: A claim's requester cannot change.
                  rule: self == oldSelf
              stopped:
                default: false
                description: |-
                  Whether the claim is stopped (#2058): its runner is suspended, never destroyed (its pod
                  ends; a kept claim's volume, its home, stays), or not made yet, until it is false again.
                  Its pool's `stopped` stops it too. False unless set.
                type: boolean
            required:
            - pool
            - requester
            type: object
          status:
            description: What the operator says about a Claim.
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Ready`: whether the claim''s runner is running, and if not, why.'
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              linkKey:
                description: |-
                  The runner's link key, vouched for: the operator's statement of the claim, the pod, the
                  public link key the pod made as it started and who asked for the claim, and its
                  signature (#2056).
                nullable: true
                properties:
                  nextSignature:
                    description: |-
                      While the operator's key is rolled, the next key's signature over the same statement,
                      128 lower-case hex, for a desktop that has moved its pin to it (#3305).
                    nullable: true
                    type: string
                  signature:
                    description: Its Ed25519 signature, 128 lower-case hex, by the key the Pool's status names.
                    type: string
                  statement:
                    description: The statement, exactly as signed (crate::vouch).
                    type: string
                required:
                - signature
                - statement
                type: object
            type: object
        required:
        - spec
        title: Claim
        type: object
    served: true
    storage: true
    subresources:
      status: {}
