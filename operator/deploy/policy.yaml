# Who may use a Pool is the cluster's own access control on it: a Claim is admitted only when
# the person making it may `use` the Pool it names, asked of the cluster's authorizer as that
# person. Applied before purlis's definitions (crds.yaml), so no Claim is admitted before it
# holds, and before the operator.
#
# Rendered from the chart, charts/purlis-cluster-operator/; never edited by hand. Regenerate
# with
#   PURLIS_OPERATOR_BLESS=1 cargo test --test the_chart
#
# A cluster admin grants `use` with RBAC, on one pool or on all of them:
#
#   apiGroups: [runners.purlis.dev]
#   resources: [pools]
#   resourceNames: [team]
#   verbs: [use]
#
# A Claim's pool never changes after it is made (crds.yaml), so creating one is the only time
# this is asked. operator/tests/the_install_manifests.rs holds it, and the kind tests check that
# the cluster refuses a Claim from someone who may not use its pool.
#
# Upstream's claims on a purlis pool's warm pool, and warm pools of its template, are made by
# the operator alone, so a runner from a pool is had only through a Claim (#2055).
#
# The second policy, purlis-runner-namespaces (#2055): only the operator makes a runner
# namespace (purlis-runners-*) or changes who it is for, and the operator binds
# purlis-runner-owner, and makes the quota purlis-person, in a runner namespace alone, for the
# one person that namespace is for, who is not the operator.
#
# The third policy, purlis-operator-changes-only-a-sandboxs-mode, narrows the operator's own
# `patch` on upstream's sandboxes (#2058), which RBAC cannot scope to a field or an owner: the
# operator may change only a Sandbox's spec.operatingMode, and only on a Sandbox a SandboxClaim
# controls; and its spec.podTemplate only while it is Suspended in a runner namespace (#3982).
#
# The fourth policy, purlis-forge (#4206): whoever writes a Pool's spec.forge needs `use` on the
# key it names (forgekeys), and only a Claim's requester changes the repos it names. The operator
# mints only for a Claim and a Pool made once its binding has settled.
#
# The fifth policy, purlis-operator-deletes-only-a-retained-claim (#3981): the operator deletes
# only a kept Claim, not stopped, that carries its own RetentionEnded condition.
#
# The sixth policy, purlis-only-the-operator-writes-a-claims-status (#3981): what the operator acts
# on is what a Claim's status says, so no one else writes it.
#
# The seventh policy, purlis-operator-writes-only-a-runners-shape (#3754): the operator writes
# upstream's templates, claims and warm pools in a runner namespace alone, a template's pod only in
# purlis's runner shape.
---
# Source: purlis-cluster-operator/templates/forge-policy.yaml
# Copyright 2026 Purlis
# SPDX-License-Identifier: Apache-2.0
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-forge
  labels:
    app.kubernetes.io/name: purlis-cluster-operator
    app.kubernetes.io/part-of: purlis
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [pools]
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [claims]
  validations:
    # Writing a Pool's spec.forge is spending the key it names, so the writer needs `use` on that
    # key. Any other change to a Pool, and taking its forge off, asks nothing.
    - expression: >-
        request.resource.resource != 'pools' || !has(object.spec.forge) ||
        (request.operation == 'UPDATE' && has(oldObject.spec.forge) &&
        object.spec.forge == oldObject.spec.forge) ||
        authorizer.group('runners.purlis.dev').resource('forgekeys')
        .name(object.spec.forge.appKeySecretRef.name).check('use').allowed()
      messageExpression: >-
        'You may not use the GitHub App key ' + object.spec.forge.appKeySecretRef.name + '. A cluster admin can grant use on it (forgekeys).'
      reason: Forbidden
    # On a Pool that mints, its image holds the link keys the operator vouches for, so changing it
    # is spending the key too.
    - expression: >-
        request.resource.resource != 'pools' || request.operation != 'UPDATE' ||
        object.spec.image == oldObject.spec.image || !has(oldObject.spec.forge) ||
        !oldObject.spec.forge.mintInCluster ||
        authorizer.group('runners.purlis.dev').resource('forgekeys')
        .name(oldObject.spec.forge.appKeySecretRef.name).check('use').allowed()
      messageExpression: >-
        'This pool mints with the GitHub App key ' + oldObject.spec.forge.appKeySecretRef.name + ', so changing its image takes use on that key (forgekeys).'
      reason: Forbidden
    # The repos a claim names say what its runner's token may cover, within its Pool's allow-list.
    # Someone else who may patch claims in the namespace has no say in that, and nor has its
    # requester once they may no longer use the pool. Any other patch is left alone, so a
    # finalizer's removal never depends on the authorizer.
    - expression: >-
        request.resource.resource != 'claims' ||
        (has(object.spec.forge) ?
        has(oldObject.spec.forge) && object.spec.forge == oldObject.spec.forge :
        !has(oldObject.spec.forge)) ||
        (request.userInfo.username == object.spec.requester &&
        authorizer.group('runners.purlis.dev').resource('pools')
        .name(object.spec.pool).check('use').allowed())
      messageExpression: >-
        'Only ' + object.spec.requester + ', who asked for this claim, while they may use its pool, may change the repos it names.'
      reason: Forbidden
---
# Source: purlis-cluster-operator/templates/policy.yaml
# Copyright 2026 Purlis
# SPDX-License-Identifier: Apache-2.0
# Kept when the release is uninstalled, as Helm keeps the definitions in crds/: a Claim is never
# admitted without it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-claims-use-their-pool
  labels:
    app.kubernetes.io/name: purlis-cluster-operator
    app.kubernetes.io/part-of: purlis
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        # Who may change the repos a claim names is the policy purlis-forge's (#4206).
        operations: [CREATE]
        resources: [claims]
      # Upstream's objects, so that a runner from a purlis pool is had only through a Claim
      # (#2055): its warm pools and claims, on purlis's templates and warm pools.
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxclaims, sandboxwarmpools]
  validations:
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'CREATE' ||
        authorizer.group('runners.purlis.dev').resource('pools')
        .name(object.spec.pool).check('use').allowed()
      messageExpression: >-
        'You may not use the pool ' + object.spec.pool + '. A cluster admin can grant use on it.'
      reason: Forbidden
    # Who asked for a claim is stamped on it, as the cluster signed them in, and never changes
    # (crds.yaml): the operator vouches for it with the runner's link key (#2056).
    - expression: >-
        request.resource.group != 'runners.purlis.dev' || request.operation != 'CREATE' ||
        object.spec.requester == request.userInfo.username
      messageExpression: >-
        'A claim names who makes it: set spec.requester to ' + request.userInfo.username + '.'
      reason: Forbidden
    # An upstream claim on a purlis pool's warm pool, or a warm pool of a purlis pool's template,
    # is made by the operator alone, for a Claim it acts on: one made directly would have a
    # runner without the checks above. Nor is one moved onto or off a purlis pool's object by
    # anyone else. Purlis's names start purlis-pool- (operator/src/upstream.rs).
    - expression: >-
        request.resource.resource != 'sandboxclaims' ||
        request.userInfo.username == 'system:serviceaccount:purlis-system:purlis-cluster-operator' ||
        (request.operation == 'UPDATE' ?
        oldObject.spec.warmPoolRef.name == object.spec.warmPoolRef.name ||
        !oldObject.spec.warmPoolRef.name.startsWith('purlis-pool-') &&
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-') :
        !object.spec.warmPoolRef.name.startsWith('purlis-pool-'))
      messageExpression: >-
        'Runners from a purlis pool are claimed with a Claim (runners.purlis.dev): only the purlis
        cluster operator puts an upstream claim on the warm pool of a purlis pool, or takes one off it.'
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'sandboxwarmpools' ||
        request.userInfo.username == 'system:serviceaccount:purlis-system:purlis-cluster-operator' ||
        (request.operation == 'UPDATE' ?
        oldObject.spec.sandboxTemplateRef.name == object.spec.sandboxTemplateRef.name ||
        !oldObject.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') &&
        !object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-') :
        !object.spec.sandboxTemplateRef.name.startsWith('purlis-pool-'))
      messageExpression: >-
        'Runners from a purlis pool are claimed with a Claim (runners.purlis.dev): only the purlis
        cluster operator puts a warm pool on the template of a purlis pool, or takes one off it.'
      reason: Forbidden
---
# Source: purlis-cluster-operator/templates/retention-policy.yaml
# Copyright 2026 Purlis
# SPDX-License-Identifier: Apache-2.0
# The operator's `delete` on Claims, narrowed by the cluster (#3981, ruled 2026-11-01): RBAC cannot
# name which, so this policy refuses its service account any deletion but of a kept Claim that is
# not stopped and carries its own RetentionEnded condition. Kept when the release is uninstalled,
# as the policy on Claims is.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-operator-deletes-only-a-retained-claim
  labels:
    app.kubernetes.io/name: purlis-cluster-operator
    app.kubernetes.io/part-of: purlis
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [runners.purlis.dev]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [claims]
  matchConditions:
    - name: by-the-operator
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:purlis-system:purlis-cluster-operator'
  validations:
    - expression: >-
        oldObject.spec.kept == true && oldObject.spec.stopped != true &&
        has(oldObject.status) && has(oldObject.status.conditions) &&
        oldObject.status.conditions.exists(c, c.type == 'RetentionEnded' && c.status == 'True')
      message: purlis's cluster operator deletes only a kept Claim whose retention has ended.
      reason: Forbidden
---
# Source: purlis-cluster-operator/templates/retention-policy.yaml
