# Source: purlis-cluster-operator/templates/runner-namespaces-policy.yaml
# Copyright 2026 Purlis
# SPDX-License-Identifier: Apache-2.0
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-runner-namespaces
  labels:
    app.kubernetes.io/name: purlis-cluster-operator
    app.kubernetes.io/part-of: purlis
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [namespaces, namespaces/status, namespaces/finalize, resourcequotas]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [rolebindings]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [networkpolicies]
  variables:
    - name: operator
      expression: >-
        request.userInfo.username == 'system:serviceaccount:purlis-system:purlis-cluster-operator'
    - name: runners
      expression: >-
        request.resource.resource == 'namespaces' ?
        object.metadata.name.startsWith('purlis-runners-') :
        request.namespace.startsWith('purlis-runners-')
    # Who a runner namespace is for, by the marks the operator puts on it.
    - name: marks
      expression: >-
        request.resource.resource != 'namespaces' ? [] :
        [has(object.metadata.labels) && 'app.kubernetes.io/managed-by' in object.metadata.labels ?
        object.metadata.labels['app.kubernetes.io/managed-by'] : '',
        has(object.metadata.annotations) && 'runners.purlis.dev/requester' in object.metadata.annotations ?
        object.metadata.annotations['runners.purlis.dev/requester'] : '']
    - name: oldMarks
      expression: >-
        request.resource.resource != 'namespaces' || request.operation != 'UPDATE' ? [] :
        [has(oldObject.metadata.labels) && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels ?
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] : '',
        has(oldObject.metadata.annotations) && 'runners.purlis.dev/requester' in oldObject.metadata.annotations ?
        oldObject.metadata.annotations['runners.purlis.dev/requester'] : '']
    # Who the runner namespace a role binding is made in is for: the one subject it may name.
    - name: requester
      expression: >-
        request.resource.resource == 'rolebindings' && namespaceObject != null &&
        has(namespaceObject.metadata.annotations) &&
        'runners.purlis.dev/requester' in namespaceObject.metadata.annotations ?
        namespaceObject.metadata.annotations['runners.purlis.dev/requester'] : ''
  validations:
    # A runner namespace is made by the operator alone, and who it is for is changed by no one
    # else.
    - expression: >-
        request.resource.resource != 'namespaces' || variables.operator || !variables.runners ||
        request.operation == 'UPDATE' && variables.marks == variables.oldMarks
      messageExpression: >-
        'Only the purlis cluster operator makes a runner namespace (purlis-runners-*), or changes who it is for.'
      reason: Forbidden
    # The operator's mark on a namespace opens its mint port to it (#4206), so no one else puts
    # it on a namespace that is not a runner namespace.
    - expression: >-
        request.resource.resource != 'namespaces' || variables.operator || variables.runners ||
        variables.marks[0] != 'purlis-cluster-operator'
      messageExpression: >-
        'Only the purlis cluster operator marks a namespace as its own, and only a runner namespace.'
      reason: Forbidden
    # The operator makes no other namespace.
    - expression: >-
        request.resource.resource != 'namespaces' || !variables.operator || variables.runners
      messageExpression: >-
        'The purlis cluster operator makes runner namespaces (purlis-runners-*) alone.'
      reason: Forbidden
    # The operator binds one role, purlis-runner-owner, in a runner namespace alone, to the one
    # person that namespace is for, who is not the operator itself.
    - expression: >-
        request.resource.resource != 'rolebindings' || !variables.operator ||
        variables.runners && variables.requester != '' &&
        variables.requester != 'system:serviceaccount:purlis-system:purlis-cluster-operator' &&
        object.metadata.name == 'purlis-runner-owner' &&
        object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'purlis-runner-owner' &&
        has(object.subjects) && size(object.subjects) == 1 &&
        (object.subjects[0].kind == 'User' && !object.subjects[0].name.startsWith('system:') &&
        object.subjects[0].name == variables.requester ||
        object.subjects[0].kind == 'ServiceAccount' && has(object.subjects[0].namespace) &&
        'system:serviceaccount:' + object.subjects[0].namespace + ':' + object.subjects[0].name ==
        variables.requester)
      messageExpression: >-
        'The purlis cluster operator binds purlis-runner-owner alone, in a runner namespace alone, to the one person it is for, who is not the operator.'
      reason: Forbidden
    # The operator caps a person in their runner namespace alone, with purlis-person.
    - expression: >-
        request.resource.resource != 'resourcequotas' || !variables.operator ||
        variables.runners && object.metadata.name == 'purlis-person'
      messageExpression: >-
        'The purlis cluster operator makes the quota purlis-person, in a runner namespace alone.'
      reason: Forbidden
    # The operator makes one NetworkPolicy, in a runner namespace alone, and what it says is its
    # way to the mint port (#4206): a way out, to its own pods, on that port, and nothing else.
    - expression: >-
        request.resource.resource != 'networkpolicies' || !variables.operator ||
        variables.runners && object.metadata.name == 'purlis-forge-mint' &&
        object.spec.policyTypes == ['Egress'] && !has(object.spec.ingress) &&
        size(object.spec.egress) == 1 && size(object.spec.egress[0].to) == 1 &&
        object.spec.egress[0].to[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == 'purlis-system' &&
        object.spec.egress[0].to[0].podSelector.matchLabels['app.kubernetes.io/name'] == 'purlis-cluster-operator' &&
        size(object.spec.egress[0].ports) == 1 && object.spec.egress[0].ports[0].port == 8443
      messageExpression: >-
        'The purlis cluster operator makes the NetworkPolicy purlis-forge-mint, in a runner namespace alone, to its own mint port alone.'
      reason: Forbidden
---
# Source: purlis-cluster-operator/templates/sandbox-policy.yaml
# Copyright 2026 Purlis
# SPDX-License-Identifier: Apache-2.0
# The operator's `patch` on upstream's sandboxes, narrowed by the cluster (#2058): RBAC cannot
# name a field or an owner, so this policy refuses any change the operator's service account
# makes to a Sandbox but its spec.operatingMode, and any change at all to a Sandbox no
# SandboxClaim controls. Its containers' images and plain resources may change only on a Sandbox
# already Suspended in a runner namespace (#3982, ruled 2026-11-01): a kept runner next starts on
# its pool's image. The operator may not change policies or their bindings, so it cannot
# lift this. Kept when the release is uninstalled, as the policy on Claims is.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: purlis-operator-changes-only-a-sandboxs-mode
  labels:
    app.kubernetes.io/name: purlis-cluster-operator
    app.kubernetes.io/part-of: purlis
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [sandboxes]
  matchConditions:
    - name: by-the-operator
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:purlis-system:purlis-cluster-operator'
  variables:
    # A suspended runner's renewal: each container's image and plain resources may differ, and
    # nothing else of the pod (operator/tests/the_install_manifests.rs holds the lists).
    - name: renewed
      expression: >-
        has(object.spec.podTemplate.metadata) == has(oldObject.spec.podTemplate.metadata) &&
        (!has(object.spec.podTemplate.metadata) || object.spec.podTemplate.metadata == oldObject.spec.podTemplate.metadata) &&
        has(object.spec.podTemplate.spec.activeDeadlineSeconds) == has(oldObject.spec.podTemplate.spec.activeDeadlineSeconds) &&
        (!has(object.spec.podTemplate.spec.activeDeadlineSeconds) || object.spec.podTemplate.spec.activeDeadlineSeconds == oldObject.spec.podTemplate.spec.activeDeadlineSeconds) &&
        has(object.spec.podTemplate.spec.affinity) == has(oldObject.spec.podTemplate.spec.affinity) &&
        (!has(object.spec.podTemplate.spec.affinity) || object.spec.podTemplate.spec.affinity == oldObject.spec.podTemplate.spec.affinity) &&
        has(object.spec.podTemplate.spec.dnsConfig) == has(oldObject.spec.podTemplate.spec.dnsConfig) &&
        (!has(object.spec.podTemplate.spec.dnsConfig) || object.spec.podTemplate.spec.dnsConfig == oldObject.spec.podTemplate.spec.dnsConfig) &&
        has(object.spec.podTemplate.spec.dnsPolicy) == has(oldObject.spec.podTemplate.spec.dnsPolicy) &&
        (!has(object.spec.podTemplate.spec.dnsPolicy) || object.spec.podTemplate.spec.dnsPolicy == oldObject.spec.podTemplate.spec.dnsPolicy) &&
        has(object.spec.podTemplate.spec.ephemeralContainers) == has(oldObject.spec.podTemplate.spec.ephemeralContainers) &&
        (!has(object.spec.podTemplate.spec.ephemeralContainers) || object.spec.podTemplate.spec.ephemeralContainers == oldObject.spec.podTemplate.spec.ephemeralContainers) &&
        has(object.spec.podTemplate.spec.evictionResponders) == has(oldObject.spec.podTemplate.spec.evictionResponders) &&
        (!has(object.spec.podTemplate.spec.evictionResponders) || object.spec.podTemplate.spec.evictionResponders == oldObject.spec.podTemplate.spec.evictionResponders) &&
        has(object.spec.podTemplate.spec.hostAliases) == has(oldObject.spec.podTemplate.spec.hostAliases) &&
        (!has(object.spec.podTemplate.spec.hostAliases) || object.spec.podTemplate.spec.hostAliases == oldObject.spec.podTemplate.spec.hostAliases) &&
        has(object.spec.podTemplate.spec.hostIPC) == has(oldObject.spec.podTemplate.spec.hostIPC) &&
        (!has(object.spec.podTemplate.spec.hostIPC) || object.spec.podTemplate.spec.hostIPC == oldObject.spec.podTemplate.spec.hostIPC) &&
        has(object.spec.podTemplate.spec.hostNetwork) == has(oldObject.spec.podTemplate.spec.hostNetwork) &&
        (!has(object.spec.podTemplate.spec.hostNetwork) || object.spec.podTemplate.spec.hostNetwork == oldObject.spec.podTemplate.spec.hostNetwork) &&
        has(object.spec.podTemplate.spec.hostPID) == has(oldObject.spec.podTemplate.spec.hostPID) &&
        (!has(object.spec.podTemplate.spec.hostPID) || object.spec.podTemplate.spec.hostPID == oldObject.spec.podTemplate.spec.hostPID) &&
        has(object.spec.podTemplate.spec.hostUsers) == has(oldObject.spec.podTemplate.spec.hostUsers) &&
        (!has(object.spec.podTemplate.spec.hostUsers) || object.spec.podTemplate.spec.hostUsers == oldObject.spec.podTemplate.spec.hostUsers) &&
        has(object.spec.podTemplate.spec.hostname) == has(oldObject.spec.podTemplate.spec.hostname) &&
        (!has(object.spec.podTemplate.spec.hostname) || object.spec.podTemplate.spec.hostname == oldObject.spec.podTemplate.spec.hostname) &&
        has(object.spec.podTemplate.spec.hostnameOverride) == has(oldObject.spec.podTemplate.spec.hostnameOverride) &&
        (!has(object.spec.podTemplate.spec.hostnameOverride) || object.spec.podTemplate.spec.hostnameOverride == oldObject.spec.podTemplate.spec.hostnameOverride) &&
        has(object.spec.podTemplate.spec.imagePullSecrets) == has(oldObject.spec.podTemplate.spec.imagePullSecrets) &&
        (!has(object.spec.podTemplate.spec.imagePullSecrets) || object.spec.podTemplate.spec.imagePullSecrets == oldObject.spec.podTemplate.spec.imagePullSecrets) &&
        has(object.spec.podTemplate.spec.nodeName) == has(oldObject.spec.podTemplate.spec.nodeName) &&
        (!has(object.spec.podTemplate.spec.nodeName) || object.spec.podTemplate.spec.nodeName == oldObject.spec.podTemplate.spec.nodeName) &&
        has(object.spec.podTemplate.spec.nodeSelector) == has(oldObject.spec.podTemplate.spec.nodeSelector) &&
        (!has(object.spec.podTemplate.spec.nodeSelector) || object.spec.podTemplate.spec.nodeSelector == oldObject.spec.podTemplate.spec.nodeSelector) &&
        has(object.spec.podTemplate.spec.os) == has(oldObject.spec.podTemplate.spec.os) &&
        (!has(object.spec.podTemplate.spec.os) || object.spec.podTemplate.spec.os == oldObject.spec.podTemplate.spec.os) &&
        has(object.spec.podTemplate.spec.overhead) == has(oldObject.spec.podTemplate.spec.overhead) &&
        (!has(object.spec.podTemplate.spec.overhead) || object.spec.podTemplate.spec.overhead == oldObject.spec.podTemplate.spec.overhead) &&
        has(object.spec.podTemplate.spec.preemptionPolicy) == has(oldObject.spec.podTemplate.spec.preemptionPolicy) &&
        (!has(object.spec.podTemplate.spec.preemptionPolicy) || object.spec.podTemplate.spec.preemptionPolicy == oldObject.spec.podTemplate.spec.preemptionPolicy) &&
        has(object.spec.podTemplate.spec.priority) == has(oldObject.spec.podTemplate.spec.priority) &&
        (!has(object.spec.podTemplate.spec.priority) || object.spec.podTemplate.spec.priority == oldObject.spec.podTemplate.spec.priority) &&
        has(object.spec.podTemplate.spec.priorityClassName) == has(oldObject.spec.podTemplate.spec.priorityClassName) &&
