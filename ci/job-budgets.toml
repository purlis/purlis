[[job]]
id = "scenario"
p50 = 15

[[job]]
id = "scenario-checks"
p50 = 1  # the required-check gate

[[job]]
id = "scenario-linux"
p50 = 23

[[job]]
id = "outcome-bars"
p50 = 54  # 6 runs

[[job]]
id = "outcome-bars-linux"
p50 = 26  # 12 runs

[[job]]
id = "outcome-bars-linux-checks"
p50 = 1  # the required-check gate

[[job]]
