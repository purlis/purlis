p50 = 8

[[job]]
id = "lint"
p50 = 11

[[job]]
id = "rust-doctests"
p50 = 6

[[job]]
id = "rust-checks"
p50 = 1  # the required-check gate

[[job]]
id = "parity"
p50 = 26

[[job]]
id = "remote-parity"
p50 = 33

[[job]]
id = "deny"
p50 = 1

[[job]]
id = "web"
p50 = 12  # pools its four parts

[[job]]
id = "web-checks"
p50 = 1  # the required-check gate

[[job]]
id = "bench"
p50 = 3

[[job]]
id = "bench-record"
p50 = 1

[[job]]
id = "app"
p50 = 15

[[job]]
