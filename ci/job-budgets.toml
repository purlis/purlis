p50 = 30  # added on main after seeding, no runs measured: seeded above its Linux leg for macOS; measure after a week

# ---- release.yml (#7384) ----
#
# Every number below is the job's minutes in one measured run, rounded up (the convention above).
# The macOS jobs are the one-cargo-run job (R1, #7396): run 45069994116 took 90.2 min on the
# `release` profile, which it was started by hand with. No dev-release run of the one-run job is
# measured yet, so the dev budget borrows that run as a ceiling (the lighter profile cannot be
# slower, ADR 0092); R0's run 45069887140 measured the old two-run job at 101 min on dev-release,
# which no longer exists. Reset each on the median of its first clean runs once R1's pull
# requests have landed.
#
# The two dev build jobs below are lowered for `lto = "off"` (R7, #7418, ADR 0092 amended
# 2026-11-24). Run 45137164155 built `dev-release` on the one-cargo-run job with each LTO setting:
# macOS compiled in 111.2 and 91.3 min with LTO off against 114.6 and 107.2 with thin (dsymutil
# 1.5 against 10), Linux in 24.0 and 18.7 against 32.2 and 31.2. Each is cut by about the ten
# minutes R7 measured and is a ceiling until a dev publish with the new profile has run.

[[job]]
id = "release-macos-dev"
workflow = "release"
profile = "dev-release"
check = "macOS (.app)"
run = 45137164155  # R7, LTO off: about 10 min under the 90.2 of run 45069994116 (`release`, thin)
p50 = 81

[[job]]
id = "release-macos-release"
workflow = "release"
profile = "release"
check = "macOS (.app, .dmg)"
run = 45069994116  # 90.2 min (compile 84.5)
p50 = 91

[[job]]
id = "release-linux-dev"
workflow = "release"
profile = "dev-release"
check = "Linux (.deb, AppImage)"
run = 45137164155  # R7, LTO off: about 10 min under the 35 of R0's run 45069887140 (thin)
p50 = 25

[[job]]
id = "release-linux-release"
workflow = "release"
profile = "release"
check = "Linux (.deb, AppImage)"
run = 45069994116  # 37 min
p50 = 37

[[job]]
id = "release-runner-binary-aarch64-dev"
workflow = "release"
profile = "dev-release"
check = "runner binary (linux-aarch64)"
run = 45069994116  # 10.1 min, `release` profile: a ceiling for dev-release
p50 = 11

[[job]]
id = "release-runner-binary-aarch64-release"
workflow = "release"
profile = "release"
check = "runner binary (linux-aarch64)"
run = 45069994116  # 10.1 min
p50 = 11
