# Each job of `.github/workflows/ci.yml` and the minutes its p50 may take (spec #7324, ADR 0127, in
# line with ADR 0086: every budget names the job that measures it, here by its id in `ci.yml`).
# `ci-health` reads each job's p50 of the last seven days against its budget every day and files
# an `area:ci` ticket when it runs more than 20% over. A matrix job's p50 pools its legs.
#
# A job without a budget fails `tools/job-budgets.test.mjs`, so a new job brings its own. Raising
# a budget takes a pull request that says why; lowering one is welcome.
#
# Seeded on 2026-11-22 from the p50 of each job's passed runs, rounded up to the minute, with a
# floor of one: 43 runs of `ci.yml` read through the public API (every merge-group and push run of
# the newest 100 green ones, 31 pull request runs spread evenly over them, and the last three
# nightly runs), which is the same number `ci-health` computes (`overBudget`). A job that did not
# run in them says so beside its budget.

# The jobs of `.github/workflows/release.yml` (#7384, train R5) are budgeted below the ci ones, each
# with `workflow = "release"`, the Cargo `profile` its runs build with, the `check` run's name in
# full and the `run` its number was measured from (ADR 0086). A dev build of `main` is `dev-release`
# and the nightly profile guard and a stable tag are `release`; the two are budgeted apart, and a
# build started by hand (which may ask for either) is judged by neither. `ci-health` reads
# `release.yml` runs as it reads `ci.yml` runs.

[[job]]
id = "changes"
p50 = 1

[[job]]
id = "stale-group"
p50 = 42  # waits for the group it guards; 4 runs

[[job]]
id = "rust"
p50 = 27  # pools its four parts

