/* ===================== status: one place per variant ===================== */
function headline(p){

    case "Setting up": {const c=cur(S.run);return c?`Setting up: ${c.title}${c.status==="run"?`, ${dur(c.el)}`:""}.`:"Setting up.";}
    case "Unreachable": return `purlis can't reach ${h} and keeps trying${S.retry?`: next in ${Math.max(0,Math.ceil(S.retry.left))} s`:""}.`;
    case "Refused": return `${h} answers, and refused: ${f?f.short:""}. purlis stopped trying.`;
    case "Host key changed": return `${h} shows a different host key. purlis stopped and waits for your OK.`;
    case "Runner gone": return `The runner on ${h} is gone. Its home volume, with your sign-ins, is still there.`;

/* ===================== steps per variant ===================== */
function stepIds(){
  if(S.kind==="cluster") return fl("three")?["where","cluster","use"]:fl("merge")?["where","check","pool","signins","identity","try"]:["where","check","install","pool","signins","identity","try"];
  return fl("three")?["where","machine","use"]:fl("merge")?["where","connect","signins","identity","try"]:["where","connect","pool","signins","identity","try"];

const NAMES={where:"Where chats run",connect:"Connect",pool:"Pool",signins:"Sign-ins",identity:"Agent identity",try:"Try it",check:"Check the cluster",install:"Install",machine:"Machine",cluster:"Cluster",use:"Use it"};
function stepInfo(id){
  const r=S.run, cl=S.cl, rc=cl.run, made=!!(S.pool&&S.pool.made), poolBad=S.pool&&!["Ready","Setting up","Pool forgotten"].includes(S.pool.state);
  const fail=x=>x&&x.status==="failed";
  const d=(run,stages)=>fl("raildur")&&run?dur(total(run,stages)):"";
  if(S.kind==="cluster"){
    const c=cl.pool&&cl.pool.state==="Ready";
    switch(id){
      case "where": return cl.where?{s:"done",line:cl.context.replace(/^gke_/,"")}:{s:"now"};
      case "check": {if(!cl.where)return{s:"later"}; if(fail(rc)&&ORDER[cur(rc).stage]<=(fl("merge")?1:0))return{s:"attention",line:"Needs you"}; if(fl("merge")?cl.installed:cl.checked)return{s:"done",line:fl("merge")?"Checked and installed":"Ready for the install",took:d(rc,["check","install"])}; return{s:"now"};}
      case "install": if(!cl.checked)return{s:"later"}; return cl.installed?{s:"done",line:"Installed by your admin"}:{s:"now"};
      case "pool": {if(!cl.installed)return{s:"later"}; if(fail(rc)&&cur(rc).stage==="pool")return{s:"attention",line:cl.pool?cl.pool.state:"Not made"}; return c?{s:"done",line:cl.name,took:d(rc,["pool"])}:{s:"now"};}
      case "cluster": {if(!cl.where)return{s:"later"}; if(fail(rc))return{s:"attention",line:cl.pool?cl.pool.state:"Needs you"}; return c?{s:"done",line:cl.name,took:d(rc)}:{s:"now"};}
      default: return useInfo(id,c);
    }
  }
  switch(id){
    case "where": return S.where?{s:"done",line:"Docker on another machine"}:{s:"now"};
    case "connect": {if(!S.where)return{s:"later"};
      if(fail(r)&&(fl("merge")||cur(r).stage!=="create"))return{s:"attention",line:S.pool&&fl("fix")?S.pool.state:fl("fix")?F[r.finding].state:"Needs you"};
      if(fl("merge")?made:S.connected){const bad=poolBad&&made&&S.pool.reason&&!["image","disk","runner","link"].includes(F[S.pool.reason].at); return{s:bad?"attention":"done",line:bad?S.pool.state:`${H()}, key ${FP_OLD.slice(7,15)}…`,took:d(r,fl("merge")?null:["meet","trust"])};}
      return{s:"now"};}
    case "pool": {if(!S.connected)return{s:"later"}; if(fail(r)&&cur(r).stage==="create")return{s:"attention",line:fl("fix")?F[r.finding].state:made?S.pool.state:"Wasn't made"}; if(made)return poolBad?{s:"attention",line:S.pool.state}:{s:"done",line:S.name}; return{s:"now"};}
    case "machine": {if(!S.where)return{s:"later"}; if(fail(r)||poolBad)return{s:"attention",line:S.pool?S.pool.state:F[r.finding].state}; return made?{s:"done",line:`${S.name} on ${H()}`,took:d(r)}:{s:"now"};}
    default: return useInfo(id,made);
  }
}
function useInfo(id,made){
  const tr=S.tryRun?dur(total(S.tryRun)):"";
  switch(id){
    case "signins": return !made?{s:"later"}:S.signins?{s:"done",line:"claude-work"}:{s:"now"};
    case "identity": return !made||!S.signins?{s:"later"}:S.identity?{s:"done",line:"gh through coder"}:{s:"now"};
    case "try": return !made||!S.identity?{s:"later"}:S.tried?{s:"done",line:"A real chat started",took:fl("raildur")?tr:""}:{s:"now"};
    case "use": return !made?{s:"later"}:S.tried?{s:"done",line:"A real chat started",took:tr}:{s:"now"};
  }
  return {s:"later"};
}
function currentStep(){const ids=stepIds();for(const id of ids){const i=stepInfo(id);if(i.s!=="done")return id;}return ids[ids.length-1];}

  if(!r){ b+=pickSection()+seeWhat("Reads the key the machine shows. Both commands only read.",`ssh -o StrictHostKeyChecking=accept-new ${addr().replace("ssh://","")} true\nssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`);
    return b+action("Reads the key the machine shows, and keeps nothing. Nothing on it changes.",btn("connect",`Connect to ${h}`,"primary lg"))+(fl("fix")?forgetRow():""); }
  b+=chosenFacts(!made);
  if(fl("dur")){ b+=liveLine(r)+`<h2 class="h2">Docker on ${esc(h)}</h2>`+checkList(r,fl("merge")?null:["meet","trust","create"],`What purlis checked on ${h}`,{laterNote:!fl("merge")&&!made,phases:fl("merge"),twelve:!fl("merge")});

  else if(S.connected&&!fl("merge")&&!failedNow&&!made){ b+=whoCanSignIn()+action(`Keeps ${h} as this pool's machine. Next, you choose its image and limits.`,btn("next","Continue","primary lg")); }

    else if(st==="unreach") b+=`<div class="notice"><span class="mk" aria-hidden="true">!</span><h3>Pool ${esc(p.name)} wasn't removed</h3><div class="body"><p>${esc(H())} didn't answer on port 22. Nothing was removed. Forget it here forgets pool ${esc(p.name)} on this machine without contacting ${esc(H())}. Its runner's container and home volume stay on ${esc(H())}. ${esc(H())} still lists this machine as the runner's peer. purlis then says the commands that remove them on ${esc(H())}. There is no undo.</p></div><div class="btnrow">${btn("forgethere","Forget it here","")}</div></div>`;
    else if(st==="dead") b+=`<div class="notice"><span class="mk" aria-hidden="true">!</span><h3>Pool ${esc(p.name)} wasn't removed</h3><div class="body"><p>${esc(F[p.reason]?F[p.reason].said(H()):"")}</p></div></div>`;
    else if(st==="gone") b+=`<p class="does">Pool ${esc(p.name)} was removed.</p>`;
  }
  return b+`</section>`;
}

/* ===================== render ===================== */
function pageFor(id){
  const p=S.pool;
  if(S.kind!=="cluster"&&p&&p.state==="Pool forgotten") return forgottenPage();
  if(S.forgetOpen&&(fl("bar")||fl("railstat"))&&S.kind!=="cluster") return (fl("bar")?statusBar():"")+head(`Forget pool ${S.name}`)+forgetBox();
  switch(id){
    case "where": return pageWhere();
    case "connect": return pageConnect();
    case "pool": return S.kind==="cluster"?pageClusterPool():pagePool();
    case "machine": return pageMachine();
    case "signins": return (fl("bar")?statusBar():"")+partSignins();
    case "identity": return (fl("bar")?statusBar():"")+partIdentity();
    case "try": return (fl("bar")?statusBar():"")+partTry();
    case "use": return (fl("bar")?statusBar():"")+pageUse();
    case "check": return pageCheck();
    case "install": return pageInstall();
    case "cluster": return pageCluster();
  }
  return "";
}
function render(){
  const ae=document.activeElement, fid=ae&&ae.id, s0=ae&&ae.selectionStart, s1=ae&&ae.selectionEnd;
  const sc=document.getElementById("readout"), scroll=sc&&sc.scrollTop;
  const v=VARIANTS.find(x=>x.id===S.variant);
  document.getElementById("vhead").innerHTML=`<span class="tag">Prototype note, not the design</span><h1>${esc(v.name)}</h1><p>${esc(v.what)}</p>`;
  const view=S.view||currentStep();
  document.getElementById("app").innerHTML=`<div class="win" role="region" aria-label="purlis window (mock)"><div class="tabs" aria-hidden="true"><span class="tab">fix-login</span><span class="tab on">Pool setup</span><span class="tab">Settings</span></div>${windowNotices()}<div class="ps">${rail()}<div class="page" id="page">${pageFor(view)}</div></div></div>${settingsPanel()}`;
  document.getElementById("chrome").innerHTML=renderChrome();
  document.getElementById("pt-theme").value=document.documentElement.getAttribute("data-theme")||"";
  document.getElementById("sw-label").textContent=v.name;
  if(fid){const el=document.getElementById(fid); if(el){el.focus({preventScroll:true}); try{if(s0!=null&&el.setSelectionRange)el.setSelectionRange(s0,s1);}catch(e){}}}
  const ro=document.getElementById("readout"); if(scroll!=null&&ro) ro.scrollTop=scroll;
}

/* ===================== prototype chrome ===================== */
function renderChrome(){
  const sc=scn(), groups=[...new Set(SCEN.map(s=>s.g))];
  let b=`<span class="tag">Prototype controls, not the design</span><section>
  <label for="pt-scenario">Scenario</label><select id="pt-scenario">${groups.map(g=>`<optgroup label="${g}">${SCEN.filter(s=>s.g===g).map(s=>`<option value="${s.id}" ${s.id===S.scenario?"selected":""}>${esc(s.label)}</option>`).join("")}</optgroup>`).join("")}</select>
  <p>${esc(sc.tip||(sc.fault?`Fails at "${F[sc.fault].at}". In a refined variant it is ${F[sc.fault].state}. A fix button assumes you made the fix.`:sc.post?"Finish setup to Ready, then press the trigger.":sc.cluster?"The cluster path.":""))}</p>
  <div class="btnrow"><label for="pt-speed" style="margin:0">Speed</label><select id="pt-speed" style="width:auto">${[1,5,10,30].map(x=>`<option value="${x}" ${S.speed==x?"selected":""}>${x}×</option>`).join("")}</select>
  <button type="button" class="btn" id="pt-reset">Reset</button>
  <select id="pt-theme" aria-label="Theme" style="width:auto"><option value="">Auto theme</option><option value="light">Light</option><option value="dark">Dark</option></select></div>`;
  if(sc.post) b+=`<div class="btnrow" style="margin-top:6px"><button type="button" class="btn" id="pt-trigger" ${S.pool&&S.pool.state==="Ready"?"":"disabled"}>Trigger: ${esc(sc.label)}</button></div>`;
  if(F[S.fault]&&F[S.fault].state==="Unreachable") b+=`<div class="btnrow" style="margin-top:6px"><button type="button" class="btn" id="pt-back" ${S.back?"disabled":""}>${S.back?"The machine is back":"Bring the machine back"}</button></div>`;
  b+=`<p>Keys: ← → switch variants. The hash #variant-t, -r1, -r2, -r3 keeps it.</p></section><section><label for="readout">State readout</label><pre id="readout" tabindex="0">${esc(readout())}</pre></section>`;
  return b;
}
function readout(){
  const r=S.run,c=cur(r),p=S.pool,cl=S.cl;
  const L=[`variant      ${S.variant}`,`scenario     ${S.scenario}`,`last action  ${S.lastAction}`,`kind         ${S.kind}`,`address      ${addr()}  host ${H()}`,`fault        ${S.fault||"none"}`,
    `pool         ${p?`${p.name}: ${p.state}${p.reason?" ("+p.reason+")":""}${p.made?"":" (not made)"}`:"none"}`,
    `run          ${r?`${r.doctor?"doctor":"setup"} until ${r.until}, ${r.status}, ${r.i+1}/${r.checks.length}`:"none"}`];
  if(c&&r.status!=="done") L.push(`  on         ${c.id} ${dur(c.el)}${c.el>=30?" (past 30 s)":""} limit ${isFinite(c.limit)?dur(c.limit):"none"}`);
  if(r&&r.finding) L.push(`  finding    ${r.finding}`);
  if(S.retry) L.push(`retry        attempt ${S.retry.attempt}, next in ${Math.max(0,S.retry.left).toFixed(0)} s`);
  if(!fl("fix")&&S.memoryUntil>S.clock) L.push(`hidden memo  failing forward remembered ${Math.ceil(S.memoryUntil-S.clock)} s more: Try now can't beat it`);
  if(r) L.push(`durations    `+r.checks.filter(x=>x.took!=null).map(x=>`${x.id} ${dur(x.took)}`).join(", "));
  L.push(`steps        signins ${S.signins} identity ${S.identity} tried ${S.tried}`);
  if(S.kind==="cluster") L.push(`cluster      ${cl.pool?cl.pool.state+(cl.pool.reason?" ("+cl.pool.reason+")":""):"no pool"}; run ${cl.run?cl.run.status+" "+(cl.run.i+1)+"/"+cl.run.checks.length:"none"}; wait ${cl.wait} min; ${cl.kubeconfig}`);
  return L.join("\n");
}

/* ===================== actions ===================== */
function goNext(){const ids=stepIds(),v=S.view||currentStep(),i=ids.indexOf(v);S.view=null;if(currentStep()===v&&ids[i+1])S.view=ids[i+1];}
function makePoolRecord(){ if(!S.pool) S.pool={name:S.name,state:"Setting up",reason:null}; else S.pool.state="Setting up"; }
const A={
  view:a=>{S.view=a;S.forgetOpen=false;},
  where:()=>{S.where=true;S.view=null;},
  tocluster:()=>{S.kind="cluster";S.whereOpt="cluster";S.view=null;},
  connect:()=>{ if(plainTcp()) return; S.run=newRun("docker","meet"); S.view=null; },
  trust:()=>{ S.trusted=true; const r=S.run, made=S.pool&&S.pool.made; r.until=fl("merge")||made?"create":"trust"; r.status="running"; if(fl("merge")&&!made) makePoolRecord(); S.view=fl("three")?"machine":"connect"; },
  notit:()=>{ S.run=null; S.trusted=false; S.connected=false; },
  change:()=>{ S.run=null; S.retry=null; S.trusted=false; S.connected=false; if(!S.pool||!S.pool.made) S.pool=null; if(F[S.fault]&&F[S.fault].next==="change"){S.fault=null; S.pick="build-box"; S.typed=""; S.name="build-box";} },
  next:()=>{ goNext(); },
  create:()=>{ if(fl("fix")) makePoolRecord(); const r=S.run; if(r.status==="failed"){ S.fault=null; rerun(); return; } r.until="create"; r.status="running"; },
  again:()=>{ if(S.kind==="cluster"){A.clagain();return;} const f=F[S.fault]; if(S.fault!=="host_key_changed"&&(!f||f.state!=="Unreachable"||S.back)) S.fault=null; S.retry=null; rerun(); },
  trynow:()=>{ retryNow(); },
  ntrynow:()=>{ if(fl("fix")){retryNow();return;} if(S.clock<S.memoryUntil){log("Try now: the remembered finding answers (hidden backoff)");return;} retryNow(); },
  cancel:()=>{ const r=S.kind==="cluster"?S.cl.run:S.run; const c=cur(r); if(!c) return; c.status="fail"; c.took=c.el; r.status="failed"; r.finding=c.id==="claim"?"vouch":"cancelled"; S.retry=null; if(S.pool&&r===S.run){S.pool.state="Refused";S.pool.reason=r.finding;} },
  usessh:()=>{ S.route="ssh"; S.pick="build-box"; S.typed=""; S.fault=null; S.name="build-box"; },
  usetls:()=>{ S.route="tls"; S.typed=S.typed.replace(/^tcp:\/\//,"").replace(":2375",":2376"); S.fault=null; },
  trustagain:()=>{ S.run=newRun("docker","meet",true); S.run.checks.forEach(c=>c.fail=null); S.fault=null; S.trusted=false; S.view=fl("three")?"machine":"connect"; },
  trustnew:()=>{ if(!S.keyOk) return; S.keyOk=false; S.fault=null; S.notices=[]; S.run=newRun("docker","create",true); S.pool.state="Setting up"; },
  goconnect:()=>{ S.view=fl("three")?"machine":"connect"; if(!fl("fix")) A.trustagain(); },
  remake:()=>{ S.fault=null; S.notices=S.notices.filter(n=>n!=="gone"); S.run=newRun("docker","create",false); S.run.checks.forEach(c=>{if(c.stage!=="create"){c.status="ok";c.took=c.d;}}); S.run.i=S.run.checks.findIndex(c=>c.stage==="create"); S.pool.state=fl("fix")?"Setting up":S.pool.state; },
  admin:()=>{ log("Send to your admin: words shown (not drawn in the prototype)"); },
  gethelp:()=>{ log("Get help: opens a chat (not in the prototype)"); },
  signin:()=>{ S.signins=true; S.view=null; },
  identity:()=>{ S.identity=true; },
  skip:a=>{ if(a==="signins")S.signins=true; else S.identity=true; S.view=null; },
  try:()=>{ S.tryRun=tryRunNew(); },
  trycancel:()=>{ S.tryRun=null; },
  openchat:()=>{ log("Open a chat on the pool (not in the prototype)"); },
  another:()=>{ resetAll(); },
  forget:()=>{ S.forgetOpen=true; if(!fl("bar")&&!fl("railstat")) S.view=S.pool&&S.pool.made&&S.view==="pool"?"pool":"connect"; },
  forgetno:()=>{ S.forgetOpen=false; },
  forgetyes:()=>{ const p=S.pool||{name:S.name}; const answers=["Ready","Refused","Runner gone","Setting up"].includes(p.state)&&!(p.reason&&F[p.reason]&&F[p.reason].state==="Unreachable");
    const left=answers&&S.forgetRemove?[]:leftovers(); S.pool=Object.assign(p,{state:"Pool forgotten",left,reason:null,made:!!p.made}); S.run=null; S.retry=null; S.forgetOpen=false; S.notices=[]; S.drift=false; },
  setupagain:()=>{ resetAll(); S.fault=null; },
  opensetup:()=>{ S.view=fl("three")?"machine":"connect"; },
  opensettings:()=>{ log("Open Pools settings"); },
  sremove:()=>{ const p=S.pool; S.removing=p.state==="Ready"||p.state==="Runner gone"?"ask":F[p.reason]&&["wrong_name","port_closed"].includes(p.reason)?"unreach":"dead"; },
  sremoveno:()=>{ S.removing=null; },
  sremoveyes:()=>{ S.removing=null; resetAll(); log("removed pool (today)"); },
  forgethere:()=>{ S.removing=null; S.pool.left=leftovers(); S.pool.state="Pool forgotten"; S.run=null; S.retry=null; S.notices=[]; },
  ctxfollow:()=>{ S.drift=false; log("Connect again: a new pool's setup on gpu-1 (not drawn)"); },
  ctxkeep:()=>{ S.drift=false; },
  clinstall:()=>{ const r=S.cl.run; r.until="install"; r.status="running"; },
  clwhere:()=>{ S.cl.where=true; S.view=null; },
  clcheck:()=>{ S.cl.run=newRun("cluster",fl("merge")?"install":"check"); },
  clagain:()=>{ const r=S.cl.run; if(r.finding!=="kube") S.cl.fault=null; S.cl.run=newRun("cluster",r.until); if(fl("fix")&&S.cl.pool) S.cl.pool.state="Setting up"; },
  clclaim:()=>{ const r=S.cl.run; if(fl("fix")) S.cl.pool={state:"Setting up",reason:null}; if(r.status==="failed"){ S.cl.run=newRun("cluster","pool"); S.cl.run.checks.forEach(c=>{if(c.stage!=="pool"){c.status="ok";c.took=c.d;}}); S.cl.run.i=S.cl.run.checks.findIndex(c=>c.stage==="pool"); return;} r.until="pool"; r.status="running"; },
  clall:()=>{ S.cl.pool={state:"Setting up",reason:null}; if(S.cl.run&&S.cl.run.status==="paused"){S.cl.run.until="pool";S.cl.run.status="running";} else S.cl.run=newRun("cluster","pool"); },
  useplugin:()=>{ S.cl.fault=null; const u=S.cl.run.until; S.cl.run=newRun("cluster",u); },
  raise:()=>{ if(S.cl.wait<10) S.cl.wait=10; A.clclaim(); },
};
function trigger(){
  const sc=scn(),p=S.pool; if(!p) return;
  if(sc.post==="context_drift"){ S.drift=true; S.view=fl("three")?"machine":"connect"; return; }
  S.fault=sc.post; S.back=false;
  if(sc.post==="host_key_changed"){ p.state="Host key changed"; p.reason=sc.post; if(!fl("fix")) notice(sc.post); S.run=newRun("docker","create",true); const r=S.run; r.checks.forEach((c,i)=>{if(i<2){c.status="ok";c.took=c.d;}}); r.i=2; r.checks[2].status="fail"; r.checks[2].took=0.3; r.status="failed"; r.finding=sc.post; return; }
  if(sc.post==="runner_gone"&&!fl("fix")) notice("runner_gone");
  S.run=newRun("docker","create",true);
  if(fl("fix")) p.state="Setting up";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="pt-reset"){resetAll();log("reset");render();return;}
  if(t.id==="pt-trigger"){trigger();log("trigger "+scn().post);render();return;}
  if(t.id==="pt-back"){S.back=true;log("machine back");render();return;}
  if(t.id==="sw-prev"||t.id==="sw-next"){cycle(t.id==="sw-next"?1:-1);return;}
  const a=t.dataset.act; if(!a||!A[a]) return;
  e.preventDefault(); A[a](t.dataset.arg); log(a+(t.dataset.arg?" "+t.dataset.arg:"")); render();
  if(a==="view"||a==="next"){const h=document.getElementById("step-title"); if(h) h.focus({preventScroll:false});}
});
function setPath(k,v){ if(k.startsWith("cl.")) S.cl[k.slice(3)]=k==="cl.wait"?Number(v):v; else S[k]=v; }
document.addEventListener("input",e=>{
  const t=e.target,k=t.dataset&&t.dataset.bind; if(!k) return;
  const v=t.type==="checkbox"?t.checked:t.value; setPath(k,v);
  if(k==="whereOpt"){S.kind=v==="cluster"?"cluster":"remote";}
  if(k==="typed"||k==="pick"){ if(S.run&&!S.pool){S.run=null;S.trusted=false;S.connected=false;} if(k==="pick"&&v==="typed"&&!S.typed)S.typed=""; const hn=H(); if(hn!=="the machine") S.name=/^\d/.test(hn)?"build-10":hn.split(".")[0]; }
  if(t.type==="checkbox"||t.type==="radio"||t.tagName==="SELECT"){log("set "+k);render();}
  else document.getElementById("readout").textContent=readout();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="pt-scenario"){S.scenario=t.value;resetAll();log("scenario "+t.value);render();return;}
  if(t.id==="pt-speed"){S.speed=Number(t.value);log("speed "+t.value+"×");render();return;}
  if(t.id==="pt-theme"){if(t.value)document.documentElement.setAttribute("data-theme",t.value);else document.documentElement.removeAttribute("data-theme");render();return;}
  if(t.dataset&&t.dataset.bind&&t.type==="text") render();
});
function typing(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"||a.isContentEditable);}
function cycle(d){const i=VARIANTS.findIndex(v=>v.id===S.variant);setVariant(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].id);}
function setVariant(v){
  if(S.variant===v) return; S.variant=v; S.forgetOpen=false; S.view=null; S.removing=null;
  if(location.hash!=="#variant-"+v) history.replaceState(null,"","#variant-"+v);
  resetAll(); log("variant "+v+" (scenario restarted)"); render();
}
document.addEventListener("keydown",e=>{
  if(typing()||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="ArrowLeft"){cycle(-1);e.preventDefault();}
  if(e.key==="ArrowRight"){cycle(1);e.preventDefault();}
});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#variant-(t|r1|r2|r3)$/);if(m)setVariant(m[1]);});
(function init(){
  const m=location.hash.match(/^#variant-(t|r1|r2|r3)$/); S.variant=m?m[1]:"t";
  if(!m) history.replaceState(null,"","#variant-t");
  resetAll(); render();
})();
</script>
