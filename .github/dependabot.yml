version: 2

# Tauri ships as a pair: the Rust crates (`tauri`, `tauri-build`, `tauri-plugin-*`) and the npm
# packages (`@tauri-apps/api`, `@tauri-apps/cli`, `@tauri-apps/plugin-*`). `tauri build` refuses
# to run when the crate and its package sit on different minors. That is how #536 failed: it
# moved `tauri` to 2.12 and `tauri-plugin-opener` to 2.6 while npm held 2.11 and 2.5.
# `groups` cannot cross ecosystems, and `ignore` cannot say "unless the other one moves", so
# both halves belong to one multi-ecosystem group: one PR moves the crates and the packages
# together. The ordinary cargo and npm entries below ignore Tauri, so only this group moves it.
multi-ecosystem-groups:
  tauri:
    target-branch: main
    schedule: { interval: weekly }
  # The Playwright the stories draw in comes as a pair too: the npm packages, and the image of that
  # version, which `tools/story-image.mjs` holds to the lockfile. One PR moves the two (#2956).
  # `vitest` and its browser packages come along, as a single bump of one of them fails (#3016).
  playwright:
    schedule: { interval: weekly }

updates:
  - package-ecosystem: cargo
    directory: /
    # Needed so this entry and the Tauri entry below count as distinct blocks for one directory.
    target-branch: main
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
    ignore:
      # Moved only by the `tauri` multi-ecosystem group, together with its npm half.
      - dependency-name: tauri
      - dependency-name: "tauri-*"
      # release-manifest must verify with the minisign-verify tauri-plugin-updater uses, so what
      # it refuses at release time is exactly what an installed app refuses. It moves when the
      # updater moves; a 0.x minor is a breaking bump.
      - dependency-name: minisign-verify
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The app draws its one pre-Tauri dialog through the rfd tauri-plugin-dialog already
      # brings in (`app/src-tauri/Cargo.toml`), so it moves when the plugin moves; a 0.x minor
      # alone would add a second rfd and, on Linux, split it from the `gtk3` feature line.
      - dependency-name: rfd
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The app asks the portal through the zbus tauri-plugin-single-instance already brings in
      # (`app/src-tauri/Cargo.toml`), so it moves when the plugin moves; a major alone would add
      # a second zbus to the tree.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
      # The specimen's picture comes as the cairo surface wry's and GTK's own cairo-rs hands
      # over, so it moves when they do; a 0.x minor alone is a different crate's type and does
      # not compile.
      - dependency-name: cairo-rs
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: npm
    directory: /app
    target-branch: main
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    ignore:
      # Moved only by the `tauri` multi-ecosystem group, together with its crate half.
      - dependency-name: "@tauri-apps/*"
      # Moved only by the `playwright` multi-ecosystem group, together with the stories' image.
      - dependency-name: playwright
      - dependency-name: "@playwright/*"
      - dependency-name: vitest
      - dependency-name: "@vitest/*"
      # typescript-eslint 8 declares typescript <7 as its peer range; move both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the Node major in .nvmrc (24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # WebdriverIO moves when `@wdio/tauri-service` does: its 1.x line (1.5.0, 2026-10-08)
      # requires `webdriverio ^9`, so 10 alone breaks every scenario run (#1636). The service
      # itself is not held, so its release for 10 is what proposes the move.
      - dependency-name: "@wdio/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wdio/local-runner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wdio/mocha-framework"
        update-types: ["version-update:semver-major"]

  # The docs site (`site/`), its own package and lockfile, apart from the app's.
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site: { patterns: ["*"] }
    # `sharp` is replaced on purpose by the local stand-in `site/no-sharp`, through npm
    # `overrides` (FR-5, #836), to keep its LGPL libvips out of the build. Dependabot cannot
    # update a `file:` override, so it would fail every week.
    ignore:
      - dependency-name: sharp

  # The Tauri pair, one PR across both ecosystems (see the note at the top).
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: tauri
    patterns: ["tauri", "tauri-*"]
  - package-ecosystem: npm
    directory: /app
    multi-ecosystem-group: tauri
    patterns: ["@tauri-apps/*"]

  # The Playwright pair, one PR across both ecosystems (see the note at the top). A third block for
  # `/app` needs a spelling of its own, as `target-branch` only tells two apart. The image's
  # file is `tools/story-image.mjs`'s pin, which nothing builds; its digest also moves here when
  # the same tag is pushed again.
  - package-ecosystem: npm
    directory: /app/.
    multi-ecosystem-group: playwright
    patterns: ["playwright", "@playwright/*", "vitest", "@vitest/*"]
  - package-ecosystem: docker
    directory: /app/.storybook/playwright-image
    multi-ecosystem-group: playwright
    patterns: ["*"]

  # The Rust toolchain `rust-toolchain.toml` pins (#888, ruling V84b). Every CI job installs
  # that version through `.github/actions/rust-toolchain`, so this one PR moves CI and local
  # builds together; it rides the next train like any other change.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule: { interval: weekly }

  # Every workflow pins its actions by commit SHA with the version as a comment; Dependabot
  # moves the SHA and the comment together. `dtolnay/rust-toolchain` publishes no version tags
  # for Dependabot to follow, so its pin, in `.github/actions/rust-toolchain`, is moved by hand.
  # `/` reads `.github/workflows` only; `.github/actions/linux-packages` pins `actions/cache`
  # too, and is named so its pin moves in the same PR as the workflows' (#1477).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/linux-packages"]
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # The runner image's bases, pinned by digest (`runner-image/`, #2043). Dependabot moves the
  # digest of the same tag, so a base's security fixes reach the next build of `main`.
  - package-ecosystem: docker
    directory: /runner-image
    schedule: { interval: weekly }
    groups:
      runner-image: { patterns: ["*"] }

  # The cluster operator (`operator/`, #2054): a cargo workspace with its own lock, and its
  # image's base, pinned by digest like the runner image's. The upstream agent-sandbox it is
  # tested against is pinned by its vendored definitions and moved by hand
  # (docs/cluster-operator.md).
  - package-ecosystem: cargo
    directory: /operator
    schedule: { interval: weekly }
    groups:
      operator: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /operator
    schedule: { interval: weekly }
    groups:
      operator-image: { patterns: ["*"] }
