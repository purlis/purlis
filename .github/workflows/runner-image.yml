name: runner image

run-name: ${{ github.event_name == 'workflow_run' && format('ci {0} ({1}) of {2}', github.event.workflow_run.conclusion, github.event.workflow_run.event, github.event.workflow_run.head_sha) || format('{0}, {1}', github.event_name, github.ref_name) }}

# purlis's runner image (#2043, spec #2041): `purlis serve`, the session host, for linux/amd64
# and linux/arm64, kept in the GitHub Container Registry as a public package of this
# organisation (the person's ruling of 2026-11-01, #4498), recorded by digest and signed by
# keyless cosign through this run's GitHub OIDC identity. No signing key is stored anywhere; the
# signature's entry in Sigstore's public transparency log names the image and its digest.
# `image` pushes only into a package the packages API shows public, `index` tags and signs only
# when that still holds and the registry serves both images to a puller who has not signed in,
# and `outside` then pulls and checks the release's image with no sign-in at all.
#
# Three ways in, and what each makes:
#
#   called by `release.yml` -> the image of the release it publishes (#2749): its `purlis`
#                             stamped with the release's version (`PURLIS_VERSION_STAMP`), as the
#                             desktop's is, built, checked against the contract, pushed, tagged
#                             `sha-<commit>` (and `main` when that moves it forward), signed,
#                             verified, and its line (`<image>@sha256:<digest>`) handed back as
#                             `image`, which the release signs with the updater's key and its
#                             update manifest names as `runnerImage`. So a dev or stable build
#                             and its runner image are one version, and a pool follows it.
#   a pull request         -> touching the image's own files only: the same build and contract
#                             check, for both architectures, pushed nowhere.
#   `workflow_dispatch`    -> the same, for any branch, pushed nowhere.
#
# **Each architecture is built on a runner of its own architecture** (`ubuntu-24.04` and
# `ubuntu-24.04-arm`), with no emulation, and the binary is compiled the way `release.yml`
# compiles the Linux one: the pinned toolchain, `cargo auditable`, the `dev-release` profile,
# no cache. The compile runs in a job that holds no write permission; the image jobs hold
# `packages: write`, and only `index`, which signs, can mint an OIDC token. What the registry
# and the forge are asked before a push, a tag or a signature is `tools/image-registry.mjs`,
# which fails closed.
#
# **Nothing is tagged or signed that was not checked.** `image` pushes each architecture's
# image by digest only, untagged, pulls that digest back, and runs the contract
# (`tools/runner-image-contract.mjs`, docs/runner-image.md) on exactly those bytes. `index`
# runs only when both passed.

on:
  pull_request:
    paths:
      - runner-image/**
      - tools/runner-image-*
      - tools/image-registry*
      - .github/workflows/runner-image.yml
  workflow_call:
    inputs:
      # The commit the release builds, and the version it stamps every binary with.
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
    outputs:
      image:
        description: The runner image's line, `<image>@sha256:<digest>`, signed and verified.
        value: ${{ jobs.index.outputs.image }}
  workflow_dispatch:

# One publish at a time, never cancelled once started, as `release.yml`'s dev builds; a run
# that publishes nothing takes a group of its own and displaces no publish. A pull request's run
# is superseded by its next push.
concurrency:
  group: runner-image-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push' || github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.head_repository.full_name != github.repository) && format('nothing-{0}', github.run_id) || github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Where the image lives. The organisation's own registry; the package is public (#4498).
  IMAGE: ghcr.io/${{ github.repository_owner }}/purlis-runner

jobs:
  plan:
    name: what this run makes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The same rule as `release.yml`'s `plan`, which calls this for each release it publishes:
    # the release's event is the one this run sees.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # Set only when `release.yml` calls this, for the release it publishes (#2749).
          CALLED_SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A release's call is the one way in that publishes.
          if [ -n "$VERSION" ]; then
            publish=true; sha=$CALLED_SHA
          else
            case "$EVENT" in
              pull_request) publish=false; sha=$PR_SHA ;;
              *) publish=false; sha=$GITHUB_SHA ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Runner image of \`$sha\`: $([ "$publish" = true ] && echo 'built, checked, pushed and signed' || echo 'built and checked, pushed nowhere')." >> "$GITHUB_STEP_SUMMARY"

  binary:
    name: purlis (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    # The commit checked out is `plan`'s: in main's context only the commit a green `ci` ran on
    # after a push to this repository's `main`, and otherwise the run's own branch, in that
    # branch's cache scope. No job of this workflow restores or saves a cache.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # The version `release.yml` installs, for the same reason: the image's binary lists the
      # crates it was built from, for `cargo audit bin`.
      - name: cargo-auditable
        env:
          CARGO_AUDITABLE_VERSION: 0.7.6
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"
      # Stamped with the release's version, as the desktop's binaries are (#2749), so the
      # runner says the version its desktop does. A run that publishes nothing is unstamped.
      - name: The purlis binary
        env:
          PURLIS_VERSION_STAMP: ${{ needs.plan.outputs.version }}
        run: cargo auditable build --profile dev-release --locked -p purlis-cli
      - name: It says which profile built it, and the release's version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          line=$(target/dev-release/purlis --version)
          echo "$line"
          case "$line" in
            "purlis "*"(dev-release profile)") ;;
            *) echo "::error::the binary says: $line"; exit 1 ;;
          esac
          if [ -n "$VERSION" ] && [ "$line" != "purlis $VERSION (dev-release profile)" ]; then
            echo "::error::the release is $VERSION and the binary says: $line"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlis-linux-${{ matrix.arch }}
          path: target/dev-release/purlis
          if-no-files-found: error
          retention-days: 7

  image:
    name: image (${{ matrix.arch }})
    needs: [plan, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            syft_sha256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
          - arch: arm64
            runner: ubuntu-24.04-arm
            syft_sha256: c46d5e4c28e12aa4c5becfaa343ef1c7f89045b6b895f2c21d471c62db09c706
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The build context is this folder: the binary, and purlis's plugin as this commit has it
      # (#2447), so nothing else of the checkout can reach the image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/context
      - name: purlis's plugin, beside the binary
        run: cp -R app/src-tauri/plugin "$RUNNER_TEMP/context/plugin"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # **No image is pushed into a package that is not public.** The packages API says so
      # immediately before the push, so a release never names an image a newcomer cannot pull
      # (#4498). A package that is not there is refused too: a new one starts private, and
      # someone has to choose to publish it. Anything else stops the job here.
      - name: The package is public before the image is pushed
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/image-registry.mjs visibility

      - name: Build the runner image, to check it here
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: runner-image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          load: true
          tags: purlis-runner:candidate
      # Pushed by digest only: an untagged image nothing names until `index` does, after the
      # contract has passed on the very bytes pushed.
      - name: Build the runner image and push it by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: runner-image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.title=purlis runner
            org.opencontainers.image.description=purlis serve, the session host of a runner
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Pull back what was pushed, to check exactly that
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" purlis-runner:candidate

      - name: Build the example of a team's own image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: runner-image/team-example.Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          load: true
          tags: purlis-runner-team-example:candidate

      - name: The runner image keeps the contract
        run: node tools/runner-image-contract.mjs --carries gh,glab purlis-runner:candidate
      # Confined as a Docker pool confines its runner (`Runner::create_args`), on each
      # architecture: the chat that runs them inside purlis's wrap is the parity job's, on amd64.
      - name: gh and glab run as a Docker pool's runner runs them
        run: |
          set -euo pipefail
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --security-opt "seccomp=crates/purlis-core/src/dockerpool/seccomp.json" \
            --network none --tmpfs /tmp:noexec --tmpfs /home/purlis:uid=10001,gid=10001 \
            --entrypoint /bin/sh purlis-runner:candidate -c 'gh --version && glab --version'
      # What each program adds to the image, in this run's log (#4354).
      - name: The image's size, layer by layer
        run: docker history --format '{{.Size}}  {{.CreatedBy}}' purlis-runner:candidate | cut -c1-120
      # What `sbom` asks of the pushed images, asked of a run that pushes nothing, so a change
      # that loses them is seen on its pull request. syft is the version `sbom` pins, for this
      # architecture.
      - name: This architecture's SBOM names gh and glab
        if: env.PUBLISH != 'true'
        env:
          ARCH: ${{ matrix.arch }}
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: ${{ matrix.syft_sha256 }}
          REQUIRED_PURLS: pkg:deb/ubuntu/gh@ pkg:deb/ubuntu/glab@
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_${ARCH}.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          purls=$("$RUNNER_TEMP/syft" scan docker:purlis-runner:candidate -o cyclonedx-json | jq -r '.components[]?.purl // empty')
          for want in $REQUIRED_PURLS; do
            grep -m1 "^$want" <<<"$purls" || { echo "::error::the SBOM has no $want component"; exit 1; }
          done
      - name: The example of a team's own image keeps the contract
        run: node tools/runner-image-contract.mjs purlis-runner-team-example:candidate

      - name: Record this architecture's digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  # The multi-architecture image: both digests under one index, tagged, signed and recorded.
  index:
    name: index, sign and record
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `id-token` mints the OIDC token cosign signs with, through Sigstore's public-good
    # instance; nothing else in the workflow can mint one. `contents: read` is for the checkout
    # of the commit's own tools and for comparing two commits of `main`.
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.index.outputs.image }}
    env:
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # By name, never by pattern: a pattern takes whatever any job of the run uploaded under
      # a name that matches.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests
      # Each is a digest and nothing else, before anything names an image by it.
      - name: Each architecture's digest is a sha256 digest
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            [[ "$(cat "$RUNNER_TEMP/digests/$arch")" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::digests/$arch holds no sha256 digest"; exit 1; }
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Before anything is tagged or signed, the packages API has to say `public` and the
      # registry has to serve both images to a puller who has not signed in. An answer that shows
      # neither stops the run (`tools/image-registry.mjs` fails closed).
      - name: The images are public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(node tools/image-registry.mjs visibility)
          if [ "$state" != public ]; then
            echo "::error::the package is $state, not public"
            exit 1
          fi
          node tools/image-registry.mjs anonymous \
            "$(cat "$RUNNER_TEMP/digests/amd64")" "$(cat "$RUNNER_TEMP/digests/arm64")"

      # `main` only moves forward, as the dev channel does (`tools/dev-build-order.mjs`): `ci`
      # runs end out of commit order, so the image of an older commit can finish last. It is
      # still tagged `sha-<commit>` and signed; `main` stays on the later one.
      - name: One index for both architectures, tagged sha-<commit>, and main when it moves forward
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          order=$(node tools/image-registry.mjs order "$SHA")
          echo "$order"
          tags=(--tag "$IMAGE:sha-$SHA")
          case "$order" in
            main:*) tags+=(--tag "$IMAGE:main") ;;
            sha-only:*) echo "::notice::main is not moved: ${order#sha-only: }" ;;
            *) echo "::error::tools/image-registry.mjs answered neither main nor sha-only: $order"; exit 1 ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/arm64")"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          platforms=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          if [ "$platforms" != "linux/amd64 linux/arm64" ]; then
            echo "::error::the index holds $platforms"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          case "$order" in main:*) echo "main=true" ;; *) echo "main=false" ;; esac >> "$GITHUB_OUTPUT"

      # Keyless: the certificate names this workflow on `main` as the signer, and the
      # signature goes in Sigstore's public transparency log. `--recursive` signs each
      # architecture's image as well as the index.
      - name: Sign by digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      # Signed as this workflow, called by the release on the ref it releases: `main` for a
      # dev build, the tag for a stable one.
      - name: The signature verifies as this workflow's on the ref it releases
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          RELEASED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/runner-image.yml@$RELEASED_REF" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null

      - name: Record the digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          MAIN: ${{ steps.index.outputs.main }}
        run: |
          set -euo pipefail
          tags="\`sha-$SHA\`"
          if [ "$MAIN" = true ]; then tags="$tags and \`main\`"; fi
          mkdir -p "$RUNNER_TEMP/record"
          echo "$IMAGE@$DIGEST" > "$RUNNER_TEMP/record/runner-image.txt"
          {
            echo "### Runner image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Commit \`$SHA\`, tagged $tags, linux/amd64 and linux/arm64, signed and verified."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-image
          path: ${{ runner.temp }}/record/runner-image.txt
          if-no-files-found: error
          retention-days: 90

  # **An SBOM of each architecture's image, read from the pushed bytes** (#2191), as
  # `release.yml`'s `sbom` reads each platform's bundle (#584): the image's packages, and the
  # crates the `purlis` binary was built from, which `cargo auditable` embeds in it. syft is the
  # version `release.yml` pins, checked against the same sha256 before it is unpacked, and it
  # runs in a job that can read the package and write nothing: no OIDC token, no
  # attestation, no secret but the run's own token for the pull. It reads the images `image`
  # pushed by digest, beside `index`, so the release waits on it no longer than on `index`. The
  # SBOMs are handed to `attest` under one exact name.
  sbom:
    name: SBOM of each architecture's image
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests
      # Each is a digest and nothing else, before anything names an image by it.
      - name: Each architecture's digest is a sha256 digest
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            [[ "$(cat "$RUNNER_TEMP/digests/$arch")" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::digests/$arch holds no sha256 digest"; exit 1; }
          done
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same two lines as `release.yml`'s `sbom`: moving to a new syft is both, in both.
      - name: syft, at one version and checksum, reads each architecture's image
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" version
          mkdir -p out
          "$RUNNER_TEMP/syft" scan "registry:$IMAGE@$(cat "$RUNNER_TEMP/digests/amd64")" -o "cyclonedx-json=out/purlis-runner-amd64.cdx.json"
          "$RUNNER_TEMP/syft" scan "registry:$IMAGE@$(cat "$RUNNER_TEMP/digests/arm64")" -o "cyclonedx-json=out/purlis-runner-arm64.cdx.json"
      # An SBOM that lists nothing looks like one that lists everything until someone reads it:
      # each has to name the binary's own crate, which it does only when the binary was built
      # with cargo auditable, the base image's packages, and the forge programs (#4354).
      - name: Each SBOM names the purlis binary and the image's packages
        env:
          REQUIRED_PURLS: pkg:cargo/purlis-cli@ pkg:deb/ pkg:deb/ubuntu/gh@ pkg:deb/ubuntu/glab@
        run: |
          set -euo pipefail
          for sbom in out/*.cdx.json; do
            purls=$(jq -r '.components[]?.purl // empty' "$sbom")
            for want in $REQUIRED_PURLS; do
              grep -q "^$want" <<<"$purls" \
                || { echo "::error::$sbom has no $want component"; exit 1; }
            done
            echo "$sbom: $(grep -c '^pkg:cargo/' <<<"$purls") crates, $(grep -c '^pkg:deb/' <<<"$purls") packages"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-image-sbom
          path: out/
          if-no-files-found: error
          retention-days: 90

  # **Build provenance and the SBOMs, attached to the image and verified here** (#2191), as
  # `release.yml`'s `provenance` does for its files (#583). SLSA provenance on the index the
  # release names, and each architecture's SBOM on that architecture's image, each stored by
  # GitHub and pushed to the registry beside the image (`push-to-registry`), into the same
  # package. Then each is checked as a person would check it: signed by this workflow,
  # for this commit, on a GitHub-hosted runner. An attestation that does not verify fails the
  # run, and with it the release's call. The one job of the workflow that may store an
  # attestation; it builds and runs nothing of the commit's.
  attest:
    name: provenance and SBOM, attested and verified
    needs: [plan, index, sbom]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests
      # Each is a digest and nothing else, before anything names an image by it.
      - name: Each architecture's digest is a sha256 digest
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            [[ "$(cat "$RUNNER_TEMP/digests/$arch")" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::digests/$arch holds no sha256 digest"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-image-sbom
          path: ${{ runner.temp }}/sbom
      - name: The digests attested
        id: digests
        env:
          LINE: ${{ needs.index.outputs.image }}
        run: |
          set -euo pipefail
          case "$LINE" in
            "$IMAGE"@sha256:*) ;;
            *) echo "::error::index handed back '$LINE'"; exit 1 ;;
          esac
          {
            echo "index=${LINE#*@}"
            echo "amd64=$(cat "$RUNNER_TEMP/digests/amd64")"
            echo "arm64=$(cat "$RUNNER_TEMP/digests/arm64")"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.index }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ runner.temp }}/sbom/purlis-runner-amd64.cdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ runner.temp }}/sbom/purlis-runner-arm64.cdx.json
          push-to-registry: true
      # What a person checking the image runs (docs/runner-image.md), run here first and pinned
      # to this workflow, this commit and a GitHub-hosted runner.
      - name: The provenance and each SBOM verify against this run
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX: ${{ steps.digests.outputs.index }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          pinned=(--repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/runner-image.yml"
            --signer-digest "$GITHUB_WORKFLOW_SHA"
            --source-digest "$GITHUB_SHA"
            --deny-self-hosted-runners)
          gh attestation verify "oci://$IMAGE@$INDEX" "${pinned[@]}"
          for digest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://$IMAGE@$digest" "${pinned[@]}" --predicate-type https://cyclonedx.org/bom
          done
          {
            echo "### Runner image attestations"
            echo
            echo "Build provenance on \`$IMAGE@$INDEX\`; an SBOM on each architecture's image. Verified."
          } >> "$GITHUB_STEP_SUMMARY"

  # **What someone outside does, done here** (#4498): no registry login and no permission on the
  # package. The release's image is pulled, its signature checked, and its provenance checked, by
  # the commands docs/runner-image.md gives, the SBOMs apart. Only the attestation step holds a
  # token, for the forge's attestation API, and it has no permission on the package. A failure
  # fails the release's call, so no release names an image that cannot be pulled and checked.
  outside:
    name: pulled and checked with no sign-in
    needs: [plan, index, attest]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Both architectures pull and the signature verifies, with no token
        env:
          LINE: ${{ needs.index.outputs.image }}
          RELEASED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$LINE"
          docker pull --platform linux/arm64 "$LINE"
          cosign verify "$LINE" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/runner-image.yml@$RELEASED_REF" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
      - name: The provenance verifies, for this workflow on the ref it releases
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ needs.index.outputs.image }}
          RELEASED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$LINE" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/runner-image.yml@$RELEASED_REF" \
            --deny-self-hosted-runners
