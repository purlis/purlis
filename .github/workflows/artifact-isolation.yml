name: artifact isolation

# ADR 0122 §3's five tests on each platform (#5949, PE-39), against the native webview ADR 0122 chose and
# its unguarded controls (the rejected sandboxed frame is ignored; `-- --ignored` measures it), in
# the probe app `tools/artifact-isolation-probe`: a launch per rendering and question.
# The probe is its own workspace and builds on Windows, where the app crate does not compile yet.
#
# **Evidence, not a gate**, like `ci.yml`'s `windows` job: each platform reports, and a platform
# whose chosen rendering is red there is one where scripted artifacts are refused (ADR 0122 §10),
# not a red `main`. The real rendering (#5952) carries these tests into the app's own checks; on
# that day this workflow and the probe are deleted. Four are carried so far: reach, loop, speak and
# walk, in `app/e2e/specs/artifact-isolation.e2e.ts`; escape needs a witness outside the app, and
# until it has one this stays.

on:
  pull_request:
    paths:
      - .github/workflows/artifact-isolation.yml
      - tools/artifact-isolation-probe/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: artifact isolation (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04] # [DEBUG-5948]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's Linux build dependencies, and a display
        if: runner.os == 'Linux'
        timeout-minutes: 11
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: xvfb xauth
      - uses: ./.github/actions/rust-toolchain
      - name: Build the probe
        run: cargo build --tests --manifest-path tools/artifact-isolation-probe/Cargo.toml
      # One test at a time: each opens windows of its own, and two at once would race for focus
      # and for the display. `--no-fail-fast`, so the run is the whole table, not its first red.
      - name: The five tests on the chosen rendering, and its controls
        run: |
          run=(cargo test --manifest-path tools/artifact-isolation-probe/Cargo.toml --no-fail-fast -- --test-threads=1 --nocapture shape) # [DEBUG-5948]
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}" 2>&1 | tee probe.txt
          status=${PIPESTATUS[0]}
          {
            echo "## artifact isolation on ${{ matrix.os }}"
            echo '```'
            grep -E '^(RESULT|NOTE) ' probe.txt || echo "no result lines: the probe did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
