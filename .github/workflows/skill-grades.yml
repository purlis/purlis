          if-no-files-found: warn

  grade-opencode:
    name: grade on opencode
    needs: [select]
    if: needs.select.outputs.skills != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: skill-grades
    permissions:
      contents: read
    steps:
      # The key decides whether anything runs. It is handed over again only to the step that
      # grades, which is the only other step that names it.
      - name: Is the key provisioned?
        id: provisioned
