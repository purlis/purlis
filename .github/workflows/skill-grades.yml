        with:
          name: skill-grades-runs-codex
          path: ${{ runner.temp }}/records
          if-no-files-found: warn

  grade-opencode:
    name: grade on opencode
    needs: [select]
    if: needs.select.outputs.skills != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: skill-grades
