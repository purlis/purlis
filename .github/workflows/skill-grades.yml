  nightly:
    # A scheduled run's red X is on a page nobody opens; an issue is in the repo. What to do is
    # `skill-grader nightly`'s, which has tests; this job fetches the open issues and carries
    # its decisions out. It holds no key, and is the only job that may write to the repo.
    name: track the nightly's grades
    needs: [grade-claude-code, grade-codex, grade-opencode]
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token reaches git for the push alone, never the checkout's config.
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # No cache: this job can write to the repo, and a cache is written by whichever job
      # saved it last.
      - name: Build the grader
        run: cargo build -p skill-grader --locked
      # Each harness graded tonight. One without its key, or whose grade failed to run, kept
      # none, and the grader then leaves its issues as they are and proposes no pins.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: skill-grades-scorecard-*
          merge-multiple: true
          path: ${{ runner.temp }}/scorecards
      - name: Open, rewrite or close each skill's issue, and propose the pins
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          BRANCH=skill-grades/pins
          gh label create skill-triggers --force --color d93f0b \
            --description "A built-in skill below its trigger bar on a harness, from the nightly skill grades"
          # Every open issue of the label, every page of them.
          gh api --paginate "repos/$GH_REPO/issues?state=open&labels=skill-triggers&per_page=100" \
            --jq '.[] | select(.pull_request | not) | {number, title}' > "$RUNNER_TEMP/issues.jsonl"
          target/debug/skill-grader nightly \
            --scorecards "$RUNNER_TEMP/scorecards" \
            --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/said" \
            < "$RUNNER_TEMP/issues.jsonl" > "$RUNNER_TEMP/acts.tsv"
          cat "$RUNNER_TEMP/acts.tsv"
          while IFS=$'\t' read -r verb number file title; do
            case "$verb" in
              create) gh issue create --title "$title" --label skill-triggers --body-file "$file" ;;
              edit) gh issue edit "$number" --body-file "$file" ;;
              close)
                gh issue comment "$number" --body-file "$file"
                gh issue close "$number" ;;
              bump)
                git switch -C "$BRANCH"
                git commit -q -m "$title" -- ci/skill-grades/pins.toml
                auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
                echo "::add-mask::$auth"
                git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin "HEAD:refs/heads/$BRANCH"
                existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
                if [ -n "$existing" ]; then
                  gh pr edit "$existing" --title "$title" --body-file "$file"
                else
                  gh pr create --head "$BRANCH" --base main --title "$title" --body-file "$file"
                fi ;;
              *) echo "::error::unknown act from skill-grader nightly: $verb"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/acts.tsv"
