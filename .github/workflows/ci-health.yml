name: ci-health

# A daily report on the `ci` workflow (#3598, daily and acting since #7331, ADR 0127). Between
# 2026-10-14 and 10-27 CI got twice as slow and three times as flaky, and nobody saw it for two
# weeks: the numbers were all in the API, but nothing read them. This reads the last seven whole
# days every day, writes them as the run's job summary, and keeps them in one issue labelled
# `area:ci` (made the first time), with a comment of the day's headline (ready to merged, the
# queue drop rate, the week's runs) so whoever watches the issue hears of it. It also files one
# `area:ci` ticket for each flaky test, and comments on the ticket a test already has.
#
# It also files a ticket for each job whose p50 of the week runs more than 20% over its budget
# (`ci/job-budgets.toml`, #7334).
#
# It keeps the quarantine (`ci/quarantine.toml`, #7333): a test that flaked in three runs of the
# week gets a pull request adding it (the steward reviews and enqueues it); the ticket of a test
# quarantined 14 days gets a priority label; and more than 10 quarantined tests turns this run
# red and pings the operator on the report's issue (the `CI_OPERATOR` repository variable, a
# login: unset, the comment pings no one). A pull request opened with the workflow's own token
# starts no workflows, so one that must run `ci` is opened with `CI_HEALTH_TOKEN`, a secret.
#
# What it reports, and how many calls each costs, is written in `tools/ci-health.mjs`; its
# numbers are tested on recorded API answers in `tools/ci-health.test.mjs`, run with the other
# tools' tests in `ci`.
#
# **Evidence only (V70).** It reads the API and writes issues. It never runs on a pull request
# and no branch protection names it.

on:
  schedule:
    # 05:17 UTC every day: after the previous day has ended everywhere the team works.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "How many of the week's runs to read jobs and flaky tests from (~2,500 in a week)"
        # A number by type here, and a positive whole one by `tools/ci-health.mjs`, which refuses
        # anything else before it reads a run.
        type: number
        default: 600
      issue:
        description: "Write the report into the area:ci issue"
        type: boolean
        default: true

# Nothing by default: the one job below names exactly what it needs.
permissions: {}

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  report:
    name: ci health (daily report, evidence only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read the repository (the tool), its workflow runs and its pull requests' merge-queue
    # events; write the report's issue and the flake tickets, and open the quarantine's pull
    # requests (a branch and one commit by the API, so `contents: write`).
    # Without pull-request access the merged pull requests come back from GraphQL's search with
    # no fields, and the queue's wait reads as none (seen on this workflow's first run, 2026-10-28).
    permissions:
      contents: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /tools/
            /ci/quarantine.toml
            /ci/job-budgets.toml
            /.github/workflows/ci.yml
            /.nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Report the last seven days
        env:
          GITHUB_TOKEN: ${{ secrets.CI_HEALTH_TOKEN || github.token }}
          OPERATOR: ${{ vars.CI_OPERATOR }}
          SAMPLE: ${{ inputs.sample || '600' }}
          # A scheduled run has no inputs: it writes the issue.
          ISSUE: ${{ github.event_name == 'schedule' || inputs.issue }}
        run: |
          set -euo pipefail
          args=(--sample "$SAMPLE")
          if [ "$ISSUE" = "true" ]; then args+=(--issue); fi
          node tools/ci-health.mjs "${args[@]}"
