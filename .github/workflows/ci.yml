name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue's run of the group a pull request joins: main, or the entries ahead of it, with
  # the pull request on top. It runs every job a pull request runs, and is gated as one: the jobs
  # that compare a change with main (`bench`, the cold start, the scoped macOS and Docker jobs)
  # treat a merge group as a pull request and measure it against the group's base
  # (`.github/actions/change-base`). A merge group is never scoped by what it changes
  # (`tools/ci-scope.mjs`): every job a pull request could run, it runs.
  merge_group:
    types: [checks_requested]
  # Nightly, for the evidence-only jobs below, which nothing else runs (V70). The gating jobs
  # run too, so each night is a whole record of `main` on that day's runner images, with the
  # toolchain `rust-toolchain.toml` pins. `release.yml` publishes a dev build only for a run started by a push, so a
  # nightly publishes nothing.
  schedule:
    - cron: "41 2 * * *"

# **Evidence-only jobs run nightly, never on a pull request and never on a push (V70, amended
# 2026-10-09).** `windows`, `fedora`, `macos-tests` and `app-evidence` (the preview images)
# report and never gate: none is a required check, and each has `continue-on-error`. Each carries
#
#     if: github.event_name == 'schedule'
#
# so a pull request queues only what can block it, and a merge's run on `main` is the same jobs
# its pull request ran. They ran on every push to `main` until 2026-10-09: `fedora` alone took
# 20 minutes, so `main` was 28 minutes behind a merge whose gating jobs were done in 18, and each
# merge held four more runners. What that buys is paid for in lateness: a break on one of these
# platforms is reported the next night, by a run that covers every merge of that day. A job skipped
# by `if:` concludes `skipped`, which counts as passing, both for a check and for the run's own
# conclusion; and none of these names is in branch protection, so a pull request waits on nothing it
# no longer runs. `bench` measures each pull request against main (V62), so it stays.

# **A pull request's heavy jobs run by what it changes (#3505).** The `changes` job sorts the change
# into scopes (`tools/ci-scope.mjs`, the one place that says which paths need which jobs): a pull
# request that changes only docs, agent skills or a tool a person runs by hand needs no Rust, app,
# scenario or web build, and one that changes only the window's sources (`app/src/`, but for the
# files Rust reads by name) needs no Rust suite, fmt, clippy or cargo-deny (#3596). No workflow has
# a `paths:` filter, and no job that carries a required check's name is skipped by `if:`: such a job
# always runs, and skips its expensive steps when its scope is untouched, as `parity` does. The jobs
# behind a `*-checks` job (`rust`, `lint`, `scenario`, `scenario-linux`) are skipped by scope, and
# their `*-checks` job passes only when the scope says there was nothing to run. The whole-tree
# guards, Rust tests that read every file of the repository, and the window's guards, which read
# every file of `app/src/`, run on every change (`recorded`). A merge group, a push to main and a
# nightly run every scope. When `changes` itself fails, every scope's output is empty and every job
# runs (`!= 'false'`), so a fault there runs more, never less.
#
# **A change to Rust alone runs no web check or story (2026-10-31, #3596).** Runner waits came back
# on 2026-10-29: about 1 job in 10 waited over 5 minutes, at some 336 pull request runs a day. Of the
# last 199 merged pull requests, 52 changed Rust and nothing the web checks or stories need: each
# spent about 70 minutes on them, in 10 jobs. `web`'s part 2 runs the vitest files that read Rust
# (`RUST_READERS`) in their place, about 3 minutes, and the other three parts are not started
# (`web-parts`). A job that only asks whether it is needed is not started on a pull request (`GATES`
# in `tools/ci-scope.mjs`): those were 18 of a pull request's 38 jobs, for 3 of its 281 minutes.
#
# **macOS's scenarios stay on the pull request**, though they are the largest cost: 75 of those 281
# minutes. In the 2.5 days to 2026-10-31, 24 pull request runs failed them with Linux's passing,
# about 10 a day. In the queue each would fail a 275-minute run and every group behind it, where
# about 8 groups a day failed in those days, 14 of those 19 on macOS's scenarios alone.

concurrency:
  # The nightly run keeps a group of its own, so it never displaces a merge's pending run on main.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # Superseding a PR's run is right: only the newest push is a claim about that branch.
  # Superseding a run on `main` is NOT: every merge's run is the record for that commit, and
  # `main` is protected by nine required checks. Cancelling it leaves the commit with no
  # verified result at all — measured on 2026-09-20, three merges in a row cancelled the
  # previous merge's run, so three commits on a protected branch were never checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The test runner the `rust` job installs, one exact version (`.config/nextest.toml`).
  NEXTEST_VERSION: "0.9.146"

jobs:
  # Which scopes this change needs (`tools/ci-scope.mjs`, `.github/actions/change-scope`).
  changes:
    name: what this change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
      app: ${{ steps.scope.outputs.app }}
      scenario: ${{ steps.scope.outputs.scenario }}
      web-parts: ${{ steps.scope.outputs.web-parts }}
      listen-shim: ${{ steps.scope.outputs.listen-shim }}
      browser-engine: ${{ steps.scope.outputs.browser-engine }}
      confinement: ${{ steps.scope.outputs.confinement }}
      parity: ${{ steps.scope.outputs.parity }}
      bench: ${{ steps.scope.outputs.bench }}
      outcome-bars: ${{ steps.scope.outputs.outcome-bars }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its first parent: what the change is.
          fetch-depth: 2
          persist-credentials: false
      - name: The scopes this change needs
        id: scope
        uses: ./.github/actions/change-scope

  # The Rust suite in four parts on four runners, each building the tests and running a quarter
  # of them (`--partition`): one runner took 14 to 17 minutes, longer than any other job a pull
  # request waits on (2026-10-10), and each of two took 15 to 16 minutes by 2026-10-27. Runners
  # start at once (no queue on 2026-10-14..27), so a part costs runner minutes, not wait. Part 2
  # also runs the schema check, a few seconds (fmt and clippy are `lint`'s; the doctests are
  # `rust-doctests`'s). Each part builds
  # for itself: a build handed from one job to the next saves runner minutes, not the wait, since
  # no test can start before the build ends. An optimised test build was tried and dropped
  # (#3553: 21 to 32 minutes to build cold, then the runners stopped). `rust-checks` below
  # carries the required check's name and passes when every part did.
  rust:
    name: rust tests (part ${{ matrix.part }} of 4)
    needs: changes
    # Skipped whole when nothing Rust reads has changed; `rust-checks` says so.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # purlis's own Linux sandbox (#1040) needs Landlock ABI 6 (Linux 6.12), and its tests run
      # in this job and never skip. The runner's kernel and its Landlock, as a notice on the run,
      # so a red sandbox test is read against them without the job's log. A report: it never
      # fails the job (the tests do, saying the version they need).
      - name: The runner's kernel and its Landlock
        continue-on-error: true
        run: |
          abi=$(python3 -c 'import ctypes; print(ctypes.CDLL(None).syscall(444, None, 0, 1))')
          echo "::notice title=Landlock::kernel $(uname -r), Landlock ABI $abi"
      # bubblewrap and socat: Claude Code's Linux sandbox runs through them, and a project
      # purlis makes runs its chats sandboxed (ADR 0067 §1), so the start tests need them.
      # From a cache of their .deb files, and bounded: a slow mirror fails the step in minutes,
      # and the job summary says how long the install took (#1477, `.github/actions/linux-packages`).
      - name: Tauri's Linux build dependencies, and the sandbox's programs
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      # Only `main` saves a Rust cache; a pull request restores `main`'s and saves none.
      # The repository holds 10 GB of caches, and each pull request's own 0.8-1.2 GB ones
      # pushed `main`'s out: on 2026-10-08 the caches held 12 GB and a run on `main` started
      # with none (the rust-cache README's own advice for a busy repository).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! reads the built frontend, so it has to exist before a build.
      - run: mkdir -p app/dist
      # cargo-nextest runs every test binary's tests at once, each test in a process of its own,
      # where `cargo test` runs the binaries one after another. Its settings are in
      # `.config/nextest.toml`. A machine without it runs the same tests with `cargo test`.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # The pinned engine makes its sandbox with user namespaces, which Ubuntu 23.10 and later
      # allow only to a program an AppArmor profile names (#2835). The `.deb` installs purlis's
      # profile, which names the engine in a user's default data folder; this step installs the
      # same file, as the package's postinst does. The window's end-to-end browser tests give
      # each session host a home of its own under the temporary folder, so AppArmor is told
      # that folder holds homes, as a machine with homes outside `/home` tells it.
      - name: The pinned engine may make its sandbox, as the .deb sets it up
        run: |
          echo '@{HOMEDIRS}+=/tmp/' | sudo tee /etc/apparmor.d/tunables/home.d/purlis-ci >/dev/null
          sudo install -m 0644 crates/purlis-core/src/browsers/purlis-engine.apparmor /etc/apparmor.d/purlis-engine
          sudo apparmor_parser -r -T -W /etc/apparmor.d/purlis-engine
      # The names the studio probe's network tests look up, from the hosts file, not outside DNS
      # (#3261): see the action for which names and why.
      - name: The studio probe's names
        uses: ./.github/actions/studio-probe-names
      # Built in a step of its own, so the run's step timings say how much of this job is
      # compiling and linking the test binaries and how much is running them, with no log to read.
      - name: Build the tests
        run: cargo nextest run --workspace --locked --no-run
      # Every test's result, never the first red only (`fail-fast = false` in the profile): a
      # flake in one test (charter-app#39) must not hide the rest of the suite.
      #
      # Under `tools/no-orphans.sh`, which fails the step when the suite leaves a process of its
      # own running after it ends (#923) — a stand-in or a signal-ignoring fixture that outlived
      # its test — and kills each one by pid. `--reap` is safe here because the runner is the
      # job's own machine.
      #
      # `hash:` places each test by its name, not by its place in its binary: `count:` dealt the
      # suite's heavy neighbours (the theme engine's import tests, 50 to 170 s each) to the same
      # part, and in three parts on 2026-10-27 part 1 summed 51.6 minutes of tests against 35 and
      # 30. On that run's own times four `hash:` parts put at most about 33 minutes in one.
      - name: Run the tests
        run: tools/no-orphans.sh --reap -- cargo nextest run --workspace --locked --profile ci --partition hash:${{ matrix.part }}/4 -E 'not test(/::in_a_docker_pool$/)'
      # The slowest tests and test binaries, as notices on the run: what makes the step above
      # slow, readable through the checks API without the job's log. A report, so it never turns
      # the job red.
      - name: Annotate the slowest tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/slowest-tests.mjs target/nextest/ci/junit.xml
      # **Claude Code's own sandbox on Linux, on the settings purlis writes** (#2211): the macOS
      # step in `scenario`'s, here on bubblewrap. The version purlis supports, this runner's build
      # of it from npm with no install scripts run, against a stand-in model on a loopback port;
      # the repositories' probes alone (`tools/seatbelt-case.sh --repositories-here`). Ubuntu
      # 23.10 and later let only a program an AppArmor profile names make a user namespace, and
      # Claude Code has none, so the runner allows them, as a machine without that rule does. No
      # model is called, and no credential is used.
      - name: Claude Code's own sandbox on Linux, on the settings purlis writes
        if: matrix.part == 3
        run: |
          version=$(sed 's/ .*//' tests/fixtures/harness-versions/claude.txt)
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64 ;;
            X64) arch=x64 ;;
            *) echo "::error::no Claude Code build for $RUNNER_ARCH"; exit 1 ;;
          esac
          package="@anthropic-ai/claude-code-linux-$arch"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" "$package@$version"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          PURLIS_CLAUDE_CODE="$RUNNER_TEMP/claude-code/node_modules/$package/claude" \
            cargo nextest run --workspace --locked --profile ci --no-capture \
            -E 'package(purlis-core) & binary(it) & test(/^claude_codes_own_sandbox_holds_the_settings_purlis_writes::/)'
      # The theme schema only grows within a format (#2524). `Run the tests` holds the engine's
      # schema to the committed `docs/schema/theme.v2.schema.json`; this step holds it to the
      # file the last release's tag holds, fetched with git, so an edit of the committed file
      # cannot carry a removal or a narrowing past the check. Before a release has a v2 schema
      # it says so in a notice and passes. The test it runs is `#[ignore]`d everywhere else.
      - name: The theme schema only grows since the last release
        if: matrix.part == 2
        run: >-
          tools/theme-schema-since-release.sh
          cargo nextest run --workspace --locked --run-ignored only
          -E 'package(purlis-core) & test(/the_schema_only_grows_since_the_last_release$/)'
  # The required check `rust (fmt, clippy, test)`: green only when every part of `rust` is.
  # `!cancelled()` so a red part still reports here as red, not as skipped, which a required
  # check would count as passing.
  # fmt and clippy, beside the parts of `rust` rather than in part 1: a check build of its own, 1.5
  # minutes that part 1 waited on before its tests (2026-10-12).
  lint:
    name: rust (fmt, clippy)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's Linux build dependencies
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! reads the built frontend, so it has to exist before clippy.
      - run: mkdir -p app/dist
      - run: cargo fmt --all --check
      # `crates/unicode/src/tables.rs` is generated, and is what its generator makes of its
      # pinned inputs (#3218): `tools/gen-unicode-tables.py` runs on the committed UCD files in
      # `tools/ucd/<version>/` under the CPython whose `unicodedata` is of that version, and
      # any difference from the committed file fails here. A hand edit, a changed input file
      # (the header records each one's sha256) or a generator change without its output each
      # turn this red. The Python is pinned by minor version, because a minor release is what
      # fixes CPython's Unicode version: 3.14 is Unicode 16.0.0.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The Unicode tables are what the generator makes of their pinned inputs
        run: |
          python -I tools/gen-unicode-tables.py > "$RUNNER_TEMP/tables.rs"
          rustfmt --edition 2024 "$RUNNER_TEMP/tables.rs"
          if ! diff -u crates/unicode/src/tables.rs "$RUNNER_TEMP/tables.rs"; then
            echo "::error file=crates/unicode/src/tables.rs::not what tools/gen-unicode-tables.py makes of tools/ucd/; regenerate it (the generator's docstring says how)"
            exit 1
          fi
      # No release build carries a crate's test-only feature, each listed in the script's
      # `TEST_ONLY` (#2216, #3180): the features Cargo resolves for each build the shipping
      # workflows make, read with `cargo tree` and nothing compiled. An error names the manifest
      # that turned one on; a build line it cannot read whole, a feature flag on one, or a
      # `test-support` feature the list leaves out is an error too.
      - run: node tools/release-features.mjs
      # `purlis-session-protocol/bench` so the latency bench, which only that feature builds, is
      # linted too (SC-16).
      - run: cargo clippy --workspace --all-targets --locked --features purlis-session-protocol/bench -- -D warnings
      # The app's `e2e` feature, so what only the scenario build compiles (`ipc_commands.rs`'s
      # `e2e_only` and what it calls, #2836) is linted too.
      - run: cargo clippy -p purlis-app --lib --features e2e --locked -- -D warnings
  # nextest does not run doctests, so cargo does, in a job of its own (#4255). In `rust`'s part 2
  # this step was 3 of the 5 minutes that made that part the slowest (22.8 against 17.6 to 18.4,
  # 2026-10-31), and no part needs it: the workspace has no doctest yet, so the 3 minutes are
  # `--doc` recompiling `purlis-core`, `purlis-app` and Tauri for its own set of features. Kept so
  # that a doctest written later runs. `shared-key: rust` restores `rust`'s cache: a key of its own
  # would be cold on every pull request, since only `main` saves one.
  rust-doctests:
    name: rust doctests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's Linux build dependencies
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: false
      # tauri::generate_context! reads the built frontend, so it has to exist before a build.
      - run: mkdir -p app/dist
      - name: Run the doctests
        run: tools/no-orphans.sh --reap -- cargo test --workspace --locked --doc
  # The required check `rust (fmt, clippy, test)`: green only when the lint, the doctests and every
  # part of `rust` are. `!cancelled()` so a red one still reports here as red, not as skipped, which a
  # required check would count as passing.
  # Skipped is green only when the change touched nothing Rust reads (`changes`).
  rust-checks:
    name: rust (fmt, clippy, test)
    needs: [changes, lint, rust, rust-doctests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: The lint, the doctests and every part passed
        env:
          SCOPE: ${{ needs.changes.outputs.rust }}
          RESULTS: ${{ needs.lint.result }} ${{ needs.rust.result }} ${{ needs.rust-doctests.result }}
        run: |
          if [ "$SCOPE" = false ]; then want="skipped skipped skipped"; else want="success success success"; fi
          echo "scope: ${SCOPE:-unknown}, results: $RESULTS"
          test "$RESULTS" = "$want"
  # **The parity suite against a Docker pool** (#2045, spec #2041): the behaviour suite
  # (`app/src-tauri/src/behaviour.rs`) on its Docker pool target, each behaviour on a pool of its
  # own whose runner is a container of this build's runner image, reached through `docker exec`
  # and the link between hosts; and the real-Docker tests of the pool, its link and its code.
  # The local targets of the same suite run in `rust` on every pull request. A pull request that
  # touches the host, the protocol, the sandbox or the browsers is gated on both; any other runs a
  # check of a few seconds and nothing else, scoped like `bench`, so the check's name is posted on
  # every pull request and can be required. A push to `main` is scoped the same way; each night
  # runs it whole.
  #
  # The runner image is `runner-image/Dockerfile` around the `purlis` this job built, with the
  # fake harness and `purlis` added at the folder the tests' build keeps them in
  # (`tests/parity/runner.Dockerfile`), pushed to a registry of this job's own: a pool names its
  # image by digest alone.
  parity:
    name: parity against a Docker pool (host, protocol, sandbox, browsers)
    needs: changes
    # Not started on a pull request that touches none of it (`GATES`); the step below decides for
    # a merge group and a push.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.parity != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # A Docker pool's target is made here or its test fails (`behaviour::in_a_docker_pool`).
      PURLIS_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and the base branch's tip, or a push and the commit
          # before it: what the change is.
          fetch-depth: 2
      - name: The commit this change is measured against
        id: base
        uses: ./.github/actions/change-base
      - name: Whether this change touches the host, the protocol, the sandbox or the browsers
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(crates/(host|session-protocol|linux-sandbox|browser-engine|fake-harness|terminal|stand-in)/|crates/purlis-core/src/(sandbox|browser|hook|runner|eventlog|linkkey|host|dockerpool|pools|codelink|session)[^/]*(\.rs$|/)|crates/purlis-cli/src/(bridge|mcp|hooks|browsing|main)[^/]*(\.rs$|/)|app/src-tauri/plugin/|app/src-tauri/src/(behaviour|host|session|hooks|killswitch|browser|chatbrowsers|routedsessions|runner|dockerpools|sandboxing|poolfollow)[^/]*(\.rs$|/)|runner-image/|tests/parity/|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing of the host, the protocol, the sandbox or the browsers has changed; the parity suite is not run against Docker"
          fi
      - name: Tauri's Linux build dependencies, and the sandbox's programs
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: bubblewrap socat
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/rust-toolchain
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.scope.outputs.run == 'true'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # tauri::generate_context! reads the built frontend, so it has to exist before a build.
      - name: The tests, purlis and the fake harness, built
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p app/dist
          cargo build --locked -p purlis-cli --bin purlis -p fake-harness --bin fake-harness
          cargo nextest run --locked -p purlis-app --lib --no-run
          cargo nextest run --locked -p purlis-core --test it --no-run
      - name: The runner image of this build, and the parity suite's around it, by digest
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run --detach --publish 127.0.0.1:5000:5000 --name registry registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
          context="$RUNNER_TEMP/runner"
          mkdir -p "$context"
          cp target/debug/purlis "$context/purlis"
          cp -R app/src-tauri/plugin "$context/plugin"
          docker build --file runner-image/Dockerfile --tag purlis-runner:parity "$context"
          # The runner image as it ships, with no harness, and one an update moves it to, for the
          # test of a person's whole way through a pool (`behaviour::pool_journey`).
          docker tag purlis-runner:parity localhost:5000/purlis-runner:shipped
          docker push localhost:5000/purlis-runner:shipped
          echo "DOCKER_POOL_JOURNEY_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:5000/purlis-runner:shipped | sed 's/.*@//')" >> "$GITHUB_ENV"
          printf 'FROM purlis-runner:parity\nLABEL dev.purlis.parity.next=true\n' \
            | docker build --tag localhost:5000/purlis-runner:next -
          docker push localhost:5000/purlis-runner:next
          echo "DOCKER_POOL_JOURNEY_NEXT_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:5000/purlis-runner:next | sed 's/.*@//')" >> "$GITHUB_ENV"
          parity="$RUNNER_TEMP/parity"
          mkdir -p "$parity"
          cp target/debug/purlis target/debug/fake-harness "$parity/"
          # The Claude Code purlis supports, this runner's build of it from npm with no install
          # scripts run, for the behaviour that runs it inside the wrap (#4083). No model is
          # called, and no credential is used.
          version=$(sed 's/ .*//' tests/fixtures/harness-versions/claude.txt)
          package="@anthropic-ai/claude-code-linux-x64"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" "$package@$version"
          cp "$RUNNER_TEMP/claude-code/node_modules/$package/claude" "$parity/claude-code"
          docker build --file tests/parity/runner.Dockerfile \
            --build-arg RUNNER=purlis-runner:parity --build-arg "AT=$PWD/target/debug" \
            --tag localhost:5000/purlis-runner-parity:candidate "$parity"
          docker push localhost:5000/purlis-runner-parity:candidate
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:5000/purlis-runner-parity:candidate)
          echo "image $image"
          echo "DOCKER_POOL_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      # The Linux wrap's listen in a container, as a Docker pool runs one: the runner's seccomp
      # profile (Docker's default and `pidfd_getfd`), no new privileges, every capability
      # dropped, not root. A socket the chat bound listens there; one it never bound does not.
      # Docker's own default profile is tried too: there nothing listens (fail closed).
      - name: A socket listens only where it was bound, in a container
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p purlis-linux-sandbox --test a_wrapped_chat_is_held_on_linux --no-run \
            --message-format=json | jq -r 'select(.profile.test == true and .executable != null) | .executable' \
            | grep '/a_wrapped_chat_is_held_on_linux-' | tail -1)
          test -x "$bin"
          echo "test binary: $bin"
          # `contained <seccomp option or "default"> <test>`: one test in a runner's container.
          contained() {
            local seccomp=()
            if [ "$1" != default ]; then seccomp=(--security-opt "$1"); fi
            docker run --rm --security-opt no-new-privileges --cap-drop ALL --user "$(id -u):$(id -g)" \
              "${seccomp[@]}" --volume "$PWD:$PWD" --workdir "$PWD" --entrypoint "$bin" \
              purlis-runner:parity "$2" --exact --test-threads=1
          }
          runner="seccomp=$PWD/crates/purlis-core/src/dockerpool/seccomp.json"
          contained "$runner" a_socket_never_bound_does_not_listen
          contained "$runner" a_server_on_a_socket_the_chat_bound_listens
          # A thread's own descriptor table is tried on the host (`rust`): a container's
          # default profile refuses `unshare`, so no thread makes one there.
          contained default a_socket_never_bound_does_not_listen
          if contained default a_server_on_a_socket_the_chat_bound_listens; then
            echo "::notice title=Listening in a container::Docker's own default profile lets the chat's socket be taken now"
          else
            echo "::notice title=Listening in a container::under Docker's own default profile nothing listens (fail closed)"
          fi
      # Under `tools/no-orphans.sh`, as `rust` is: a test ends what it started, its pool's
      # container included.
      - name: The behaviour suite on its Docker pool target, and the window's real-Docker tests
        if: steps.scope.outputs.run == 'true'
        run: >-
          tools/no-orphans.sh --reap --
          cargo nextest run --locked -p purlis-app --lib --profile ci --retries 0 --no-tests fail
          -E 'test(/::in_a_docker_pool$/) | test(/^runnerlinks::tests::a_(window_reaches|project_reaches)_/)'
      # `--retries 0` in both: the `ci` profile's retry is reported by `rust`'s annotate step,
      # which this job has not, so a flake here fails as it did rather than pass unseen.
      # Run whatever the step above found, so each step's result is its own.
      - name: The pool's link, code over it and a chat's move, on Docker
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: >-
          tools/no-orphans.sh --reap --
          cargo nextest run --locked -p purlis-core --profile ci --retries 0 --no-tests fail
          --test it -E 'test(/^(a_docker_pool_runner_is_linked_through_docker_exec|a_killed_docker_exec_closes_what_it_ran_on_a_runner|code_crosses_to_a_docker_pools_runner_and_back|a_chat_moves_to_a_docker_pools_runner_and_back)::/)'
      - name: What the runners left, if a test failed
        if: failure() && steps.scope.outputs.run == 'true'
        run: docker ps --all --no-trunc || true
  # A required check, so it always runs, and skips its steps when nothing Rust reads has changed.
  deny:
    name: rust (licences, advisories)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nothing Rust reads has changed
        if: needs.changes.outputs.rust == 'false'
        run: echo "::notice::nothing Rust reads has changed; the licences and advisories are not checked"
      - if: needs.changes.outputs.rust != 'false'
        uses: ./.github/actions/rust-toolchain
      # cargo-deny itself, the version `EmbarkStudios/cargo-deny-action` v2.1.1 runs, checked
      # against its published SHA-256. Run here rather than in that action's container so its
      # findings can be read: each is an annotation on `Cargo.lock` (qw390), the one place a
      # failure shows without the job's log.
      - name: Install cargo-deny
        if: needs.changes.outputs.rust != 'false'
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location -o /tmp/deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  /tmp/deny.tgz" | sha256sum --check --strict
          tar -xzf /tmp/deny.tgz -C /tmp
          install -m 0755 "/tmp/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: cargo deny check
        if: needs.changes.outputs.rust != 'false'
        run: |
          status=0
          cargo deny --format json --log-level warn --all-features check 2> deny.jsonl || status=$?
          # The whole of it in the log, pass or fail: warnings, and findings past the annotations.
          cat deny.jsonl >&2
          if [ "$status" -ne 0 ]; then
            node tools/deny-annotations.mjs deny.jsonl
          fi
          exit "$status"

  # The web checks in four parts, each running a quarter of vitest's test files (`--shard`):
  # after `rust` and `scenario` were split (#1712), vitest's 8 to 10 minutes made this the
  # longest job a pull request waited on, and by 2026-10-27 each of two parts took 10 to 12
  # minutes of vitest alone. Part 1 also runs the type check, lint and format check, part 2 the
  # licences and the tools' tests. `web-checks` carries the required check's name.
  #
  # It always runs, for the tools' tests, which run on every change; the rest of its steps run
  # when the change touches what the web checks read (`changes`).
  web:
    name: web (part ${{ matrix.part }} of 4)
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # Part 2 alone when `web` is out of scope: it has the tools' tests, and the others would
        # each take a runner to say so. An empty output (`changes` failed) runs every part.
        part: ${{ fromJSON(needs.changes.outputs.web-parts || '[1,2,3,4]') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Nothing the web checks read has changed
        if: needs.changes.outputs.web == 'false'
        run: echo "::notice::nothing the web checks read has changed; only the tools' tests run"
      - run: npm ci
        if: needs.changes.outputs.web != 'false' || (matrix.part == 2 && needs.changes.outputs.rust != 'false')
      # Every npm package the app ships, and every vendored asset (app/icons/vendored.json), is
      # under a licence deny.toml allows (FM-3, #1106). It reads the lockfile and nothing else,
      # under a second, so it gates as part of this job rather than as evidence.
      - run: node ../tools/npm-licences.mjs
        if: matrix.part == 2 && needs.changes.outputs.web != 'false'
      - run: npm run typecheck
        if: matrix.part == 1 && needs.changes.outputs.web != 'false'
      - run: npm run lint
        if: matrix.part == 1 && needs.changes.outputs.web != 'false'
      - run: npm run format:check
        if: matrix.part == 1 && needs.changes.outputs.web != 'false'
      - run: npm test -- --shard=${{ matrix.part }}/4
        if: needs.changes.outputs.web != 'false'
      # Vitest's files that read Rust (`RUST_READERS` in `tools/ci-scope.mjs`), when a change to
      # Rust leaves the rest of vitest out: `copy.rust.test.ts` holds the window's copy written in
      # every Rust file, and the others a constant or a theme. Vitest fails on a name it cannot find.
      - name: Vitest's files that read Rust
        if: matrix.part == 2 && needs.changes.outputs.web == 'false' && needs.changes.outputs.rust != 'false'
        run: |
          npm test -- \
            e2e/dialogs.test.ts e2e/fence.test.ts e2e/gitAnswer.test.ts e2e/recordedForge.test.ts \
            e2e/standInForge.test.ts e2e/upgrade.test.ts src/PersonaMark.test.tsx src/StripMarks.test.tsx \
            src/allowLabels.test.ts src/copy.rust.test.ts src/layoutProjects.test.ts src/settings/linkedGroups.test.ts \
            src/specimen/Specimen.test.tsx src/theme/consentToggles.test.ts src/theme/contrast.test.ts src/theme/core.test.ts \
            src/theme/forced-colors.test.ts src/theme/grounds.test.ts src/theme/railIcons.vendor.test.ts src/theme/registry.test.ts \
            src/theme/theme.test.ts src/theme/themeIds.test.ts src/theme/tint.test.ts src/ui/buildingSkill.test.ts src/ui/field/refusingFields.guard.test.ts \
            src/ui/menu/submenuRows.guard.test.ts src/ui/notice/noticeCardFill.test.ts src/windowprefs.test.ts
      # The tools' own tests (node:test), such as the cold-start gate's decision.
      - run: node --test "../tools/*.test.mjs"
        if: matrix.part == 2
  # The required check `web (types, lint, format, test)`, as `rust-checks` is for `rust`.
  web-checks:
    name: web (types, lint, format, test)
    needs: web
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.web.result }}
        run: test "$RESULT" = success

  # SC-16: the session layer's latency against main's, measured in this job (ADR 0086's CI
  # relative rows L1 and L3, as amended by V62). It runs on every pull request and posts a green
  # check when the change cannot move what it measures, so it can be required later: a `paths:`
  # filter would post no check at all (see `stress.yml`).
  #
  # **Gated on the bursts (V62, #932).** Five records of main's spread by 4.4% (2 MB burst) and
  # 4.1% (13 MB burst), so a confirmed regression in either fails the job. The keystroke under
  # ten flooding panes spread by 89% and stays evidence: it is reported and never fails
  # (`GATED` in `tools/latency-gate.mjs`). A required check once the operator adds it to branch
  # protection.
  #
  # **Why main is built here and not read from the `benchmarks` branch.** The same binary on two
  # ubuntu-24.04 runners differs by more than 20% (they are not one machine), so a change's value
  # held to the last value main recorded on another runner is a coin toss at the 20% line. main
  # and the change, built from the same runner and run in turn on it, share whatever this
  # runner's speed is. `tools/latency-gate.mjs` says what fails: a ratio past 1.20 in all rounds
  # but one, confirmed by a second pass; a row main cannot agree with itself on passes as noisy.
  #
  # **What it executes is the dependency set:** the session-protocol crate, its dependencies'
  # versions and the toolchain, and the bench and the gate themselves. The window and the app's
  # own session code are not in it: `stress` and the release scale run (#814) measure those.
  bench:
    name: latency against main (session layer)
    # A pull request's measurement and a push's record; a nightly has nothing to measure.
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.bench != 'false') }}
    # A pull request is gated; main's own record is evidence (ADR 0086 §1), so a record that
    # fails to be made never turns main red or holds back the dev release this run starts.
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its first parent, the base branch's tip: main
          # as it is now, which is what the change is measured against.
          fetch-depth: 2
      - name: The commit this change is measured against
        id: base
        uses: ./.github/actions/change-base
      - name: Whether this change can move what the bench measures
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(crates/session-protocol/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|fixtures/corpora/|tools/bench\.mjs$|tools/latency-gate\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing the session layer's bench runs has changed; not measured"
          fi
      - if: steps.scope.outputs.measure == 'true'
        uses: ./.github/actions/rust-toolchain
      - if: steps.scope.outputs.measure == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.scope.outputs.measure == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The change's bench, in release
        if: steps.scope.outputs.measure == 'true'
        run: cargo build --release --locked -p purlis-session-protocol --bin charter-session-bench --features bench
      # The change's bench source, built against main's crate and lockfile: the same scenarios on
      # both sides, so only the code under them differs. When main's crate cannot build it (the
      # change moved the API the bench calls, or main has no such crate), there is no baseline:
      # every row is reported and nothing is gated, which the job's summary says.
      #
      # The bench's runtime is the crate's `bench` feature; a main from before it had none, and
      # gets the same runtime by naming tokio's feature directly.
      - name: main's bench, in release
        id: main
        if: github.event_name != 'push' && steps.scope.outputs.measure == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach ../main "$BASE"
          if [ -d ../main/crates/session-protocol ]; then
            cp crates/session-protocol/src/bin/charter-session-bench.rs ../main/crates/session-protocol/src/bin/
          fi
          features=tokio/rt-multi-thread
          if grep -q '^bench = ' ../main/crates/session-protocol/Cargo.toml 2>/dev/null; then features=bench; fi
          if (cd ../main && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/main" cargo build --release --locked \
                -p purlis-session-protocol --bin charter-session-bench --features "$features"); then
            echo "bench=$GITHUB_WORKSPACE/target/main/release/charter-session-bench" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main's crate cannot build this change's bench, so nothing is gated: no baseline"
          fi
      - name: The session layer against main, interleaved, in this job
        if: github.event_name != 'push' && steps.main.outputs.bench != ''
        timeout-minutes: 15
        run: node tools/bench.mjs --skip-build --only host --baseline "${{ steps.main.outputs.bench }}"
      - name: The session layer, with no baseline to judge it by
        if: github.event_name != 'push' && steps.scope.outputs.measure == 'true' && steps.main.outputs.bench == ''
        timeout-minutes: 10
        run: node tools/bench.mjs --skip-build --only host
      # main's own record (ADR 0086 §1): each row's median of five runs, which `bench record`
      # appends to the `benchmarks` branch. It gates nothing: on main there is nothing to compare.
      - name: main's record
        if: github.event_name == 'push'
        timeout-minutes: 10
        run: |
          node tools/bench.mjs --skip-build --only host
          cp target/bench/*/host-bench.json host-bench.json
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-bench
          path: host-bench.json

  # main's values onto the `benchmarks` branch through github-action-benchmark (ADR 0086 §5),
  # for the chart that shows drift across merges. The one job with `contents: write`, and only on
  # a push to main: a pull request's run never holds a token that can move a baseline.
  # Evidence, not a gate: a record that fails to push must not turn main red or hold back the
  # dev release `release.yml` makes when this workflow succeeds. One at a time, so two merges'
  # records never race for the branch.
  bench-record:
    name: latency record (main only, evidence)
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: bench-record
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-bench
      # github-action-benchmark fetches the branch and fails when it does not exist yet. The first
      # record starts it as an empty commit of its own, with no history of main's.
      - name: The benchmarks branch, made once
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if ! git ls-remote --exit-code --heads origin benchmarks; then
            empty=$(git hash-object -t tree /dev/null)
            root=$(git commit-tree "$empty" -m "benchmarks: github-action-benchmark's data for ADR 0086's CI relative rows")
            git push origin "$root:refs/heads/benchmarks"
          fi
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: session layer (ubuntu-24.04)
          tool: customSmallerIsBetter
          output-file-path: host-bench.json
          gh-pages-branch: benchmarks
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "120%"
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true

  # The desktops `docs/platforms.md` lists (FR-25): the two latest macOS majors and the two
  # Ubuntu LTS releases, in two jobs with one list of steps. `macos-latest` is macOS 26 and
  # `xcode-27` is the runner images' macOS 27, a preview; when macOS 27 becomes `macos-latest`,
  # `xcode-27` here becomes `macos-26`. `expect` is the OS version the row in
  # `docs/platforms.md` says the label runs, and the first step warns when the label has moved
  # off it. Only the `macos-latest` and `ubuntu-24.04` checks are required, and both are legs of
  # `app`. Until 2026-10-28 macOS's steps ran in the macOS scenario job's part 1 to hold one macOS
  # runner fewer (on the free plan a `main` run waited 26 minutes for one, 2026-10-12); since the
  # move to GitHub Enterprise's runners (2026-10-13) 699 macOS jobs started with a median wait of
  # 2 s and none over a minute, while part 1, building this app before its own, took 35 minutes.
  #
  # Two jobs, not one matrix, because a job's `if:` cannot see `matrix`, and a matrix `exclude`
  # computed per event is undone by `include`, which adds an excluded entry back.
  #
  # Both legs, `app builds (ubuntu-24.04)` and `app builds (macos-latest)`, are required checks,
  # so the job always runs, and skips its steps when nothing the app is built from has changed
  # (`changes`).
  app:
    name: app builds (${{ matrix.os }}${{ matrix.evidence && ', evidence only' || '' }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        include:
          - os: ubuntu-24.04
            expect: "24.04"
            evidence: false
          - os: macos-latest
            expect: "26"
            evidence: false
    runs-on: ${{ matrix.os }}
    # `checks: read`: when main's app does not build here, the step reads main's own result for
    # this job on that commit before it lets the cold start go without a baseline (#2388).
    permissions:
      contents: read
      checks: read
    steps: &app-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its first parent, main as it is now: the cold
          # start below is measured against main's build of it (#1866).
          fetch-depth: 2
      - name: Nothing the app is built from has changed
        if: needs.changes.outputs.app == 'false'
        run: echo "::notice::nothing the app is built from has changed; it is not built"
      # Which OS this runner image really is, and a warning when a label has moved off the
      # version its row in `docs/platforms.md` names.
      - name: What this runner is
        if: needs.changes.outputs.app != 'false'
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            got=$(sw_vers -productVersion | cut -d. -f1)
          else
            cat /etc/os-release
            got=$(. /etc/os-release && echo "$VERSION_ID")
          fi
          uname -m
          if [ "$got" != "$EXPECT" ]; then
            echo "::warning::${{ matrix.os }} runs $got, but docs/platforms.md says it covers $EXPECT: update the row and this matrix"
          fi
      # bubblewrap and socat: Claude Code's Linux sandbox runs through them (ADR 0067 §1).
      # Cached and bounded, as the `rust` job's (#1477).
      - name: Tauri's Linux build dependencies, an X server and i3 to start it in, and the sandbox's programs
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux') }}
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: xvfb xauth dbus-x11 i3 bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
        if: needs.changes.outputs.app != 'false'
      # Not on the newer images: rust-cache's key has the OS and architecture but not the image,
      # so they would restore objects compiled on macOS 26 or Ubuntu 24.04 and only link them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        if: ${{ needs.changes.outputs.app != 'false' && (!matrix.evidence) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.app != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: needs.changes.outputs.app != 'false'
        working-directory: app
      # Every Rust crate and npm package this platform's build ships has its licence text
      # (#1784). `vite build` generates the notices from the locked graph and fails on the same
      # thing; this names it as a step of its own. Nothing is committed, so nothing can be stale.
      - name: Every shipped crate and npm package has its licence text
        if: needs.changes.outputs.app != 'false'
        run: node tools/third-party-notices.mjs
      - run: npx tauri build --debug --no-bundle
        if: needs.changes.outputs.app != 'false'
        working-directory: app
      # The window's main bundle carries no CodeMirror (#987): the light editor is a lazy chunk
      # (ADR 0086 rows M2 and L6), and a static import would quietly undo that. It reads the
      # `app/dist` this build left. Not on the evidence images, which only report.
      - name: The window's main bundle carries no CodeMirror
        if: ${{ needs.changes.outputs.app != 'false' && (!matrix.evidence) }}
        run: node tools/main-chunk-has-no-codemirror.mjs
      # main's app, built in this job, for the cold start below to be held to (#1866, ADR 0086 as
      # amended): the merge commit's first parent, main as it is now, built into the same target
      # directory so it reuses this build's dependencies. The change's binary is put aside and back
      # around it. When main's app cannot be built here, main's own run of this job on that commit
      # decides (#2388, ADR 0086 as amended 2026-10-17, `tools/coldstart-no-baseline.mjs`). Not
      # green there either: no baseline, and the cold start reports the 2 s limit with a warning
      # that nothing was gated, because the runner's speed alone missed it in 39 of 1,572 cases on
      # unchanged launch code. Green there: this change broke main's build in its own job (main is
      # built in the environment the change set up), and the step fails rather than ungate it.
      - name: The commit this change is measured against
        id: base
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
        uses: ./.github/actions/change-base
      - name: main's app, for the cold start to be measured against
        id: main-app
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          kept="$RUNNER_TEMP/coldstart"
          mkdir -p "$kept"
          cp target/debug/charter-app "$kept/change"
          git worktree add --detach "$RUNNER_TEMP/main" "$BASE"
          if (cd "$RUNNER_TEMP/main/app" && npm ci \
                && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" npx tauri build --debug --no-bundle); then
            cp target/debug/charter-app "$kept/main"
            echo "app=$kept/main" >> "$GITHUB_OUTPUT"
            # The change is launched from its copy beside main's, not from target/debug: the
            # app finds the `purlis` beside it and arms hooks and shims at start, so two builds
            # launched from two kinds of folder are not measured alike.
            echo "change=$kept/change" >> "$GITHUB_OUTPUT"
          else
            node tools/coldstart-no-baseline.mjs "$BASE"
          fi
          cp "$kept/change" target/debug/charter-app
      # Cold start on Linux (charter-app#24, program map FR-8). This runner IS the issue's machine:
      # its session bus is up and can activate a desktop portal that cannot start, which cost
      # 26-31 s before the app asked the portal first (`portal.rs`). A debug build on a shared
      # runner, so the numbers are an upper bound on what a release build does.
      #
      # On a pull request it is held to main's build, launched in turn with it on this runner: it
      # fails when it is past 1.15 times main's in two passes, and the spec's 2 s limit is reported,
      # not gated, because with the launch unchanged the runners' medians went from 874 to 2537 ms
      # (#1866). With no main to measure against, one discarded launch, then five on fresh
      # profiles: their median against the limit, and at most one past a 2.5 s ceiling (V39, ADR
      # 0086 as amended), reported with a warning that nothing was gated when it is a pull request
      # whose main did not build (#2388). On a push to main and a nightly it is evidence: the pull
      # request held the same code to main already. `tools/coldstart-linux.sh` says why not a
      # release build.
      - name: Cold start on X, on the runner's own session bus (charter-app#24's machine)
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux') }}
        env: &coldstart-env
          APP: ${{ steps.main-app.outputs.change }}
          BASELINE_APP: ${{ steps.main-app.outputs.app }}
          # Why a pull request has no main to be held to, when it has none (#2388).
          NO_BASELINE: ${{ steps.main-app.outputs.no-baseline }}
          # Gated on a pull request, evidence on a push to main and a nightly. It was report-only
          # on pull requests from train 87 (#1876) until its record was read (#1866): 524 pull
          # request runs from 2026-10-14 to 2026-10-17, 1,572 cases: the ratio 0.80 to 1.10 in
          # all but five, in two runs that held one build steadily slower through a whole job
          # (each round line now says where both builds' time went), while the absolute median
          # missed 2 s in 39 of them. Where the gate reports, a case that could not be
          # measured at all is a warning naming its cause and passes; this change's own build
          # leaving before its first frame fails either way (`tools/coldstart-linux.sh`).
          EVIDENCE_ONLY: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && '1' || '' }}
        run: tools/coldstart-linux.sh bare
      - name: Cold start on i3 under X11, on the runner's own session bus
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux') }}
        env: *coldstart-env
        run: tools/coldstart-linux.sh i3
      - name: Cold start on i3 under X11 with no session bus, as startx into i3
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux') }}
        env: *coldstart-env
        run: tools/coldstart-linux.sh i3-nobus
      # A launch that puts 1, 10 and 40 chats back (ADR 0086 row L8): when the window could be
      # used and when the chats had started. They start behind the window, so the first must
      # not grow with them. Evidence: reported in the job's summary, and it fails nothing.
      - name: A launch that puts chats back, on X (evidence only)
        if: ${{ needs.changes.outputs.app != 'false' && (runner.os == 'Linux') }}
        continue-on-error: true
        env:
          APP: ${{ steps.main-app.outputs.change }}
        run: tools/coldstart-linux.sh restore

  # The two newer images are evidence, like `windows`: reported, never a gate, because
  # `release.yml` publishes a dev build only when this whole workflow succeeds, and a preview
  # image breaking upstream must not stop that. Nightly only (V70).
  app-evidence:
    name: app builds (${{ matrix.os }}${{ matrix.evidence && ', evidence only' || '' }})
    # `changes` for the steps it shares with `app`; a nightly runs every scope, and a `changes`
    # that fails runs it all the same.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, ubuntu-26.04]
        include:
          - os: xcode-27
            expect: "27"
            evidence: true
          - os: ubuntu-26.04
            expect: "26.04"
            evidence: true
    runs-on: ${{ matrix.os }}
    steps: *app-steps

  # Fedora 44, the current release, as `docs/platforms.md` lists it (FR-25). On each Fedora
  # release bump the image here, `FEDORA` below, and the row in `docs/platforms.md` together.
  # A container on the Ubuntu runner, because GitHub has no Fedora runner. What it proves:
  # purlis builds against Fedora's own WebKitGTK and toolchain libraries, the core's and the
  # CLI's tests pass there, and the app it built starts and draws a window. It does not run the
  # AppImage a release build makes.
  #
  # Evidence, like `windows`: reported, never a gate, because `release.yml` publishes a dev
  # build only when this whole workflow succeeds. Nightly only (V70).
  #
  # The tests run as a normal user, not the container's root: root reads a file whose mode
  # says nobody may, and a test about refusing such a file would pass or fail for the wrong
  # reason. The cold start is run for "it starts"; its limit is set wide, because the 2 s limit
  # is held on the Ubuntu runners, not inside a container. No build cache: it would be evicted
  # within hours and saving it costs minutes, so only the crate registry is kept.
  fedora:
    name: fedora (build, core and cli tests, start, evidence only)
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      # An init that reaps, as every desktop has. Without it PID 1 is the runner's
      # `tail -f /dev/null`, a killed orphan stays a zombie, and the executor's tests that a
      # helper is stopped read the zombie as still running (seen on this job's first run).
      options: --init
    env:
      CARGO_TARGET_DIR: /home/ci/target
      FEDORA: "44"
      # rustup-init, pinned and checked against its published SHA-256.
      RUSTUP_VERSION: 1.29.1
      RUSTUP_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
    steps:
      # Bounded, and each download tried again by dnf itself (#1625), as the Ubuntu jobs'
      # packages are (#1477): a slow mirror ends this step rather than holding the job.
      #
      # The programs the core's tests run that the Ubuntu runner image has and Fedora's does not
      # (#3507): `nc` (`nmap-ncat`), the client the brokered tunnel's tests send through it, and
      # the `openssl` command, which makes the certificate of a private skill source's https
      # test. `openssl-devel` is only the library's headers.
      - name: Fedora's build dependencies for Tauri, and a display to start the app in
        timeout-minutes: 15
        run: |
          dnf -y install --setopt=install_weak_deps=False --setopt=retries=3 --setopt=timeout=60 \
            gcc gcc-c++ make pkgconf-pkg-config perl git tar gzip xz which findutils procps-ng gawk \
            curl wget file openssl openssl-devel webkit2gtk4.1-devel libxdo-devel \
            libappindicator-gtk3-devel librsvg2-devel \
            xorg-x11-server-Xvfb xauth dbus-daemon dbus-x11 mesa-dri-drivers bubblewrap socat \
            nmap-ncat
          test -x /usr/bin/nc
          openssl version
          cat /etc/fedora-release
          got=$(. /etc/os-release && echo "$VERSION_ID")
          if [ "$got" != "$FEDORA" ]; then
            echo "::warning::the image runs Fedora $got, but docs/platforms.md says Fedora $FEDORA: update the row and this job"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # A user to build and test as, owning the checkout, with its own rustup.
      - name: A normal user, with Rust
        run: |
          useradd --create-home --uid 1001 ci || useradd --create-home ci
          chown -R ci: "$GITHUB_WORKSPACE"
          init=/tmp/rustup-init
          curl --proto =https --tlsv1.2 -sSfo "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $init" | sha256sum -c -
          chmod 755 "$init"
          runuser -u ci -- env HOME=/home/ci "$init" -y --profile minimal --default-toolchain none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/ci/.cargo/registry/index
            /home/ci/.cargo/registry/cache
          key: fedora-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora-registry-
      - name: Build the app
        run: |
          chown -R ci: /home/ci
          runuser -u ci -- env HOME=/home/ci PATH="/home/ci/.cargo/bin:$PATH" sh -c \
            'cd app && npm ci && npx tauri build --debug --no-bundle'
      # Every crate the workspace's lock names, as `mutants.yml` does and for its reason: the
      # gitoxide guard reads `cargo metadata --offline` over the whole workspace, and building
      # the app, the core and the CLI never downloads a crate only another member needs.
      - name: Every crate the lock names
        run: |
          runuser -u ci -- env HOME=/home/ci PATH="/home/ci/.cargo/bin:$PATH" \
            cargo fetch --locked
      # Under `tools/no-orphans.sh`, as the `rust` job runs its tests (#923, #965), inside
      # `runuser` so the check counts the `ci` user's processes, the ones the tests start.
      # `--reap` is safe here: the container is the job's own.
      - name: The core's and the CLI's tests, as a normal user
        run: |
          runuser -u ci -- env HOME=/home/ci PATH="/home/ci/.cargo/bin:$PATH" \
            tools/no-orphans.sh --reap -- \
            cargo test --locked -p purlis-core -p purlis-terminal -p purlis-cli --no-fail-fast
      - name: The app starts and draws a window
        run: |
          runuser -u ci -- env HOME=/home/ci PATH="/home/ci/.cargo/bin:$PATH" \
            APP=/home/ci/target/debug/charter-app LIMIT_MS=20000 CEILING_MS=30000 \
            dbus-run-session -- tools/coldstart-linux.sh bare

  # The core's and the app's tests on macOS, under the orphan check (#965). The leaks #923
  # fixed were seen on macOS, where processes run on another schedule (first-run program checks
  # under load, another `/bin/sh`), and no other job runs these crates' tests there: `app` only
  # builds, and `scenario` drives the built app.
  #
  # Evidence, like `fedora`: reported, never a gate, and nightly only (V70). Measured cost, from
  # `main`'s runs of 2026-10-09: the gating macOS `app` job is 3-5 minutes and `rust`, the
  # longest gate, 16; the same tests took 13 minutes in `fedora` with no build cache. Run on
  # every pull request they would add some 10 macOS minutes to each run, on the runners CI
  # is already short of, for tests the Linux `rust` job runs already. Nightly, a leak that is
  # macOS's own is reported the next morning. The CLI's tests can join once the nights are
  # green.
  #
  # nextest, as the `rust` job runs them: each test in a process of its own, so a leak is the
  # test's, not a neighbour's. `--reap` is safe here because the runner is the job's own.
  # The browser engine's tests run here too: they start the runner's own Chrome, and macOS,
  # with no parent-death signal, is where an engine outliving its host would show (#2009).
  #
  # **In three parts, as `rust` is in two (#2458).** One runner ran out of its 45 minutes on
  # 2026-10-13, -14, -16 and -17: the build alone took 9 to 22 minutes, since no night had ever
  # saved a cache (rust-cache saves after a green job only, and this one was never green), and
  # the tests are some 6,000 s of test time on a runner that runs three at once. Each part
  # builds every test binary and runs a third of each one's tests (`count:`), and a red night
  # still saves its build (`cache-on-failure`), so the next night starts from it.
  #
  # Each part has 60 minutes, and the app's `behaviour` tests are left out here until #2464: on
  # macOS each takes some 160 s where Linux takes under 10, and the Linux `rust` job runs them
  # on every pull request. What each part took, measured, is in #2468.
  macos-tests:
    name: macos (core and app tests, no orphans, evidence only, part ${{ matrix.part }} of 3)
    if: github.event_name == 'schedule'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # tauri::generate_context! reads the built frontend, as in the `rust` job.
      - run: mkdir -p app/dist
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # The names the studio probe's network tests look up, from the hosts file, not outside DNS
      # (#3261): see the action for which names and why.
      - name: The studio probe's names
        uses: ./.github/actions/studio-probe-names
      - name: Build the tests
        run: cargo nextest run --locked -p purlis-core -p purlis-terminal -p purlis-app -p purlis-browser-engine -p studio-probe --no-run
      - name: Run the tests
        run: tools/no-orphans.sh --reap -- cargo nextest run --locked -p purlis-core -p purlis-terminal -p purlis-app -p purlis-browser-engine -p studio-probe --profile ci --partition count:${{ matrix.part }}/3 -E 'not (package(purlis-app) & test(/^behaviour::/))'
      # What makes a part slow, as notices on the run, as in `rust`.
      - name: Annotate the slowest tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/slowest-tests.mjs target/nextest/ci/junit.xml

  # The browser engine's tests on macOS, against the runner's own Chrome, on a pull request
  # that changes the engine's crate (#2009). macOS has no parent-death signal, so an engine
  # outliving its host would show here first; the Linux `rust` job runs the same tests on every
  # pull request. Scoped like `bench`: a pull request that does not touch the crate runs a
  # check of a few seconds and nothing else. The nightly `macos-tests` runs them on `main`.
  browser-engine-macos:
    name: browser engine on macos (real Chrome, when the engine changes)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (github.event_name != 'pull_request' || needs.changes.outputs.browser-engine != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: The commit this change is measured against
        id: base
        uses: ./.github/actions/change-base
      - name: Whether this change touches the engine
        id: scope
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(crates/browser-engine/|Cargo\.lock$|rust-toolchain\.toml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the browser engine's crate has not changed; not run"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/rust-toolchain
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # Not under `no-orphans.sh`: on a macOS runner the system starts processes of the job's
      # user while the tests run (Spotlight's workers, cache extensions), which it would count.
      # The tests check what they started themselves: every process of each engine is gone.
      - name: The engine's tests, the runner's Chrome
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p purlis-browser-engine -- --test-threads=2

  # An extension that declares a studio capability, confined on macOS by Seatbelt (ADR 0101,
  # #2777): the studio probe tries from inside its sandbox to read the project, write outside its
  # state folder, and reach an undeclared host or a model provider's. The Linux `rust` job runs
  # the same tests under purlis's own wrap on every pull request; Seatbelt is macOS's alone, so
  # its claims are proven here. Scoped like `browser-engine-macos`: a pull request that does not
  # touch the confinement runs a check of a few seconds and nothing else.
  studio-confinement-macos:
    name: studio confinement on macos (Seatbelt, when the confinement changes)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (github.event_name != 'pull_request' || needs.changes.outputs.confinement != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: The commit this change is measured against
        id: base
        uses: ./.github/actions/change-base
      - name: Whether this change touches the confinement
        id: scope
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(crates/studio-probe/|\.github/actions/studio-probe-names/|crates/purlis-core/src/(executor|extension)(\.rs|/)|crates/purlis-core/src/sandbox/(seatbelt|confined|egress|reach|wrapper|hosts|localport|door)(\.rs|/)|crates/purlis-core/src/hookwire/serve(\.rs|/)|crates/purlis-cli/src/listen/|crates/purlis-core/tests/it/a_sandboxed_chat_listens_nowhere_under_seatbelt\.rs|Cargo\.lock$|rust-toolchain\.toml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the studio confinement has not changed; not run"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/rust-toolchain
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # The names the studio probe's network tests look up, from the hosts file, not outside DNS
      # (#3261): see the action for which names and why.
      - name: The studio probe's names
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/studio-probe-names
      # Node, for a Claude Code chat's server dialling in to its door (#3316).
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The studio probe, confined by Seatbelt
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p studio-probe
      # A wrapped chat's own compiled profile, applied for real: no port bound, nothing listening.
      - name: A wrapped chat listens nowhere, confined by Seatbelt
        if: steps.scope.outputs.run == 'true'
        run: |
          tools/tests-ran.sh -- cargo test --locked -p purlis-core --test it -- a_sandboxed_chat_listens_nowhere_under_seatbelt::
      # A chat allowed to serve on a port, under its own compiled profile for real (#2019): its
      # own socket and no TCP port, reached through purlis's door alone.
      - name: A chat's server behind its door, confined by Seatbelt
        if: steps.scope.outputs.run == 'true'
        run: tools/tests-ran.sh -- cargo test --locked -p purlis-core --lib -- sandbox::localport::tests::under_seatbelt
      # Which of the confined profile's parts the probe needs to start, each tried on its own.
      # What Seatbelt refused while the probe ran, from the system's log, for a red run's reader.
      - name: What the sandbox refused
        if: failure() && steps.scope.outputs.run == 'true'
        run: log show --last 15m --style compact --predicate 'eventMessage CONTAINS "studio-probe" AND eventMessage CONTAINS "deny"' | tail -100 || true

  # **`purlis listen`'s shim for Node, tried for real** (#2019): a server started on a chat's port
  # by Node's own `http`, by Vite and by Next.js listens on the chat's socket and on no TCP port,
  # under each Node the shim promises. Scoped like the confinement jobs: a pull request that does
  # not touch the shim runs a check of a few seconds.
  listen-shim:
    name: listen shim (Node ${{ matrix.node }}, ${{ matrix.kind }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule') && (github.event_name != 'pull_request' || needs.changes.outputs.listen-shim != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
        # `dial-` kinds: a Claude Code chat's server dials in to its door (#3316).
        kind: [plain, vite, next, dial-plain, dial-express, dial-vite, dial-refused]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: The commit this change is measured against
        id: base
        uses: ./.github/actions/change-base
      - name: Whether this change touches the shim
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if [ "$EVENT" = schedule ] || git diff --name-only "$BASE" HEAD | grep -qE '^(crates/purlis-cli/src/listen|tests/listen-shim/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the listen shim has not changed; not run"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: A server on the chat's port listens on its socket
        if: steps.scope.outputs.run == 'true'
        run: node tests/listen-shim/check.mjs ${{ matrix.kind }}

  # What the Python charter answered, frozen: every scenario the old differential ran, and the
  # generated cases of the shell reader and the plane-root guards, replayed against this build
  # and compared with the recorded answers (ADR 0046). No Python and no oracle: the answers are
  # files in `tests/fixtures/recorded/` and `fixtures/corpora/`, and nothing here installs
  # anything.
  #
  # The `rust` job's `cargo test --workspace` runs these too. This job exists so the gate has a
  # NAME — "recorded behaviour" is a required check — and so a red run says which contract moved
  # without reading a whole test log. It builds no frontend and needs no Tauri.
  #
  # A required check, so it always runs, and skips its steps when nothing Rust reads has changed.
  recorded:
    name: recorded behaviour
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nothing Rust reads has changed
        if: needs.changes.outputs.rust == 'false'
        run: echo "::notice::nothing Rust reads has changed; the recorded behaviour is not replayed, and only the whole-tree and window guards run"
      # On every change: the whole-tree guards below need the toolchain when nothing else does.
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # **The whole-tree guards** (`WHOLE_TREE_GUARDS` in `tools/ci-scope.mjs`): Rust tests that
      # read every file of the repository, docs and tools included, so a change that leaves Rust
      # out of scope can still fail them (a new tool with no licence header). The `rust` job runs
      # them with the rest of the suite; when it is skipped, they run here, alone.
      #
      # With them, the window's guards (`WINDOW_SOURCE_GUARDS`, #3596): Rust tests that read every
      # file of `app/src/`, which runs no Rust suite of its own. Each is a module of the core's one
      # test binary (#3613), picked by its name.
      # A name that picks no test passes `cargo test` green, so a renamed file would quietly stop
      # running: `tools/tests-ran.sh` fails the step on such a name instead (#3752). So does every
      # other step that picks tests by name, here and in the scheduled workflows.
      - name: The whole-tree guards, as Rust is out of scope
        if: needs.changes.outputs.rust == 'false'
        run: >-
          tools/tests-ran.sh -- cargo test --locked -p purlis-core --test it --
          every_first_party_source_file_carries_its_licence_header::
          no_tracked_file_is_one_a_sandboxed_chat_may_not_write::
          no_old_name_is_spelled_in_the_window_or_its_assets::
          every_deferral_names_its_ticket::
      - name: The plane writes, hooks, status line and doctor, as recorded
        if: needs.changes.outputs.rust != 'false'
        run: cargo test --locked -p purlis-cli --test recorded_behaviour
      # A red replay offers the file a bless would write, so rows that moved on purpose can be
      # taken from here where no machine at hand can run the recorder (a sandboxed chat cannot
      # lay out a project's harness files). The run stays red: nothing is committed, and
      # `tools/recorded-bless-check.mjs` is what holds the downloaded file to the rows and the
      # fields that were meant to move, before anyone commits it. A row's verdict (`denies`,
      # `allows`) is never moved by a bless.
      - name: What a bless would record, where the replay differs
        if: ${{ needs.changes.outputs.rust != 'false' && (failure()) }}
        continue-on-error: true
        env:
          CHARTER_RECORDED_BLESS: "1"
        run: cargo test --locked -p purlis-cli --test recorded_behaviour
      - name: The blessed file, to check and commit by hand
        if: ${{ needs.changes.outputs.rust != 'false' && (failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorded-behaviour-blessed
          path: |
            tests/fixtures/recorded/behaviour.jsonl
            tests/fixtures/recorded/behaviour-blobs.jsonl.gz
          if-no-files-found: error
      - name: The shell reader and the plane-root guards, as recorded
        if: needs.changes.outputs.rust != 'false'
        run: >-
          tools/tests-ran.sh -- cargo test --locked -p purlis-core --test it --
          the_shell_is_read_the_way_python_reads_it::
          the_leak_guard_answers_what_the_python_answers::
          the_golden_rule_and_the_prose_guards_answer_what_the_python_answers::
          the_handoff_guard_answers_what_the_python_answers::
          the_plane_root_guards_answer_what_the_python_answers::

  # The scenario specs on macOS in four parts on four runners: on one runner the job took 15
  # minutes, 7 of them building on macOS's slow runner and 6 running the specs one at a time,
  # longer than any other job but `rust` (2026-10-10). Each part builds for itself, as `rust`'s
  # do. The seven runs that each need an app of their own (`extras`) are a leg that runs no spec
  # (`specs: false`): in a spec part they added about 7 minutes after its specs, and that part was
  # the run's longest job (31 to 32 minutes on 2026-10-28; 25.9 with the extras apart). macOS
  # runners vary a lot: the same half of the specs took 622 to 984 s and the build 179 to 485 s
  # across those runs. The app as it ships is `app`'s macOS leg (`app builds (macos-latest)`).
  #
  # Four parts, not two (#3615): on 14 runs of 2026-10-28 a half took 24 minutes at the median and
  # up to 31, of which 15.5 running its specs and 8 building, and the build is the runner's speed
  # (sccache hit 80 to 90% on the fastest build and the slowest alike). A build shared through an
  # artifact would only move those 8 minutes in front of every part, so the specs are what to cut.
  # The parts are cut by measured time (`e2e/parts.ts`), not by WebdriverIO's `--shard`, which
  # counts files: its four parts would have taken 4.6, 10.8, 6.3 and 8.2 minutes of specs, the
  # cut ones 7.7, 7.7, 6.9 and 7.6. Runners do not queue (Enterprise runners, 2026-10-13), so a
  # part costs runner minutes, not wait. Every part is a run of neighbours in name order, as
  # before.
  #
  # macOS's own sandbox checks are a leg of their own too (`sandbox`): they compile the core's
  # tests and build no app, 4.2 minutes on average that made the single-app leg the next longest.
  # `scenario-checks` carries the required check's name. Linux has the same steps, in
  # `scenario-linux`.
  #
  # Skipped whole, and no macOS runner held, when nothing the scenarios run has changed
  # (`changes`); `scenario-checks` says so.
  scenario:
    name: scenario tests (${{ matrix.os }}, ${{ matrix.specs && format('part {0} of {1}', matrix.shard, matrix.shards) || matrix.sandbox && 'the sandbox runs' || 'the single-app runs' }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scenario != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        shard: [1, 2, 3, 4]
        shards: [4]
        extras: [false]
        specs: [true]
        sandbox: [false]
        outcome: [false]
        include:
          - os: macos-latest
            shard: extras
            shards: 4
            extras: true
            specs: false
            sandbox: false
          - os: macos-latest
            shard: sandbox
            shards: 4
            extras: false
            specs: false
            sandbox: true
    runs-on: ${{ matrix.os }}
    steps: &scenario-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bubblewrap and socat: Claude Code's Linux sandbox runs through them, and a project
      # purlis makes runs its chats sandboxed (ADR 0067 §1).
      # Cached and bounded, as the `rust` job's (#1477): this is the step that took 1,285 s on
      # 2026-10-07 and held `main` for over an hour.
      - name: Tauri's Linux build dependencies, a display to run in, and the sandbox's programs
        if: runner.os == 'Linux'
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: xvfb dbus-x11 bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # **sccache for the workspace's own crates, on macOS** (2026-10-12, an experiment kept only
      # if it pays). rust-cache keeps the dependencies but never the workspace's crates, so each
      # macOS part compiled purlis-core and the app afresh: 3.5 to 4 of its minutes on the
      # slowest runners. sccache keeps each compiled crate in the Actions cache, written by
      # `main` and only read by a pull request, as rust-cache's is (#1547). Turned on AFTER
      # rust-cache: rust-cache keys its cache on every RUST* and CARGO* variable, and a
      # RUSTC_WRAPPER set before it would key it apart from the one `stress` restores (#1826).
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: runner.os == 'macOS'
        with:
          version: v0.18.0
      # A cache that does not answer is a slower job, never a failed one: the storage behind
      # the Actions cache refuses reads once the account's egress is over its limit
      # ("ServerBusy"), and sccache then failed `rustc -vV` and the whole job with it
      # (2026-10-30, three merge-queue drops). The server is started here; only one that comes
      # up is put in front of rustc, and SCCACHE_IGNORE_SERVER_IO_ERROR has a later failure
      # compile without it.
      - name: Compile through sccache
        if: runner.os == 'macOS'
        env:
          MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
        run: |
          export SCCACHE_GHA_ENABLED=true SCCACHE_GHA_RW_MODE="$MODE"
          if sccache --start-server >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_GHA_ENABLED=true"
              echo "SCCACHE_GHA_RW_MODE=$MODE"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
          else
            echo "::warning title=sccache::the build cache did not answer, so this job compiles without it"
          fi
      # Whether macOS's sandbox matches a name as typed or as it is on disk, measured; that the
      # case-classed rules purlis writes for Claude Code hold every spelling (#2071, #2107); and
      # the profiles a wrapped chat starts under, at the full sandbox and at the floor, built by
      # the core and applied whole to the same operations (#2128). After the toolchain and the
      # caches, since the core's test writes those profiles out.
      - name: macOS's sandbox and a name spelled in another case
        if: runner.os == 'macOS' && matrix.sandbox
        env:
          PURLIS_SEATBELT_OUT: ${{ runner.temp }}/seatbelt-emitted
        run: |
          tools/tests-ran.sh -- cargo test --locked -p purlis-core --test it -- the_profiles_a_wrapped_chat_starts_under_are_written_out::
          tools/seatbelt-case.sh "$PURLIS_SEATBELT_OUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: ${{ !matrix.sandbox }}
        working-directory: app
      # **Claude Code's own sandbox, on the settings purlis writes** (#2211). Claude Code builds its
      # sandbox itself, so the real one is run: the version purlis supports
      # (`tests/fixtures/harness-versions/claude.txt`), this machine's build of it from npm with no
      # install scripts run, started with a full-sandbox chat's settings and a floor chat's against
      # a stand-in model on a loopback port the test binds. Its Bash tool runs the same probes as
      # the step above, and a wrong answer fails the step. No model is called, and no credential
      # is used.
      - name: Claude Code's own sandbox on the settings purlis writes
        if: runner.os == 'macOS' && matrix.sandbox
        run: |
          version=$(sed 's/ .*//' tests/fixtures/harness-versions/claude.txt)
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64 ;;
            X64) arch=x64 ;;
            *) echo "::error::no Claude Code build for $RUNNER_ARCH"; exit 1 ;;
          esac
          package="@anthropic-ai/claude-code-darwin-$arch"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" "$package@$version"
          PURLIS_CLAUDE_CODE="$RUNNER_TEMP/claude-code/node_modules/$package/claude" \
            tools/tests-ran.sh -- cargo test --locked -p purlis-core --test it -- claude_codes_own_sandbox_holds_the_settings_purlis_writes:: --nocapture
      # The `e2e` feature puts WebdriverIO's embedded WebDriver server inside the app, which is
      # what drives it on macOS as well as Linux. It is in no build anyone is given.
      #
      # The harness the scenario tests run in every pane, and the `purlis` binary its hooks run,
      # are built by the same cargo run as the app (the packages after `--`). Built apart, their
      # dependencies resolve other features than the app's, so purlis-core compiled twice
      # (2026-10-12); together, once. They take the app's `purlis-core/fenced` with it.
      #
      # **What this build spends its time on** (#3742, 2026-10-29; six legs' logs and cargo's
      # timings). Not linking (6 s for the app's program) and not sccache's round trips (under a
      # second a hit): the app's own crate, 193 s of a 394 s cargo run, compiled afresh on every
      # leg. Its library also emitted a `staticlib` and a `cdylib`, Tauri's template's for iOS and
      # Android, and sccache never caches a crate that links (`crate-type` among its
      # non-cacheable calls), so "80 to 90% hits" counted only the small crates. The library is now
      # an `rlib` alone (`app/src-tauri/Cargo.toml`). The frontend was the rest: `tsc` before vite
      # took 20 to 150 s per leg, a type check the required `web` job already makes, so
      # `build:e2e` is vite alone. Rejected: a lighter debug profile (`line-tables-only` is already
      # the dev profile, and #3560's opt-level made the cold build 21 to 32 min), another linker
      # (6 s to win), a `target/` cache (rust-cache already restores the dependencies, and the
      # workspace's crates change with every pull request that runs this job).
      - name: Build the app, the harness and the CLI for the scenario tests
        if: ${{ !matrix.sandbox }}
        run: npx tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json -- -p purlis-app -p fake-harness -p purlis-cli --timings
        working-directory: app
      # Cargo's own account of that build, unit by unit (`--timings`), kept a week: what a slow
      # build spent its time on, read without rerunning it (#3742).
      - name: Keep cargo's timings of the build
        if: ${{ !cancelled() && !matrix.sandbox }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-${{ matrix.os }}-${{ matrix.shard }}
          path: target/cargo-timings/cargo-timing.html
          retention-days: 7
      # What sccache found, as a notice: whether the experiment pays, without the log.
      - name: sccache's hits and misses
        if: runner.os == 'macOS' && !cancelled()
        continue-on-error: true
        # Its whole report, or what it said instead: the first version filtered it to five lines
        # and #1829's run showed no notice at all.
        run: |
          said=$(sccache --show-stats 2>&1 | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=sccache (macOS, ${{ matrix.specs && format('part {0}', matrix.shard) || matrix.sandbox && 'the sandbox runs' || 'the single-app runs' }})::${said:-sccache said nothing}"
      # The part's specs, cut by `e2e/parts.ts` (#3615).
      - run: npm run e2e
        if: runner.os == 'macOS' && matrix.specs
        working-directory: app
        env:
          PURLIS_E2E_PART: ${{ matrix.shard }}/${{ matrix.shards }}
      - run: xvfb-run -a npm run e2e
        if: runner.os == 'Linux' && matrix.specs
        working-directory: app
        env:
          PURLIS_E2E_PART: ${{ matrix.shard }}/${{ matrix.shards }}
      # The slowest spec files and tests of the run above, as notices on the job: what makes the
      # specs slow, readable through the checks API without the log (`tools/e2e-timings.mjs`). A
      # report, so it never turns the job red.
      - name: Annotate the slowest scenario specs
        if: ${{ !cancelled() && matrix.specs }}
        continue-on-error: true
        run: node ../tools/e2e-timings.mjs logs/timings.jsonl "${{ matrix.os }}, part ${{ matrix.shard }} of ${{ matrix.shards }}"
        working-directory: app
      # What the project switches of the run above took (`specs/project-switch.e2e.ts`), as a
      # notice on the part of the job that ran them: a switch to a project of many chats apart
      # from one to a project of one (`tools/switch-notice.mjs`). A report, never a verdict.
      - name: Annotate the project switches
        if: ${{ !cancelled() && matrix.specs }}
        continue-on-error: true
        run: node ../tools/switch-notice.mjs logs/project-switch.jsonl "${{ matrix.os }}, part ${{ matrix.shard }} of ${{ matrix.shards }}"
        working-directory: app
      # A harness reporting its own state through `charter hook`, all the way to what the
      # window draws. Its own run, because the app reads `SHELL` once and this harness is a
      # different one.
      - name: What a chat is doing, from a real hook
        run: npm run e2e:state
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: What a chat is doing, from a real hook
        run: xvfb-run -a npm run e2e:state
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # The Skill studio's outcome bars, one run per harness on its stand-in (#4343). `outcome-bars`
      # alone runs these. Each runs whatever the one before it did, so a red run names every miss.
      - name: The Skill studio's outcome bars on claude's stand-in
        run: npm run e2e:outcome
        if: ${{ !cancelled() && runner.os == 'macOS' && matrix.outcome }}
        working-directory: app
        env:
          PURLIS_OUTCOME_HARNESS: claude
      - name: The Skill studio's outcome bars on claude's stand-in
        run: xvfb-run -a npm run e2e:outcome
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.outcome }}
        working-directory: app
        env:
          PURLIS_OUTCOME_HARNESS: claude
      - name: The Skill studio's outcome bars on codex's stand-in
        run: npm run e2e:outcome
        if: ${{ !cancelled() && runner.os == 'macOS' && matrix.outcome }}
        working-directory: app
        env:
          PURLIS_OUTCOME_HARNESS: codex
      - name: The Skill studio's outcome bars on codex's stand-in
        run: xvfb-run -a npm run e2e:outcome
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.outcome }}
        working-directory: app
        env:
          PURLIS_OUTCOME_HARNESS: codex
      - name: The Skill studio's outcome bars on opencode's stand-in
        run: npm run e2e:outcome
        if: ${{ !cancelled() && runner.os == 'macOS' && matrix.outcome }}
        working-directory: app
        env:
          PURLIS_OUTCOME_HARNESS: opencode
      - name: The Skill studio's outcome bars on opencode's stand-in
        run: xvfb-run -a npm run e2e:outcome
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.outcome }}
        working-directory: app
        env:
          PURLIS_OUTCOME_HARNESS: opencode
      # The app started the way an operator starts it — from Finder, with the `PATH` Finder
      # gives — on purlis's own built-in profile. Its own run, because it is the app's
      # ENVIRONMENT that is under test and one run is one environment (charter-app#134).
      - name: A chat on a built-in profile, from a Finder launch
        run: npm run e2e:finder
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: A chat on a built-in profile, from a Finder launch
        run: xvfb-run -a npm run e2e:finder
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # A layout file written before the app starts, and the window's first frame drawn from
      # it (M6.9). Its own run, because the file has to be on disk before the one app process
      # a run keeps is started.
      - name: The window's first frame, from a layout file
        run: npm run e2e:layout
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: The window's first frame, from a layout file
        run: xvfb-run -a npm run e2e:layout
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # A project that picks a theme before the app starts, and the native window drawn in it
      # with no draw asked by the test (#2583). Its own run, because the pick has to be on disk
      # before the one app process a run keeps is started.
      - name: The native window, from a project's theme pick
        run: npm run e2e:picked
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: The native window, from a project's theme pick
        run: xvfb-run -a npm run e2e:picked
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # The project rail's show and keep, which hold over its own hide for the rest of a launch
      # (#3077). Its own run, because the base run measures narrow windows with the rail as the
      # window draws it, in the one app process a run keeps.
      - name: The project rail
        run: npm run e2e:rail
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: The project rail
        run: xvfb-run -a npm run e2e:rail
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # The app launched over an old charter install, and the launch's migration it runs
      # (RN-10). Its own run, because the old install has to be on disk before the one app
      # process a run keeps is started, and this is the one app that migrates at launch.
      - name: An upgrade over an old charter install
        run: npm run e2e:upgrade
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: An upgrade over an old charter install
        run: xvfb-run -a npm run e2e:upgrade
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # A browser view tab drawing a real engine's frames and taking a click (#2025, spec #2008's
      # one window end-to-end test). Its own run, because its host downloads the pinned engine
      # on its first browser. On Linux the engine makes its sandbox only where an AppArmor
      # profile names it (#2835): the `.deb`'s profile is installed, and AppArmor told the
      # temporary folder holds homes, as the `rust` job does.
      - name: The pinned engine may make its sandbox, as the .deb sets it up
        if: runner.os == 'Linux' && matrix.extras
        run: |
          echo '@{HOMEDIRS}+=/tmp/' | sudo tee /etc/apparmor.d/tunables/home.d/purlis-ci >/dev/null
          sudo install -m 0644 crates/purlis-core/src/browsers/purlis-engine.apparmor /etc/apparmor.d/purlis-engine
          sudo apparmor_parser -r -T -W /etc/apparmor.d/purlis-engine
      - name: A browser view tab draws frames and takes a click
        run: npm run e2e:browser
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      - name: A browser view tab draws frames and takes a click
        run: xvfb-run -a npm run e2e:browser
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # The app ended and started again, which no scenario spec can do: WebdriverIO's service
      # keeps one app process for a whole run, so a spec that quits takes the run with it.
      - name: Reopening what was open, across a real relaunch
        run: npm run e2e:relaunch
        if: runner.os == 'macOS' && matrix.extras
        working-directory: app
      # `dbus-run-session` because a Linux desktop has a WORKING session bus and this runner
      # does not. The runner has one — that was the wrong description, and charter-app#24's
      # own title was wrong the same way — but its desktop portal is activatable and cannot
      # start. The app now notices that in 300 ms and starts without the bus (`portal.rs`),
      # which takes single-instance with it; this test is about a relaunch on a desktop whose
      # bus works, so it gets one.
      - name: Reopening what was open, across a real relaunch
        run: dbus-run-session -- xvfb-run -a npm run e2e:relaunch
        if: runner.os == 'Linux' && matrix.extras
        working-directory: app
      # Each failed test as an annotation on its spec's line, with its assertion: the checks API
      # carries annotations, so a failure reads there without the log or the artifact.
      - name: The failed scenario tests, as annotations
        if: failure()
        run: node ../tools/e2e-annotations.mjs logs/failures.jsonl
        working-directory: app
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-logs-${{ matrix.os }}-${{ matrix.shard }}
          path: app/logs

  # The required check `scenario tests (macos-latest)`: green only when every leg is, and
  # `!cancelled()` for the reason `rust-checks` gives.
  scenario-checks:
    name: scenario tests (macos-latest)
    needs: [changes, scenario]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg passed
        env:
          SCOPE: ${{ needs.changes.outputs.scenario }}
          RESULT: ${{ needs.scenario.result }}
        run: |
          if [ "$SCOPE" = false ]; then want=skipped; else want=success; fi
          echo "scope: ${SCOPE:-unknown}, result: $RESULT"
          test "$RESULT" = "$want"

  # Its own job, not a leg of `scenario`'s matrix, so that `scenario-checks` waits on macOS
  # alone. Two parts too, since its specs alone took 7.8 minutes of 12.7 (2026-10-12); Linux
  # runners are not the ones in short supply. Part 2 runs the seven single-app runs (on macOS
  # they are a leg of their own).
  scenario-linux:
    name: scenario tests (${{ matrix.os }}, part ${{ matrix.shard }} of ${{ matrix.shards }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scenario != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        shard: [1, 2]
        shards: [2]
        outcome: [false]
        include:
          - shard: 1
            extras: false
            specs: true
            sandbox: false
          - shard: 2
            extras: true
            specs: true
            sandbox: false
    runs-on: ${{ matrix.os }}
    steps: *scenario-steps

  # **The Skill studio's outcome bars** (SK-23, #4343): the scenario legs' steps, with every leg's
  # own flag off and `outcome` on, so it builds as they do and runs the three runs alone. Not
  # required, and no `scenario-checks` waits on it: its 300 ms is measured on a debug build on a
  # shared runner, and a miss is a ticket (the operator's ruling of 2026-10-31), not a block on
  # every merge. It becomes required with the flag's flip (#2786).
  #
  # On main's push, and on a pull request that touches what the bars measure (`GATES`), by the
  # operator's choice of 2026-11-01: it takes a macOS and a Linux runner for 11 to 17 minutes. A
  # regression from anywhere else shows on main, not on its pull request.
  outcome-bars:
    name: outcome bars (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.outcome-bars != 'false')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        shard: [bars]
        shards: [1]
        extras: [false]
        specs: [false]
        sandbox: [false]
        outcome: [true]
    runs-on: ${{ matrix.os }}
    steps: *scenario-steps

  # The required check `scenario tests (ubuntu-24.04)`, as `scenario-checks` is for macOS.
  scenario-linux-checks:
    name: scenario tests (ubuntu-24.04)
    needs: [changes, scenario-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg passed
        env:
          SCOPE: ${{ needs.changes.outputs.scenario }}
          RESULT: ${{ needs.scenario-linux.result }}
        run: |
          if [ "$SCOPE" = false ]; then want=skipped; else want=success; fi
          echo "scope: ${SCOPE:-unknown}, result: $RESULT"
          test "$RESULT" = "$want"

  windows:
    # M4, the Windows question. ADR 0025 names macOS, Linux AND Windows; nothing has ever
    # been compiled on Windows, so this job exists to find out what is true rather than to
    # pass.
    #
    # **Not a gate, and not one of the nine required checks.** The same reasoning `fifty
    # tabs` gives in `stress.yml`, and more of it: a required check on a platform with no
    # port would block every merge in the repo — including the ports that would make it
    # green. It reports, and it is allowed to fail. It runs nightly, not on a pull
    # request or a push (V70).
    name: windows (build, test, evidence only)
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, so one shell reads the same way everywhere in this job. Where the answer
        # would be Git Bash's rather than Windows's — a path, a device name — the step says
        # `shell: pwsh`, and says why.
        shell: bash
    env:
      # `-D warnings` is the gate's setting and it is the wrong one for a survey: on a
      # platform with no port every unused import becomes an "error" and the real ones
      # drown. Here an error is an error.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: What this runner is
        run: |
          rustc -vV
          cargo -V
          git --version
          git config --get core.autocrlf || echo "core.autocrlf: unset"
      # `--workspace` includes the app crate, and `tauri::generate_context!` reads the built
      # frontend — the same reason the `rust` job above does this. Without it the app crate's
      # only Windows error is a missing directory, which says nothing.
      - run: mkdir -p app/dist
      # Every step from here runs whatever happened before it (`if: always()`): the
      # deliverable is the whole list, not its first line.
      - name: cargo check, every crate on the ladder, as a list rather than a stop
        if: always()
        run: cargo check --workspace --all-targets --message-format short 2>&1 | tee windows-check.txt || true
      - name: The error list, counted
        if: always()
        run: |
          echo '## errors by code'
          grep -oE 'error\[E[0-9]+\]' windows-check.txt | sort | uniq -c | sort -rn || true
          echo '## errors by file'
          grep -oE '^[^ :]+\.rs' windows-check.txt | sort | uniq -c | sort -rn | head -40 || true
          echo '## how many lines say error at all'
          grep -cE 'error' windows-check.txt || true
      - name: cargo build, the binary a plane actually needs
        if: always()
        run: cargo build -p purlis-cli 2>&1 | tail -40 || true
      - name: cargo test, if there is anything left to run
        if: always()
        run: cargo test --workspace --no-fail-fast 2>&1 | tail -80 || true
      # The three properties `session.rs` takes from a unix pty, asked of a real ConPTY. Its
      # own workspace, built and run here and nowhere else, and it always exits 0.
      - name: What ConPTY does that a unix pty does not
        if: always()
        # A probe that hangs teaches nothing and holds the whole run open, which is the one
        # way this job could cost anybody something. `child.wait()` has no deadline of its
        # own, so the deadline is here.
        timeout-minutes: 6
        # No pipe: a `| tail` killed together with a timed-out step prints nothing at all, and
        # a probe that has answered two of three questions before it stalls is exactly the
        # run worth reading. It prints a dozen lines.
        run: cargo run --manifest-path tools/windows-probe/Cargo.toml 2>&1 || true
      # `worktree::git` searches four FIXED directories before it trusts `PATH`. Asked in
      # pwsh and not bash: Git Bash maps `/usr/bin` onto its own installation, while
      # purlis's Rust hands the literal string to the Win32 API, which resolves it against
      # the current drive.
      - name: The directories worktree::git searches, as Windows resolves them
        if: always()
        shell: pwsh
        run: |
          foreach ($d in '/usr/bin','/usr/local/bin','/opt/homebrew/bin','/bin') {
            $p = Join-Path $d 'git.exe'
            "GIT_DIRS $p exists: $(Test-Path $p)"
          }
          "git on PATH: $((Get-Command git -ErrorAction SilentlyContinue).Source)"
      # `-c core.hooksPath=/dev/null` is the guard that stops a repo's own hook running under
      # purlis. Whether it still bites on a platform with no `/dev/null` is a measurement,
      # not a guess. pwsh again, so nothing mangles the argument on its way to git.exe.
      - name: Whether core.hooksPath=/dev/null still disables a hook here
        if: always()
        shell: pwsh
        run: |
          $r = Join-Path $env:RUNNER_TEMP 'hookprobe'
          Remove-Item -Recurse -Force $r -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $r | Out-Null
          git -C $r init -q
          git -C $r config user.email probe@example.com
          git -C $r config user.name probe
          Set-Content -Path (Join-Path $r 'f.txt') -Value 'x'
          git -C $r add f.txt
          $hook = Join-Path $r '.git/hooks/pre-commit'
          Set-Content -Path $hook -Value "#!/bin/sh`necho THE-HOOK-RAN 1>&2`nexit 1"
          "--- without the guard: the hook must run and refuse the commit"
          git -C $r commit -m one 2>&1 | Out-String
          "exit: $LASTEXITCODE"
          "--- with the guard: the commit must go through"
          git -C $r -c core.hooksPath=/dev/null -c core.fsmonitor=false commit -m one 2>&1 | Out-String
          "exit: $LASTEXITCODE"
      - name: The whole check log, kept
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-check
          path: windows-check.txt
