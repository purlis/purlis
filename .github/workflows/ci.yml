# Throwaway: the macOS nightly's failing tests, on their own, for one draft pull request.
# Never merged; its pull request is closed once it has run.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NEXTEST_VERSION: "0.9.146"

jobs:
  macos-tests:
    name: macos (the nightly's red tests, evidence)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: The machine
        run: sysctl hw.ncpu hw.memsize machdep.cpu.brand_string
      - name: Spotlight off
        run: sudo mdutil -a -i off
      - run: mkdir -p app/dist
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build the tests
        run: cargo nextest run --locked -p purlis-core -p purlis-app --no-run
      - name: Run the tests, no retries
        run: >-
          cargo nextest run --locked -p purlis-core -p purlis-app --profile ci --retries 0
          -E 'test(/^windowline::/) | test(/^hoststart::/) | test(/^secrets::brokered::/)
          | test(/^sandbox::tests::a_block_on_a_git_folder/)
          | test(/^sandbox::opencode_tests::live::a_report_left/)
          | test(/^repocmd::clone::tests::landing::a_chats_clone_through_the_host/)
          | test(/^a_start_the_host_composes_runs_as_the_window_would_start_it::/)
          | (package(purlis-app) & test(/^chats::tests::(a_claude_code_chat_runs_with_purlis_s_pins_alone|a_record_holding_one_id_twice|a_record_is_put_back_as_one_session)/))'
      - name: The clone-through-the-host and put-back tests, five times more
        run: >-
          for i in 1 2 3 4 5; do cargo nextest run --locked -p purlis-core -p purlis-app --profile ci --retries 0
          -E 'test(/^repocmd::clone::tests::landing::a_chats_clone_through_the_host_that_keeps/) | test(/^hoststart::tests::chats_that_write/) | (package(purlis-app) & test(/^chats::tests::a_record_/))' || exit 1; done
