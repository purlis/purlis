# Throwaway: the macOS nightly's failing tests, on their own, for one draft pull request.
# Never merged; its pull request is closed once it has run.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NEXTEST_VERSION: "0.9.146"

jobs:
  macos-tests:
    name: macos (the nightly's red tests, evidence)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: The machine
        run: sysctl hw.ncpu hw.memsize machdep.cpu.brand_string
      - name: Spotlight off
        run: sudo mdutil -a -i off
      - run: mkdir -p app/dist
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build the tests
        run: cargo nextest run --locked -p purlis-app --no-run
      - name: The put-back of one id twice, with why a chat did not start, five times
        run: >-
          for i in 1 2 3 4 5; do cargo nextest run --locked -p purlis-app --profile ci --retries 0 --no-capture
          -E 'test(/^chats::tests::a_record_/)' || exit 1; done
