name: ci

# PROBE for #2375, never merged: reruns the host-composed behaviours many times under a busy
# machine, and counts how often a pane misses a line.
on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.146"

jobs:
  probe:
    name: probe 2375
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's Linux build dependencies, and the sandbox's programs
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - run: mkdir -p app/dist
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build
        run: |
          cargo nextest run --locked -p purlis-app --no-run
          cargo build --locked -p purlis-app --bin charter-app
          cargo build --locked -p purlis-cli --bin purlis
          cargo build --locked -p fake-harness --bin fake-harness
      - name: Loop under load
        timeout-minutes: 45
        run: |
          set +e
          pids=""
          for i in $(seq 1 $(( $(nproc) * 2 ))); do sh -c 'while :; do :; done' & pids="$pids $!"; done
          filter='package(purlis-app) & test(/^behaviour::(an_opt_out_of_a_chat_the_host_composes_is_in_its_event_log_before_it_starts|a_chat_named_alone_is_composed_by_the_host_as_its_profile_says)::/)'
          fails=0; runs=0
          for n in $(seq 1 60); do
            out=$(cargo nextest run --locked -p purlis-app --no-fail-fast -E "$filter" 2>&1); rc=$?
            runs=$((runs+1))
            if [ $rc -ne 0 ]; then fails=$((fails+1)); echo "=== round $n FAILED"; echo "$out" | grep -E "FAIL|panicked|never drawn" | cut -c1-600; fi
          done
          for p in $pids; do kill $p; done
          echo "ROUNDS $runs FAILED $fails"
          echo "::notice title=probe 2375::rounds $runs failed $fails"
          [ $fails -eq 0 ]
