# THROWAWAY: probe for #3892 (do not merge). Runs the macOS scenario parts 1 and 3 against
# variants of the branch, and keeps a picture and the window's state at each failure.
name: probe-3892

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: probe-3892-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.variant }}, part ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [1, 3]
        variant: [as-is, no-card, in-flow, unmount-under-palette]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Compile through sccache
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: The variant
        working-directory: app/src
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          case "$VARIANT" in
            as-is) ;;
            no-card)
              sed -i '' 's/notices={focusMode ? undefined : statusNotices}/notices={undefined}/' PlaneView.tsx
              grep -q 'notices={undefined}' PlaneView.tsx ;;
            in-flow)
              sed -i '' 's/notices={focusMode ? undefined : statusNotices}/notices={undefined}/' PlaneView.tsx
              sed -i '' 's/said \&\& said !== closedSaid \&\& !paletteOpen \&\& inFront === undefined \&\&/said \&\& said !== closedSaid \&\& !paletteOpen \&\&/' App.tsx
              grep -q 'notices={undefined}' PlaneView.tsx
              grep -q 'said && said !== closedSaid && !paletteOpen && (' App.tsx ;;
            unmount-under-palette)
              sed -i '' 's/const statusUp = chipNotices.open === AT_STATUS;/const statusUp = !paletteOpen \&\& chipNotices.open === AT_STATUS;/' App.tsx
              grep -q 'const statusUp = !paletteOpen && chipNotices.open' App.tsx ;;
          esac
          git diff --stat
      - name: Build the app, the harness and the CLI
        run: npx tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json -- -p purlis-app -p fake-harness -p purlis-cli
        working-directory: app
      - run: npm run e2e
        working-directory: app
        env:
          PURLIS_E2E_PART: ${{ matrix.part }}/4
          PURLIS_PROBE: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.variant }}-${{ matrix.part }}
          path: app/logs
          retention-days: 3
