name: nightly on the integration branch

# **The integration branch's nightlies, scheduled from main** (M74.1, T1.1-09; Q285). GitHub runs
# `schedule` only from the default branch, and dispatches only workflows whose files are there, so
# this workflow lives on main. It is the one exception to "prerequisites only from main" (the
# milestone's Process). Each night it checks out `BRANCH` and runs every entry of the branch's
# `.github/nightly-on-<branch>.txt`. The list's format, and what `kind: escape` does, is in
# `tools/nightly-list.mjs`. Each entry runs through the branch's own `.github/actions/nightly`, so a
# ticket adds a nightly without touching main.
#
# **At the gate it is re-pointed at main, never removed** (ticket 55): `BRANCH` is the one place
# that names the branch, so the switch is that line and a list file on main.
#
# An entry that fails or is cancelled (a budget overrun reads as cancelled) uploads what it left and opens an issue labelled `bot-maintained`, or
# comments on the one already open. Everything runs in public (Q301): a red `kind: escape` entry
# reports as any other does, and its issue is also labelled `area:security` and `priority:p0`,
# to be fixed first.
#
# A composite action cannot read `secrets`: an entry that needs one gets it as an input here.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-branch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_NET_RETRY: "10"
  # The branch whose nightlies run. Ticket 55 sets it to main.
  BRANCH: phase-1-proven

jobs:
  list:
    name: the branch's nightly list
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - name: The list, as a matrix
        id: list
        run: node tools/nightly-list.mjs ".github/nightly-on-$BRANCH.txt"

  entry:
    name: ${{ matrix.entry }} (${{ matrix.runs-on }})
    needs: list
    if: needs.list.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - name: The entry
        uses: ./.github/actions/nightly
        with:
          entry: ${{ matrix.entry }}
      - name: What a red night leaves
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ matrix.entry }}-${{ matrix.runs-on }}
          path: |
            target/sandbox-scenarios/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
      # One open issue for each red entry and runner: a later red night comments on it. An escape
      # entry's issue is a p0 security issue as well.
      - name: A red night's issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENTRY: ${{ matrix.entry }}
          RUNS_ON: ${{ matrix.runs-on }}
          ESCAPE: ${{ matrix.escape }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly on $BRANCH: $ENTRY on $RUNS_ON is red"
          labels=bot-maintained
          if [ "$ESCAPE" = true ]; then
            labels=bot-maintained,area:security,priority:p0
          fi
          open=$(gh issue list -R "$REPO" --state open --label bot-maintained --search "\"$title\" in:title" \
            --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$REPO" --body "Red again: $RUN_URL"
          else
            gh issue create -R "$REPO" --title "$title" --label "$labels" \
              --body "The nightly entry \`$ENTRY\` went red on \`$RUNS_ON\` against \`$BRANCH\`: $RUN_URL"
          fi
