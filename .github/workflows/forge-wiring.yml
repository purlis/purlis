name: forge wiring

# The `forge-wiring` feature of purlis-core (ADR 0128, "One login"): every chat reaches its forge
# through the app's proxy and the old ways of handing a chat a token are replaced by the person's
# sign-in. The feature is off in every other job, so nothing else builds this code; this one runs
# purlis-core's tests with it on, on Linux and macOS, until the train turns it on for good and
# the job goes with the flag.

on:
  pull_request:
    paths:
      - crates/purlis-core/**
      - .github/workflows/forge-wiring.yml
  merge_group:

concurrency:
  group: forge-wiring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXTEST_VERSION: "0.9.146"

jobs:
  tests:
    name: purlis-core tests with forge-wiring (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The sandbox's programs
        if: runner.os == 'Linux'
        timeout-minutes: 11
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
          packages: bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # tauri::generate_context! reads the built frontend, so it has to exist before a build.
      - run: mkdir -p app/dist
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build the tests
        timeout-minutes: 90
        run: cargo nextest run -p purlis-core --features forge-wiring --locked --no-run
      # The cli and the app carry the feature too (they forward it to purlis-core): built with it
      # on, so a build of either with the train's switch on is known to compile.
      - name: Build the cli and the app with it
        timeout-minutes: 60
        run: cargo nextest run -p purlis-cli -p purlis-app --features purlis-cli/forge-wiring,purlis-app/forge-wiring --locked --no-run
      - name: Run the tests
        # The end-to-end test (`one_login_end_to_end`) needs the real gh, glab and git and its own
        # node harness: `one-login-e2e` runs it, with those, on every one-login pull request.
        run: cargo nextest run -p purlis-core --features forge-wiring --locked --profile ci -E 'not test(/one_login_end_to_end/)'
