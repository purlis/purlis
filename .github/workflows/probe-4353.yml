# Temporary (#4353), never merged: repeats the engine's tests on macOS to see where they fail.
name: probe 4353
on:
  push:
    branches: [r6b-4353]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Build
        run: cargo test --locked -p purlis-browser-engine --no-run
      - name: Timed tests alone, 15 times
        continue-on-error: true
        run: |
          for i in $(seq 15); do
            echo "### lib round $i"
            cargo test --locked -p purlis-browser-engine --lib reading -- --test-threads=2 2>&1 | grep -E "FAILED|panicked|test result" || true
          done
      - name: The retitle test alone, 15 times
        continue-on-error: true
        run: |
          for i in $(seq 15); do
            echo "### retitle round $i"
            cargo test --locked -p purlis-browser-engine --test it retitles -- --nocapture 2>&1 | grep -E "DEBUG-4353|FAILED|panicked|PageInfo|test result: " || true
          done
      - name: The job's own command, 4 times
        continue-on-error: true
        run: |
          for i in 1 2 3 4; do
            echo "### suite round $i"
            cargo test --locked --no-fail-fast -p purlis-browser-engine -- --test-threads=2 > suite.txt 2>&1 || true
            grep -E "DEBUG-4353.*(MISS|SLOW)|FAILED|panicked at|PageInfo|test result: " suite.txt | cut -c1-400 || true
          done
