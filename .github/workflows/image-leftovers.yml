name: image leftovers

# The untagged images a failed publishing run left in the runner's and the operator's packages
# (#4930). Since #4512 an image is pushed only after its check passed, by digest and untagged, and
# `index` names it; when a later step of the same run fails, an image it pushed stays behind,
# checked but named by nothing and never signed. The registry has no retention rule to set by
# hand, so this removes them, once a day.
#
# What may be removed is `tools/image-leftovers.mjs`, tested on recorded answers in
# `tools/image-leftovers.test.mjs`: only an untagged plain image that a failed, cancelled or
# timed-out run of the publishing workflow recorded as its own push, that nothing any tag reaches
# holds (an index's own images, its signatures and attestations are untagged too), pushed while
# that run ran, three days after it ended, while no publishing run is under way, and at most four
# at a time. Any answer it cannot read removes nothing.
#
# **It can never hold a release back or turn `main` red.** Both jobs `continue-on-error`, it is in
# no release's chain, and no branch protection names it. A pull request touching it runs `plan`
# only, which can read the package and never write it; `remove` runs on the schedule, on `main`,
# or by hand when asked to.

on:
  schedule:
    # Every day at 04:41 UTC.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      remove:
        description: "Remove what the plan names (off: only say what it would remove)"
        type: boolean
        default: false
  pull_request:
    paths:
      - tools/image-leftovers*
      - tools/image-registry.mjs
      - .github/workflows/image-leftovers.yml

permissions: {}

concurrency:
  group: image-leftovers-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What would be removed, and why each other untagged version stays. Removes nothing.
  plan:
    name: plan (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner image is pushed by `runner-image.yml`, called by `release.yml`: the
          # release's run holds the `digest-<arch>` artifacts.
          - package: purlis-runner
            workflow: release.yml
          - package: purlis-cluster-operator
            workflow: operator-image.yml
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: What would be removed
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          WORKFLOW: ${{ matrix.workflow }}
        run: |
          set -euo pipefail
          node tools/image-leftovers.mjs plan "$WORKFLOW" | tee "$RUNNER_TEMP/plan.txt"
          { echo "### $IMAGE"; echo; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The same selection, asked again, then each version removed, after asking once more that no
  # publishing run is under way and no tag reaches it.
  remove:
    name: remove (${{ matrix.package }})
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.remove)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: purlis-runner
            workflow: release.yml
          - package: purlis-cluster-operator
            workflow: operator-image.yml
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Remove what a failed run left
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          WORKFLOW: ${{ matrix.workflow }}
        run: |
          set -euo pipefail
          node tools/image-leftovers.mjs remove "$WORKFLOW" | tee "$RUNNER_TEMP/removed.txt"
          { echo "### $IMAGE"; echo; echo '```'; cat "$RUNNER_TEMP/removed.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
