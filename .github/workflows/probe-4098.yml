# Probe for #4098, never merged: repeats chromium shard 2/7 of the stories, and the
# ChatsSection file alone, with the hold's let-go log printed when the gap story fails.
name: probe-4098

on:
  push:
    branches: [probe-4098-gap]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        run: echo "image=$(node tools/story-image.mjs ref)" >> "$GITHUB_OUTPUT"

  repeat:
    name: repeat (${{ matrix.variant }} ${{ matrix.browser }} ${{ matrix.story }} ${{ matrix.rep }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: file, variant: before, browser: webkit, rep: 1, file: src/SkillGrades.stories.tsx, story: Grades }
          - { mode: file, variant: before, browser: webkit, rep: 2, file: src/SkillGrades.stories.tsx, story: Grades }
          - { mode: shard, variant: before, browser: webkit, rep: 1, file: --shard=4/7, story: Grades }
          - { mode: shard, variant: before, browser: webkit, rep: 2, file: --shard=4/7, story: Grades }
          - { mode: shard, variant: after, browser: webkit, rep: 1, file: --shard=4/7, story: Grades }
          - { mode: shard, variant: after, browser: webkit, rep: 2, file: --shard=4/7, story: Grades }
    container:
      image: ${{ needs.image.outputs.image }}
      options: --init --ipc=host
    env:
      PURLIS_STORY_PICTURES: "1"
      HOME: /root
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - if: ${{ matrix.variant == 'before' }}
        run: |
          sed -i 's/^const PROBE_BEFORE = false;/const PROBE_BEFORE = true;/' src/stories.testkit.ts
          sed -i '/^    await parkTheEnginesCursor();$/d' src/ChatsSection.stories.tsx
          grep -c "PROBE_BEFORE = true" src/stories.testkit.ts || true
          grep -c "await parkTheEnginesCursor" src/ChatsSection.stories.tsx || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Repeat
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          if [ "${{ matrix.mode }}" = shard ]; then loops=3; else loops=15; fi
          end=$((SECONDS + 35 * 60))
          for i in $(seq 1 $loops); do
            [ $SECONDS -gt $end ] && break
            set -- ${{ matrix.file }}
            PURLIS_STORY_REPORT="$RUNNER_TEMP/report/report-$i.json" \
              npx vitest run --project "stories * (${{ matrix.browser }})" "$@" \
              --reporter=dot --reporter=../tools/story-failures.mjs > "$RUNNER_TEMP/report/out-$i.txt" 2>&1 || true
            echo "loop $i: $(grep -o '"story": "${{ matrix.story }}"' "$RUNNER_TEMP/report/report-$i.json" 2>/dev/null | wc -l) gap failures; $(grep -E 'Tests +[0-9]' "$RUNNER_TEMP/report/out-$i.txt" | tail -1)"
            grep -o 'PROBE width not landed [0-9]* vs [0-9]*' "$RUNNER_TEMP/report/report-$i.json" 2>/dev/null | head -3 || true
          done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe5-${{ matrix.mode }}-${{ matrix.rep }}-${{ matrix.story }}-${{ matrix.variant }}-${{ matrix.browser }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/report/
          retention-days: 3
