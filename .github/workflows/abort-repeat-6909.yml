# TEMPORARY (#6909): loops the crash probe's abort on macOS, to find and then prove the fix for an
# abort that leaves no minidump. Removed before the pull request merges.
name: abort repeat (#6909)

on:
  push:
    branches: [6909-abort-leaves-no-minidump-on-macos-r-1p8qsjqs]

permissions:
  contents: read

jobs:
  unit:
    name: the crash handler's own tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo test --locked -p purlis-crash-handler --lib

  probe:
    name: the abort test, looped (${{ matrix.code }}, ${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        code: [old, fixed]
        mode: [serial, parallel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: The code before the fix (instrumented)
        if: matrix.code == 'old'
        run: git checkout 0704985df05ec6fbef986326b577de766d1610ae -- crates/crash-handler Cargo.lock
      - name: Build
        run: |
          cargo test --locked -p purlis-crash-handler --test a_native_crash_leaves_a_minidump --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "a_native_crash_leaves_a_minidump") | .executable' \
            > test-binary.txt
          cat test-binary.txt
          test -x "$(cat test-binary.txt)"
      - name: Loop
        env:
          MODE: ${{ matrix.mode }}
        run: |
          T=$(cat test-binary.txt)
          F=an_aborts_stack_starts_where_it_aborted_not_in_the_crash_handler
          case "$MODE" in
            serial) N=1000; J=1 ;;
            parallel) N=3000; J=6 ;;
          esac
          seq 1 "$N" | xargs -P "$J" -I{} sh -c "'$T' $F > \"\$TMPDIR/t{}.txt\" 2>&1 || echo {}" > failed.txt || true
          echo "failed: $(wc -l < failed.txt | tr -d ' ') of $N"
          for i in $(head -20 failed.txt); do echo "::group::run $i"; cat "$TMPDIR/t$i.txt"; echo "::endgroup::"; done
          echo "::group::a run that passed"; cat "$TMPDIR/t$(seq 1 "$N" | grep -vxFf failed.txt | head -1).txt"; echo "::endgroup::"
          test ! -s failed.txt
