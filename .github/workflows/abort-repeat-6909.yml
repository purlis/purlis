# TEMPORARY (#6909): loops the crash probe's abort on macOS, to find and then prove the fix for an
# abort that leaves no minidump. Removed before the pull request merges.
name: abort repeat (#6909)

on:
  push:
    branches: [6909-abort-leaves-no-minidump-on-macos-r-1p8qsjqs]

permissions:
  contents: read

jobs:
  unit:
    name: the crash handler's own tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo test --locked -p purlis-crash-handler --lib

  probe:
    name: the abort test, looped (${{ matrix.code }}, ${{ matrix.window }} window)
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        code: [old, fixed]
        window: [normal, widened]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: The code before the fix (instrumented)
        if: matrix.code == 'old'
        run: git checkout 0704985df05ec6fbef986326b577de766d1610ae -- crates/crash-handler Cargo.lock
      - name: Widen the gap between the companion binding its socket and checking in its Mach service
        if: matrix.window == 'widened'
        run: |
          cargo fetch --locked
          src=$(ls -d ~/.cargo/registry/src/*/minidumper-0.11.0 | head -1)
          cp -R "$src" vendor-minidumper
          perl -0pi -e 's/(\n(\s*)let port = crash_context::ipc::Server::create\(&port_name\)\?;)/\n$2std::thread::sleep(std::time::Duration::from_millis(30));$1/' vendor-minidumper/src/ipc/server.rs
          grep -n -B1 "Server::create(&port_name)" vendor-minidumper/src/ipc/server.rs
          grep -q "from_millis(30)" vendor-minidumper/src/ipc/server.rs
          printf '\n[patch.crates-io]\nminidumper = { path = "vendor-minidumper" }\n' >> Cargo.toml
      - name: Build
        run: |
          cargo test -p purlis-crash-handler --test a_native_crash_leaves_a_minidump --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "a_native_crash_leaves_a_minidump") | .executable' \
            > test-binary.txt
          test -x "$(cat test-binary.txt)"
      - name: Loop
        env:
          WINDOW: ${{ matrix.window }}
        run: |
          if [ "$WINDOW" = widened ]; then N=600; else N=2500; fi
          bash tools/abort-loop-6909.sh "$(cat test-binary.txt)" "$N" 6
