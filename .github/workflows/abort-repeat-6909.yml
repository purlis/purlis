# TEMPORARY (#6909): loops the crash probe's abort on macOS, to find and then prove the fix for an
# abort that leaves no minidump. Removed before the pull request merges.
name: abort repeat (#6909)

on:
  push:
    branches: [6909-abort-leaves-no-minidump-on-macos-r-1p8qsjqs]

permissions:
  contents: read

jobs:
  probe:
    name: the probe's abort, looped (${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [test-serial, test-parallel, test-all, heavy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked -p purlis-crash-handler --bin crash-probe
      - run: cargo test --locked -p purlis-crash-handler --test a_native_crash_leaves_a_minidump --no-run
      - name: Loop
        env:
          MODE: ${{ matrix.mode }}
        run: |
          T=$(ls -t target/debug/deps/a_native_crash_leaves_a_minidump-* | grep -v '\.d$' | head -1)
          case "$MODE" in
            heavy)
              for k in 1 2 3 4 5 6; do (while :; do :; done) & done
              bash tools/abort-loop-6909.sh target/debug/crash-probe 4000 16; exit ;;
            test-serial) N=800; J=1; F=an_aborts_stack_starts_where_it_aborted_not_in_the_crash_handler ;;
            test-parallel) N=2000; J=6; F=an_aborts_stack_starts_where_it_aborted_not_in_the_crash_handler ;;
            test-all) N=300; J=1; F= ;;
          esac
          seq 1 "$N" | xargs -P "$J" -I{} sh -c "'$T' $F > \"\$TMPDIR/t{}.txt\" 2>&1 || echo {}" > failed.txt || true
          echo "failed: $(wc -l < failed.txt) of $N"
          for i in $(cat failed.txt); do echo "::group::run $i"; cat "$TMPDIR/t$i.txt"; echo "::endgroup::"; done
          test ! -s failed.txt
