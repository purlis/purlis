name: cluster operator

# purlis's cluster operator (#2054, spec #2041): a Rust workspace of its own in `operator/`,
# which `ci` never builds. This workflow checks it, and runs it on a kind cluster of the oldest
# Kubernetes purlis supports with the pinned upstream agent-sandbox, the operator installed by its
# Helm chart, and a runner image built from this commit (`operator/e2e/kind.sh`).
#
# A pull request that changes docs/cluster-pool-setup.md runs it too, since kind.sh runs that
# guide's commands. A push doesn't: a push's run publishes an image (its `image` job, which calls
# operator-image.yml), and the nightly run checks the guide on main.
#
# Otherwise only a change to the operator, the runner image, the desktop's side of a cluster runner, the
# toolchain, the licence and advisory rules or this file runs it on a pull request, so every
# other pull request waits on none of it; it also runs nightly on `main`. Only its run of a push to
# `main` publishes, through the `image` job; the checks hold no write permission.

on:
  pull_request:
    paths:
      - operator/**
      - docs/cluster-pool-setup.md
      - runner-image/**
      - deny.toml
      - rust-toolchain.toml
      - .github/actions/rust-toolchain/**
      - .github/actions/helm/**
      - .github/actions/kind/**
      - .github/actions/cargo-deny/**
      - tools/operator-install*
      - tools/guide-commands*
      - .github/workflows/operator.yml
      # The desktop's side of a cluster runner, which the kind run checks too (#2056).
      - crates/purlis-core/src/clusterpool*
      - crates/purlis-core/src/runnerlink*
      - crates/purlis-core/src/pools*
      - crates/purlis-core/src/poollogins*
      - crates/purlis-core/src/dockerpool*
      - crates/purlis-core/src/profilestore/sign_in*
      - crates/purlis-cli/src/main.rs
      - crates/purlis-core/tests/it/a_chat_runs_on_a_cluster_runner_through_kubectl_exec.rs
      - crates/purlis-core/tests/it/a_chat_mints_on_a_cluster_runner_with_its_desktop_away.rs
      # A short task's runner of its own, from its claim to its release (#4569).
      - crates/purlis-core/src/codelink*
      - app/src-tauri/src/behaviour/tests/fresh_runner.rs
      - app/src-tauri/src/behaviour/tests/on_a_cluster_pool.rs
      - tests/parity/**
      - tests/fixtures/harness-versions/claude-code/**
      - crates/purlis-core/src/sandbox/claude_wrap*
      - app/src-tauri/src/behaviour.rs
      - app/src-tauri/src/chats.rs
      - app/src-tauri/src/chats/**
      - app/src-tauri/src/clusterpools.rs
      - app/src-tauri/src/hostedsessions*
      - app/src-tauri/src/poolprofiles*
      - app/src-tauri/src/runnerlinks*
      - crates/purlis-core/src/runners*
      - app/src-tauri/src/routedsessions*
      - app/src-tauri/src/runnercode*
      - crates/purlis-core/src/forge/mintport*
      - crates/purlis-cli/src/bridge.rs
      - fixtures/runner-link-key/**
      # Pool setup's cluster path, which the kind run walks on a bare cluster (#4492), and the
      # doctor's checks the operator and Pool setup share.
      - crates/cluster-doctor/**
      - crates/purlis-core/src/poolsetup*
      - crates/purlis-core/tests/it/pool_setup_on_a_kind_cluster.rs
  push:
    branches: [main]
    paths:
      - operator/**
      - runner-image/**
      - deny.toml
      - rust-toolchain.toml
      - .github/actions/rust-toolchain/**
      - .github/actions/helm/**
      - .github/actions/kind/**
      - .github/actions/cargo-deny/**
      - tools/operator-install*
      - .github/workflows/operator.yml
      # The desktop's side of a cluster runner, which the kind run checks too (#2056).
      - crates/purlis-core/src/clusterpool*
      - crates/purlis-core/src/runnerlink*
      - crates/purlis-core/src/pools*
      - crates/purlis-core/src/poollogins*
      - crates/purlis-core/src/dockerpool*
      - crates/purlis-core/src/profilestore/sign_in*
      - crates/purlis-cli/src/main.rs
      - crates/purlis-core/tests/it/a_chat_runs_on_a_cluster_runner_through_kubectl_exec.rs
      - crates/purlis-core/tests/it/a_chat_mints_on_a_cluster_runner_with_its_desktop_away.rs
      # A short task's runner of its own, from its claim to its release (#4569).
      - crates/purlis-core/src/codelink*
      - app/src-tauri/src/behaviour/tests/fresh_runner.rs
      - app/src-tauri/src/behaviour/tests/on_a_cluster_pool.rs
      - tests/parity/**
      - tests/fixtures/harness-versions/claude-code/**
      - crates/purlis-core/src/sandbox/claude_wrap*
      - app/src-tauri/src/behaviour.rs
      - app/src-tauri/src/chats.rs
      - app/src-tauri/src/chats/**
      - app/src-tauri/src/clusterpools.rs
      - app/src-tauri/src/hostedsessions*
      - app/src-tauri/src/poolprofiles*
      - app/src-tauri/src/runnerlinks*
      - crates/purlis-core/src/runners*
      - app/src-tauri/src/routedsessions*
      - app/src-tauri/src/runnercode*
      - crates/purlis-core/src/forge/mintport*
      - crates/purlis-cli/src/bridge.rs
      - fixtures/runner-link-key/**
      # Pool setup's cluster path, which the kind run walks on a bare cluster (#4492), and the
      # doctor's checks the operator and Pool setup share.
      - crates/cluster-doctor/**
      - crates/purlis-core/src/poolsetup*
      - crates/purlis-core/tests/it/pool_setup_on_a_kind_cluster.rs
  # Nightly, so a new advisory against the operator's own lock, or a change elsewhere that
  # breaks the runner image the kind run builds, is reported though nothing here changed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: operator-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: operator (fmt, clippy, test, chart, licences)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy
      # Only `main` saves, as in `ci`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: operator
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Helm, for the chart's tests (.github/actions/helm pins it).
      - uses: ./.github/actions/helm
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      # The root workspace's `deny.toml`, against this workspace's own lock, with the cargo-deny
      # `ci` installs (`.github/actions/cargo-deny`).
      - name: Install cargo-deny
        uses: ./.github/actions/cargo-deny
      - run: cargo deny --all-features --config ../deny.toml check

  kind:
    name: operator on a kind cluster
    runs-on: ubuntu-24.04
    # It also builds and runs the desktop's side of a cluster runner from the root workspace, and
    # Pool setup's cluster path on a second, bare cluster (#4492): about 50 minutes on main before
    # that stage, which adds a cluster, an install and a Claim.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The desktop's side of a short task's runner is the app's own (#4569).
      - name: Tauri's Linux build dependencies
        timeout-minutes: 9
        uses: ./.github/actions/linux-packages
        with:
          tauri: true
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            operator
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # kind, one exact release, checked against the SHA-256 it publishes (.github/actions/kind
      # pins it).
      - uses: ./.github/actions/kind
      # Helm, which installs the operator's chart on the kind cluster.
      - uses: ./.github/actions/helm
      # Node, for `tools/operator-install.mjs`, which pins the install kind.sh installs (#2281).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The runner image of this commit, from runner-image/Dockerfile, as `runner-image.yml`
      # builds it (the binary and purlis's plugin) but in a debug build: the operator is under
      # test here, not the binary.
      - name: The runner image
        run: |
          cargo build --locked -p purlis-cli
          mkdir -p "$RUNNER_TEMP/runner"
          cp target/debug/purlis "$RUNNER_TEMP/runner/purlis"
          cp -R app/src-tauri/plugin "$RUNNER_TEMP/runner/plugin"
          docker build -t purlis-runner:e2e -f runner-image/Dockerfile "$RUNNER_TEMP/runner"
      - name: The operator's image
        run: |
          cargo build --locked --manifest-path operator/Cargo.toml
          mkdir -p "$RUNNER_TEMP/operator"
          cp operator/target/debug/purlis-cluster-operator "$RUNNER_TEMP/operator/"
          docker build -t purlis-cluster-operator:e2e -f operator/Dockerfile "$RUNNER_TEMP/operator"
      - name: A Pool and a Claim on kind, with the pinned agent-sandbox
        run: operator/e2e/kind.sh purlis-runner:e2e purlis-cluster-operator:e2e

  # **The operator image of a push to `main`**, built and published by `operator-image.yml` once
  # this commit's checks and kind tests passed. Called from here, rather than started by this
  # run's end, so that run's `github.sha` is this push's commit: the one it builds, and the one
  # its OIDC token, and so its build provenance, names. The nightly run and a pull request
  # publish nothing. The permissions are the most the called workflow's jobs ask for; each of
  # its jobs holds only its own. It needs no secret: the registry takes the run's own token.
  image:
    name: operator image
    needs: [checks, kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/operator-image.yml
