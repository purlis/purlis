name: cluster operator

# purlis's cluster operator (#2054, spec #2041): a Rust workspace of its own in `operator/`,
# which `ci` never builds. This workflow checks it, and runs it on a kind cluster of the oldest
# Kubernetes purlis supports with the pinned upstream agent-sandbox, the operator installed by its
# Helm chart, and a runner image built from this commit (`operator/e2e/kind.sh`).
#
# Only a change to the operator, the runner image, the desktop's side of a cluster runner, the
# toolchain, the licence and advisory rules or this file runs it on a pull request, so every
# other pull request waits on none of it; it also runs nightly on `main`. It publishes nothing
# and holds no write permission.

on:
  pull_request:
    paths:
      - operator/**
      - runner-image/**
      - deny.toml
      - rust-toolchain.toml
      - .github/actions/rust-toolchain/**
      - .github/actions/helm/**
      - tools/operator-install*
      - .github/workflows/operator.yml
      # The desktop's side of a cluster runner, which the kind run checks too (#2056).
      - crates/purlis-core/src/clusterpool*
      - crates/purlis-core/src/runnerlink*
      - crates/purlis-core/tests/a_chat_runs_on_a_cluster_runner_through_kubectl_exec.rs
      - crates/purlis-cli/src/bridge.rs
      - fixtures/runner-link-key/**
  push:
    branches: [main]
    paths:
      - operator/**
      - runner-image/**
      - deny.toml
      - rust-toolchain.toml
      - .github/actions/rust-toolchain/**
      - .github/actions/helm/**
      - tools/operator-install*
      - .github/workflows/operator.yml
      # The desktop's side of a cluster runner, which the kind run checks too (#2056).
      - crates/purlis-core/src/clusterpool*
      - crates/purlis-core/src/runnerlink*
      - crates/purlis-core/tests/a_chat_runs_on_a_cluster_runner_through_kubectl_exec.rs
      - crates/purlis-cli/src/bridge.rs
      - fixtures/runner-link-key/**
  # Nightly, so a new advisory against the operator's own lock, or a change elsewhere that
  # breaks the runner image the kind run builds, is reported though nothing here changed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: operator-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: operator (fmt, clippy, test, chart, licences)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy
      # Only `main` saves, as in `ci`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: operator
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Helm, for the chart's tests (.github/actions/helm pins it).
      - uses: ./.github/actions/helm
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      # The root workspace's `deny.toml`, against this workspace's own lock. cargo-deny is the
      # version `ci` installs, checked against the same SHA-256.
      - name: Install cargo-deny
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny --all-features --config ../deny.toml check

  kind:
    name: operator on a kind cluster
    runs-on: ubuntu-24.04
    # It also builds and runs the desktop's side of a cluster runner from the root workspace.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            operator
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # kind, one exact release, checked against the SHA-256 it publishes.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      # Helm, which installs the operator's chart on the kind cluster.
      - uses: ./.github/actions/helm
      # Node, for `tools/operator-install.mjs`, which pins the install kind.sh installs (#2281).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The runner image of this commit, from runner-image/Dockerfile, as `runner-image.yml`
      # builds it (the binary and purlis's plugin) but in a debug build: the operator is under
      # test here, not the binary.
      - name: The runner image
        run: |
          cargo build --locked -p purlis-cli
          mkdir -p "$RUNNER_TEMP/runner"
          cp target/debug/purlis "$RUNNER_TEMP/runner/purlis"
          cp -R app/src-tauri/plugin "$RUNNER_TEMP/runner/plugin"
          docker build -t purlis-runner:e2e -f runner-image/Dockerfile "$RUNNER_TEMP/runner"
      - name: The operator's image
        run: |
          cargo build --locked --manifest-path operator/Cargo.toml
          mkdir -p "$RUNNER_TEMP/operator"
          cp operator/target/debug/purlis-cluster-operator "$RUNNER_TEMP/operator/"
          docker build -t purlis-cluster-operator:e2e -f operator/Dockerfile "$RUNNER_TEMP/operator"
      - name: A Pool and a Claim on kind, with the pinned agent-sandbox
        run: operator/e2e/kind.sh purlis-runner:e2e purlis-cluster-operator:e2e
