name: stories

# Every component story run as a test (#2901, `docs/component-stories.md`): in real Chromium and
# real WebKit, in each cell of the theme matrix (#2945, `app/.storybook/matrix.ts`: each
# appearance of Purlis Classic and Purlis, in each density), failing on a story that does not
# render, on a `play` function that fails (its keyboard path), on any axe violation at WCAG 2.2
# AA with `target-size` on, and on a picture that is not its baseline. A baseline whose story is
# gone, no longer runs as a test in a pictured cell, or takes no picture, fails it too, naming
# the story: `stories-baselines.yml` deletes it.
#
# **One pinned image draws and compares every picture.** A picture differs by its machine's
# fonts and rasteriser, so it is taken nowhere but in Playwright's own image for the Playwright
# version `app/package-lock.json` locks, and the job fails when the two disagree. The image is
# named by its tag and its digest here and in `stories-baselines.yml`, which draws the baselines
# this job compares with; the two must name the same digest (`tools/story-image.mjs`). A tag can
# be pushed again, and a digest cannot, so a baseline is compared in the image it was drawn in.
#
# **A pull request's run draws the baselines it would need, in the same run.** When a pull
# request's stories fail on their pictures alone (a story failing any other gate draws nothing),
# or only an obsolete baseline is wrong, the job runs the stories again with `--update` and
# keeps every live baseline as the `story-baselines` artifact, with `drawn.json` naming the head
# and the base it was merged with. The check stays red: a baseline is compared only once it is
# committed. Two ways take the artifact into the branch, and only on request: the person's own
# `node tools/story-baselines-pull.mjs <pull request>` and push, or the `update-baselines`
# label (`stories-baselines.yml`), which commits it with the workflow's token. Neither draws
# again. `workflow_dispatch` is how that job starts this one on the commit it pushed: the
# `pull_request` run that push starts waits for a maintainer's approval.
#
# **In parts, and one check** (#4038). The stories ran 28 minutes as one job, against its 30, and
# grow, so each browser's stories run in three parts (`part`), each a third of the story files
# (Vitest's `--shard`), in every cell: six jobs, well inside their 20 minutes. The `stories`
# check is one job after them, as `web (types, lint, format, test)` is in `ci.yml`: it names
# what failed in every part, holds the baselines to every part's report, and keeps the one
# `story-baselines` artifact `stories-baselines.yml` and `tools/story-baselines-pull.mjs` take.
# A part whose pictures are all that failed in it draws them again itself; the check keeps them
# only when that is so in every part, so a baseline is still drawn only of a story that passes
# everything else.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stories-${{ github.ref }}
  # As in ci.yml: a newer push supersedes a PR's run, and every run on `main` is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether this change touches what the stories draw (`tools/ci-scope.mjs`, #3505). Its own job
  # on the runner, not a step of `stories`: that job's container is pulled before its first step.
  changes:
    name: what this change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stories: ${{ steps.scope.outputs.stories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: The scopes this change needs
        id: scope
        uses: ./.github/actions/change-scope

  # Not a required check, so it is skipped whole when nothing it draws has changed: a docs-, skills-
  # or tools-only pull request pulls no Playwright image. A push to main and a run by hand run it;
  # a `changes` that fails runs it too. This workflow has no merge-group run, so a scope rule that
  # skips a story wrongly first shows on main's push run, not in the queue.
  #
  # Each part keeps what the check needs as its own `stories-part-<browser>-<part>` artifact: its
  # report, and, when it drew them, the baselines it drew with `drawn-<browser>-<part>` beside them.
  part:
    name: stories (${{ matrix.browser }}, part ${{ matrix.part }} of 3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stories != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each browser on its own, so each failure can say which browser it failed in; every
        # cell of the matrix is a project of its own, `stories <cell> (<browser>)`.
        browser: [chromium, webkit]
        part: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      # An init that reaps, and the host's IPC namespace, which Chromium wants for its shared
      # memory (Playwright's own advice for this image).
      options: --init --ipc=host
    env:
      PURLIS_STORY_PICTURES: "1"
      HOME: /root
      BROWSER: ${{ matrix.browser }}
      PART: ${{ matrix.part }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: The image is the Playwright the lockfile names, by its tag and its digest
        run: node ../tools/story-image.mjs
      # A third of the story files, by Vitest's own hash of each file's path, in every cell. The
      # failures are kept by `tools/story-failures.mjs`'s reporter rather than Vitest's JSON
      # one, which keeps an error's stack alone: WebKit's does not repeat the message.
      - name: This part's stories
        id: stories
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          PURLIS_STORY_REPORT="$RUNNER_TEMP/part/stories-$BROWSER-$PART.json" \
            npx vitest run --project "stories * ($BROWSER)" --shard="$PART/3" \
            --reporter=default --reporter=../tools/story-failures.mjs
      - name: The pictures that differ, kept
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-pictures-${{ matrix.browser }}-${{ matrix.part }}
          path: app/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7
      # Drawn when a picture is all that failed in this part; the check keeps them only when that
      # holds in every part. Each picture the drawing wrote is kept, under its path in `app/`.
      - name: This part's baselines, drawn again
        if: failure() && github.event_name == 'pull_request' && steps.stories.outcome == 'failure'
        run: |
          if ! files=$(node ../tools/story-failures.mjs pictures-alone "$RUNNER_TEMP/part/stories-$BROWSER-$PART.json"); then
            echo "a story in this part failed on more than its picture, so none are drawn"
            exit 0
          fi
          touch "$RUNNER_TEMP/drawing-since"
          # shellcheck disable=SC2086 # story files, with no space in any
          # Its own report: the check reads the whole part's, which names every story that takes
          # no picture.
          if ! PURLIS_STORY_REPORT="$RUNNER_TEMP/drawing-$BROWSER-$PART.json" \
            npx vitest run --project "stories * ($BROWSER)" --update --reporter=default \
            --reporter=../tools/story-failures.mjs $files; then
            echo "::notice::a story failed while its baselines were drawn in $BROWSER, part $PART, so none are kept"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/part/app"
          find src -path '*/__screenshots__/*' -name "*-$BROWSER-linux.png" -newer "$RUNNER_TEMP/drawing-since" -print0 \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/part/app"
          touch "$RUNNER_TEMP/part/drawn-$BROWSER-$PART"
      - name: This part's report and baselines, kept for the stories check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stories-part-${{ matrix.browser }}-${{ matrix.part }}
          path: ${{ runner.temp }}/part/
          if-no-files-found: ignore
          retention-days: 7

  # The one `stories` check, whatever the parts did: skipped with them when nothing it draws has
  # changed, and red when any part is not green, ran out of time or wrote no report.
  stories:
    name: stories (Chromium and WebKit, axe, keyboard, screenshots)
    needs: [changes, part]
    if: ${{ !cancelled() && needs.changes.outputs.stories != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # A part that kept nothing is named below as having written no report.
      - name: Every part's report and baselines
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: stories-part-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      # Every part's report, by browser; one a part never wrote is named as such.
      - name: The reports
        id: reports
        run: |
          named="" all=""
          for browser in chromium webkit; do
            for part in 1 2 3; do
              report="$RUNNER_TEMP/parts/stories-$browser-$part.json"
              named="$named $browser $report"
              all="$all $report"
            done
          done
          echo "named=$named" >> "$GITHUB_OUTPUT"
          echo "all=$all" >> "$GITHUB_OUTPUT"
      # One annotation per story that failed, the same in both browsers: its browser, its gate,
      # the first line of why and the axe rules it broke, put on the story file's line it failed
      # at (`GITHUB_WORKSPACE` is the root its path is relative to); a failure axe raises after
      # the story has no such line, and is on the check alone. GitHub keeps 10 of a step's, so
      # the stories that stop the baselines being drawn come first, and the step's summary,
      # never capped, lists them all and then every picture (#4050).
      - name: The stories that failed, named
        if: needs.part.result != 'success'
        env:
          NAMED: ${{ steps.reports.outputs.named }}
        run: |
          # shellcheck disable=SC2086 # browser and report pairs, with no space in any
          node ../tools/story-failures.mjs $NAMED
      # Storybook's own index says which stories there are, and the run's reports which of them
      # take no picture (`screenshot: false`, which no index has); a baseline of any other is
      # obsolete. A part's missing report is warned of, and fails the check below.
      - name: Every baseline was drawn in this image, of a story there is that takes a picture
        env:
          ALL: ${{ steps.reports.outputs.all }}
        run: |
          npx storybook index --disable-telemetry --quiet -c .storybook \
            -o "$RUNNER_TEMP/stories-index.json"
          # shellcheck disable=SC2086 # report paths, with no space in any
          node ../tools/story-baselines.mjs check "$RUNNER_TEMP/stories-index.json" $ALL
      - name: Every part passed
        if: ${{ !cancelled() }}
        env:
          RESULT: ${{ needs.part.result }}
        run: test "$RESULT" = success
      # The baselines this run would make, for the pull request to take on request (above). Kept
      # only when a picture is all that failed in every part, and every part that failed drew
      # its own, so the other gates hold every baseline drawn; an obsolete baseline alone needs
      # no drawing, and gathering leaves it out.
      - name: The baselines, drawn in this run for the pull request to take
        id: drawn
        if: failure() && github.event_name == 'pull_request' && steps.reports.outcome == 'success'
        env:
          RESULT: ${{ needs.part.result }}
          ALL: ${{ steps.reports.outputs.all }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          parts="$RUNNER_TEMP/parts"
          if [ "$RESULT" != success ]; then
            # shellcheck disable=SC2086 # report paths, with no space in any
            if ! node ../tools/story-failures.mjs pictures-alone $ALL > /dev/null; then
              echo "::notice::no baselines are drawn: a story failed on more than its picture, or a part wrote no report (the first annotation names which); fix it, and the next run draws them"
              exit 0
            fi
            for report in $ALL; do
              name=$(basename "$report" .json)
              if jq -e .failed "$report" > /dev/null && [ ! -f "$parts/drawn-${name#stories-}" ]; then
                echo "::notice::a story failed while its baselines were drawn in ${name#stories-}, so none are kept"
                exit 0
              fi
            done
            # Each part's pictures over the checkout's: a story file is in one part, and a part
            # keeps only its own browser's pictures.
            if [ -d "$parts/app/src" ]; then cp -R "$parts/app/src/." src/; fi
          fi
          if [ ! -f "$RUNNER_TEMP/stories-index.json" ]; then
            npx storybook index --disable-telemetry --quiet -c .storybook \
              -o "$RUNNER_TEMP/stories-index.json"
          fi
          mkdir -p "$RUNNER_TEMP/drawn/app"
          # shellcheck disable=SC2086
          node ../tools/story-baselines.mjs gather "$RUNNER_TEMP/stories-index.json" \
            "$RUNNER_TEMP/drawn/app" $ALL > "$RUNNER_TEMP/gathered.txt"
          printf '{"head":"%s","base":"%s"}\n' "$HEAD_SHA" "$BASE_SHA" > "$RUNNER_TEMP/drawn/drawn.json"
          echo "$(grep -c . "$RUNNER_TEMP/gathered.txt" || true) baselines drawn; take them with node tools/story-baselines-pull.mjs ${{ github.event.pull_request.number }}, or the update-baselines label"
          echo "drawn=true" >> "$GITHUB_OUTPUT"
      - name: The baselines drawn, kept for the pull request to take
        if: failure() && steps.drawn.outputs.drawn == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-baselines
          path: ${{ runner.temp }}/drawn/
          if-no-files-found: error
          retention-days: 7
      # Last, so it is the newest annotation, which GitHub shows first: one that names every
      # story that stops the baselines being drawn, however many pictures failed (#4050).
      - name: What stops the baselines being drawn, named first
        if: ${{ !cancelled() && needs.part.result != 'success' }}
        env:
          NAMED: ${{ steps.reports.outputs.named }}
        run: |
          # shellcheck disable=SC2086 # browser and report pairs, with no space in any
          node ../tools/story-failures.mjs headline $NAMED
