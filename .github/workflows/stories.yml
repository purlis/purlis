name: stories

# Every component story run as a test (#2901, `docs/component-stories.md`): in real Chromium and
# real WebKit, in each cell of the theme matrix (#2945, `app/.storybook/matrix.ts`: each
# appearance of Purlis Classic and Purlis, in each density), failing on a story that does not
# render, on a `play` function that fails (its keyboard path), on any axe violation at WCAG 2.2
# AA with `target-size` on, and on a picture that is not its baseline. A baseline whose story is
# gone, no longer runs as a test in a pictured cell, or takes no picture, fails it too, naming
# the story: `stories-baselines.yml` deletes it.
#
# **One pinned image draws and compares every picture.** A picture differs by its machine's
# fonts and rasteriser, so it is taken nowhere but in Playwright's own image for the Playwright
# version `app/package-lock.json` locks, and the job fails when the two disagree. The image is
# named by its tag and its digest here and in `stories-baselines.yml`, which draws the baselines
# this job compares with; the two must name the same digest (`tools/story-image.mjs`). A tag can
# be pushed again, and a digest cannot, so a baseline is compared in the image it was drawn in.
#
# **A pull request's run draws the baselines it would need, in the same run.** When a pull
# request's stories fail on their pictures alone (a story failing any other gate draws nothing),
# or only an obsolete baseline is wrong, each shard that failed runs its stories again with
# `--update`, and the `stories` check keeps every live baseline as the one `story-baselines`
# artifact, with `drawn.json` naming the head
# and the base it was merged with. The check stays red: a baseline is compared only once it is
# committed. Two ways take the artifact into the branch, and only on request: the person's own
# `node tools/story-baselines-pull.mjs <pull request>` and push, or the `update-baselines`
# label (`stories-baselines.yml`), which commits it with the workflow's token. Neither draws
# again. `workflow_dispatch` is how that job starts this one on the commit it pushed: the
# `pull_request` run that push starts waits for a maintainer's approval.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stories-${{ github.ref }}
  # As in ci.yml: a newer push supersedes a PR's run, and every run on `main` is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether this change touches what the stories draw (`tools/ci-scope.mjs`, #3505). Its own job
  # on the runner, not a step of `stories`: that job's container is pulled before its first step.
  changes:
    name: what this change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # To read main's last run's jobs, for how many parts the stories need.
    permissions:
      contents: read
      actions: read
    outputs:
      stories: ${{ steps.scope.outputs.stories }}
      shards: ${{ steps.parts.outputs.shards }}
      of: ${{ steps.parts.outputs.of }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: The scopes this change needs
        id: scope
        uses: ./.github/actions/change-scope
      - name: How many parts the stories need, from main's last good run
        id: parts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/story-shards.mjs

  # Not a required check, so it is skipped whole when nothing it draws has changed: a docs-, skills-
  # or tools-only pull request pulls no Playwright image. A push to main and a run by hand run it;
  # a `changes` that fails runs it too. This workflow has no merge-group run, so a scope rule that
  # skips a story wrongly first shows on main's push run, not in the queue.
  #
  # **The stories run in shards** (#4013): each browser's story files split by Vitest's `--shard`,
  # each shard a job of its own. All of them in one job took 28 minutes of its 30, and a pull
  # request whose pictures changed then drew them again past the limit, so the job was cancelled
  # and kept no baselines to take. A shard runs its stories, names what failed in them, and draws
  # again the pictures that failed in it; `stories`, the check, then reads every shard's report
  # and keeps the one `story-baselines` artifact the pull request takes.
  shard:
    name: stories (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stories != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard runs to its end, so every story that failed is named.
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        # `of` is how many parts `--shard` splits a browser's story files into, and `shard` lists
        # each part. Each report is named by both, so the check finds a part that never ran
        # (`tools/story-failures.mjs shards`).
        # **The sharding trigger** (#3040, `tools/story-shards.mjs`): a stories step past 8 minutes
        # on main's last good run means more parts here on the next, leaving a part room to draw
        # its pictures again and for the stories to grow. Three when `changes` could not say
        # (#4038).
        shard: ${{ fromJson(needs.changes.outputs.shards || '[1,2,3]') }}
        of: ${{ fromJson(needs.changes.outputs.of || '3') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      # An init that reaps, and the host's IPC namespace, which Chromium wants for its shared
      # memory (Playwright's own advice for this image).
      options: --init --ipc=host
    env:
      PURLIS_STORY_PICTURES: "1"
      HOME: /root
      BROWSER: ${{ matrix.browser }}
      SHARD: ${{ matrix.shard }}
      OF: ${{ matrix.of }}
      NAME: ${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.of }}
    defaults:
      run:
        working-directory: app
        # A container's steps run in `sh` unless told otherwise; the drawing step reads arrays.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: The image is the Playwright the lockfile names, by its tag and its digest
        run: node ../tools/story-image.mjs
      # One browser and one part of its story files; every cell of the matrix is a project of its
      # own, `stories <cell> (<browser>)`. The failures are kept by `tools/story-failures.mjs`'s
      # reporter rather than Vitest's JSON one, which keeps an error's stack alone: WebKit's does
      # not repeat the message.
      - name: The stories, in this shard of this browser
        id: stories
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          PURLIS_STORY_REPORT="$RUNNER_TEMP/report/report-$NAME.json" \
            npx vitest run --project "stories * ($BROWSER)" --shard="$SHARD/$OF" \
            --reporter=default --reporter=../tools/story-failures.mjs
      # Storybook's own index of the stories, for the check to read the baselines against: the
      # same in every shard, so any one shard's will do, and named by its shard so none is lost.
      - name: The stories there are
        if: ${{ !cancelled() && steps.stories.conclusion != 'skipped' }}
        run: |
          npx storybook index --disable-telemetry --quiet -c .storybook \
            -o "$RUNNER_TEMP/report/index-$NAME.json"
      # Kept before any drawing, so a shard that runs out of time while it draws still reports.
      - name: The shard's report, kept for the check
        if: ${{ !cancelled() && steps.stories.conclusion != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-report-${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.of }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn
          retention-days: 7
      # One annotation per story that failed: its browser, its gate, the first line of why and
      # the axe rules it broke, put on the story file's line it failed at. The shard that ran the
      # story says it: the frames are of this container's paths, which `GITHUB_WORKSPACE` is the
      # root of. A failure axe raises after the story has no such line, and is on the check
      # alone; a shard that failed before its stories ran says it wrote no report. GitHub keeps
      # 10 of a step's, so the stories that stop the baselines being drawn come first, and the
      # step's summary, never capped, lists them all and then every picture (#4050).
      - name: The stories that failed, named
        if: failure()
        run: node ../tools/story-failures.mjs "$BROWSER" "$RUNNER_TEMP/report/report-$NAME.json"
      - name: The pictures that differ, kept
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-pictures-${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.of }}
          path: app/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7
      # The pictures that failed in this shard, drawn again for the pull request to take (above):
      # only when a picture is all that failed in it, so the other gates hold every baseline
      # drawn. Each story file is drawn in the cells its picture failed in, and only those cells'
      # pictures are kept: a file's other cells may be another shard's. `drew-<shard>` beside
      # them says this shard drew all it had to; the check keeps them only when every shard that
      # failed drew.
      - name: The pictures that failed, drawn again
        id: drawn
        if: failure() && github.event_name == 'pull_request' && steps.stories.outcome == 'failure'
        run: |
          if ! node ../tools/story-failures.mjs pictures-to-draw "$RUNNER_TEMP/report/report-$NAME.json" > "$RUNNER_TEMP/to-draw.tsv"; then
            echo "::notice::a story failed on more than its picture in $BROWSER $SHARD/$OF, so no baselines are drawn: fix it, and the next run draws them"
            exit 0
          fi
          projects=()
          while IFS= read -r cell; do projects+=(--project "stories $cell ($BROWSER)"); done \
            < <(cut -f2 "$RUNNER_TEMP/to-draw.tsv" | sort -u)
          mapfile -t files < <(cut -f1 "$RUNNER_TEMP/to-draw.tsv" | sort -u)
          # Its own report: the check reads the whole run's, which names every story that takes no
          # picture.
          if ! PURLIS_STORY_REPORT="$RUNNER_TEMP/drawing.json" \
            npx vitest run "${projects[@]}" --update --reporter=default \
            --reporter=../tools/story-failures.mjs "${files[@]}"; then
            echo "::notice::a story failed while its baselines were drawn in $BROWSER $SHARD/$OF, so none are kept"
            exit 0
          fi
          while IFS=$'\t' read -r file cell; do
            pictures="$(dirname "$file")/__screenshots__/$(basename "$file")"
            mkdir -p "$RUNNER_TEMP/drawn/app/$pictures"
            find "$pictures" -maxdepth 1 -type f -name "*_$cell-$BROWSER-linux.png" \
              -exec cp {} "$RUNNER_TEMP/drawn/app/$pictures/" \;
          done < "$RUNNER_TEMP/to-draw.tsv"
          touch "$RUNNER_TEMP/drawn/drew-$NAME"
          echo "drawn=true" >> "$GITHUB_OUTPUT"
      - name: The pictures drawn again, kept for the check
        if: failure() && steps.drawn.outputs.drawn == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-drawn-${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.of }}
          path: ${{ runner.temp }}/drawn/
          if-no-files-found: error
          retention-days: 7

  # **The check**, under the name it has always had: it fails when any shard failed, checks that
  # every baseline is of a live story that takes a picture, and keeps the baselines a pull request
  # takes as one `story-baselines` artifact, as `tools/story-baselines-pull.mjs` and
  # `stories-baselines.yml` read it. It runs no story, so it needs no image and no `npm ci`: the
  # baseline and report tools use Node's own modules alone. Each story's annotations are on the
  # shard that ran it.
  stories:
    name: stories (Chromium and WebKit, axe, keyboard, screenshots)
    needs: [changes, shard]
    if: ${{ !cancelled() && needs.changes.outputs.stories != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Each artifact's files are named by its shard, so they merge into one directory. A shard
      # that never ran its stories kept none: the next step names it.
      - name: Every shard's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: story-report-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true
      - name: Every shard's pictures, drawn again
        if: ${{ github.event_name == 'pull_request' && needs.shard.result == 'failure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: story-drawn-*
          path: ${{ runner.temp }}/redrawn
          merge-multiple: true
      # Storybook's own index says which stories there are, and the shards' reports which of them
      # take no picture (`screenshot: false`, which no index has); a baseline of any other is
      # obsolete. After the stories, whether they passed or not.
      - name: Every baseline was drawn in this image, of a story there is that takes a picture
        id: check
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/reports/report-*.json)
          indexes=("$RUNNER_TEMP"/reports/index-*.json)
          if ! node tools/story-failures.mjs shards "$RUNNER_TEMP/reports" > "$RUNNER_TEMP/shards.txt"; then
            while IFS= read -r line; do echo "::warning::$line: its stories are not checked for screenshot: false"; done < "$RUNNER_TEMP/shards.txt"
          fi
          if [ "${#indexes[@]}" -eq 0 ]; then
            echo "::error::no shard's story index reached this job, so no baseline is checked: the shards' logs say why"
            exit 1
          fi
          node tools/story-baselines.mjs check "${indexes[0]}" "${reports[@]}"
      # The baselines this run would make, for the pull request to take on request (above): every
      # shard's pictures drawn again, put over this checkout, and every live baseline gathered.
      # Only when every shard reported, a picture is all that failed in any, and each shard that
      # failed drew; an obsolete baseline alone needs no drawing, and gathering leaves it out.
      - name: The baselines, drawn in this run for the pull request to take
        id: drawn
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.shard.result == 'failure' || steps.check.outcome == 'failure') }}
        env:
          SHARDS_RESULT: ${{ needs.shard.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/reports/report-*.json)
          indexes=("$RUNNER_TEMP"/reports/index-*.json)
          if [ "${#indexes[@]}" -eq 0 ]; then exit 0; fi
          if [ "$SHARDS_RESULT" != success ]; then
            if ! node tools/story-failures.mjs pictures-alone "${reports[@]}" > /dev/null; then
              echo "::notice::a story failed on more than its picture, so no baselines are drawn: fix it, and the next run draws them"
              exit 0
            fi
            if ! node tools/story-failures.mjs shards "$RUNNER_TEMP/reports" "$RUNNER_TEMP/redrawn" > "$RUNNER_TEMP/undrawn.txt"; then
              while IFS= read -r line; do echo "::notice::$line, so no baselines are kept: its log says why"; done < "$RUNNER_TEMP/undrawn.txt"
              exit 0
            fi
            if [ -d "$RUNNER_TEMP/redrawn/app" ]; then cp -R "$RUNNER_TEMP/redrawn/app/." app/; fi
          fi
          mkdir -p "$RUNNER_TEMP/drawn/app"
          node tools/story-baselines.mjs gather "${indexes[0]}" \
            "$RUNNER_TEMP/drawn/app" "${reports[@]}" > "$RUNNER_TEMP/gathered.txt"
          printf '{"head":"%s","base":"%s"}\n' "$HEAD_SHA" "$BASE_SHA" > "$RUNNER_TEMP/drawn/drawn.json"
          echo "$(grep -c . "$RUNNER_TEMP/gathered.txt" || true) baselines drawn; take them with node tools/story-baselines-pull.mjs ${{ github.event.pull_request.number }}, or the update-baselines label"
          echo "drawn=true" >> "$GITHUB_OUTPUT"
      - name: The baselines drawn, kept for the pull request to take
        if: ${{ !cancelled() && steps.drawn.outputs.drawn == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-baselines
          path: ${{ runner.temp }}/drawn/
          if-no-files-found: error
          retention-days: 7
      - name: Every shard passed
        if: ${{ !cancelled() }}
        env:
          SHARDS_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::a shard of the stories failed ($SHARDS_RESULT): the stories (<browser> <shard>) checks name each story and why"
            exit 1
          fi
      # Last, so it is the check's newest annotation, which GitHub shows first: one that names
      # every story that stops the baselines being drawn, in any shard, however many pictures
      # failed, and every shard that wrote no report (#4050).
      - name: What stops the baselines being drawn, named first
        if: ${{ !cancelled() && needs.shard.result != 'success' }}
        run: node tools/story-failures.mjs headline "$RUNNER_TEMP/reports"
