name: stories

# Every component story run as a test (#2901, `docs/component-stories.md`): in real Chromium and
# real WebKit, failing on a story that does not render, on a `play` function that fails (its
# keyboard path), on any axe violation at WCAG 2.2 AA with `target-size` on, and on a picture
# that is not its baseline.
#
# **One pinned image draws and compares every picture.** A picture differs by its machine's
# fonts and rasteriser, so it is taken nowhere but in Playwright's own image for the Playwright
# version `app/package-lock.json` locks, and the job fails when the two disagree. The image is
# named by its tag here and in `stories-baselines.yml`, which draws the baselines this job
# compares with; the two must name the same one.
#
# A baseline changes only through `stories-baselines.yml`, which a pull request's
# `update-baselines` label starts. `workflow_dispatch` is how that job starts this one on the
# commit it pushed: a push made with the workflow's own token starts no run by itself.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stories-${{ github.ref }}
  # As in ci.yml: a newer push supersedes a PR's run, and every run on `main` is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  stories:
    name: stories (Chromium and WebKit, axe, keyboard, screenshots)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # An init that reaps, and the host's IPC namespace, which Chromium wants for its shared
      # memory (Playwright's own advice for this image).
      options: --init --ipc=host
    env:
      # Playwright's version in the image's tag above, held to the lockfile's below.
      PLAYWRIGHT_IMAGE: "1.64.1"
      PURLIS_STORY_PICTURES: "1"
      HOME: /root
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: The image is the Playwright the lockfile names
        run: |
          locked=$(node -p 'require("playwright/package.json").version')
          if [ "$locked" != "$PLAYWRIGHT_IMAGE" ]; then
            echo "::error::app/package-lock.json locks Playwright $locked, and the stories image is $PLAYWRIGHT_IMAGE: move both workflows' image to v$locked-noble"
            exit 1
          fi
      - name: Every baseline was drawn in this image
        run: node ../tools/story-baselines.mjs check
      - name: The stories
        run: npm run test:stories
      - name: The pictures that differ, kept
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-pictures
          path: app/.vitest/attachments/
          if-no-files-found: ignore
