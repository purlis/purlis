name: stories-baselines

# **A pull request's baselines, committed by a label** (#2901, `docs/component-stories.md`): the
# `update-baselines` label on a pull request. Nothing is drawn here: the pull request's own
# `stories` run drew them, in the pinned image, when its pictures were all that failed, and kept
# them as the `story-baselines` artifact (`stories.yml`). `commit` waits for that run of the
# labelled head, takes its artifact, pushes the baselines to the pull request's branch as one
# commit, with every baseline whose story is gone deleted, so the pictures show in its diff,
# takes the label off and starts `stories.yml` on that commit. A baseline is obsolete once its
# story is gone, or once it takes no picture (`screenshot: false`).
#
# **The pictures are of the branch's own tree.** The `stories` run tested the branch merged into
# its base, and its `drawn.json` names both. `commit` takes them only while the branch is still
# that head and has every commit of that base, so the merge and the branch are one tree.
#
# **Only code from the base branch runs while a token can push.** The pictures come from a run of
# the pull request's code, with a read-only token. `commit` runs the baseline tool from a checkout
# of the base, and takes only whole PNG baselines within its limits, written nowhere but under
# the pull request's `app/src`; it deletes nothing but the other files in that tree's
# `__screenshots__` directories, each reached through no link (`tools/story-baselines.mjs take`).
# The pull request's checkout keeps no credentials; the token is handed to git for the push
# alone. A pull request from a fork gets no token that can push, so `commit` says so and stops.
#
# The `pull_request` runs a push made with the workflow's own token starts wait for a maintainer
# to approve them, so the rest of the pull request's checks run once approved, or on its next push
# (or `gh pr update-branch`). `node tools/story-baselines-pull.mjs <pull request>` takes the same
# artifact into a checkout instead, for a push of the person's own, which starts every check.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# At job level, which a job skipped by its `if:` never enters: another label put on the pull
# request starts a run that skips every job, and so never displaces a pending baseline run.
jobs:
  commit:
    name: baselines (commit to the pull request)
    if: github.event.label.name == 'update-baselines'
    runs-on: ubuntu-24.04
    # Most of it waiting for the head's `stories` run, which takes up to 30 minutes.
    timeout-minutes: 45
    concurrency:
      group: stories-baselines-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: A pull request from this repository
        if: env.SAME_REPO != 'true'
        run: |
          echo "::error::the pull request comes from a fork, whose branch this job cannot push to: its author takes the baselines with node tools/story-baselines-pull.mjs and pushes them"
          exit 1
      # The tool that decides what is taken, from the base branch: nothing the pull request
      # changed runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: tools/story-baselines.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
          persist-credentials: false
      - name: The branch is where it was labelled
        working-directory: pr
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::the branch moved after the label was put on; put it on again"
            exit 1
          fi
      # The newest `stories` run of the labelled head, waited for while it runs. One that passed
      # drew nothing, as every baseline matches; one that failed on more than a picture kept none.
      - name: The stories run of the labelled head, finished, and its baselines
        id: stories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api -X GET "repos/$GH_REPO/actions/workflows/stories.yml/runs" \
              -f head_sha="$HEAD_SHA" -f per_page=20 \
              --jq '[.workflow_runs[] | select(.head_sha == env.HEAD_SHA)] | sort_by([.run_number, .run_attempt]) | last // empty | "\(.id) \(.status) \(.conclusion)"')
            if [ -z "$run" ]; then
              echo "::error::no stories run has tested $HEAD_SHA: push again, or start one with gh workflow run stories.yml --ref $HEAD_REF"
              exit 1
            fi
            read -r id status conclusion <<< "$run"
            if [ "$status" = completed ]; then break; fi
            echo "the stories run $id is $status; waiting"
            sleep 30
          done
          if [ "$conclusion" = success ]; then
            echo "::notice::the stories run $id passed, so every baseline already matches what the pinned image draws"
            exit 0
          fi
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" \
            --jq '.artifacts[] | select(.name == "story-baselines" and (.expired | not)) | .id' | head -n 1)
          if [ -z "$artifact" ]; then
            echo "::error::the stories run $id kept no baselines: a story failed on more than its picture there, and its annotations say which"
            exit 1
          fi
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - if: steps.stories.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: story-baselines
          path: ${{ runner.temp }}/drawn
          run-id: ${{ steps.stories.outputs.run }}
          github-token: ${{ github.token }}
      # Of this head, merged with a base the head has every commit of: the branch's own tree.
      - name: The baselines are of the labelled head's own tree
        if: steps.stories.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drawn=$(jq -r .head "$RUNNER_TEMP/drawn/drawn.json")
          base=$(jq -r .base "$RUNNER_TEMP/drawn/drawn.json")
          if [ "$drawn" != "$HEAD_SHA" ]; then
            echo "::error::the baselines were drawn of $drawn, not of the labelled head $HEAD_SHA"
            exit 1
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the baselines do not say which base the head was merged with"
            exit 1
          fi
          behind=$(gh api "repos/$GH_REPO/compare/$base...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "::error::the branch is $behind commits behind the base its stories run merged it with: update the branch (gh pr update-branch), let stories run, then put the label on again"
            exit 1
          fi
      # With nothing drawn, every baseline is obsolete: an empty directory takes none.
      - name: The baselines, taken, and the obsolete ones deleted
        if: steps.stories.outputs.run != ''
        run: |
          mkdir -p "$RUNNER_TEMP/drawn/app"
          node trusted/tools/story-baselines.mjs take "$RUNNER_TEMP/drawn/app" pr/app
      - name: The baselines, committed and pushed
        id: taken
        if: steps.stories.outputs.run != ''
        working-directory: pr
        env:
          TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -A -- app/src
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "every baseline already matches what the pinned image draws"
            exit 0
          fi
          drawn=$(git diff --cached --name-only --diff-filter=d)
          deleted=$(git diff --cached --name-only --diff-filter=D)
          git commit -q -m "stories: baselines drawn in the pinned image" \
            -m "By the update-baselines label (.github/workflows/stories-baselines.yml)."
          # The token reaches git for this one command, never the checkout's config.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$HEAD_REF"
          {
            echo "changed<<EOF"
            echo "$changed"
            echo "EOF"
            echo "drawn<<EOF"
            echo "$drawn"
            echo "EOF"
            echo "deleted<<EOF"
            echo "$deleted"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: The stories, started on the new commit
        if: steps.taken.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stories.yml --ref "$HEAD_REF"
      - name: The label, taken off, and what changed said
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.taken.outputs.changed }}
          DRAWN: ${{ steps.taken.outputs.drawn }}
          DELETED: ${{ steps.taken.outputs.deleted }}
        run: |
          gh pr edit "$PR" --remove-label update-baselines || true
          if [ -n "$CHANGED" ]; then
            # A baseline's path has no space in it (tools/story-baselines.mjs). Every path goes
            # to the run's summary; the comment lists them only while it stays short, and
            # otherwise counts them by directory, so it never grows past what a comment holds.
            listed() { for path in $1; do echo "- \`$path\`"; done; }
            counted() { for path in $1; do dirname "$path"; done | sort | uniq -c | while read -r n dir; do echo "- $n in \`$dir\`"; done; }
            many=$(( $(echo "$CHANGED" | wc -l) > 100 ))
            {
              echo "## Baselines drawn"
              echo
              if [ -n "$DRAWN" ]; then listed "$DRAWN"; fi
              echo
              echo "## Baselines deleted"
              echo
              if [ -n "$DELETED" ]; then listed "$DELETED"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            {
              if [ -n "$DRAWN" ]; then
                echo "The pinned image drew these baselines anew; the pictures are in this pull request's diff:"
                echo
                if [ "$many" = 1 ]; then counted "$DRAWN"; else listed "$DRAWN"; fi
                echo
              fi
              if [ -n "$DELETED" ]; then
                echo "These baselines were deleted, as no story that runs as a test draws them in a pictured cell, or it takes no picture:"
                echo
                if [ "$many" = 1 ]; then counted "$DELETED"; else listed "$DELETED"; fi
                echo
              fi
              if [ "$many" = 1 ]; then
                echo "Every path is in the summary of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
                echo
              fi
              echo "The \`stories\` check runs on the new commit now. Its other checks wait for a maintainer to approve them, or run on the branch's next push."
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi
