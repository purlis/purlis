# PROBE (#5454, #5463), temporary: removed before the pull request is ready.
name: probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        run: echo "image=$(node tools/story-image.mjs ref)" >> "$GITHUB_OUTPUT"

  # #5463: WaitingStrip's stories in WebKit, alone many times, and in the shard that has failed.
  strip:
    name: probe strip (${{ matrix.how }} ${{ matrix.rep }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        how: [alone, loaded]
        rep: [1, 2, 3, 4]
    container:
      image: ${{ needs.image.outputs.image }}
      options: --init --ipc=host
    env:
      PURLIS_STORY_PICTURES: "1"
      HOME: /root
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Run
        env:
          HOW: ${{ matrix.how }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/probe"
          if [ "$HOW" = loaded ]; then
            # CPU load beside the browser, to widen any race in what the picture waits for.
            for n in $(seq 1 "$(nproc)"); do (while :; do :; done) & done
          fi
          if [ "$HOW" = alone ] || [ "$HOW" = loaded ]; then
            for i in $(seq 1 12); do
              npx vitest run --project "stories * (webkit)" src/WaitingStrip.stories.tsx 2>&1 | tee -a "$RUNNER_TEMP/probe/log.txt" | grep -E "PROBE-5463|FAIL|dimensions"
            done
          else
            shard=3
            for k in $(seq 1 8); do
              if npx vitest list --project "stories * (webkit)" --filesOnly --shard=$k/8 2>/dev/null | grep -q WaitingStrip; then shard=$k; fi
            done
            echo "::notice title=strip shard::WaitingStrip is in webkit shard $shard/8"
            for i in 1 2; do
              npx vitest run --project "stories * (webkit)" --shard=$shard/8 2>&1 | tee -a "$RUNNER_TEMP/probe/log.txt" | grep -E "PROBE-5463|FAIL|dimensions"
            done
          fi
          echo "::notice title=strip $HOW::$(grep -c 'Expected image dimensions' "$RUNNER_TEMP/probe/log.txt") dimension misses, $(grep -c 'PROBE-5463 {\"when\":\"before\"' "$RUNNER_TEMP/probe/log.txt") pictures probed"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-strip-${{ matrix.how }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/probe/
          retention-days: 7
