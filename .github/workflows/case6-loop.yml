# Temporary: loops the artifact isolation spec on macOS, old case 6 against new. Never merged.
name: case 6 loop (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  loop:
    name: case 6 loop (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: ./.github/actions/npm-ci
        with:
          directory: app
      - name: Build the app for the scenario tests
        timeout-minutes: 110
        env:
          CARGO_PROFILE_DEV_RELEASE_DEBUG: "false"
          CARGO_PROFILE_DEV_RELEASE_SPLIT_DEBUGINFO: "off"
        run: >-
          npx tauri build --debug --no-bundle --features e2e
          --config src-tauri/tauri.e2e.conf.json -- -p purlis-app -p fake-harness -p purlis-cli
        working-directory: app
      - name: Loop the old and the new case 6
        working-directory: app
        run: |
          git show origin/main:app/e2e/specs/artifact-isolation.e2e.ts > e2e/specs/zz-old-isolation.e2e.ts
          old=0; new=0
          for n in $(seq 1 20); do
            npx wdio run e2e/wdio.conf.ts --spec e2e/specs/zz-old-isolation.e2e.ts > "old-$n.txt" 2>&1 || { old=$((old+1)); grep -E "Error|Received|\+ " "old-$n.txt" | head -12; }
            npx wdio run e2e/wdio.conf.ts --spec e2e/specs/artifact-isolation.e2e.ts > "new-$n.txt" 2>&1 || { new=$((new+1)); grep -E "Error|Received|\+ " "new-$n.txt" | head -12; }
            echo "after $n: old failed $old, new failed $new"
          done
          echo "## case 6 loop: old failed $old/20, new failed $new/20" >> "$GITHUB_STEP_SUMMARY"
          [ "$new" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: case6-loop
          path: |
            app/old-*.txt
            app/new-*.txt
            app/logs
          retention-days: 7
