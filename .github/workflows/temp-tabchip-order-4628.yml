# TEMPORARY (#4628): the TabChip test alone and in shuffled orders. Removed before this PR is ready.
name: temp tabchip order

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  order:
    name: tabchip order (temporary)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: alone
        run: npx vitest run --project unit src/TabChip.window.test.tsx -t "keeps a menu a press opened"
      - name: whole file, in order
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit src/TabChip.window.test.tsx
      - name: whole file, shuffled, seed 1
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit src/TabChip.window.test.tsx --sequence.shuffle.tests --sequence.seed=1
      - name: whole file, shuffled, seed 2
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit src/TabChip.window.test.tsx --sequence.shuffle.tests --sequence.seed=2
      - name: whole file, shuffled, seed 3
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit src/TabChip.window.test.tsx --sequence.shuffle.tests --sequence.seed=3
      - name: the leave audit's tests
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit src/ThemeDraftStrip.test.tsx src/ui/field/Field.test.tsx src/ui/activity/ActivityItem.test.tsx src/ui/menu/MenuTip.test.tsx src/ChatsSection.window.test.tsx
      - name: the leave audit's tests, shuffled
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit src/ThemeDraftStrip.test.tsx src/ui/field/Field.test.tsx src/ui/activity/ActivityItem.test.tsx src/ui/menu/MenuTip.test.tsx src/ChatsSection.window.test.tsx --sequence.shuffle.tests --sequence.seed=1
