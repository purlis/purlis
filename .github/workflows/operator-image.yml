name: operator image

# purlis's cluster operator image (#2238, spec #2041), made the way `runner-image.yml` makes the
# runner image: for linux/amd64 and linux/arm64, kept in the GitHub Container Registry as a
# public package of this organisation, recorded by digest and signed by keyless cosign through
# this run's GitHub OIDC identity. No signing key is stored anywhere; the signature's entry in
# Sigstore's public transparency log names the image and its digest.
# The package is public (the person's ruling of 2026-11-01, #4498):
# `image` pushes only into a package the packages API shows public, `index` tags and signs only
# when that still holds and the registry serves both images to a puller who has not signed in,
# and `outside` then pulls and checks the image with no sign-in at all.
#
# Two ways in, and what each makes:
#
#   called by `operator.yml` -> the image of that commit: built, checked, pushed, tagged
#   on a push to `main`         `sha-<commit>` (and `main` when that moves it forward), signed,
#                               verified, and its digest recorded in the run's summary, its
#                               `operator-image` artifact and an `operator.yaml` that names it.
#                               `operator.yml` runs on a push to `main` that changes the operator,
#                               so every such change, and only that, makes an image; its checks
#                               and kind tests on that commit are what the call waits for.
#   a pull request           -> touching the operator or this image's own files only: the same
#                               build and check, for both architectures, pushed nowhere.
#
# Nothing else starts it: there is no `workflow_dispatch`, and a failed publish is re-run from
# the page of the `cluster operator` run that called it.
#
# **Each architecture is built on a runner of its own architecture** (`ubuntu-24.04` and
# `ubuntu-24.04-arm`), with no emulation, with the pinned toolchain, `cargo auditable` and the
# operator's `release` profile, and no cache. The compile runs in a job that holds no write
# permission; the image jobs hold `packages: write`, and only `index`, which signs, and `attest`,
# which attests, can mint an OIDC token. What the registry and the forge are asked before a push,
# a tag or a signature is `tools/image-registry.mjs`, the runner image's own, which fails closed.
#
# **Nothing is pushed, tagged or signed that was not checked** (#4512). `image` builds each
# architecture's image once, into a file, checks the image loaded from that file
# (`tools/operator-image-check.mjs`), and only then pushes the same file by its digest,
# untagged; an image that fails is never pushed. `index` runs only when both passed. `sbom` and
# `attest` give the image an SBOM of each architecture and build provenance (#4513), and `main`
# moves last, in `tag-main`, once `outside` has pulled and checked the index.

on:
  pull_request:
    paths:
      - operator/**
      - rust-toolchain.toml
      - .github/actions/rust-toolchain/**
      - tools/operator-image-*
      - tools/image-registry*
      - .github/workflows/operator-image.yml
  # Called by `operator.yml`'s run of a push to `main`, once its checks and kind tests passed
  # on that commit. A called workflow sees its caller's event, so here that is a `push` to
  # `main`, and `github.sha` is the commit pushed: the one this run builds and the one its
  # OIDC token, and so its build provenance, names. It used to be started by `cluster
  # operator`'s end instead, and such a run's `github.sha` is main's head when it starts, a
  # later commit whenever a merge landed meanwhile.
  workflow_call:

# One publish at a time, never cancelled once started, as `runner-image.yml`'s; a pull
# request's run is grouped by its ref apart from them, and superseded by its next push.
concurrency:
  group: operator-image-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Where the image lives: the name `operator/deploy/operator.yaml` gives it. The organisation's
  # own registry; the package is public (#4498).
  IMAGE: ghcr.io/${{ github.repository_owner }}/purlis-cluster-operator

jobs:
  plan:
    name: what this run makes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - id: plan
        env:
          # Only `operator.yml`'s run of a push to `main` calls this (it has no push of its own),
          # and only after that commit's checks and kind tests passed: the one way in that
          # publishes, and the commit it publishes is the run's own.
          EVENT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'called' || github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            called) publish=true; sha=$GITHUB_SHA ;;
            pull_request) publish=false; sha=$PR_SHA ;;
            *) publish=false; sha=$GITHUB_SHA ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Operator image of \`$sha\`: $([ "$publish" = true ] && echo 'built, checked, pushed and signed' || echo 'built and checked, pushed nowhere')." >> "$GITHUB_STEP_SUMMARY"

  binary:
    name: purlis-cluster-operator (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    # The commit checked out is `plan`'s: in main's context only the commit a green
    # `cluster operator` ran on after a push to this repository's `main`, and otherwise the
    # run's own branch. No job of this workflow restores or saves a cache.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # The version `release.yml` installs: the binary lists the crates it was built from, for
      # `cargo audit bin`.
      - name: cargo-auditable
        env:
          CARGO_AUDITABLE_VERSION: 0.7.6
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"
      - name: The operator's binary
        run: cargo auditable build --release --locked --manifest-path operator/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlis-cluster-operator-linux-${{ matrix.arch }}
          path: operator/target/release/purlis-cluster-operator
          if-no-files-found: error
          retention-days: 7

  image:
    name: image (${{ matrix.arch }})
    needs: [plan, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            syft_sha256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
          - arch: arm64
            runner: ubuntu-24.04-arm
            syft_sha256: c46d5e4c28e12aa4c5becfaa343ef1c7f89045b6b895f2c21d471c62db09c706
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
      SHA: ${{ needs.plan.outputs.sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The build context is this folder and the one file in it, so nothing else of the
      # checkout can reach the image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-cluster-operator-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/context
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once, into a file, on every run alike (#4512): the image the checks below run on is
      # loaded from this file, and a publishing run pushes this same file after they pass.
      - name: Build the operator's image into a file
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: operator/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.title=purlis cluster operator
            org.opencontainers.image.description=purlis in your cluster: turns Pools and Claims into runners
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=docker,name=purlis-cluster-operator:candidate,dest=${{ runner.temp }}/candidate.tar
      # The file's one manifest names the image by its digest; the image loaded has to be that
      # manifest's (its config's digest, or the manifest's own on a containerd image store).
      - name: Load the file, and name its digest
        id: candidate
        run: |
          set -euo pipefail
          digest=$(tar -xOf "$RUNNER_TEMP/candidate.tar" index.json \
            | jq -r '.manifests | if length == 1 then .[0].digest else error("the file holds \(length) manifests") end')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the file's manifest is '$digest'"; exit 1; }
          config=$(tar -xOf "$RUNNER_TEMP/candidate.tar" "blobs/sha256/${digest#sha256:}" | jq -r .config.digest)
          docker load --input "$RUNNER_TEMP/candidate.tar"
          id=$(docker image inspect --format '{{.Id}}' purlis-cluster-operator:candidate)
          if [ "$id" != "$digest" ] && [ "$id" != "$config" ]; then
            echo "::error::the image loaded is $id, not the file's $digest (config $config)"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: The operator's image is what the cluster runs, and its binary starts
        run: node tools/operator-image-check.mjs purlis-cluster-operator:candidate "$ARCH"
      # What `sbom` asks of the pushed images, asked of a run that pushes nothing, so a change
      # that loses them is seen on its pull request (#4513). syft is the version `sbom` pins, for
      # this architecture.
      - name: This architecture's SBOM names the operator's binary and its packages
        if: env.PUBLISH != 'true'
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: ${{ matrix.syft_sha256 }}
          REQUIRED_PURLS: pkg:cargo/purlis-cluster-operator@ pkg:deb/ pkg:deb/ubuntu/ca-certificates@
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_${ARCH}.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          purls=$("$RUNNER_TEMP/syft" scan docker:purlis-cluster-operator:candidate -o cyclonedx-json | jq -r '.components[]?.purl // empty')
          for want in $REQUIRED_PURLS; do
            grep -m1 "^$want" <<<"$purls" || { echo "::error::the SBOM has no $want component"; exit 1; }
          done

      - name: Sign in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # **No image is pushed into a package that is not public.** The packages API says so
      # immediately before the push (and the registry sign-in comes only now, after the checks, so
      # no write credential sits on the runner while the image under check runs), so a release
      # never names an image a newcomer cannot pull (#4498). A package that is not there is
      # refused too: a new one starts private, and someone has to choose to publish it. Anything
      # else stops the job here.
      - name: The package is public before the image is pushed
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/image-registry.mjs visibility
      # Pushed only now, after every check above passed, by digest only: an untagged image
      # nothing names until `index` does. skopeo sends the file as it is: it refuses a push to a
      # digest the manifest does not have, and `--preserve-digests` refuses to change one.
      - name: Push the checked file by its digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: skopeo copy --preserve-digests "oci-archive:$RUNNER_TEMP/candidate.tar" "docker://$IMAGE@$DIGEST"
      # What a run that publishes nothing can do of the push: the same copy of the same file,
      # into a folder, and the manifest copied is the digest's.
      - name: The checked file copies by its digest unchanged
        if: env.PUBLISH != 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          skopeo copy --preserve-digests "oci-archive:$RUNNER_TEMP/candidate.tar" "dir:$RUNNER_TEMP/copied"
          copied="sha256:$(sha256sum "$RUNNER_TEMP/copied/manifest.json" | cut -d' ' -f1)"
          if [ "$copied" != "$DIGEST" ]; then
            echo "::error::the copy's manifest is $copied, not $DIGEST"
            exit 1
          fi

      - name: Record this architecture's digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  # The multi-architecture image: both digests under one index, tagged, signed and recorded.
  index:
    name: index, sign and record
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `id-token` mints the OIDC token cosign signs with, through Sigstore's public-good
    # instance; nothing else in the workflow can mint one. `contents: read` is for the checkout
    # of the commit's own tools and manifests, and for comparing two commits of `main`.
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.line.outputs.image }}
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      SIGNER: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # By name, never by pattern: a pattern takes whatever any job of the run uploaded under
      # a name that matches.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests
      # Each is a digest and nothing else, before anything names an image by it.
      - name: Each architecture's digest is a sha256 digest
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            [[ "$(cat "$RUNNER_TEMP/digests/$arch")" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::digests/$arch holds no sha256 digest"; exit 1; }
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Before anything is tagged or signed, the packages API has to say `public` and the
      # registry has to serve both images to a puller who has not signed in. An answer that shows
      # neither stops the run (`tools/image-registry.mjs` fails closed).
      - name: The images are public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(node tools/image-registry.mjs visibility)
          if [ "$state" != public ]; then
            echo "::error::the package is $state, not public"
            exit 1
          fi
          node tools/image-registry.mjs anonymous \
            "$(cat "$RUNNER_TEMP/digests/amd64")" "$(cat "$RUNNER_TEMP/digests/arm64")"

      # Tagged `sha-<commit>` only: `main` moves last, in `tag-main`, once `outside` has pulled
      # and checked this index with no sign-in (#4512).
      - name: One index for both architectures, tagged sha-<commit>
        id: index
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:sha-$SHA" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/arm64")"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          platforms=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          if [ "$platforms" != "linux/amd64 linux/arm64" ]; then
            echo "::error::the index holds $platforms"
            exit 1
          fi
          # The index holds exactly the two images checked, whatever the tag was moved to.
          children=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].digest] | sort | join(" ")')
          checked=$(printf '%s\n' "$(cat "$RUNNER_TEMP/digests/amd64")" "$(cat "$RUNNER_TEMP/digests/arm64")" | sort | paste -sd' ' -)
          if [ "$children" != "$checked" ]; then
            echo "::error::the index holds $children, not the images checked, $checked"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless: the certificate names this workflow on `main` as the signer, and the
      # signature goes in Sigstore's public transparency log. `--recursive` signs each
      # architecture's image as well as the index.
      - name: Sign by digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: The image's line, for the check from outside
        id: line
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: The signature verifies as this workflow's on main
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$SIGNER/.github/workflows/operator-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null

      # The digest, and the install that names it (#2281): the plain manifests and the chart of
      # this commit, the manifest's image and the chart's default set to this index by digest
      # (`tools/operator-install.mjs`, which `operator/e2e/kind.sh` installs from too), as
      # docs/cluster-operator.md installs them.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/record"
          echo "$IMAGE@$DIGEST" > "$RUNNER_TEMP/record/operator-image.txt"
          node tools/operator-install.mjs "$RUNNER_TEMP/record/install" "$IMAGE@$DIGEST"
          grep -qxF "          image: $IMAGE@$DIGEST" "$RUNNER_TEMP/record/install/operator.yaml"
          {
            echo "### Operator image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Commit \`$SHA\`, tagged \`sha-$SHA\`, linux/amd64 and linux/arm64, signed and verified."
            echo "The run's \`operator-image\` artifact holds the install naming it: \`install/\`, the plain manifests and the chart."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-image
          path: |
            ${{ runner.temp }}/record/operator-image.txt
            ${{ runner.temp }}/record/install/
          if-no-files-found: error
          retention-days: 90

  # **An SBOM of each architecture's image, read from the pushed bytes** (#4513), as the runner
  # image's `sbom` reads it (#2191): the image's packages, and the crates the operator's binary
  # was built from, which `cargo auditable` embeds in it. syft is the
  # version `release.yml` pins, checked against the same sha256 before it is unpacked, and it
  # runs in a job that can read the package and write nothing: no OIDC token, no
  # attestation, no secret but the run's own token for the pull. It reads the images `image`
  # pushed by digest, beside `index`. The SBOMs are handed to `attest` under one exact name.
  sbom:
    name: SBOM of each architecture's image
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests
      # Each is a digest and nothing else, before anything names an image by it.
      - name: Each architecture's digest is a sha256 digest
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            [[ "$(cat "$RUNNER_TEMP/digests/$arch")" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::digests/$arch holds no sha256 digest"; exit 1; }
          done
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same two lines as `release.yml`'s `sbom` and the runner image's: a new syft moves
      # all three.
      - name: syft, at one version and checksum, reads each architecture's image
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" version
          mkdir -p out
          "$RUNNER_TEMP/syft" scan "registry:$IMAGE@$(cat "$RUNNER_TEMP/digests/amd64")" -o "cyclonedx-json=out/purlis-cluster-operator-amd64.cdx.json"
          "$RUNNER_TEMP/syft" scan "registry:$IMAGE@$(cat "$RUNNER_TEMP/digests/arm64")" -o "cyclonedx-json=out/purlis-cluster-operator-arm64.cdx.json"
      # An SBOM that lists nothing looks like one that lists everything until someone reads it:
      # each has to name the binary's own crate, which it does only when the binary was built
      # with cargo auditable, and the base image's packages, the certificates among them.
      - name: Each SBOM names the operator's binary and the image's packages
        env:
          REQUIRED_PURLS: pkg:cargo/purlis-cluster-operator@ pkg:deb/ pkg:deb/ubuntu/ca-certificates@
        run: |
          set -euo pipefail
          for sbom in out/*.cdx.json; do
            purls=$(jq -r '.components[]?.purl // empty' "$sbom")
            for want in $REQUIRED_PURLS; do
              grep -q "^$want" <<<"$purls" \
                || { echo "::error::$sbom has no $want component"; exit 1; }
            done
            echo "$sbom: $(grep -c '^pkg:cargo/' <<<"$purls") crates, $(grep -c '^pkg:deb/' <<<"$purls") packages"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-image-sbom
          path: out/
          if-no-files-found: error
          retention-days: 90

  # **Build provenance and the SBOMs, attached to the image and verified here** (#4513), as the
  # runner image's `attest` does (#2191). SLSA provenance on the index the run records, and each
  # architecture's SBOM on that architecture's image, each stored by GitHub and pushed to the
  # registry beside the image (`push-to-registry`), into the same package. Then each is checked as
  # a person would check it: signed by this workflow, for the run's commit, on a GitHub-hosted
  # runner. An attestation that does not verify fails the run, so `main` is not moved to the
  # image. The one job of the workflow that may store an attestation; it builds and runs nothing
  # of the commit's.
  attest:
    name: provenance and SBOM, attested and verified
    needs: [plan, index, sbom]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      # The commit `plan` chose and the image was built from: the run's own, as the provenance
      # says, since the push this run belongs to started it.
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests
      # Each is a digest and nothing else, before anything names an image by it.
      - name: Each architecture's digest is a sha256 digest
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            [[ "$(cat "$RUNNER_TEMP/digests/$arch")" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::digests/$arch holds no sha256 digest"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operator-image-sbom
          path: ${{ runner.temp }}/sbom
      - name: The digests attested
        id: digests
        env:
          LINE: ${{ needs.index.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$LINE" =~ ^"$IMAGE"@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::index handed back '$LINE'"; exit 1; }
          {
            echo "index=${LINE#*@}"
            echo "amd64=$(cat "$RUNNER_TEMP/digests/amd64")"
            echo "arm64=$(cat "$RUNNER_TEMP/digests/arm64")"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.index }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ runner.temp }}/sbom/purlis-cluster-operator-amd64.cdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ runner.temp }}/sbom/purlis-cluster-operator-arm64.cdx.json
          push-to-registry: true
      # What a person checking the image runs (docs/cluster-operator.md), run here first and pinned
      # to this workflow, the commit it built and a GitHub-hosted runner.
      - name: The provenance and each SBOM verify against this run
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX: ${{ steps.digests.outputs.index }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          pinned=(--repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/operator-image.yml"
            --signer-digest "$GITHUB_WORKFLOW_SHA"
            --source-digest "$SHA"
            --deny-self-hosted-runners)
          gh attestation verify "oci://$IMAGE@$INDEX" "${pinned[@]}"
          for digest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://$IMAGE@$digest" "${pinned[@]}" --predicate-type https://cyclonedx.org/bom
          done
          {
            echo "### Operator image attestations"
            echo
            echo "Build provenance on \`$IMAGE@$INDEX\`; an SBOM on each architecture's image. Verified."
          } >> "$GITHUB_STEP_SUMMARY"

  # **What someone outside does, done here** (#4498): no registry login and no permission on the
  # package. The image is pulled, its signature checked, and its provenance checked (#4513), by
  # the commands docs/cluster-operator.md gives, the SBOMs apart. Only the attestation step holds
  # a token, for the forge's attestation API, and it has no permission on the package.
  outside:
    name: pulled and checked with no sign-in
    needs: [plan, index, attest]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The index is read with no sign-in and each architecture's own image is pulled by its digest
      # in it: one daemon refuses a second pull of the index for another platform (#4784).
      - name: Both architectures pull and the signature verifies, with no token
        env:
          LINE: ${{ needs.index.outputs.image }}
        run: |
          set -euo pipefail
          index=$(docker buildx imagetools inspect "$LINE" --format '{{json .Manifest}}')
          for platform in linux/amd64 linux/arm64; do
            digest=$(jq -r --arg platform "$platform" \
              '[.manifests[] | select("\(.platform.os)/\(.platform.architecture)" == $platform) | .digest]
                | if length == 1 then .[0] else error("the index holds \(length) images for \($platform)") end' \
              <<< "$index")
            docker pull --platform "$platform" "${LINE%@*}@$digest"
          done
          cosign verify "$LINE" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/operator-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
      - name: The provenance verifies, for this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ needs.index.outputs.image }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$LINE" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/operator-image.yml@refs/heads/main" \
            --deny-self-hosted-runners

  # **`main`, moved last** (#4512): only once `outside` has pulled the index and checked it as
  # someone outside would, so `:main` only ever names an image that passed. `main` only moves
  # forward, as the runner image's does: the image of an older commit can finish last. It is still
  # tagged `sha-<commit>` and signed; `main` stays on the later one. The tag is put on the index
  # `index` handed on, by its digest, and read back: it has to name that digest.
  tag-main:
    name: main, moved last
    needs: [plan, index, outside]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `contents: read` is for the checkout of the commit's own tools and for comparing two
    # commits of `main`; `packages: write` moves the tag. It signs nothing.
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: main moves to the checked index, when that moves it forward
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ needs.index.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$LINE" =~ ^"$IMAGE"@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::index handed back '$LINE'"; exit 1; }
          order=$(node tools/image-registry.mjs order "$SHA")
          echo "$order"
          case "$order" in
            main:*) ;;
            sha-only:*) echo "::notice::main is not moved: ${order#sha-only: }"; exit 0 ;;
            *) echo "::error::tools/image-registry.mjs answered neither main nor sha-only: $order"; exit 1 ;;
          esac
          docker buildx imagetools create --tag "$IMAGE:main" "$LINE"
          tagged=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$tagged" != "${LINE#*@}" ]; then
            echo "::error::main names $tagged, not ${LINE#*@}"
            exit 1
          fi
          echo "\`main\` names \`$LINE\`." >> "$GITHUB_STEP_SUMMARY"
