# Throwaway (#5675): runs ci.yml's macOS "Claude Code's own sandbox on the settings purlis
# writes" step on a push of this task branch, since ci.yml runs it only in the merge queue.
# Removed before the fix goes onto the pull request's branch.
name: tmp-5675-macos-probe

on:
  push:
    branches: [5675-fails-on-macos-claude-code-s-tmpdir-g6gk19cw]

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The temporary folder's unit tests
        run: cargo test --locked -p purlis-core --lib -- temporary_folder
      - name: Claude Code's own sandbox on the settings purlis writes
        run: |
          version=$(sed 's/ .*//' tests/fixtures/harness-versions/claude.txt)
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64 ;;
            X64) arch=x64 ;;
            *) echo "::error::no Claude Code build for $RUNNER_ARCH"; exit 1 ;;
          esac
          package="@anthropic-ai/claude-code-darwin-$arch"
          mkdir -p "$RUNNER_TEMP/claude-code"
          cp tests/fixtures/harness-versions/claude-code/package.json tests/fixtures/harness-versions/claude-code/package-lock.json "$RUNNER_TEMP/claude-code/"
          (cd "$RUNNER_TEMP/claude-code" && npm ci --ignore-scripts --no-audit --no-fund)
          PURLIS_CLAUDE_CODE="$RUNNER_TEMP/claude-code/node_modules/$package/claude" \
            cargo test --locked -p purlis-core --test it -- claude_codes_own_sandbox_holds_the_settings_purlis_writes:: --nocapture
