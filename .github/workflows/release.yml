name: release

# What the runs list shows for a run. For a run `ci` started it names the commit that `ci` ran
# on, which is the commit this run builds. Without it the list shows only `main`'s head at the
# moment `ci` ended, a later commit this run never touches: on 2026-10-13 run 661 read as a
# build of dd46646c, whose `ci` was red, while it built 8781c167, whose `ci` was green.
run-name: ${{ github.event_name == 'workflow_run' && format('ci {0} ({1}) of {2}', github.event.workflow_run.conclusion, github.event.workflow_run.event, github.event.workflow_run.head_sha) || github.event_name == 'schedule' && 'profile guard' || github.event_name == 'push' && format('stable {0}', github.ref_name) || format('on demand, {0}', github.ref_name) }}

# The build a person installs, and the two update channels the installed app reads.
#
# `ci.yml`'s `app` job proves the app COMPILES on both platforms; it builds `--debug
# --no-bundle`, so it produces nothing anyone can run. This workflow is the only place that
# uses the release profiles, the only place Tauri's bundler runs, and the only place anything is
# signed or published (ADR 0042).
#
# Four ways in, and what each one makes:
#
#   a `v*` tag             -> the STABLE channel: a GitHub Release for that tag, `latest.json`
#                             beside its bundles. Only the operator pushes a `v*` tag.
#   `ci` green on `main`   -> the DEV channel: the bundles and `dev.json` replace the assets of
#                             the one prerelease named `dev`. One at a time, never cancelled
#                             once started, and never an older commit over a newer one
#                             (`concurrency` and `plan`).
#   `workflow_dispatch`    -> a build of any branch, uploaded as run artifacts and published
#                             NOWHERE. The operator asking for something to try. It runs
#                             outside the `release` environment, so it holds no signing key
#                             and its bundles are unsigned for the updater.
#   the nightly schedule   -> the PROFILE GUARD: `main`, built the way a stable build is, on
#                             that same keyless path. Published nowhere. A red night keeps one
#                             issue open (see the `profile-guard` job).
#
# **The two channels differ in optimisation profile and bundle set, and in nothing else**
# (ADR 0092). A stable build uses Cargo's `release` profile and makes every bundle. A dev
# channel build uses `dev-release` (the same profile with thin LTO over sixteen codegen units)
# and makes no `.dmg`, which takes its macOS job from about 34 minutes to about 17. Signing,
# the no-cache rule and one runner per platform are the same on both. `plan` decides all of it
# once, in its `profile`, `dmg` and `appimage_required` outputs.
#
# **Nothing here creates, moves or deletes a tag.** The stable release is created with
# `--verify-tag`, which refuses unless the tag the operator pushed is already on the remote;
# the dev release is found by name and only has its assets replaced, and if it does not exist
# the run stops and prints the one command that creates it. That is the standing rule — the
# release is prepared unasked and tagged only on the operator's word — kept by construction.
#
# **Two signatures, and they do different jobs.**
#   minisign (TAURI_SIGNING_PRIVATE_KEY) — mandatory, free, and the thing the updater checks
#     before it installs anything. No key, no publish: the `plan` job refuses first, and
#     `release-manifest` refuses again over the actual bytes against the key the app ships.
#   Developer ID (APPLE_CERTIFICATE…) — what macOS checks. **Optional** (ADR 0042, amended
#     2026-09-23), because it costs an Apple Developer account and the updater's trust does not
#     come from it. When the three secrets are set the bundle is Developer ID signed; when they
#     are not it is **ad-hoc** signed. Either way the signature is verified on the built bundle
#     rather than assumed from a secret being set, and the check asserts the signing that was
#     ASKED for — an ad-hoc bundle must not slip through a Developer ID check, or the reverse.
#
# **macOS signing is never skipped, only downgraded.** On Apple Silicon a Mach-O with no
# signature at all does not execute, so "unsigned" is not one of the options. Leaving
# APPLE_SIGNING_IDENTITY unset does not produce an unsigned app either — it produces a bundle
# whose executables carry the linker's own ad-hoc signature while the BUNDLE has no seal, which
# `codesign --verify` rejects and which is the worst of both. So this workflow always names an
# identity: a Developer ID one when it has it, `-` (ad-hoc) when it does not.
#
# **Apple notarization is declined** (ADR 0042), so no APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
# / APPLE_API_* is passed anywhere, and a first install from a browser meets Gatekeeper. The
# job summary says what that looks like and what to do about it.
#
# **Every published file also carries SLSA build provenance** (#583), the update manifests
# included (#778), attested by the `provenance` job before `publish` runs, and the attestation's
# bundle is published beside them as `purlis.intoto.jsonl` (#1133). See that job.

on:
  workflow_dispatch:
    inputs:
      # A build started by hand is a stable-profile build unless it asks otherwise. The other
      # choice is how to time the dev channel's profile, or try a branch sooner, without
      # publishing anything.
      profile:
        description: "Cargo profile: release (what a stable build uses) or dev-release (what a dev channel build uses)"
        type: choice
        options: [release, dev-release]
        default: release
  push:
    tags: ["v*"]
  # The profile guard. Since the dev channel stopped using `release`, nothing built the stable
  # profile between one tag and the next; this does, every night, so a break in it is found
  # on a night and not on the operator's tag. After the nightly `ci` (02:41) and clear of the
  # other nightlies.
  schedule:
    - cron: "53 4 * * *"
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  # **One dev publish at a time, and none is ever cancelled once it has started**: a cancelled
  # publish can leave the dev release holding half of one build's assets. A dev build takes
  # about half an hour and `main` takes a merge more often than that, so a build is usually
  # running when the next commit's `ci` goes green. That next run WAITS: `cancel-in-progress`
  # is false, so a merge never costs the build in progress.
  #
  # **Among the runs that wait, the latest wins.** A group holds one running run and one
  # pending run. A run that arrives while another is pending takes its place, and GitHub
  # cancels the one that was waiting, which had not started a job. That is wanted here: only
  # runs that will publish wait in this group, the dev channel serves one build, and a build
  # nobody would be offered is not worth half an hour of two runners.
  #
  # **So a run that publishes nothing never enters this group.** The group is taken when the
  # run is created, before any job's `if:` is read, and `workflow_run` fires for every `ci`
  # that ends on `main`: red ones, cancelled ones, the nightly one. Each of those is a run that
  # only skips (`plan`'s `if:`), and while it shared the group it took the pending place from a
  # build that would have published and then skipped. On 2026-10-13 that lost the dev builds of
  # 51bf31b6 and 672fa978 (runs 651 and 655, cancelled while pending by runs 652 and 656, which
  # a failed and a cancelled `ci` had started). Such a run now gets a group of its own, named
  # for its run id, where it displaces nothing. The four tests here are `plan`'s `if:`,
  # negated; `tools/release-workflow.test.mjs` holds the two together.
  #
  # The profile guard has a group of its own for the same reason. A tag and a build started by
  # hand are grouped by their ref.
  group: release-${{ github.event_name == 'schedule' && 'profile-guard' || github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push' || github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.head_repository.full_name != github.repository) && format('nothing-{0}', github.run_id) || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT `RUSTFLAGS: -D warnings`, which ci.yml sets. Warnings are gated on every
  # PR; a new warning out of a dependency must not be the thing that stops a release.

jobs:
  plan:
    name: what this run makes
    runs-on: ubuntu-24.04
    # **Every job has a deadline.** A job with none may run for six hours, and a hung one
    # would hold the dev builds' group, and every build waiting behind it, for all of them.
    # Each is several times what the job takes: `plan` seconds (minutes for a tag, which
    # compiles the changelog tool), a dev `build` about 20 minutes and a stable one about 35,
    # `manifest` 5, `sbom`, `provenance` and `publish` under 2 (2026-10-13). A whole dev run is
    # about half an hour. `tools/release-workflow.test.mjs` holds every job to having one.
    timeout-minutes: 15
    # `workflow_run` fires for every `ci` completion, red ones included, and for a `ci` run
    # started by ANY event whose branch is called `main` — including a pull request from a
    # fork whose branch happens to be named `main`. Only a green `ci` on a PUSH to THIS
    # repository's `main` may produce a signed dev build; anything else would sign a
    # stranger's code with the operator's key. `workflow_run.head_sha`, the commit that green
    # `ci` ran on, is the only commit such a run ever checks out and builds (`SHA` below).
    # The branch is the trigger's own filter, said again here so that this `if:` is the whole
    # rule by itself. The workflow's `concurrency.group` repeats these four tests, negated, so a run this
    # `if:` skips waits behind no build and displaces none.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    # **The signing secrets live in the `release` environment, not the repository** (#344).
    # Its deployment policy admits `main` (a `workflow_run` job runs on the default branch)
    # and `v*` tags, so a job on any other ref gets no secret at all. `plan` only asks whether
    # they are SET, but it has to ask inside the environment to get a true answer. An
    # on-demand `workflow_dispatch` build publishes nowhere, so it takes no environment and no
    # key, whatever branch it builds, and comes out unsigned (see `This build's config`). So
    # does the nightly profile guard. The two events that publish are NAMED, so an event added
    # to `on:` later holds no key until this line says it does.
    # `x && 'release' || ''` and never `x && '' || 'release'`: an empty string is falsy, so
    # the second form is `release` every time.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_run') && 'release' || '' }}
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      signed: ${{ steps.plan.outputs.signed }}
      skip: ${{ steps.plan.outputs.skip }}
      macos_signing: ${{ steps.plan.outputs.macos_signing }}
      profile: ${{ steps.plan.outputs.profile }}
      dmg: ${{ steps.plan.outputs.dmg }}
      appimage_required: ${{ steps.plan.outputs.appimage_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # **The workflow this run executes, beside the source it builds.** A `workflow_run` runs
      # `release.yml` as it is on `main` NOW (`github.workflow_sha`), but builds the commit
      # whose `ci` went green (`workflow_run.head_sha`). When a merge lands while the previous
      # commit's `ci` is still running, that `ci`'s release builds the OLD source under the NEW
      # workflow, and a check the merge added for something the merge also added fails on a
      # build that never had it: the third-party notices' check (#1784) failed its first dev
      # run that way, grepping for a file the source it built did not generate. So `plan`
      # compares the two, and a run whose source carries a different `release.yml` builds
      # nothing (below). Only this one file, sparsely: everything else comes from the source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.workflow_sha }}
          path: running
          sparse-checkout: .github/workflows/release.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Channel, version, and whether anything is published
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ASKED_PROFILE: ${{ inputs.profile }}
          # For `tools/dev-build-order.mjs`, which reads the dev release and compares two
          # commits. The workflow's `contents: read`, and nothing more.
          GH_TOKEN: ${{ github.token }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # Passed as three booleans and counted in the shell below, rather than and-ed here,
          # so a HALF-configured certificate is a case of its own instead of reading the same
          # as no certificate at all. (Counting them in a `${{ }}` expression is possible but
          # has to fit on one line: a folded YAML scalar keeps the newlines of its
          # more-indented lines, and they end up inside the expression.)
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          # **Hardening: a second gate, independent of the `if:` above, before anything from
          # the checkout runs.** A dev build's commit has to be in `main`'s history NOW, by the
          # forge's own comparison: `ahead` or `identical` is `main` standing at or after it.
          # The `if:` reads what the event says about the `ci` run; this reads the repository.
          # So an edit that loosens one of them still leaves the other, and a commit that is
          # not on this repository's `main` is never built with the release environment's key.
          if [ "$EVENT" = workflow_run ]; then
            on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)
            case "$on_main" in
              ahead | identical) echo "$SHA is in main's history" ;;
              *) echo "::error::$SHA is not in main's history (main is '$on_main' of it), so it is not built"; exit 1 ;;
            esac
          fi
          # The one version every crate shares, and the one `tauri.conf.json` carries (a test
          # in app/src-tauri holds the two together).
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$base" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          case "$EVENT" in
            push)
              tag="$GITHUB_REF_NAME"
              version="${tag#v}"
              # The manifest announces this number and the app compares its own against it,
              # so a tag that is not the version the code says it is would publish a release
              # that no installed app can place. Bump Cargo.toml, merge, THEN tag.
              if [ "$version" != "$base" ]; then
                echo "::error::the tag $tag says $version and Cargo.toml says $base — bump the workspace version, merge it, then tag"
                exit 1
              fi
              channel=stable; publish=true
              # The stable build: Cargo's `release` profile and every bundle (ADR 0092).
              profile=release; dmg=true; appimage_required=true ;;
            workflow_run)
              # `main` holds the version that will be released NEXT (bumped right after each
              # release), so a dev build is a prerelease OF it: newer than every stable
              # release before it, older than the stable release it becomes. The run number
              # only ever grows, so each dev build is newer than the last.
              tag=""; version="$base-dev.$GITHUB_RUN_NUMBER"
              channel=dev; publish=true
              # The dev channel build: the lighter profile, and no `.dmg` (ADR 0092). The
              # updater never reads a `.dmg`, and the `.app.zip` beside it is the same app.
              profile=dev-release; dmg=false; appimage_required=true ;;
            schedule)
              # The profile guard: `main`, built the way a stable build is, and published
              # nowhere. The AppImage is required as it is for a stable publish, so the night
              # its bundler breaks is a red night.
              tag=""; version="$base-dev.$GITHUB_RUN_NUMBER"
              channel=dev; publish=false
              profile=release; dmg=true; appimage_required=true ;;
            *)
              tag=""; version="$base-dev.$GITHUB_RUN_NUMBER"
              channel=dev; publish=false
              # A build started by hand: the profile it asked for, every bundle, and an extra
              # bundle that fails costs it nothing but that bundle.
              profile="${ASKED_PROFILE:-release}"; dmg=true; appimage_required=false
              case "$profile" in
                release | dev-release) ;;
                *) echo "::error::'$profile' is not a profile this workflow builds: release or dev-release"; exit 1 ;;
              esac ;;
          esac
          skip=false
          # Before the operator has generated the updater key, every merge to `main` would
          # otherwise start a twenty-minute build that fails red at the end. The automatic
          # trigger builds NOTHING instead and says why, once per merge, as a warning. This
          # skips a publish; it does not weaken one — nothing unsigned is built or published.
          # A `v*` tag is different: it is the operator's deliberate act, and a tag that
          # quietly did nothing would be worse than a red run, so it still fails below.
          if [ "$EVENT" = workflow_run ] && [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY in the release environment, so this green main is not published to the dev channel. docs/updating.md, steps 0 and 1, is the setup."
            skip=true; publish=false
          fi
          # A green `ci` of a commit `main` has moved past, whose `release.yml` is not the one
          # running (see the checkout above): its checks are not the ones its source was
          # written for, so it builds nothing and says why. Nothing is lost: the newer commit's
          # own `ci` starts the release that builds it, under its own workflow. The same file
          # on both sides builds as before, so a merge that leaves `release.yml` alone never
          # skips a dev build.
          if [ "$EVENT" = workflow_run ] && ! cmp -s running/.github/workflows/release.yml .github/workflows/release.yml; then
            echo "::notice::$SHA carries a different release.yml from the one this run executes (main at $GITHUB_WORKFLOW_SHA), so it is not built: the release that main's newer commit's own ci starts builds that commit instead."
            skip=true; publish=false
          fi
          # **The dev channel only moves forward.** Runs start in the order their `ci` runs
          # ENDED, which is not the order of the commits: a `ci` started again ends after its
          # successors'. Run 654 published 4c7854ee that way on 2026-10-13, over e827217c,
          # nine commits newer, and under the higher number, so every machine on the channel
          # took it. So a build publishes only when its commit comes after the one `dev.json`
          # names and its version is newer; otherwise it builds nothing and says why. This run
          # holds the group, so nothing else is publishing while it asks. The tool exits 1
          # when it could not find out, and `set -e` stops the run there.
          if [ "$EVENT" = workflow_run ] && [ "$skip" != "true" ]; then
            order=$(node tools/dev-build-order.mjs --version "$version" --sha "$SHA")
            case "$order" in
              publish:*) echo "$order" ;;
              skip:*)
                echo "::notice::not built, and nothing is published: ${order#skip: }"
                skip=true; publish=false ;;
              *) echo "::error::tools/dev-build-order.mjs answered neither publish nor skip: $order"; exit 1 ;;
            esac
          fi
          # Which macOS signing this run does, decided ONCE and carried to the build and to the
          # check that verifies it. Developer ID needs all three secrets; with none of them the
          # build is ad-hoc signed, which is a weaker Gatekeeper story and not a weaker updater
          # (ADR 0042 §3). A partial group is neither, and is handled as an error below.
          apple_parts=0
          for present in "$HAS_CERT" "$HAS_CERT_PASSWORD" "$HAS_IDENTITY"; do
            if [ "$present" = "true" ]; then apple_parts=$((apple_parts + 1)); fi
          done
          case "$apple_parts" in
            3) macos_signing=developer-id ;;
            0) macos_signing=ad-hoc ;;
            *) macos_signing=partial ;;
          esac
          {
            echo "channel=$channel"; echo "publish=$publish"; echo "version=$version"
            echo "sha=$SHA"; echo "tag=$tag"; echo "signed=$HAS_UPDATER_KEY"; echo "skip=$skip"
            echo "macos_signing=$macos_signing"
            echo "profile=$profile"; echo "dmg=$dmg"; echo "appimage_required=$appimage_required"
          } >> "$GITHUB_OUTPUT"
          echo "channel=$channel publish=$publish version=$version sha=$SHA updater-key=$HAS_UPDATER_KEY macos-signing=$macos_signing profile=$profile dmg=$dmg appimage-required=$appimage_required"

      # A stable release says what it brought, and says it from CHANGELOG.md: the section is
      # the GitHub release's body and `latest.json`'s notes, and About purlis in the build
      # shows the same section out of the copy compiled into it. So a tag whose version has no
      # `## [X.Y.Z]` section, or an empty one, is refused here, beside the check that the tag
      # agrees with Cargo.toml and before anything is built. The `changelog` crate is the one
      # the app reads the file with, so this refusal and the dialog cannot disagree.
      - uses: ./.github/actions/rust-toolchain
        if: steps.plan.outputs.channel == 'stable'
      - name: A stable tag has its section in CHANGELOG.md
        if: steps.plan.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          if ! notes=$(cargo run --locked --quiet -p changelog -- "$VERSION" CHANGELOG.md 2>&1); then
            echo "::error::$notes"
            exit 1
          fi
          { echo "### What $VERSION brought"; echo; echo "$notes"; } >> "$GITHUB_STEP_SUMMARY"
      # Release prep folds `changes/` into CHANGELOG.md (`docs/updating.md`). A fragment still
      # there would be missing from the release notes and from About in the build, so it is
      # refused here too. The runner image's own Node runs it: the script needs nothing else.
      - name: A stable tag has no changelog fragment left to fold
        if: steps.plan.outputs.channel == 'stable'
        run: node tools/changelog-fold.mjs --check
      # Release prep also gives the component parts manifest its one version for this release
      # (`node tools/theme-parts-release.mjs`, ADR 0103 amended 2026-10-25). A `since: NEXT` still
      # there is an addition no version names, so a stable tag is refused on it too.
      - name: A stable tag has no unreleased theme part left
        if: steps.plan.outputs.channel == 'stable'
        run: node tools/theme-parts-release.mjs --check

      # Everything a publish needs that a human has to provide, checked BEFORE twenty minutes
      # of building, each failure naming the one thing to do. See docs/updating.md.
      - name: A publish has everything the operator must provide
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          MACOS_SIGNING: ${{ steps.plan.outputs.macos_signing }}
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Without it the bundler signs nothing, in silence, and no app could verify this release. It has to be a secret of the release environment, not of the repository. See docs/updating.md, steps 0 and 1."
            fail=1
          fi
          pubkey=$(jq -r '.plugins.updater.pubkey' app/src-tauri/tauri.conf.json)
          if [ "$pubkey" = "UNSET-THE-OPERATOR-GENERATES-THIS-SEE-docs-updating.md" ] || [ -z "$pubkey" ]; then
            echo "::error::tauri.conf.json still carries the placeholder updater public key. An app built from it refuses every update. See docs/updating.md, step 2."
            fail=1
          fi
          # Developer ID is OPTIONAL (ADR 0042, amended 2026-09-23). What is NOT optional is
          # knowing which signing this run does, so it is said once, here, before the build.
          case "$MACOS_SIGNING" in
            developer-id)
              echo "::notice::macOS: Developer ID signed. Not notarized (ADR 0042), so a browser-downloaded first install still meets Gatekeeper once."
              ;;
            ad-hoc)
              echo "::notice::macOS: ad-hoc signed — no Apple Developer account is configured, which is a supported way to publish (ADR 0042). The updater is unaffected: its trust is the minisign key, not Apple's. The cost is a rougher first install; see docs/updating.md, step 3."
              ;;
            *)
              # Half a certificate is the one case that silently builds something nobody asked
              # for: with APPLE_CERTIFICATE set but no password the bundler cannot import it,
              # and with an identity set but no certificate it signs with whatever that name
              # happens to match on the runner. Refuse and name what is missing.
              echo "::error::the Developer ID secrets are half set — APPLE_CERTIFICATE=$HAS_CERT, APPLE_CERTIFICATE_PASSWORD=$HAS_CERT_PASSWORD, APPLE_SIGNING_IDENTITY=$HAS_IDENTITY. Set all three to sign with a Developer ID, or none to ad-hoc sign. See docs/updating.md, step 3."
              fail=1
              ;;
          esac
          if [ "$CHANNEL" = "dev" ]; then
            # The dev channel's address is a prerelease named `dev`. It is created ONCE, by the
            # operator, because nothing in CI creates a tag.
            if ! pre=$(gh release view dev --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
              echo "::error::there is no release named 'dev', so the dev channel has nowhere to publish. The operator creates it once — see docs/updating.md, step 4."
              fail=1
            elif [ "$pre" != "true" ]; then
              echo "::error::the release named 'dev' is not a prerelease, so GitHub's 'latest' pointer could resolve to it and stable machines would take dev builds. Mark it a prerelease: gh release edit dev --prerelease"
              fail=1
            fi
          fi
          exit $fail

  build:
    # The platform and the bundles this run makes of it: a dev channel build makes no `.dmg`
    # (`plan`'s `dmg`), so its job does not say it does (#1433).
    name: ${{ format('{0} ({1}{2})', matrix.platform, matrix.made, (matrix.extra_bundles != 'dmg' || needs.plan.outputs.dmg == 'true') && matrix.extra_made || '') }}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # The job that reads the signing keys, so it runs in the `release` environment whenever
    # it builds something that is published — and only then (see `plan`).
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    strategy:
      # Neither platform's bundle is worth losing because the other one broke.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            made: .app
            extra_made: ", .dmg"
            # `app` is the bundle itself and always has to work; the updater's `.app.tar.gz`
            # is made from it. `dmg` is a nicety whose bundler drives Finder through
            # AppleScript on a machine with nobody logged in, so it is allowed to fail. A dev
            # channel build does not make it at all (`plan`'s `dmg`, ADR 0092).
            bundles: app
            extra_bundles: dmg
            extra_required: false
          - os: ubuntu-24.04
            platform: Linux
            made: .deb
            extra_made: ", AppImage"
            # `deb` is plain `ar` + `tar` and is reliable. `appimage` downloads linuxdeploy at
            # build time, so it is the one that breaks when something upstream moves — but it
            # is also the only Linux bundle the updater can replace, so a publish needs it, and
            # then one `tauri build` makes both (`plan`'s `appimage_required`).
            bundles: deb
            extra_bundles: appimage
            extra_required: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      # Every binary says the version the app announces (#2749): `purlis --version` of a dev
      # build is `<version>-dev.<run>`, as its runner image's is (`runner-image.yml`), so a
      # pool's runner is held to the desktop's own version.
      PURLIS_VERSION_STAMP: ${{ needs.plan.outputs.version }}
      # The Cargo profile every binary of this build is compiled with, and so the directory
      # under `target/` they and the bundles land in: `release` for a stable build, `dev-release`
      # for a dev channel build (ADR 0092).
      PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # Bounded and tried twice, as in `ci.yml`, but from the mirror every time: this job holds
      # the signing keys and restores no cache, so it runs the script itself, without `--cache`
      # and without `.github/actions/linux-packages` (#1477).
      - name: Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 9
        run: tools/linux-packages.sh install --tauri

      - uses: ./.github/actions/rust-toolchain
      # **No cache, restored or saved.** This job holds the signing keys, so it builds from its
      # own checkout and the lockfiles alone: a cache is whatever the last job to save it left,
      # and another workflow's job is not this one. It is a cold build, slower by design.
      # `package-manager-cache: false` because setup-node caches on its own when package.json
      # names npm, and leaving out `cache:` does not stop that. A test in
      # `crates/release-manifest` holds every job here that has a secret or publishes to this.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci
        working-directory: app

      # A dev build is a prerelease of the next version, and About shows `## [Unreleased]` for
      # it (`about.rs`). What has merged since the last release is in `changes/` until release
      # prep folds it, so the build folds it into its own copy of CHANGELOG.md before anything
      # compiles that copy in. Nothing is committed. A stable tag has none left (`plan`).
      - name: Unreleased changelog fragments, into this build's CHANGELOG.md
        if: needs.plan.outputs.channel != 'stable'
        run: node tools/changelog-fold.mjs

      - name: What this build is called
        id: names
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          case "$triple" in
            aarch64-apple-darwin) slug=macos-arm64; updater=darwin-aarch64 ;;
            x86_64-unknown-linux-gnu) slug=linux-x86_64; updater=linux-x86_64-appimage ;;
            *) echo "::error::$triple has no updater target in purlis_core::updates::TARGETS"; exit 1 ;;
          esac
          {
            echo "triple=$triple"
            echo "slug=$slug"
            echo "updater=$updater"
            echo "artifact=purlis-$slug-${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # The `purlis` binary hooks run, built with the same profile and shipped INSIDE the
      # bundle. The app looks for it beside its own executable and deliberately ignores PATH
      # (`charter_binary()` in app/src-tauri/src/lib.rs): the command on PATH may be an older
      # install or the Python one, and a hook pointed at either answers a different program's
      # idea of these events. An app launched from Finder has no shell PATH to read anyway.
      #
      # And purlis's built-in extensions (charter-app#339), built with the same profile and
      # put in the bundle's resources, where the app looks for them and nowhere else
      # (`find_built_in` in app/src-tauri/src/extensions.rs). `assemble` is the program copying
      # itself beside its manifest, the same directory an operator used to add by hand.
      #
      # Every Rust binary this job links is built with `cargo auditable` (#584): the same
      # compile, plus a section in the binary listing the crates it was built from. That is what
      # the `sbom` job reads back out of the bundle, and what `cargo audit bin` checks against
      # the advisory database on anyone's machine. It changes no name, no profile and no
      # signing step: codesign and the minisign signature both run after linking, over the
      # binary as it now is.
      #
      # **The first third-party compiled tool in the job that holds the signing keys.** It runs
      # as the rustc wrapper for every crate this job compiles, so it is pinned as tightly as
      # `cargo install` allows: one exact version, built from its own lockfile (`--locked`).
      # `cargo install` takes no checksum for the crate it installs; what holds the bytes is
      # crates.io never replacing a published version, and Cargo checking every crate it
      # downloads against the index. Moving to a new version is a reviewed change to this line.
      - name: cargo-auditable
        env:
          CARGO_AUDITABLE_VERSION: 0.7.6
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"

      # `purlis` is the command line; `charter` is its alias for the rename's window, a small
      # program that runs the `purlis` beside it (RN-3). Both ship, each as a file of its own.
      - name: The purlis binary the app's hooks run, its charter alias, and the built-in extensions
        run: cargo auditable build --profile "$PROFILE" --locked -p purlis-cli -p persona-statistics

      - name: Stage them where Tauri's bundler picks them up
        run: |
          set -euo pipefail
          mkdir -p app/src-tauri/binaries
          for name in purlis charter; do
            cp "target/$PROFILE/$name" "app/src-tauri/binaries/$name-${{ steps.names.outputs.triple }}"
          done
          rm -rf app/src-tauri/extensions
          "target/$PROFILE/persona-statistics" assemble app/src-tauri/extensions/persona-statistics
          # The binary says which profile built it, and it has to be the one this run asked
          # for: the summary below names `$PROFILE`, and this is what makes that true.
          line=$("target/$PROFILE/purlis" --version)
          echo "$line"
          case "$line" in
            *"($PROFILE profile)") ;;
            *) echo "::error::this run asked for the $PROFILE profile and the binary says: $line"; exit 1 ;;
          esac

      # `tauri.release.conf.json` adds only `bundle.externalBin`; this run adds the version it
      # announces. The bundle's version is what the installed app compares a manifest against,
      # and what `tauri build` writes into each signature's trusted comment — the pairing
      # `requireSignedVersion` and `release-manifest` both check.
      #
      # One exception, and it is the ONLY way this workflow ever builds without updater
      # artifacts: a `workflow_dispatch` build. It runs outside the `release` environment, so
      # it never has the signing key. It publishes nothing, its summary says it is unsigned,
      # and `release-manifest` never sees it. A publish with no key never gets here — `plan`
      # refused it.
      - name: This build's config
        env:
          SIGNED: ${{ needs.plan.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ] && [ "$SIGNED" != "true" ]; then
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY — this on-demand build makes no updater artifacts and is published nowhere"
            jq --arg v "$VERSION" '. + {version: $v} | .bundle.createUpdaterArtifacts = false' \
              app/src-tauri/tauri.release.conf.json > app/src-tauri/tauri.build.conf.json
          else
            jq --arg v "$VERSION" '. + {version: $v}' \
              app/src-tauri/tauri.release.conf.json > app/src-tauri/tauri.build.conf.json
          fi
          cat app/src-tauri/tauri.build.conf.json

      # Only the variables that are SET reach the bundler. Tauri reads the Apple variables'
      # presence as "sign", so an empty APPLE_CERTIFICATE makes it try to import nothing and
      # fail; exporting only what exists keeps an on-demand build on a repository with no
      # secrets working.
      #
      # Then the one addition that makes an account-less publish possible: when no Developer ID
      # is configured, APPLE_SIGNING_IDENTITY is set to `-`, which is codesign's spelling of
      # ad-hoc. This is NOT the same as leaving it unset. The bundler's `keychain()` returns
      # `None` for an absent identity and then signs nothing at all, which on Apple Silicon
      # leaves each Mach-O carrying only the linker's own ad-hoc signature and the BUNDLE with
      # no seal — `codesign --verify --deep --strict` rejects that, and so does the check
      # further down. With `-` the bundler takes its `with_signing_identity` branch, imports no
      # keychain (there is nothing to import) and runs `codesign --force -s -`, sealing the
      # bundle. It must go through a named identity rather than a `codesign` call of our own,
      # because signing has to happen BEFORE the bundler writes `purlis.app.tar.gz` and
      # minisigns it; anything signed afterwards would not be the bytes the updater verifies.
      #
      # Deliberately absent: APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, APPLE_API_KEY,
      # APPLE_API_ISSUER, APPLE_API_KEY_PATH. Those are notarization, which ADR 0042 declines.
      - name: Signing material
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_SIGNING: ${{ needs.plan.outputs.macos_signing }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                      APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            value="${!name}"
            if [ -n "$value" ]; then
              # A multi-line value (the Tauri key is one line of base64, the certificate too,
              # but nothing guarantees it) goes through GITHUB_ENV's heredoc form.
              delim="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "$name: not set"
            fi
          done
          if [ "$RUNNER_OS" = "macOS" ] && [ "$MACOS_SIGNING" = "ad-hoc" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY: '-' (ad-hoc; no Developer ID configured)"
          fi

      # No `--debug`, and the profile is named: `-- --profile` hands it to Cargo, and Tauri
      # reads the same words to find the binary under `target/<profile>/` and put the bundles
      # in `target/<profile>/bundle/`. No `--features e2e`: that feature puts a WebDriver server
      # inside the app and belongs in no build anyone is given.
      #
      # **When the extra bundle is required, this one run makes it too** (ADR 0092). A second
      # `tauri build` rebuilds the front end, and the app binary with it, so the two-step
      # shape below cost a second link of the whole app for a bundle that was not optional
      # anyway. Today that is the AppImage, on a publish and on the profile guard.
      - name: Build the app
        working-directory: app
        env:
          BUNDLES: ${{ (matrix.extra_required && needs.plan.outputs.appimage_required == 'true') && format('{0},{1}', matrix.bundles, matrix.extra_bundles) || matrix.bundles }}
        # `--runner`: Tauri runs `<runner> build …` in place of `cargo build …`, so the app
        # binary is linked through `cargo auditable` too (tools/auditable-cargo says why a
        # wrapper). An absolute path, so it resolves the same wherever Tauri starts it.
        run: npx tauri build --config src-tauri/tauri.build.conf.json --bundles "$BUNDLES" --runner "$GITHUB_WORKSPACE/tools/auditable-cargo" -- --profile "$PROFILE"

      # The extra bundle as a step of its own, which is allowed to fail: a build that lost
      # its `.dmg`, or a try-a-branch build that lost its AppImage, still has the bundle the
      # step above made. Skipped when that step already made it, and for the `.dmg` of a dev
      # channel build, which has none.
      #
      # Both targets, not just the extra one: Tauri DELETES a bundle it had to build only as
      # an intermediate. Asking for `dmg` alone builds `purlis.app`, wraps it, then prints
      # "Cleaning .../bundle/macos/purlis.app" and removes it — which is how the first run of
      # this workflow lost the .app it had already built. Naming both keeps both.
      - name: Build the extra bundle
        id: extra
        if: ${{ !(matrix.extra_required && needs.plan.outputs.appimage_required == 'true') && !(matrix.extra_bundles == 'dmg' && needs.plan.outputs.dmg != 'true') }}
        continue-on-error: true
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.build.conf.json --bundles ${{ matrix.bundles }},${{ matrix.extra_bundles }} --runner "$GITHUB_WORKSPACE/tools/auditable-cargo" -- --profile "$PROFILE"

      # Fixed names, so the dev release's assets are REPLACED build after build rather than
      # accumulating one per version, and so a manifest's url never has to guess a bundler's
      # file-naming scheme.
      #
      # `.app` is a DIRECTORY, and actions/upload-artifact zips what it is given with a zip
      # that drops the executable bit. `ditto -c -k` writes the archive Apple's own tools read
      # back, permissions and all.
      - name: Collect what was built (macOS)
        if: runner.os == 'macOS'
        env:
          DMG: ${{ needs.plan.outputs.dmg }}
        run: |
          set -euo pipefail
          mkdir -p dist
          slug=${{ steps.names.outputs.slug }}; up=${{ steps.names.outputs.updater }}
          ditto -c -k --sequesterRsrc --keepParent \
            "target/$PROFILE/bundle/macos/purlis.app" "dist/purlis-$slug.app.zip"
          for dmg in "target/$PROFILE"/bundle/dmg/*.dmg; do
            [ -e "$dmg" ] && cp "$dmg" "dist/purlis-$slug.dmg"
          done
          if [ "$DMG" != "true" ]; then
            echo "no .dmg — a dev channel build makes none (ADR 0092)"
          elif [ ! -e "dist/purlis-$slug.dmg" ]; then
            echo "no .dmg — its bundler failed, see the step above"
          fi
          # The updater's own artifact and the signature over it. The name inside the
          # signature's trusted comment is the bundler's; minisign does not check it, and the
          # version beside it is what `release-manifest` does check.
          if [ -e "target/$PROFILE/bundle/macos/purlis.app.tar.gz" ]; then
            cp "target/$PROFILE/bundle/macos/purlis.app.tar.gz" "dist/purlis-$up.app.tar.gz"
          fi
          if [ -e "target/$PROFILE/bundle/macos/purlis.app.tar.gz.sig" ]; then
            cp "target/$PROFILE/bundle/macos/purlis.app.tar.gz.sig" "dist/purlis-$up.app.tar.gz.sig"
          fi
          ls -l dist

      - name: Collect what was built (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          slug=${{ steps.names.outputs.slug }}; up=${{ steps.names.outputs.updater }}
          for deb in "target/$PROFILE"/bundle/deb/*.deb; do cp "$deb" "dist/purlis-$slug.deb"; done
          # The AppImage is both what a person runs and what the updater replaces: Tauri signs
          # it directly, so the same file carries the `.sig`.
          for img in "target/$PROFILE"/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || continue
            cp "$img" "dist/purlis-$up.AppImage"
            [ -e "$img.sig" ] && cp "$img.sig" "dist/purlis-$up.AppImage.sig"
          done
          [ -e "dist/purlis-$up.AppImage" ] || echo "no AppImage — its bundler failed, see the step above"
          ls -l dist

      # A publish carries the signed updater artifact, or this build is not one. The manifest
      # step would refuse later anyway; this says which platform, while its log is on screen.
      - name: The updater artifact and its signature are both here
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          up=${{ steps.names.outputs.updater }}
          art=""
          for f in dist/purlis-"$up".*; do [[ $f == *.sig ]] || art="$f"; done
          [ -n "$art" ] || { echo "::error::no updater artifact for $up in dist/"; exit 1; }
          [ -s "$art.sig" ] || { echo "::error::$art has no .sig beside it — the bundler signed nothing"; exit 1; }
          echo "$art and $art.sig"

      # The signing decision, checked on the thing that was built rather than assumed from the
      # secrets. This has to assert the signing that was ASKED for, in both directions. A
      # certificate secret that is set but wrong — expired, the wrong identity, an Apple
      # *Development* cert instead of Developer ID — produces a bundle signed with something
      # else, or ad-hoc, and nothing downstream notices until an operator's Mac does. Since
      # ad-hoc became a legitimate outcome, the reverse matters too: a Developer ID run that
      # quietly produced an ad-hoc bundle must not pass a check that only asked "is it signed".
      #
      # `codesign --verify --deep --strict` runs FIRST and in both modes, because it is the one
      # thing an ad-hoc bundle can still fail: it is what separates "the bundler sealed this
      # bundle ad-hoc" from "nobody signed the bundle and its executables merely carry the
      # linker's ad-hoc signature". Those two print the same `Signature=adhoc`.
      - name: The macOS bundle carries the signature this run asked for, sidecar included
        if: runner.os == 'macOS' && needs.plan.outputs.publish == 'true'
        env:
          MACOS_SIGNING: ${{ needs.plan.outputs.macos_signing }}
        run: |
          set -euo pipefail
          bundle=target/$PROFILE/bundle/macos/purlis.app
          echo "this run asked for: $MACOS_SIGNING"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          for path in "$bundle" "$bundle/Contents/MacOS/purlis" "$bundle/Contents/MacOS/charter"; do
            info=$(codesign -dv --verbose=4 "$path" 2>&1)
            echo "--- $path"
            echo "$info" | grep -E '^(Authority|TeamIdentifier|Signature|CodeDirectory)=' || true
            case "$MACOS_SIGNING" in
              developer-id)
                echo "$info" | grep -q '^Authority=Developer ID Application:' \
                  || { echo "::error::$path is not signed with a Developer ID Application certificate, but this run had all three Apple secrets set"; exit 1; }
                ;;
              ad-hoc)
                # Both halves, or the assertion is worth nothing: `Signature=adhoc` alone is
                # also what an unsealed bundle's linker signature prints, and a bundle that
                # somehow came out Developer ID signed here would mean the secrets are not
                # where this workflow thinks they are.
                echo "$info" | grep -q '^Signature=adhoc' \
                  || { echo "::error::$path is not ad-hoc signed, and ad-hoc is what this run asked for"; exit 1; }
                echo "$info" | grep -q '^TeamIdentifier=not set' \
                  || { echo "::error::$path carries a team identifier, so it is not the ad-hoc signature this run asked for"; exit 1; }
                ;;
              *)
                echo "::error::unknown macOS signing mode '$MACOS_SIGNING'"; exit 1 ;;
            esac
          done
          # Declined, and said so. A notarized build would print a stapled ticket here; a
          # Developer ID one prints 'Unnotarized Developer ID'; an ad-hoc one prints
          # 'rejected'. None of the three is an error, and none of them is the updater's
          # business — this is Gatekeeper's verdict on a FIRST install, nothing more.
          echo "notarization: not requested (ADR 0042). spctl's verdict on a first install:"
          spctl -a -vv -t exec "$bundle" 2>&1 || true

      # **The hardened runtime, read off the signed app** (ruling V90a, #1180). A keyring item is
      # held to the app, and that holds only while no other code can run as the app: the
      # runtime refuses an injected library and an attaching debugger, and an entitlement is how
      # a build gives one of those back. The bundler's configuration is held by a test
      # (`the_app_keeps_the_hardened_runtime.rs`); this holds what it signed. In both signing
      # modes and on every macOS build, the profile guard's and a hand-started one's included,
      # so a bundler that stops passing `--options runtime` is found on a night, not on a tag.
      # The seal is verified first, so a linker's own signature never answers for the bundle.
      #
      # **Report-only on a dev publish, until a runner has measured it** (train 79 review). The
      # bundler passes `--options runtime` for an ad-hoc identity too (tauri-macos-sign's
      # `Keychain::sign`), but no runner has run this step yet, and a red here would stop the
      # dev channel on every green main. So on a dev publish a red is an annotation and the
      # publish goes on; on the nightly profile guard, a hand-started build and a stable tag it
      # blocks. The guard runs every night before any tag, so it is where a red shows first.
      # Once a guard night is green this exemption goes (#1180).
      - name: The app keeps the hardened runtime and carries no entitlement
        if: runner.os == 'macOS'
        continue-on-error: ${{ needs.plan.outputs.publish == 'true' && needs.plan.outputs.channel == 'dev' }}
        run: |
          set -euo pipefail
          bundle=target/$PROFILE/bundle/macos/purlis.app
          codesign --verify --deep --strict "$bundle"
          info=$(codesign -dv --verbose=4 "$bundle" 2>&1)
          flags=$(sed -n 's/^CodeDirectory .*flags=\(0x[0-9a-f]*([^)]*)\).*/\1/p' <<<"$info")
          echo "flags: ${flags:-none}"
          case "$flags" in
            *runtime*) ;;
            *) echo "::error::$bundle is signed without the hardened runtime (flags: ${flags:-none})"; exit 1 ;;
          esac
          entitlements=$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null)
          if grep -q '<key>' <<<"$entitlements"; then
            echo "::error::$bundle carries entitlements, and the app carries none: $entitlements"
            exit 1
          fi
          echo "hardened runtime on, no entitlements"

      # Honest evidence for "does this start on a machine with no developer tools". It cannot
      # prove it — every runner here has Xcode — but a binary that links only what ships with
      # the OS cannot be missing a developer-tools library. Printed, never hidden.
      - name: What the built app links against
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            bundle=target/$PROFILE/bundle/macos/purlis.app
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            echo "### $bundle/Contents/MacOS (CFBundleExecutable is '$exe')"
            ls -l "$bundle/Contents/MacOS"
            echo; echo "otool -L of the app:"; otool -L "$bundle/Contents/MacOS/$exe"
            echo; echo "otool -L of the purlis binary its hooks run:"; otool -L "$bundle/Contents/MacOS/purlis"
            echo; echo "otool -L of its charter alias:"; otool -L "$bundle/Contents/MacOS/charter"
            echo; echo "codesign of the bundle:"; codesign -dv --verbose=2 "$bundle" 2>&1 || true
          else
            echo "### what the .deb ships"
            dpkg -c dist/*.deb | grep -E 'usr/bin/|\.desktop' || true
            echo; echo "ldd of the app:"; ldd "target/$PROFILE/charter-app" || true
          fi

      # The plugin every Claude Code chat loads (`purlis_core::plugin`), and the shim every
      # opencode chat loads from inside it (`purlis_core::opencode`). A bundle without it
      # starts every chat unarmed — no state, no guard, no skills — so its absence fails the
      # build rather than reaching anyone.
      - name: The bundle carries charter's own plugin
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            plugin=target/$PROFILE/bundle/macos/purlis.app/Contents/Resources/plugin
            ls -R "$plugin"
            test -f "$plugin/.claude-plugin/plugin.json"
            test -f "$plugin/hooks/hooks.json"
            test -f "$plugin/opencode/purlis.ts"
          else
            # Listed ONCE into a variable, then searched. `dpkg -c … | grep -q` failed the first
            # dev publish after #221 with the plugin present: `grep -q` exits at its first
            # match, dpkg-deb's tar gets SIGPIPE writing the rest, and `pipefail` turns that
            # into "tar subprocess returned error exit status 2".
            listing=$(dpkg -c dist/*.deb)
            grep -E 'plugin/' <<<"$listing" || true
            grep -q 'plugin/.claude-plugin/plugin.json' <<<"$listing"
            grep -q 'plugin/hooks/hooks.json' <<<"$listing"
            grep -q 'plugin/opencode/purlis.ts' <<<"$listing"
          fi

      # purlis's own licence and NOTICE, which the Apache License 2.0 asks every copy to carry
      # (§4(a) and §4(d)). The `purlis` command line ships inside this same bundle, so this
      # covers it too.
      #
      # And the third-party notices (#1784): every crate and npm package this build ships, with
      # its licence text, which `vite build` generated from the locked graph into `app/dist`
      # and the bundler copied in (`tauri.release.conf.json`). A build that could not find a
      # package's licence text failed before it got here.
      - name: The bundle carries purlis's LICENSE and NOTICE, and the third-party notices
        run: |
          set -euo pipefail
          grep -q '^tauri [0-9][^ ]* (Rust crate' app/dist/THIRD-PARTY-NOTICES
          grep -q '^react [0-9][^ ]* (npm package' app/dist/THIRD-PARTY-NOTICES
          if [ "$RUNNER_OS" = "macOS" ]; then
            resources=target/$PROFILE/bundle/macos/purlis.app/Contents/Resources
            cmp "$resources/LICENSE" LICENSE
            cmp "$resources/NOTICE" NOTICE
            cmp "$resources/THIRD-PARTY-NOTICES" app/dist/THIRD-PARTY-NOTICES
          else
            # Listed once into a variable, then searched (see the plugin check's note on SIGPIPE).
            listing=$(dpkg -c dist/*.deb)
            grep -q 'usr/lib/purlis/LICENSE$' <<<"$listing"
            grep -q 'usr/lib/purlis/NOTICE$' <<<"$listing"
            grep -q 'usr/lib/purlis/THIRD-PARTY-NOTICES$' <<<"$listing"
          fi

      # The built-in extensions (charter-app#339). A bundle without them has no persona
      # statistics, and one whose program lost its executable bit on the way in has a view that
      # always refuses — so both fail the build. On macOS the program sits in Contents/Resources,
      # so the bundle's seal (checked above) covers its bytes as it covers every resource, and
      # the updater's `.app.tar.gz` is that same directory.
      - name: The bundle carries charter's built-in extensions, runnable
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            ext=target/$PROFILE/bundle/macos/purlis.app/Contents/Resources/extensions/persona-statistics
            ls -lR "$ext"
            test -f "$ext/purlis-extension.json"
            test -x "$ext/bin/persona-statistics"
            # The updater's archive, when this run made one: the bytes the minisign signature is
            # over. Listed once into a variable, then searched (see the plugin check's note on
            # SIGPIPE). The `.app.zip` is `ditto` of the same `.app`, and the `.dmg` wraps it.
            archive=target/$PROFILE/bundle/macos/purlis.app.tar.gz
            if [ -e "$archive" ]; then
              listing=$(tar -tzvf "$archive")
              grep -qE '^-rwx.*extensions/persona-statistics/bin/persona-statistics$' <<<"$listing" \
                || { echo "FAIL: the updater archive lacks a runnable persona-statistics"; exit 1; }
            fi
          else
            listing=$(dpkg -c dist/*.deb)
            # Under `usr/lib/purlis` exactly: the `purlis` binary in `usr/bin` finds its built-ins
            # there and nowhere else (`extension::bundle`, #1366).
            grep -q 'usr/lib/purlis/extensions/persona-statistics/purlis-extension.json' <<<"$listing"
            grep -qE '^-rwx.*usr/lib/purlis/extensions/persona-statistics/bin/persona-statistics$' <<<"$listing" \
              || { echo "FAIL: persona-statistics is not in the .deb, or is not executable"; exit 1; }
            # The AppImage, when this run made one: what the Linux updater replaces, and what
            # its signature is over. Unpacked by its own runtime, which starts nothing of purlis.
            for img in dist/purlis-*.AppImage; do
              [ -e "$img" ] || continue
              unpacked=$(mktemp -d)
              (cd "$unpacked" && "$OLDPWD/$img" --appimage-extract >/dev/null)
              test -x "$unpacked"/squashfs-root/usr/lib/purlis/extensions/persona-statistics/bin/persona-statistics \
                || { echo "FAIL: $img lacks a runnable persona-statistics"; exit 1; }
              rm -rf "$unpacked"
            done
          fi

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: What a person sees when they install it
        if: always()
        env:
          ARTIFACT: ${{ steps.names.outputs.artifact }}
          SLUG: ${{ steps.names.outputs.slug }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          SIGNED: ${{ needs.plan.outputs.signed }}
          MACOS_SIGNING: ${{ needs.plan.outputs.macos_signing }}
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.platform }} — charter $VERSION"
            echo
            if [ "$PUBLISH" = "true" ]; then
              echo "Built from \`${{ needs.plan.outputs.sha }}\`, **\`$PROFILE\` profile, published to the \`$CHANNEL\` channel**."
            else
              echo "Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`, \`$PROFILE\` profile, **published nowhere** — download it from this run's **Artifacts** section (\`$ARTIFACT.zip\`)."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$PUBLISH" = "true" ] && [ "$MACOS_SIGNING" = "developer-id" ]; then
              cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### A first install on macOS meets Gatekeeper, and this is expected

          This build is **signed with a Developer ID and not notarized** (ADR 0042). A
          browser marks everything it downloads as quarantined, and macOS 15 and later answer a
          quarantined app that Apple has not notarized with a dialog — **"purlis" Not Opened**,
          *Apple could not verify "purlis" is free of malware* — offering only *Done* and
          *Move to Trash*. Nothing is wrong with the download. To open it the first time:

          1. Drag `purlis.app` into `/Applications`, open it once, and click **Done**.
          2. Open **System Settings → Privacy & Security**, scroll to **Security**, and click
             **Open Anyway** beside the line about charter. Confirm with your password.
          3. charter opens, and macOS does not ask again.

          Or, in a terminal, before the first launch:

          ```sh
          xattr -dr com.apple.quarantine /Applications/purlis.app
          ```

          **This happens once.** charter updates itself in place after that, and an update
          does not meet this dialog: the quarantine flag is set by the browser that downloaded
          a file, and charter's updater downloads into memory, verifies the minisign signature
          and unpacks the new bundle itself — nothing it writes is quarantined.
          EOF
            elif [ "$PUBLISH" = "true" ]; then
              cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### A first install on macOS needs one command, and this is expected

          This build is **ad-hoc signed**: charter has no Apple Developer account behind it
          (ADR 0042, amended 2026-09-23). The app is signed — on Apple Silicon nothing
          unsigned runs at all — but it is signed by nobody in particular, so Gatekeeper has no
          developer to check and refuses a *quarantined* copy. A browser marks everything it
          downloads as quarantined. Before the first launch, run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/purlis.app
          ```

          That removes the flag Gatekeeper assesses, so there is nothing left to refuse. It is
          the instruction that works whatever dialog your macOS version would otherwise show —
          **System Settings → Privacy & Security → Open Anyway** may also work, but it has not
          been measured for an ad-hoc build and the dialog an ad-hoc bundle raises is not
          necessarily the one an un-notarized Developer ID bundle raises.

          **This happens once, and it is not what the updater does.** charter's updater is not
          trusted because Apple signed it; it is trusted because every update carries a
          **minisign** signature made by the operator's key, which the app verifies before it
          unpacks anything. Nothing about ad-hoc signing weakens that. The updater downloads
          into memory, verifies the signature, unpacks the bundle itself and renames it into
          place, so nothing it writes is quarantined and no dialog is involved.

          Measured on macOS 26.2 (Apple Silicon) against the updater's own install path, from
          inside an ad-hoc-signed app in `/Applications`: the replacement succeeded, **no App
          Management permission was asked for and none was recorded**, a quarantine flag on the
          old bundle did not survive onto the new one, and the replaced bundle launched again.
          EOF
            else
              {
                echo '```sh'
                echo "cd ~/Downloads && unzip -o $ARTIFACT.zip -d $ARTIFACT && cd $ARTIFACT"
                echo "ditto -x -k purlis-$SLUG.app.zip ."
                echo "# not published, so not necessarily signed: strip the flag the browser set"
                echo "xattr -dr com.apple.quarantine purlis.app"
                echo "open purlis.app"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          \`\`\`sh
          # the AppImage: runs from anywhere, and is what purlis's updater replaces
          chmod +x purlis-linux-x86_64-appimage.AppImage && ./purlis-linux-x86_64-appimage.AppImage

          # or the .deb, which also puts \`purlis\`, the binary hooks run, on PATH
          sudo apt install ./purlis-$SLUG.deb
          \`\`\`

          **A \`.deb\` install is not updated by purlis** — \`dpkg\` owns it, and the manifest
          deliberately has no entry a \`.deb\` install would match. Install the next \`.deb\`
          from the release page, or use the AppImage to get updates.
          Needs \`libwebkit2gtk-4.1-0\`: the \`.deb\` declares it, the AppImage carries it.
          EOF
          fi
          if [ "$SIGNED" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Not updater-signed**, so no app could update to it. A build started by hand runs outside the release environment and never holds the key; a publishing run with no key is refused before it builds (docs/updating.md, step 0)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Last, so a build that is wrong is still downloadable and still says it is wrong. The
      # app resolves the binary its hooks run as `<the directory of my own exe>/purlis`, and
      # `charter` beside it is the alias that runs that `purlis` (RN-3). A missing sidecar
      # leaves every chat at `unknown`; a sidecar that IS the app's own executable makes every
      # hook launch a second GUI. Both are invisible until run.
      - name: The purlis binary and its charter alias really are beside the app, and are not the app
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Listed ONCE into a variable: piping `dpkg -c` into `grep -q` SIGPIPEs dpkg-deb
            # and `pipefail` then fails a perfectly correct .deb (run 35511509471).
            listing=$(dpkg -c dist/*.deb)
            grep '[[:space:]]usr/bin/' <<<"$listing" || true
            for name in purlis charter; do
              grep -q "[[:space:]]usr/bin/$name\$" <<<"$listing" \
                || { echo "FAIL: no usr/bin/$name in the .deb — no hook would ever fire"; exit 1; }
            done
            n=$(grep -c '[[:space:]]usr/bin/[^/][^/]*$' <<<"$listing" || true)
            [ "$n" -ge 3 ] || { echo "FAIL: only $n binaries in usr/bin — a sidecar IS the app"; exit 1; }
            exit 0
          fi
          bundle=target/$PROFILE/bundle/macos/purlis.app
          dir=$bundle/Contents/MacOS
          exe=$dir/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
          test -x "$exe" || { echo "FAIL: CFBundleExecutable names a file that is not there: $exe"; exit 1; }
          for name in purlis charter; do
            test -x "$dir/$name" || { echo "FAIL: no executable $name beside the app in $dir"; exit 1; }
            [ "$(shasum -a 256 "$dir/$name" | cut -d' ' -f1)" != "$(shasum -a 256 "$exe" | cut -d' ' -f1)" ] \
              || { echo "FAIL: the $name sidecar IS the app — every hook would launch the GUI"; exit 1; }
            "$dir/$name" --version
          done

  # **The runner image of this release** (#2749, ruled 2026-10-20): `runner-image.yml`, called
  # for the commit and the version this run publishes, so purlis's runner image says the
  # version its desktop does. Built, checked, pushed, signed keyless and verified there; its
  # line (`<image>@sha256:<digest>`) comes back as `image`. Its build provenance and an SBOM
  # of each architecture's image are attested to the image and verified there too (#2191). The
  # permissions are the most the called workflow's jobs ask for; each of its jobs holds only
  # its own.
  runner-image:
    name: runner image
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      attestations: write
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/runner-image.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}

  # **The runner image's line, signed with the updater's key** (#2749), for the update manifest
  # to name it: the manifest is not signed, so the line is, by the key every app checks its
  # bundles with (ADR 0042), with this release's version in its trusted comment. In the
  # `release` environment, the one place the key is; it holds nothing else, and writes no
  # release.
  runner-image-signature:
    name: runner image signature
    needs: [plan, runner-image]
    if: needs.plan.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RUNNER_IMAGE: ${{ needs.runner-image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: The runner image's line, signed for this version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$RUNNER_IMAGE" in
            ghcr.io/*/purlis-runner@sha256:*) ;;
            *) echo "::error::runner-image.yml handed back '$RUNNER_IMAGE'"; exit 1 ;;
          esac
          mkdir -p runner
          printf '%s\n' "$RUNNER_IMAGE" > runner/runner-image.txt
          cargo run --locked --release -p release-manifest --bin sign-runner-image -- \
            runner/runner-image.txt "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlis-runner-image-${{ needs.plan.outputs.version }}
          path: runner/
          if-no-files-found: error
          retention-days: 90

  # **A CycloneDX SBOM for each platform a release ships** (#584). What it covers, exactly:
  #
  #   - The Rust crates of the purlis binaries (the app, the `purlis` command beside it with
  #     its `charter` alias, and the `persona-statistics` extension), read out of the built
  #     binaries themselves:
  #     `build` links each with `cargo auditable`, which embeds the crates it was compiled from.
  #     macOS: read from the unpacked `.app`. Linux: from the unpacked `.deb`. The AppImage
  #     carries the same binaries, but it also bundles system libraries (WebKitGTK and
  #     what it needs) that this SBOM does not list, and nor does it list the macOS frameworks.
  #   - The web front end's npm packages, from `app/package-lock.json`, production packages
  #     only. The bundler compiles them into the app, where no scanner can see them, so these
  #     are the packages the front end was built FROM, not ones found in the download.
  #
  # A job that holds nothing: no secret, no environment, `contents: read`, and no third-party
  # action. syft is downloaded at one version and checked against a sha256 committed below
  # before it is unpacked, and it runs in a `run:` step, which the runner hands no artifact
  # token, so even a bad syft cannot upload an artifact that `provenance` would attest. It runs
  # for every build, including one started by hand, which is how to try it without publishing.
  # The SBOMs are uploaded under one exact name, `purlis-sbom-<version>`, which `provenance`
  # attests and `publish` verifies and uploads beside the bundles, as
  # `purlis-<platform>.cdx.json`.
  sbom:
    name: SBOM
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-macos-arm64-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-linux-x86_64-${{ needs.plan.outputs.version }}
          path: dist

      - name: Unpack what each platform ships
        run: |
          set -euo pipefail
          for platform in macos-arm64 linux-x86_64; do
            mkdir -p "sbom/$platform/web"
            cp app/package.json app/package-lock.json "sbom/$platform/web/"
          done
          unzip -q dist/purlis-macos-arm64.app.zip -d sbom/macos-arm64
          dpkg-deb -x dist/purlis-linux-x86_64.deb sbom/linux-x86_64
          mkdir -p out

      # The checksum is the `linux_amd64.tar.gz` line of that release's
      # `syft_<version>_checksums.txt`. Moving to a new syft is both lines, by hand.
      - name: syft, at one version and checksum, reads each platform's bundle
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" version
          "$RUNNER_TEMP/syft" scan "dir:sbom/macos-arm64" -o "cyclonedx-json=out/purlis-macos-arm64.cdx.json"
          "$RUNNER_TEMP/syft" scan "dir:sbom/linux-x86_64" -o "cyclonedx-json=out/purlis-linux-x86_64.cdx.json"

      # An SBOM that lists nothing looks exactly like one that lists everything until someone
      # reads it. Each shipped binary's own crate has to be in it, which it only is when that
      # binary was built with cargo-auditable, and so do the front end's packages.
      - name: Each SBOM names every binary it ships, and the front end
        env:
          REQUIRED_PURLS: pkg:cargo/purlis-app@ pkg:cargo/purlis-cli@ pkg:cargo/persona-statistics@ pkg:npm/
        run: |
          set -euo pipefail
          for sbom in out/*.cdx.json; do
            purls=$(jq -r '.components[]?.purl // empty' "$sbom")
            for want in $REQUIRED_PURLS; do
              grep -q "^$want" <<<"$purls" \
                || { echo "::error::$sbom has no $want component — was that binary built with cargo auditable?"; exit 1; }
            done
            echo "$sbom: $(grep -c '^pkg:cargo/' <<<"$purls") crates, $(grep -c '^pkg:npm/' <<<"$purls") npm packages"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlis-sbom-${{ needs.plan.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 90

  # **The update manifest, written before anything is published** (#778). `latest.json` on the
  # stable channel, `dev.json` on dev, and each one's weekly twin (OB-17). They are attested
  # like every build file, and the job that may sign (`provenance`) and the job that may write
  # the release (`publish`) are never the same job, so the manifest is written HERE, by a job
  # that holds nothing: no secret, no environment, `contents: read`, and no cache. It hands the
  # files on as one run artifact by an exact name; `provenance` attests them with the builds,
  # and `publish` verifies them against this run and uploads those bytes, last.
  #
  # Every guard is in `crates/release-manifest`, with tests: a signature present, made by the
  # key tauri.conf.json carries, over these exact bytes, for this exact version, for every
  # platform purlis publishes and no other. It refuses rather than write a manifest any app
  # would reject.
  manifest:
    name: update manifest
    needs: [plan, build, runner-image-signature]
    # **A runner image that failed never holds the desktop back** (#2880): this runs whatever
    # became of the image, naming it only where it was signed, and asks for each job the desktop
    # needs by name.
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # No cache: the updater reads what this job writes, so it builds from main's own tree.

      # The build files by their exact names (see `provenance` on why never a pattern).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-macos-arm64-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-linux-x86_64-${{ needs.plan.outputs.version }}
          path: dist

      # The runner image this release built, its line and its signature (#2749): only where it
      # was built and signed (#2880).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.runner-image-signature.result == 'success'
        with:
          name: purlis-runner-image-${{ needs.plan.outputs.version }}
          path: runner

      - name: The manifest, and every check it has to pass first
        env:
          RUNNER_IMAGE_SIGNED: ${{ needs.runner-image-signature.result }}
        run: |
          set -euo pipefail
          ls -l dist
          # The runner image is named only where it was built and signed; without it the
          # desktop ships, and every pool stays on the runner it has (#2880).
          runner=()
          if [ "$RUNNER_IMAGE_SIGNED" = success ]; then
            runner=(--runner-image runner/runner-image.txt)
          else
            echo "::warning::the runner image was not built and signed ($RUNNER_IMAGE_SIGNED), so this release names none and pools stay on their runners"
          fi
          if [ "$CHANNEL" = stable ]; then
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            # The version's CHANGELOG.md section, which `plan` already refused the tag without,
            # and which `publish` makes the release body from with the same tool.
            notes=$(cargo run --locked --quiet -p changelog -- "$VERSION" CHANGELOG.md)
          else
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/dev"
            notes="charter $VERSION, a dev build of $SHA."
          fi
          mkdir -p manifest
          cargo run --locked --release -p release-manifest -- \
            --channel "$CHANNEL" --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "$notes" \
            --dir dist --base-url "$base" \
            --entry darwin-aarch64=purlis-darwin-aarch64.app.tar.gz \
            --entry linux-x86_64-appimage=purlis-linux-x86_64-appimage.AppImage \
            --tauri-config app/src-tauri/tauri.conf.json \
            "${runner[@]}" \
            --out manifest
          cat manifest/*.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlis-manifest-${{ needs.plan.outputs.version }}
          path: manifest/
          if-no-files-found: error
          retention-days: 90

  # **SLSA build provenance for every file a publish ships** (#583). One signed attestation
  # names each file's sha256 and says it came out of this workflow, in this repository, at this
  # run's commit, on a GitHub-hosted runner. Anyone can check it with `gh attestation verify`
  # (SECURITY.md says how). It is a third signature beside minisign and codesign, and it answers
  # a different question: not "may the updater install this" but "which build made this".
  #
  # A job of its own, so the OIDC token that signs provenance is never in the same job as the
  # updater key (`build`) or the power to write the release (`publish`), and `publish` waits for
  # it, so nothing is published unattested. It attests the run's uploaded artifacts, the exact
  # bytes `publish` downloads and uploads next. `actions/attest` rather than
  # `actions/attest-build-provenance`: since v4 the latter is a thin wrapper over the former,
  # and its README sends new workflows to `actions/attest`. With no predicate input it writes
  # the same SLSA v1 build provenance.
  #
  # The update manifests are attested here too (#778), from the `manifest` job's artifact. And
  # the attestation's own bundle is handed on as a run artifact, which `publish` uploads beside
  # the builds as `purlis.intoto.jsonl` (#1133): the provenance a person, or a scanner, finds on
  # the release page, checkable offline with `gh attestation verify <file> --bundle`.
  #
  # A hand-started build publishes nothing, so it is not attested.
  provenance:
    name: build provenance
    needs: [plan, build, sbom, manifest]
    # Asked of each job it needs by name, so a runner image that failed before it holds nothing
    # back (#2880).
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.plan.result == 'success' && needs.build.result == 'success' && needs.sbom.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `id-token` mints the token Sigstore signs with; `attestations` stores the result. Nothing
    # else: this job checks nothing out, and `download-artifact` reads this run's own
    # artifacts without a token scope.
    permissions:
      id-token: write
      attestations: write
    steps:
      # The build artifacts by their EXACT names (`purlis-<platform>-<version>` from `build`,
      # `purlis-sbom-<version>` from `sbom`), never by pattern. Any step of this run that holds
      # the artifact token can upload an artifact, and a pattern would take one it uploaded
      # under a lookalike name, attest it, and ship it (#584 review).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-macos-arm64-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-linux-x86_64-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-sbom-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-manifest-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/*

      # What a person installing it runs, run here first, and pinned to THIS run: this
      # repository, this workflow file at this workflow commit, this source commit, a
      # GitHub-hosted runner, and on the stable channel this tag. An attestation that does not
      # verify is not one, and a release should not go out on it. `publish` runs the same check
      # again on the bytes it uploads.
      - name: Each file verifies against this run
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          ref=()
          if [ "$CHANNEL" = stable ]; then ref=(--source-ref "$GITHUB_REF"); fi
          for f in dist/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              "${ref[@]}"
          done

      # One Sigstore bundle per line: the `.intoto.jsonl` shape a provenance release asset has.
      - name: The attestation's bundle, as the release asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          jq -c . "$BUNDLE" > provenance/purlis.intoto.jsonl
          test -s provenance/purlis.intoto.jsonl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlis-provenance-${{ needs.plan.outputs.version }}
          path: provenance/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish to the ${{ needs.plan.outputs.channel }} channel
    needs: [plan, build, manifest, provenance]
    # Asked of each job it needs by name, so a runner image that failed before it holds nothing
    # back (#2880).
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.plan.result == 'success' && needs.build.result == 'success' && needs.manifest.result == 'success' && needs.provenance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # It holds no signing key, but it is what a release IS, so it runs under the same
    # environment's rules: `main` and `v*` tags only, and a required reviewer if one is set.
    environment: release
    # The only job that can write to the repository, and what it writes is release assets.
    # `attestations: read` is for checking provenance before it uploads; it holds no
    # `id-token`, so it can read an attestation and never make one.
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # For the stable release's body, from CHANGELOG.md. No cache here: this job can write the
      # release, so it builds from nothing but main's own tree.
      - uses: ./.github/actions/rust-toolchain
        if: needs.plan.outputs.channel == 'stable'

      # The build artifacts and the manifest by their exact names, the same set `provenance`
      # attested (see the note there on why never a pattern).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-macos-arm64-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-linux-x86_64-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-sbom-${{ needs.plan.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-manifest-${{ needs.plan.outputs.version }}
          path: dist

      # The attestation's bundle, outside `dist`: it is the provenance, not a file it covers.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlis-provenance-${{ needs.plan.outputs.version }}
          path: provenance

      # The bytes about to be uploaded are the bytes `provenance` attested in this run, the
      # manifest among them (#778). The same run-pinned check, over what this job downloaded,
      # before anything is uploaded.
      - name: Every file to upload verifies against this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=()
          if [ "$CHANNEL" = stable ]; then ref=(--source-ref "$GITHUB_REF"); fi
          for f in dist/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              "${ref[@]}"
          done

      # The stable release's body is its CHANGELOG.md section, the same one `manifest` gave
      # `latest.json`'s notes: one tool over one file, so the two cannot differ.
      - name: The release notes
        if: needs.plan.outputs.channel == 'stable'
        run: cargo run --locked --quiet -p changelog -- "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      # **Assets first, manifest last.** A machine that reads the manifest between the two
      # would otherwise be pointed at a file that is not there yet, or at the previous build's
      # file under the new build's signature — which fails verification and installs nothing,
      # but is still an error an operator sees. Ordered, the window is gone for a new release
      # and a few seconds wide for the dev one.
      - name: Stable — the release for the operator's tag
        if: needs.plan.outputs.channel == 'stable'
        run: |
          set -euo pipefail
          assets=()
          for f in dist/*; do [[ $f == *.json && $f != *.cdx.json ]] || assets+=("$f"); done
          assets+=(provenance/purlis.intoto.jsonl)
          # **The release page is the install page too.** The body is how to install this
          # version (`.github/release-install.md`, with the tag and version filled in) and then
          # the changelog section. `latest.json` and About purlis carry only the changelog: a
          # running app is already installed.
          sed -e "s/__TAG__/$TAG/g" -e "s/__VERSION__/$VERSION/g" .github/release-install.md \
            > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/notes.md" >> "$RUNNER_TEMP/body.md"
          if grep -q '__TAG__\|__VERSION__' "$RUNNER_TEMP/body.md"; then
            echo "::error::release-install.md has a placeholder the release step does not fill"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run over a release that exists: the same body, and the assets replaced by
            # name (the script says why not `--clobber`).
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"
            tools/replace-release-assets.sh "$TAG" "${assets[@]}"
          else
            # `--verify-tag`: refuse unless the tag already exists on the remote. This command
            # can never create a tag, which is the operator's rule enforced by the tool.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "charter $VERSION" --notes-file "$RUNNER_TEMP/body.md" "${assets[@]}"
          fi
          # The weekly manifest beside it, the same bytes: only its download count differs
          # (OB-17, docs/updating.md, "Counting weekly users").
          tools/replace-release-assets.sh "$TAG" dist/latest.json dist/latest-weekly.json

      - name: Dev — replace the assets of the one `dev` prerelease
        if: needs.plan.outputs.channel == 'dev'
        run: |
          set -euo pipefail
          # **Asked again, before the first asset is replaced.** `plan` asked before the build,
          # but "Re-run failed jobs" on an old run keeps that `plan`'s answer and runs only this
          # job, hours or days later, when the channel may serve a newer commit. So the same
          # question is put here, and anything but `publish` fails the job with nothing
          # replaced. Before the assets and not just before `dev.json`: the manifest's
          # signatures are over these assets, so replacing them and then stopping would leave
          # the newer manifest naming an older build's files. This run holds the group, so
          # nothing publishes between this answer and the manifest below.
          order=$(node tools/dev-build-order.mjs --version "$VERSION" --sha "$SHA")
          case "$order" in
            publish:*) echo "$order" ;;
            *) echo "::error::not published, and no asset was replaced: ${order#skip: }"; exit 1 ;;
          esac
          assets=()
          for f in dist/*; do [[ $f == *.json && $f != *.cdx.json ]] || assets+=("$f"); done
          assets+=(provenance/purlis.intoto.jsonl)
          # Assets replaced and `edit --notes` only: neither touches the tag the release hangs
          # on, so `dev` stays wherever the operator created it and only the assets move.
          # Replaced by name rather than with `gh release upload --clobber`, which died twice
          # on 2026-09-23 on GitHub's asset list lagging the previous publish's replace;
          # `tools/replace-release-assets.sh` says how. `dev.json` and its weekly twin last, on
          # their own, so no machine reads a manifest naming an asset that is not uploaded yet.
          tools/replace-release-assets.sh dev "${assets[@]}"
          # A dev channel build makes no `.dmg` (ADR 0092), and replacing assets by name
          # leaves alone a name this build did not make. So the `.dmg` a publish before that
          # ruling left would sit beside every later build, naming an older one. Removed by
          # id from a listing made now; a 404 means it is already gone.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/tags/dev" \
            --jq '.assets[] | select(.name | endswith(".dmg")) | .id'); do
            if ! out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" 2>&1); then
              grep -q 'HTTP 404' <<<"$out" || { echo "$out" >&2; exit 1; }
            fi
            echo "removed the .dmg an earlier dev publish left (asset $id)"
          done
          tools/replace-release-assets.sh dev dist/dev.json dist/dev-weekly.json
          gh release edit dev --repo "$GITHUB_REPOSITORY" \
            --notes "The rolling dev channel. Now: charter $VERSION, built from $SHA. Not a release — see the stable releases for those."
          {
            echo "## dev channel now serves charter $VERSION"
            echo "Built from \`$SHA\`. Machines on the dev channel find it at their next check."
          } >> "$GITHUB_STEP_SUMMARY"

  # **The profile guard's voice** (ADR 0092). A scheduled run's red X is on a page nobody opens;
  # an issue is in the repo. One issue, found by its exact title among every open issue and
  # rewritten each red night, never a second one and never a comment, and closed by the first
  # night that builds clean (as `forge-live.yml` and `mutants.yml` do).
  #
  # The guard itself is the three jobs above, started by the schedule: `main`, with Cargo's
  # `release` profile and the bundles a stable build must make, outside the `release`
  # environment, so with no signing key, and published nowhere. This job only reads how they
  # ended. It holds `issues: write` and nothing else: no checkout, no cache, no key.
  profile-guard:
    name: profile guard — say so where someone will see it
    needs: [plan, build, sbom]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open, update or close the profile guard's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          SBOM: ${{ needs.sbom.result }}
        run: |
          set -euo pipefail
          TITLE='the stable profile does not build on main'
          # Every open issue, every page of them: a listing capped at the newest 200 once lost
          # a nightly's own issue (`mutants.yml`).
          gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | "\(.number) \(.title)"' > "$RUNNER_TEMP/issues.txt"
          EXISTING="$(awk -v t="$TITLE" \
            '{n=$1; $1=""; sub(/^ /,""); if ($0 == t) {print n; exit}}' "$RUNNER_TEMP/issues.txt")"
          echo "plan=$PLAN build=$BUILD sbom=$SBOM issue=${EXISTING:-none}"
          red=false; clean=true
          for result in "$PLAN" "$BUILD" "$SBOM"; do
            [ "$result" = failure ] && red=true
            [ "$result" = success ] || clean=false
          done
          if [ "$clean" = true ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "The stable profile builds on main again: $RUN_URL"
            fi
            exit 0
          fi
          if [ "$red" != true ]; then
            # Cancelled or skipped: nothing was learned, so the issue is left as it is.
            echo "### The profile guard did not finish (plan: $PLAN, build: $BUILD, sbom: $SBOM); its issue is left as it is" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BODY_FILE="$RUNNER_TEMP/body.md"
          {
            echo "Last run: $RUN_URL (main at \`$SHA\`; plan: $PLAN, build: $BUILD, sbom: $SBOM)"
            echo
            echo "The nightly **profile guard** built \`main\` the way a stable build is built —"
            echo "Cargo's \`release\` profile, every bundle, the AppImage required — and it failed."
            echo "The dev channel builds with \`dev-release\`, so a green dev publish does not"
            echo "show that the stable profile still builds (ADR 0092). Until this is fixed, a"
            echo "\`v*\` tag would fail the same way."
            echo
            echo "The run's log names the step. To try a fix without publishing anything, start"
            echo "the \`release\` workflow by hand on the branch, with the \`release\` profile."
            echo "This issue is rewritten each red night and shut by the first clean one."
          } > "$BODY_FILE"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
