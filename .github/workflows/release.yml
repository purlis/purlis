# **R0 MEASUREMENT BRANCH. NEVER MERGED.** Ticket #7379, spec #7324, train R.
#
# This file replaces the release workflow on the branch `release-r0-measure-*` and on no other.
# It publishes nothing, signs nothing and holds no key: `workflow_dispatch` only, no environment,
# no secrets, `contents: read`. Start it with
#
#     gh workflow run release.yml --ref <this branch>
#
# One dispatch makes four jobs, each a dev build (profile `dev-release`) on a standard runner,
# with the same steps and order as release.yml's `build` job on main (CLI pass, then `tauri
# build`), plus the measurements:
#
#   mac-base      macOS, developer mode as the runner has it, all cores       <- the baseline
#   mac-devmode   macOS, `spctl developer-mode enable-terminal` before the build
#   mac-jobs2     macOS, CARGO_BUILD_JOBS=2 (does fewer parallel rustc stop the swapping?)
#   linux-base    Linux, for the Linux half of every R ticket
#   cache-usage   the repository's Actions cache use (no build)
#
# Each build job uploads one artifact, `r0-<variant>`, holding: both `cargo --timings` HTML
# reports, the full timestamped -v logs of both passes (gz), `rebuild-reasons.txt` (cargo's Dirty
# and Fresh lines), every link and every dsymutil run with its seconds, the memory and swap
# samples, the step times, and `summary.md` / `summary.json` (also the job's step summary).
# Every step's start, end and seconds are in `steps.tsv`; the `[r0] START` / `[r0] END` lines of
# the log say the same.
#
# What is NOT here and is read from main's own run of 2026-11-22 instead: the steps after
# "Build the app" (collect, verify, upload), which a release does and this does not.

name: release

run-name: R0 measurement of ${{ github.ref_name }} (nothing is published)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile (a dev channel build is dev-release)"
        type: choice
        options: [dev-release, release]
        default: dev-release

permissions:
  contents: read

env:
  # Logs are read by a script, not by eyes.
  CARGO_TERM_COLOR: never

jobs:
  measure:
    name: r0 ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac-base, os: macos-latest, devmode: "false", jobs: "", bundles: app }
          - { id: mac-devmode, os: macos-latest, devmode: "true", jobs: "", bundles: app }
          - { id: mac-jobs2, os: macos-latest, devmode: "false", jobs: "2", bundles: app }
          - { id: linux-base, os: ubuntu-24.04, devmode: "false", jobs: "", bundles: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    # More than a release's 150: the point is to see how long it takes, and mac-jobs2 may take longer.
    timeout-minutes: 240
    env:
      PROFILE: ${{ inputs.profile }}
      BUNDLES: ${{ matrix.bundles }}
      # Not a signed build: ad-hoc, which is what a build by hand does. No updater key here.
      APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The measuring kit, and the first thing that runs, so memory is sampled from here on.
      - name: R0, the measuring kit
        shell: bash
        run: |
          set -euo pipefail
          R0_DIR="$RUNNER_TEMP/r0"
          mkdir -p "$R0_DIR/bin"
          echo "R0_DIR=$R0_DIR" >> "$GITHUB_ENV"
          export R0_DIR
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          {
            echo "VERSION=$base-dev.$GITHUB_RUN_NUMBER"
            echo "PURLIS_VERSION_STAMP=$base-dev.$GITHUB_RUN_NUMBER"
            echo "CARGO_LOG=cargo::core::compiler::fingerprint=info"
          } >> "$GITHUB_ENV"
          if [ -n "${{ matrix.jobs }}" ]; then echo "CARGO_BUILD_JOBS=${{ matrix.jobs }}" >> "$GITHUB_ENV"; fi
          {
            echo "variant: ${{ matrix.id }}  profile: $PROFILE  commit: $GITHUB_SHA"
            uname -a
            if [ "$RUNNER_OS" = macOS ]; then
              sw_vers
              sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
              sysctl vm.swapusage
            else
              nproc; free -m; swapon --show || true
            fi
            df -h "$GITHUB_WORKSPACE" || true
          } > "$R0_DIR/machine.txt" 2>&1
          cat "$R0_DIR/machine.txt"
          echo none > "$R0_DIR/current-step"
          nohup tools/r0/sample.sh > "$R0_DIR/sampler.out" 2>&1 &
          echo $! > "$R0_DIR/sampler.pid"

      - name: Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: tools/r0/step.sh linux-packages tools/linux-packages.sh install --tauri

      # As release.yml has it: the swap the Linux job has today.
      - name: More swap for the build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo fallocate -l 32G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          swapon --show

      - uses: ./.github/actions/rust-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: npm ci
        shell: bash
        working-directory: app
        run: |
          "$GITHUB_WORKSPACE/tools/r0/step.sh" npm-ci npm ci

      - name: Unreleased changelog fragments, into this build's CHANGELOG.md
        shell: bash
        run: tools/r0/step.sh changelog-fold node tools/changelog-fold.mjs

      - name: cargo-auditable
        shell: bash
        env:
          CARGO_AUDITABLE_VERSION: 0.7.6
        run: tools/r0/step.sh cargo-auditable-install cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"

      # The cost of running a program this machine has never seen, before and after developer
      # mode. `spctl developer-mode enable-terminal` is the documented switch; it takes effect for
      # processes whose responsible app is Terminal, so the probe and the whole build are the
      # evidence of whether a runner's job is one.
      - name: macOS developer mode, probe and switch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "--- before"; DevToolsSecurity -status 2>&1 || true; spctl developer-mode 2>&1 | head -5 || true
          } >> "$R0_DIR/devmode.txt"
          tools/r0/step.sh exec-probe-before tools/r0/exec-probe.sh before
          if [ "${{ matrix.devmode }}" = true ]; then
            tools/r0/step.sh enable-developer-mode sudo spctl developer-mode enable-terminal || echo "::warning::spctl developer-mode enable-terminal failed"
            { echo "--- after enable-terminal"; DevToolsSecurity -status 2>&1 || true; } >> "$R0_DIR/devmode.txt"
            tools/r0/step.sh exec-probe-after tools/r0/exec-probe.sh after
          fi
          cat "$R0_DIR/devmode.txt"

      # Time every link, and every dsymutil rustc runs (`split-debuginfo = "packed"`), by standing
      # between rustc and the real programs. Both shims record into $R0_DIR; the real programs are
      # run unchanged.
      - name: Time the links and dsymutil
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          var="CARGO_TARGET_$(echo "$triple" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "R0_REAL_CC=$(command -v cc)" >> "$GITHUB_ENV"
          echo "$var=$GITHUB_WORKSPACE/tools/r0/cc-shim.py" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            real=$(xcrun -f dsymutil)
            echo "R0_REAL_DSYMUTIL=$real" >> "$GITHUB_ENV"
            cp tools/r0/dsymutil-shim.py "$R0_DIR/bin/dsymutil"
            chmod +x "$R0_DIR/bin/dsymutil"
            echo "$R0_DIR/bin" >> "$GITHUB_PATH"
            echo "dsymutil: $real"
          fi
          echo "linker variable: $var"

      # Step 1 of the build job on main: the CLI and the extension.
      - name: CLI pass
        shell: bash
        run: |
          set -uo pipefail
          tools/r0/step.sh cli-pass bash -c '
            set -o pipefail
            cargo auditable build --profile "$PROFILE" --locked -p purlis-cli -p persona-statistics --timings -v 2>&1 \
              | python3 tools/r0/ts.py | tee "$R0_DIR/cli.log" | { grep -Ev "Running .|Fresh " || true; }'
          rc=$?
          cp target/cargo-timings/cargo-timing.html "$R0_DIR/timings-cli.html" || true
          exit $rc

      - name: Stage them where Tauri's bundler picks them up
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/src-tauri/binaries
          for name in purlis charter; do
            cp "target/$PROFILE/$name" "app/src-tauri/binaries/$name-$triple"
          done
          rm -rf app/src-tauri/extensions
          "target/$PROFILE/persona-statistics" assemble app/src-tauri/extensions/persona-statistics
          "target/$PROFILE/purlis" --version

      - name: This build's config
        shell: bash
        run: |
          jq --arg v "$VERSION" '. + {version: $v} | .bundle.createUpdaterArtifacts = false' \
            app/src-tauri/tauri.release.conf.json > app/src-tauri/tauri.build.conf.json

      - name: The AppImage bundler's tools, fetched ahead
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          fetch() {
            for try in 1 2 3 4; do
              gh release download "$1" --repo tauri-apps/binary-releases --pattern "$2" --output "$tools/$3" --clobber && break
              [ "$try" = 4 ] && exit 1
              echo "::warning::try $try of 4 to fetch $2 failed"; sleep $((try * 15))
            done
            chmod +x "$tools/$3"
          }
          fetch apprun-old AppRun-x86_64 AppRun-x86_64
          fetch linuxdeploy-07333c6 linuxdeploy-x86_64.AppImage linuxdeploy-07333c6-x86_64.AppImage

      # Step 2 of the build job on main: `tauri build`, which runs the front end, then its own
      # cargo, then bundles. The log's own timestamps say when the front end ended and cargo began.
      - name: Build the app
        shell: bash
        working-directory: app
        run: |
          set -uo pipefail
          "$GITHUB_WORKSPACE/tools/r0/step.sh" app-pass bash -c '
            set -o pipefail
            npx tauri build --config src-tauri/tauri.build.conf.json --bundles "$BUNDLES" \
              --runner "$GITHUB_WORKSPACE/tools/auditable-cargo" -- --profile "$PROFILE" --timings -v 2>&1 \
              | python3 "$GITHUB_WORKSPACE/tools/r0/ts.py" | tee "$R0_DIR/app.log" | { grep -Ev "Running .|Fresh " || true; }'
          rc=$?
          cp "$GITHUB_WORKSPACE/target/cargo-timings/cargo-timing.html" "$R0_DIR/timings-app.html" || true
          exit $rc

      # Always: a build that failed or ran out of time still has its numbers.
      - name: Summarise what was measured
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          kill "$(cat "$R0_DIR/sampler.pid")" 2>/dev/null || true
          cargo metadata --no-deps --format-version 1 > "$R0_DIR/metadata.json" || true
          grep -hE '\bDirty\b|dirty:|fingerprint dirty|^\S*\s*Fresh ' "$R0_DIR"/cli.log "$R0_DIR"/app.log > "$R0_DIR/rebuild-reasons.txt" || true
          for f in cli app; do [ -f "$R0_DIR/$f.log" ] && gzip -kf "$R0_DIR/$f.log" || true; done
          ls -la "$R0_DIR"
          python3 tools/r0/summarize.py "$R0_DIR" "${{ matrix.id }}" > /dev/null || true
          cat "$R0_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          # The two full logs are big; the artifact carries them gzipped and the timings HTML as is.
          rm -f "$R0_DIR/cli.log" "$R0_DIR/app.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r0-${{ matrix.id }}
          path: ${{ runner.temp }}/r0
          if-no-files-found: error
          retention-days: 30

  # The repository's total Actions cache use, for the ticket's last measurement. Reads only.
  cache-usage:
    name: r0 cache use
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Total and largest caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## Actions cache use of $GITHUB_REPOSITORY"
            echo
            gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" \
              --jq '"active caches: \(.active_caches_count), size: \(.active_caches_size_in_bytes / 1073741824 * 100 | round / 100) GiB (limit 10 GiB unless raised)"'
            echo
            echo "Largest 15 caches by key prefix:"
            echo
            echo '| key | MiB | last used |'
            echo '|---|---|---|'
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&sort=size_in_bytes&direction=desc" \
              --jq '.actions_caches[] | "| \(.key[0:70]) | \(.size_in_bytes / 1048576 | round) | \(.last_accessed_at) |"' | head -15
          } | tee -a "$GITHUB_STEP_SUMMARY"
