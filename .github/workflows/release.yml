# **R8 MEASUREMENT BRANCH. NEVER MERGED.** Ticket #7500, spec #7497, gate #7502, train R.
#
# This file replaces the release workflow on the branch `r8-7500-*` and on no other. It
# publishes nothing, signs nothing and holds no key: `workflow_dispatch` only, no environment, no
# secrets, `contents: read`. Start it with
#
#     gh workflow run release.yml --ref <this branch>
#
# A copy of #7499's baseline job (branch `r8-7499-macos-dev-release-baseline-lto-o-492wzsyc`,
# run 45581588745), with the same kit (`tools/r0`, copied unchanged but for the summarizer, which
# now also reads cargo's front-end and codegen sections, a first pass, binary sizes and a smoke
# check). It builds the very commit the baseline built (bc226329d, `BUILD_SHA`), so only the
# profile and the order differ. Five arms, three independent `macos-latest` jobs each:
#
#   base  the baseline again, unchanged, on the same day as the arms (a control for runner drift)
#   A     purlis-core and everything it needs first (`--bin purlis --bin charter --bin
#         persona-statistics` with the same `-p` set and features, so the units are the same
#         units), then the baseline's `tauri build`: the app lib compiles with nothing else
#   B     purlis-core at opt-level 1
#   C4    purlis-app at codegen-units 4 (its opt-level is already 1)
#   C1    purlis-app at codegen-units 1
#
# Every candidate is a `--config profile.dev-release.package.<crate>.<key>=<value>` on the cargo
# command line; Cargo.toml is not touched. Each job uploads `r8-<arm>-<n>`.

name: release

run-name: R8 contention arms (#7500) of ${{ github.ref_name }} (nothing is published)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Logs are read by a script, not by eyes.
  CARGO_TERM_COLOR: never
  # The commit #7499's baseline built (its branch's base on main).
  BUILD_SHA: bc226329d104d9f0fa3a6a4d91c9472a3efa1e58

jobs:
  measure:
    name: r8 ${{ matrix.arm }}-${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        arm: [base, A, B, C4, C1]
        run: [1, 2, 3]
        include:
          - arm: base
            cfg: ""
          - arm: A
            cfg: ""
            core_first: "true"
          - arm: B
            cfg: "--config profile.dev-release.package.purlis-core.opt-level=1"
          - arm: C4
            cfg: "--config profile.dev-release.package.purlis-app.codegen-units=4"
          - arm: C1
            cfg: "--config profile.dev-release.package.purlis-app.codegen-units=1"
    runs-on: macos-latest
    # Arm A compiles in two passes; 360 is a hosted job's own limit.
    timeout-minutes: 360
    env:
      # What a dev channel build is compiled with (`plan`'s `profile` on main).
      PROFILE: dev-release
      R8_CFG: ${{ matrix.cfg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false

      # The kit is this branch's; the source is the baseline's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .r8kit
          sparse-checkout: tools/r0
          persist-credentials: false

      # The measuring kit, and the first thing that runs, so memory is sampled from here on.
      - name: R8, the measuring kit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/r0 && cp -R .r8kit/tools/r0 tools/r0 && rm -rf .r8kit
          R0_DIR="$RUNNER_TEMP/r8"
          mkdir -p "$R0_DIR/bin"
          echo "R0_DIR=$R0_DIR" >> "$GITHUB_ENV"
          export R0_DIR
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          {
            echo "VERSION=$base-dev.$GITHUB_RUN_NUMBER"
            echo "PURLIS_VERSION_STAMP=$base-dev.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
          {
            echo "job: ${{ matrix.arm }}-${{ matrix.run }}  profile: $PROFILE  source: $(git rev-parse HEAD)  cfg: ${R8_CFG:-none}  core first: ${{ matrix.core_first || 'false' }}"
            uname -a
            sw_vers
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
            sysctl vm.swapusage
            df -h "$GITHUB_WORKSPACE" || true
          } > "$R0_DIR/machine.txt" 2>&1
          cat "$R0_DIR/machine.txt"
          echo none > "$R0_DIR/current-step"
          nohup tools/r0/sample.sh > "$R0_DIR/sampler.out" 2>&1 &
          echo $! > "$R0_DIR/sampler.pid"

      - uses: ./.github/actions/rust-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: npm ci
        shell: bash
        working-directory: app
        run: |
          "$GITHUB_WORKSPACE/tools/r0/step.sh" npm-ci npm ci

      - name: Unreleased changelog fragments, into this build's CHANGELOG.md
        shell: bash
        run: tools/r0/step.sh changelog-fold node tools/changelog-fold.mjs

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-auditable@0.7.6

      - name: The macOS deployment target every compile uses
        shell: bash
        run: |
          set -euo pipefail
          target=$(jq -r '.bundle.macOS.minimumSystemVersion // "10.13"' app/src-tauri/tauri.conf.json)
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"

      # Time every link, and every dsymutil rustc runs (`split-debuginfo = "packed"`), by standing
      # between rustc and the real programs. Both record into $R0_DIR; the real programs run
      # unchanged.
      - name: Time the links and dsymutil
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          var="CARGO_TARGET_$(echo "$triple" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "R0_REAL_CC=$(command -v cc)" >> "$GITHUB_ENV"
          echo "$var=$GITHUB_WORKSPACE/tools/r0/cc-shim.py" >> "$GITHUB_ENV"
          real=$(xcrun -f dsymutil)
          echo "R0_REAL_DSYMUTIL=$real" >> "$GITHUB_ENV"
          cp tools/r0/dsymutil-shim.py "$R0_DIR/bin/dsymutil"
          chmod +x "$R0_DIR/bin/dsymutil"
          echo "$R0_DIR/bin" >> "$GITHUB_PATH"

      - name: This build's config
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg v "$VERSION" '{version: $v, build: {beforeBuildCommand: ""}}' \
            > app/src-tauri/tauri.compile.conf.json
          cat app/src-tauri/tauri.compile.conf.json

      - name: The front end the app embeds
        shell: bash
        working-directory: app
        run: |
          "$GITHUB_WORKSPACE/tools/r0/step.sh" front-end npm run build

      # **Arm A's first pass**: everything the CLI and the extension need, purlis-core and its
      # whole closure among it, through the same runner, with the same `-p` set and the feature
      # Tauri adds, so cargo resolves the same features and these are the app pass's own units
      # (checked before this branch was cut with `cargo build --unit-graph`; the summary says
      # whether the app pass compiled purlis-core again).
      - name: Arm A, purlis-core first
        if: matrix.core_first == 'true'
        shell: bash
        env:
          CARGO_TERM_VERBOSE: "true"
        run: |
          set -uo pipefail
          tools/r0/step.sh core-pass bash -c '
            set -o pipefail
            tools/auditable-cargo build --profile "$PROFILE" --locked \
              -p purlis-app -p purlis-cli -p persona-statistics --features tauri/custom-protocol \
              --bin purlis --bin charter --bin persona-statistics --timings $R8_CFG \
              2>&1 | python3 tools/r0/ts.py | tee "$R0_DIR/core.log" | { grep -Ev "Running .|Fresh " || true; }'
          rc=$?
          cp target/cargo-timings/cargo-timing.html "$R0_DIR/timings-core.html" || true
          exit $rc

      # **The one cargo run**, as main has it (R1, #7380), plus `--timings` and the arm's config.
      - name: Compile the app, the purlis binary and the built-in extensions
        shell: bash
        working-directory: app
        env:
          CARGO_TERM_VERBOSE: "true"
        run: |
          set -uo pipefail
          "$GITHUB_WORKSPACE/tools/r0/step.sh" app-pass bash -c '
            set -o pipefail
            npx tauri build --no-bundle --config src-tauri/tauri.compile.conf.json \
              --runner "$GITHUB_WORKSPACE/tools/auditable-cargo" \
              -- --profile "$PROFILE" --locked -p purlis-app -p purlis-cli -p persona-statistics --timings $R8_CFG \
              2>&1 | python3 "$GITHUB_WORKSPACE/tools/r0/ts.py" | tee "$R0_DIR/app.log" | { grep -Ev "Running .|Fresh " || true; }'
          rc=$?
          cp "$GITHUB_WORKSPACE/target/cargo-timings/cargo-timing.html" "$R0_DIR/timings-app.html" || true
          exit $rc

      # Still a usable dev build: the sizes, `purlis --version`, and the app's own binary still
      # running 30 s after it starts (only the PID this step started is stopped).
      - name: Sizes, and the binaries still run
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          t="target/$PROFILE"
          for f in purlis-app purlis charter persona-statistics; do
            [ -f "$t/$f" ] && printf '%s\t%s\n' "$f" "$(stat -f %z "$t/$f")" >> "$R0_DIR/sizes.tsv"
            [ -d "$t/$f.dSYM" ] && printf '%s\t%s\n' "$f.dSYM" "$(( $(du -sk "$t/$f.dSYM" | cut -f1) * 1024 ))" >> "$R0_DIR/sizes.tsv"
          done
          cat "$R0_DIR/sizes.tsv" || true
          {
            echo "purlis --version: $("$t/purlis" --version 2>&1; echo " (exit $?)")"
            if [ -x "$t/purlis-app" ]; then
              "$t/purlis-app" > "$R0_DIR/app-run.log" 2>&1 &
              pid=$!
              sleep 30
              if kill -0 "$pid" 2>/dev/null; then
                echo "purlis-app: still running after 30 s"
                kill "$pid"; wait "$pid" 2>/dev/null || true
              else
                wait "$pid"; echo "purlis-app: exited within 30 s, status $?"
                tail -20 "$R0_DIR/app-run.log"
              fi
            else
              echo "purlis-app: not built"
            fi
          } > "$R0_DIR/smoke.txt" 2>&1
          cat "$R0_DIR/smoke.txt"

      # Always: a build that failed or ran out of time still has its numbers.
      - name: Summarise what was measured
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          kill "$(cat "$R0_DIR/sampler.pid")" 2>/dev/null || true
          for f in app core; do [ -f "$R0_DIR/$f.log" ] && gzip -kf "$R0_DIR/$f.log"; done
          ls -la "$R0_DIR"
          python3 tools/r0/summarize.py "$R0_DIR" "${{ matrix.arm }}-${{ matrix.run }}" > /dev/null || true
          cat "$R0_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          echo "R8-SUMMARY-JSON $(python3 -c 'import json,sys;print(json.dumps(json.load(open(sys.argv[1]))))' "$R0_DIR/summary.json" 2>/dev/null)"
          rm -f "$R0_DIR/app.log" "$R0_DIR/core.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r8-${{ matrix.arm }}-${{ matrix.run }}
          path: ${{ runner.temp }}/r8
          if-no-files-found: error
          retention-days: 30
