# **R7 MEASUREMENT BRANCH. NEVER MERGED.** Ticket "Release R7: measure what thin LTO costs a dev
# build", spec #7324, train R.
#
# This file replaces the release workflow on the branch `release-r7-measure-*` and on no other.
# It publishes nothing, signs nothing and holds no key: `workflow_dispatch` only, no environment,
# no secrets, `contents: read`. Start it with
#
#     gh workflow run release.yml --ref <this branch>
#
# One dispatch makes twelve build jobs, each a dev build (profile `dev-release`) on a standard
# runner, with R1's one compile (`tauri build --no-bundle -- -p purlis-app -p purlis-cli
# -p persona-statistics`, through cargo-auditable), and no bundling: the ticket asks for the
# compile, the link, the binary and its start. They differ in one thing, the link-time
# optimisation, set through `CARGO_PROFILE_DEV_RELEASE_LTO`:
#
#   thin        what main has today (`lto = "thin"`, ADR 0092)
#   thin-local  Cargo's `lto = false`: thin LTO inside each crate across its own codegen units,
#               and no cross-crate pass. Cargo has no value spelled "thin-local"; `false` is it.
#   off         `lto = "off"`: no LTO at all, not even inside a crate
#
# Each setting runs twice per platform, as separate matrix entries (`a` and `b`), because
# runners vary widely (dev builds took 23 to 101 min).
#
# Each job uploads one artifact, `r7-<id>`: the cargo `--timings` HTML, the gzipped timestamped
# `-v` log, every link and every dsymutil run with its seconds, the memory samples, the step times,
# the binary sizes, `coldstart.json` (the repository's own `tools/bench.mjs` cold-start arm: five
# launches to the first frame on a fresh profile, after one discarded warm-up) and `summary.md` /
# `summary.json` (also the job's step summary).
#
# Not measured here: bundling, signing and uploads (about 5 min on main, from R1's log).

name: release

run-name: R7 measurement of ${{ github.ref_name }} (nothing is published)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Logs are read by a script, not by eyes.
  CARGO_TERM_COLOR: never
  PROFILE: dev-release

jobs:
  measure:
    name: r7 ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac-thin-a, os: macos-latest, lto: thin, label: thin }
          - { id: mac-thin-b, os: macos-latest, lto: thin, label: thin }
          - { id: mac-thinlocal-a, os: macos-latest, lto: "false", label: thin-local }
          - { id: mac-thinlocal-b, os: macos-latest, lto: "false", label: thin-local }
          - { id: mac-off-a, os: macos-latest, lto: "off", label: off }
          - { id: mac-off-b, os: macos-latest, lto: "off", label: off }
          - { id: linux-thin-a, os: ubuntu-24.04, lto: thin, label: thin }
          - { id: linux-thin-b, os: ubuntu-24.04, lto: thin, label: thin }
          - { id: linux-thinlocal-a, os: ubuntu-24.04, lto: "false", label: thin-local }
          - { id: linux-thinlocal-b, os: ubuntu-24.04, lto: "false", label: thin-local }
          - { id: linux-off-a, os: ubuntu-24.04, lto: "off", label: off }
          - { id: linux-off-b, os: ubuntu-24.04, lto: "off", label: off }
    runs-on: ${{ matrix.os }}
    # More than a real job's 150: the point is to see how long it takes.
    timeout-minutes: 200
    env:
      LTO_SETTING: ${{ matrix.lto }}
      # The setting under test, exactly as the ticket says: through this variable.
      CARGO_PROFILE_DEV_RELEASE_LTO: ${{ matrix.lto }}
      # Not a signed build: ad-hoc, which is what a build by hand does.
      APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The measuring kit, and the first thing that runs, so memory is sampled from here on.
      - name: R7, the measuring kit
        shell: bash
        run: |
          set -euo pipefail
          R7_DIR="$RUNNER_TEMP/r7"
          mkdir -p "$R7_DIR/bin"
          echo "R7_DIR=$R7_DIR" >> "$GITHUB_ENV"
          export R7_DIR
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          {
            echo "VERSION=$base-dev.$GITHUB_RUN_NUMBER"
            echo "PURLIS_VERSION_STAMP=$base-dev.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
          {
            echo "variant: ${{ matrix.id }}  lto: ${{ matrix.label }} (CARGO_PROFILE_DEV_RELEASE_LTO=${{ matrix.lto }})  profile: $PROFILE  commit: $GITHUB_SHA"
            uname -a
            if [ "$RUNNER_OS" = macOS ]; then
              sw_vers
              sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
              sysctl vm.swapusage
            else
              nproc; free -m; swapon --show || true
            fi
            df -h "$GITHUB_WORKSPACE" || true
          } > "$R7_DIR/machine.txt" 2>&1
          cat "$R7_DIR/machine.txt"
          echo none > "$R7_DIR/current-step"
          nohup tools/r7/sample.sh > "$R7_DIR/sampler.out" 2>&1 &
          echo $! > "$R7_DIR/sampler.pid"

      - name: Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: tools/r7/step.sh linux-packages tools/linux-packages.sh install --tauri

      # As release.yml has it: the swap the Linux job has today.
      - name: More swap for the build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo fallocate -l 32G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          swapon --show

      - uses: ./.github/actions/rust-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: npm ci
        shell: bash
        working-directory: app
        run: |
          "$GITHUB_WORKSPACE/tools/r7/step.sh" npm-ci npm ci

      - name: Unreleased changelog fragments, into this build's CHANGELOG.md
        shell: bash
        run: tools/r7/step.sh changelog-fold node tools/changelog-fold.mjs

      # As release.yml's build job installs it.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-auditable@0.7.6

      # What release.yml's build job sets, from the same config.
      - name: The macOS deployment target every compile uses
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          target=$(jq -r '.bundle.macOS.minimumSystemVersion // "10.13"' app/src-tauri/tauri.conf.json)
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"

      # Before 90 minutes are spent: does the setting reach rustc as the label says? A scratch
      # crate with a `dev-release` profile of its own, built with this job's environment variable
      # and `-v`. Cargo has no `lto = "thin-local"`: `false` is it, and passes no `-C lto` at all
      # (an `off` passes `-C lto=off`, a `thin` passes `-C lto=thin`).
      - name: The setting reaches rustc
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/lto-probe"
          mkdir -p "$scratch/src"
          cat > "$scratch/Cargo.toml" <<'TOML'
          [package]
          name = "lto-probe"
          version = "0.0.0"
          edition = "2021"
          [profile.release]
          codegen-units = 16
          lto = "thin"
          [profile.dev-release]
          inherits = "release"
          lto = "thin"
          codegen-units = 16
          TOML
          echo 'fn main() {}' > "$scratch/src/main.rs"
          (cd "$scratch" && cargo build -v --profile "$PROFILE" 2>&1 | tee "$R7_DIR/lto-probe.log")
          line=$(grep -E 'Running .*--crate-name lto_probe' "$R7_DIR/lto-probe.log" | head -1)
          flag=$(grep -oE '(-C|-Clto)[ =]?lto(=[a-z]+)?' <<<"$line" | head -1 || true)
          echo "setting '$LTO_SETTING' reached rustc as: '${flag:-no lto flag}'"
          case "$LTO_SETTING" in
            thin)  grep -qE 'lto=thin' <<<"$line" ;;
            off)   grep -qE 'lto=off' <<<"$line" ;;
            false) ! grep -qE 'lto=' <<<"$line" ;;
          esac || { echo "::error::CARGO_PROFILE_DEV_RELEASE_LTO=$LTO_SETTING did not give rustc what '${{ matrix.label }}' means"; exit 1; }
          echo "reached=${flag:-no lto flag}" > "$R7_DIR/lto-probe.txt"

      # Time every link, and every dsymutil rustc runs (`split-debuginfo = "packed"`), by standing
      # between rustc and the real programs. Both shims record into $R7_DIR; the real programs are
      # run unchanged.
      - name: Time the links and dsymutil
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          var="CARGO_TARGET_$(echo "$triple" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "R7_REAL_CC=$(command -v cc)" >> "$GITHUB_ENV"
          echo "$var=$GITHUB_WORKSPACE/tools/r7/cc-shim.py" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            real=$(xcrun -f dsymutil)
            echo "R7_REAL_DSYMUTIL=$real" >> "$GITHUB_ENV"
            cp tools/r7/dsymutil-shim.py "$R7_DIR/bin/dsymutil"
            chmod +x "$R7_DIR/bin/dsymutil"
            echo "$R7_DIR/bin" >> "$GITHUB_PATH"
            echo "dsymutil: $real"
          fi
          echo "linker variable: $var"

      # The two configs, as release.yml's build job writes them.
      - name: This build's config
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg v "$VERSION" '{version: $v, build: {beforeBuildCommand: ""}}' \
            > app/src-tauri/tauri.compile.conf.json

      - name: The front end the app embeds
        shell: bash
        working-directory: app
        run: |
          "$GITHUB_WORKSPACE/tools/r7/step.sh" front-end npm run build

      # R1's one cargo run, as release.yml has it, plus `--timings`. `CARGO_TERM_VERBOSE` is what
      # release.yml sets; the log is timestamped by `ts.py` and kept gzipped. No secret: the
      # Report intake's address is left unset, which is no address.
      - name: Compile the app, the purlis binary and the built-in extensions
        shell: bash
        working-directory: app
        env:
          CARGO_TERM_VERBOSE: "true"
        run: |
          set -uo pipefail
          "$GITHUB_WORKSPACE/tools/r7/step.sh" compile bash -c '
            set -o pipefail
            npx tauri build --no-bundle --config src-tauri/tauri.compile.conf.json \
              --runner "$GITHUB_WORKSPACE/tools/auditable-cargo" \
              -- --profile "$PROFILE" --locked -p purlis-app -p purlis-cli -p persona-statistics --timings 2>&1 \
              | python3 "$GITHUB_WORKSPACE/tools/r7/ts.py" | tee "$R7_DIR/compile.log" | { grep -Ev "Running .|Fresh " || true; }'
          rc=$?
          cp "$GITHUB_WORKSPACE/target/cargo-timings/cargo-timing.html" "$R7_DIR/timings.html" || true
          exit $rc

      # What the link left: the sizes the ticket asks for (the binaries are stripped, `strip = true`;
      # the dSYM or dwp beside each is the debug info, listed apart).
      - name: Binary sizes
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$R7_DIR/sizes.tsv"
          import os, glob
          t = os.path.join(os.environ["GITHUB_WORKSPACE"], "target", os.environ["PROFILE"])
          def size(p):
              if os.path.isdir(p):
                  return sum(os.path.getsize(os.path.join(a, f)) for a, _, fs in os.walk(p) for f in fs)
              return os.path.getsize(p)
          for name in ("purlis-app", "purlis", "charter", "persona-statistics"):
              p = os.path.join(t, name)
              if os.path.exists(p):
                  print("%s\t%d" % (name, size(p)))
          for p in sorted(glob.glob(os.path.join(t, "*.dSYM")) + glob.glob(os.path.join(t, "*.dwp"))):
              print("%s\t%d" % (os.path.basename(p), size(p)))
          PY
          cat "$R7_DIR/sizes.tsv"
          ls -la "target/$PROFILE" | head -40

      # The app's cold start, by the repository's own probe: `tools/bench.mjs`'s cold-start arm
      # launches the built app, as it ships, until its window says the first frame is on screen
      # (what `first_frame` prints when CHARTER_BENCH_LOG is set), once discarded for the cold
      # disk and then five times, each on a fresh HOME. The same probe that `ci.yml`'s app job
      # runs on Linux for ADR 0086's L6. `--evidence`: a miss of the 2 s limit is a warning, since
      # this run measures and decides nothing. It may fail on a runner with no display; then the
      # run has binary size only, and says so. Linux goes through `coldstart-linux.sh`, which
      # starts its own X server.
      - name: Cold start, five launches
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/target/$PROFILE/purlis-app"
          if [ "$RUNNER_OS" = Linux ]; then
            tools/r7/step.sh cold-start env APP="$app" EVIDENCE_ONLY=1 tools/coldstart-linux.sh bare 2>&1 | tee "$R7_DIR/coldstart.log"
          else
            tools/r7/step.sh cold-start node tools/bench.mjs --skip-build --only coldstart --app "$app" \
              --cold-starts 5 --warm-up --fresh-profile --evidence --case "${{ matrix.id }}" 2>&1 | tee "$R7_DIR/coldstart.log"
          fi
          rc=${PIPESTATUS[0]}
          latest=$(ls -d target/bench/*/ 2>/dev/null | tail -1)
          if [ -n "$latest" ] && [ -f "$latest/results.json" ]; then cp "$latest/results.json" "$R7_DIR/coldstart.json"; fi
          exit $rc

      # Always: a build that failed or ran out of time still has its numbers.
      - name: Summarise what was measured
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          kill "$(cat "$R7_DIR/sampler.pid")" 2>/dev/null || true
          [ -f "$R7_DIR/compile.log" ] && gzip -kf "$R7_DIR/compile.log" || true
          ls -la "$R7_DIR"
          python3 tools/r7/summarize.py "$R7_DIR" "${{ matrix.id }}" "${{ matrix.label }}" > /dev/null || true
          cat "$R7_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$R7_DIR/compile.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r7-${{ matrix.id }}
          path: ${{ runner.temp }}/r7
          if-no-files-found: error
          retention-days: 30
