# **The sandbox scenarios on this runner** (M74.1, T1.1-09 and T1.1-54), Linux or macOS: what the
# scenarios need, the test build, then each set asked for through `tools/sandbox-scenarios.sh`,
# with no retries, the fixture and e2e covers this OS owes (`tools/scenario-covers.mjs`), and the
# run-result gate step over the legs this job ran. `sandbox-scenarios.yml`'s jobs and
# `.github/actions/nightly` run it; the job's checkout comes first, and a red run's artifacts are
# the caller's to upload (`target/sandbox-scenarios/`, `target/nextest/ci/junit.xml`).
name: Sandbox scenarios
description: Builds purlis-app's tests and runs the sandbox scenario sets asked for, with no retries.
inputs:
  suite:
    description: "true to run the suite (every scenario but the production-timing entries)."
    required: false
    default: "true"
  production-timings:
    description: "true to run the production-timing entries (ticket 54)."
    required: false
    default: "false"
  stress:
    description: "true to run each set 20 times under a CPU stress (the stress-x20 label)."
    required: false
    default: "false"
  repeat:
    description: "How many times to run the suite, its batches shuffled each time and the verdicts compared: 3 for the nightly."
    required: false
    default: "1"
  trigger:
    description: "What started this run, for the gate step: pull_request, label, merge_group or nightly."
    required: false
    default: "pull_request"
  base:
    description: "The commit this change is measured against, for the stress run's changed batches."
    required: false
    default: ""
  github-token:
    description: "The token that opens a flaky scenario's issue (issues: write). Only the nightly's compare step holds it, never a test step; elsewhere the compare is a dry run."
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Tauri's build dependencies for purlis-app's test binary, and the programs a sandboxed chat
    # runs through on Linux (bubblewrap and socat, as the `rust` job installs them).
    - name: Tauri's Linux build dependencies, and the sandbox's programs
      if: runner.os == 'Linux'
      uses: ./.github/actions/linux-packages
      with:
        tauri: true
        packages: bubblewrap socat${{ inputs.stress == 'true' && ' stress-ng' || '' }}
    # bubblewrap makes the chat's user namespace, which Ubuntu 24.04's AppArmor refuses an
    # unprivileged program by default: purlis's own Linux wrap needs it, as on a person's machine
    # that allows it (the `rust` job does the same).
    - name: User namespaces for purlis's Linux wrap
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: The CPU stress
      if: runner.os == 'macOS' && inputs.stress == 'true'
      shell: bash
      run: brew install stress-ng
    - uses: ./.github/actions/rust-toolchain
    # Only `main` saves a Rust cache: restore what its `rust` job (Linux) or `app` job (macOS) saved.
    # The `rust` job keys its cache by its id, so `rust` here is that key.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ runner.os == 'macOS' && 'app' || 'rust' }}
        save-if: false
    # The same nextest `ci.yml`'s NEXTEST_VERSION names (`sandbox-scenarios.test.mjs` holds them equal).
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-nextest@0.9.146
    # **`glab`, for the fake forge's cells** (T1.1-50): `gh` is on both runners' images, `glab` is
    # on neither. Linux builds it from its tagged source with the Go its image carries (the Go
    # module proxy's checksum database verifies it); the macOS image has no Go, so Homebrew's
    # bottle. Either way it is on the PATH the scenarios inherit, and a cell that finds no `glab`
    # on CI fails; it never skips.
    - name: glab, for the fake forge's cells
      shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then
          brew install glab
        else
          go install gitlab.com/gitlab-org/cli/cmd/glab@v1.119.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        fi
    # tauri::generate_context! reads the built frontend, so it has to exist before a build. Built
    # in a step of its own, so the step timings say how much of the job is the build.
    #
    # On macOS the build names `fake-harness` and `purlis-cli` too, so the programs the tests run
    # are built here, once (#2464, T1.1-06): without them every test process that starts before
    # one exists builds it itself (`purlis_core::testrun::built`), with another set of features,
    # one after another on Cargo's lock, and the first tests of a run waited 300 to 450 s on it.
    #
    # On Linux the build is the `rust` job's own (`--workspace`), so the features Cargo resolves,
    # and so the objects its cache holds, are the same. The scenarios run with the same packages
    # (`CARGO_PACKAGES`, `tools/sandbox-scenarios.sh`), so the run builds nothing more.
    - name: Build the scenarios
      shell: bash
      env:
        CARGO_PACKAGES: ${{ runner.os == 'Linux' && '--workspace' || '-p purlis-app -p purlis-scenarios -p fake-harness -p purlis-cli' }}
      run: |
        mkdir -p app/dist
        cargo nextest run $CARGO_PACKAGES --locked --no-run
    # **The scenario host's kit** (T1.1-06): the `purlis` its chats run (hooks, `purlis _sandbox`,
    # git hooks, shims) and, on Linux, the `purlis-app` `in_a_host_process_at` runs as the host,
    # each built apart from the test build into a target folder of its own. A test invocation
    # turns `fenced` and `test-support` on (`crates/purlis-cli/Cargo.toml`); these have neither,
    # and neither replaces, or is replaced by, the test build's binaries. The scenario host fails
    # on CI without them (`app/src-tauri/src/scenarios/host.rs`).
    - name: The scenario kit, built apart from the tests
      shell: bash
      run: |
        cargo build --locked -p purlis-cli --bin purlis --target-dir target/scenario-kit
        echo "PURLIS_BINARY=$PWD/target/scenario-kit/debug/purlis" >> "$GITHUB_ENV"
        # The run-result gate (below), built here and not run through cargo after the suite: a
        # cargo run then finds the workspace's test build stale and builds it again.
        cargo build --locked -p purlis-scenarios --bin scenarios-gate --target-dir target/scenario-kit
        if [ "$RUNNER_OS" = Linux ]; then
          cargo build --locked -p purlis-app --bin purlis-app --target-dir target/scenario-kit
          echo "PURLIS_HOST_APP=$PWD/target/scenario-kit/debug/purlis-app" >> "$GITHUB_ENV"
        fi
    # **The pinned Claude Code, for the Claude Code leg** (T1.1-10, #6857): the version
    # `tests/fixtures/harness-versions/claude.txt` pins, from the committed lockfile with no install
    # scripts run, named by `PURLIS_CLAUDE_CODE`. The leg starts it through the scenario host's own
    # chat start, under its own sandbox, against a stand-in model on a loopback port: no model is
    # called and no credential is used. macOS only: on Linux purlis wraps Claude Code itself
    # (ticket 53), and the leg is reported not run. On macOS a leg without it fails.
    - name: The pinned Claude Code, for the Claude Code leg
      if: runner.os == 'macOS'
      shell: bash
      run: |
        version=$(sed 's/ .*//' tests/fixtures/harness-versions/claude.txt)
        case "$RUNNER_ARCH" in
          ARM64) arch=arm64 ;;
          X64) arch=x64 ;;
          *) echo "::error::no Claude Code build for $RUNNER_ARCH"; exit 1 ;;
        esac
        package="@anthropic-ai/claude-code-darwin-$arch"
        mkdir -p "$RUNNER_TEMP/claude-code"
        cp tests/fixtures/harness-versions/claude-code/package.json tests/fixtures/harness-versions/claude-code/package-lock.json "$RUNNER_TEMP/claude-code/"
        locked=$(jq -r --arg p "node_modules/$package" '.packages[$p].version' "$RUNNER_TEMP/claude-code/package-lock.json")
        if [ "$locked" != "$version" ]; then
          echo "::error::the lockfile holds $package $locked and claude.txt says $version"
          exit 1
        fi
        (cd "$RUNNER_TEMP/claude-code" && npm ci --ignore-scripts --no-audit --no-fund)
        echo "PURLIS_CLAUDE_CODE=$RUNNER_TEMP/claude-code/node_modules/$package/claude" >> "$GITHUB_ENV"
    # Each set judges itself: a red suite does not hide the production-timing entries' verdicts.
    - name: The sandbox scenarios
      if: ${{ !cancelled() && inputs.suite == 'true' }}
      shell: bash
      env:
        STRESS: ${{ inputs.stress }}
        REPEAT: ${{ inputs.repeat }}
        # The nightly's shuffle: a new order each night, the same for every OS that night.
        SHUFFLE_SEED: ${{ inputs.repeat != '1' && github.run_id || '' }}
        BASE: ${{ inputs.base }}
        CARGO_PACKAGES: ${{ runner.os == 'Linux' && '--workspace' || '-p purlis-app -p purlis-scenarios -p fake-harness -p purlis-cli' }}
      run: tools/sandbox-scenarios.sh suite
    - name: The production-timing entries
      if: ${{ !cancelled() && inputs.production-timings == 'true' }}
      shell: bash
      env:
        STRESS: ${{ inputs.stress }}
        BASE: ${{ inputs.base }}
        # The nightly takes M-NET-25 at its real 15 minutes; the label and the queue skip it (Q300).
        SCENARIOS_TRIGGER: ${{ inputs.trigger }}
        CARGO_PACKAGES: ${{ runner.os == 'Linux' && '--workspace' || '-p purlis-app -p purlis-scenarios -p fake-harness -p purlis-cli' }}
      run: tools/sandbox-scenarios.sh production-timings
    # **The flaky scenarios' issues** (T1.1-54): after every test step, in a step of its own, the
    # only one that holds `GH_TOKEN`, and only on the nightly: each set's runs are compared (the
    # test steps compared them already) and an entry that differs opens, or comments on, a public
    # issue. A pull request's `stress-x20` run, and anything not the nightly, is a dry run: it
    # prints what would open and opens none.
    - name: Flaky scenarios, compared across the runs
      if: ${{ !cancelled() && (inputs.repeat != '1' || inputs.stress == 'true') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.trigger == 'nightly' && inputs.github-token || '' }}
        SOURCE: ${{ inputs.stress == 'true' && 'stress-x20' || 'nightly' }}
        HOW: ${{ inputs.trigger == 'nightly' && '--open' || '--dry-run' }}
      run: |
        status=0
        for dir in target/sandbox-scenarios-runs/*/; do
          [ -d "$dir" ] || continue
          echo "::group::$dir"
          node tools/scenario-legs.mjs flaky "$dir" --source "$SOURCE" "$HOW" || status=1
          echo "::endgroup::"
        done
        exit "$status"
    # **The fixture and e2e covers this OS owes** (T1.1-54): each named test runs on the OS its
    # cover names, through the setup the repo already has, and writes its record in ticket 5's
    # schema beside the legs' (`target/sandbox-scenarios/<os>-covers.jsonl`). `macos-live-check`
    # and `live:` covers are not run here.
    - name: Which fixture and e2e covers run on this OS
      id: covers
      shell: bash
      run: node tools/scenario-covers.mjs plan ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
    - name: The fixture covers
      if: ${{ !cancelled() && steps.covers.outputs.fixtures != '0' }}
      shell: bash
      run: node tools/scenario-covers.mjs run ${{ runner.os == 'macOS' && 'macos' || 'linux' }} fixture
    # The e2e specs through the existing WebdriverIO setup (`ci.yml`'s `scenario` jobs): the app
    # built with the `e2e` feature, then `npm run e2e` for each named spec. Counted in this job's
    # budget, which is why it runs only when a cover names one.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: ${{ !cancelled() && steps.covers.outputs.e2e != '0' }}
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: The e2e covers' app build
      if: ${{ !cancelled() && steps.covers.outputs.e2e != '0' }}
      shell: bash
      working-directory: app
      run: |
        npm ci
        npx tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json -- -p purlis-app -p fake-harness -p purlis-cli
    - name: The e2e covers
      if: ${{ !cancelled() && steps.covers.outputs.e2e != '0' }}
      shell: bash
      run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}node tools/scenario-covers.mjs run ${{ runner.os == 'macOS' && 'macos' || 'linux' }} e2e
    # **The run-result gate step** (T1.1-08's `judge_runs`, T1.1-54): every covered entry the legs
    # this job ran owe a verdict has a pass, or a pinned `expected_fail`, in its report, so a cell a
    # loader, filter or shard never picked up cannot pass silently. A pull request's merge check
    # reads the jobs its head ran (its labels decide which); the nightly's entries and the merge
    # queue run every leg's job, so every leg is judged there. `live:` covers are ticket 44's.
    - name: The run-result gate
      if: ${{ !cancelled() }}
      shell: bash
      env:
        TRIGGER: ${{ inputs.trigger }}
        OS_WORD: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
        SUITE: ${{ inputs.suite }}
        PRODUCTION: ${{ inputs.production-timings }}
      run: |
        ran="fixture:$OS_WORD:scaled,e2e:$OS_WORD:scaled"
        [ "$SUITE" != true ] || ran="$ran,fake:$OS_WORD:scaled"
        [ "$PRODUCTION" != true ] || ran="$ran,fake:$OS_WORD:production"
        target/scenario-kit/debug/scenarios-gate target/sandbox-scenarios "$TRIGGER" "$ran"
