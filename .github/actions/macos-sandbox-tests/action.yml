# **The macOS sandbox tests, under Seatbelt for real**: the steps `ci.yml`'s
# `studio-confinement-macos` runs when the confinement changes, held once here so the sandbox
# scenarios' macOS job (`sandbox-scenarios.yml`, M74.1 T1.1-09) and the nightly on `phase-1-proven`
# (`.github/actions/nightly`) run the same targets, without that job's path filter or draft skip.
# Red fails: no step is let off. The job's checkout must come first.
name: macOS sandbox tests
description: Runs purlis's sandbox test targets under Seatbelt on a macOS runner, failing on red.
inputs:
  purlis-app:
    description: "true to run purlis-app's sandbox tests too, which build the app's test binary (M74.1)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-toolchain
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # The macOS `app` job's cache, which `main` saves. With no shared key, this job's key
        # is its own name, which nothing saves, so every run built every dependency cold.
        shared-key: app
        save-if: false
    # The names the studio probe's network tests look up, from the hosts file, not outside DNS
    # (#3261): see the action for which names and why.
    - name: The studio probe's names
      uses: ./.github/actions/studio-probe-names
    # Node, for a Claude Code chat's server dialling in to its door (#3316).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        package-manager-cache: false
        node-version: "22"
    - name: The studio probe, confined by Seatbelt
      shell: bash
      run: cargo test --locked -p studio-probe
    # A wrapped chat's own compiled profile, applied for real: no port bound, nothing listening.
    - name: A wrapped chat listens nowhere, confined by Seatbelt
      shell: bash
      run: |
        tools/tests-ran.sh -- cargo test --locked -p purlis-core --test it -- a_sandboxed_chat_listens_nowhere_under_seatbelt::
    # A chat allowed to serve on a port, under its own compiled profile for real (#2019): its
    # own socket and no TCP port, reached through purlis's door alone.
    - name: A chat's server behind its door, confined by Seatbelt
      shell: bash
      run: tools/tests-ran.sh -- cargo test --locked -p purlis-core --lib -- sandbox::localport::tests::under_seatbelt
    # A wrapped chat's ssh under its own line for real (#5897): its route's `ProxyCommand`, this
    # build's `purlis _ssh-proxy`, runs inside Seatbelt and reaches the chat's SOCKS port; a
    # host the route does not list, and a direct ssh around it, stay refused. The Linux `rust`
    # job runs the same test under purlis's own wrap.
    - name: A chat's ssh through its route from inside its sandbox, confined by Seatbelt
      shell: bash
      run: |
        tools/tests-ran.sh -- cargo test --locked -p purlis-cli --test it -- a_chats_ssh_route_carries_from_inside_its_sandbox::
    # A brokered `secret exec` child under its run's real profile: the network through its
    # proxy alone, never a direct connection to this Mac or past it.
    - name: A brokered run reaches the network only through its proxy, confined by Seatbelt
      shell: bash
      run: tools/tests-ran.sh -- cargo test --locked -p purlis-core --lib -- secrets::brokered::tests::under_seatbelt_a_brokered_child_reaches_the_network_only_through_its_proxy
    # A server's connection a host hands on, received on macOS (#5849): its control buffer holds
    # one descriptor exactly, so more than one is cut off there, and the slot is marked
    # close-on-exec after the receive, which takes no flag for it here.
    - name: A host hands on one connection, and nothing more, on macOS
      shell: bash
      run: "tools/tests-ran.sh -- cargo test --locked -p purlis-core --lib -- hookwire::serve::tests::"
    # The Keychain's own rule a held item rests on (V90a), in a keychain of the test's own:
    # read by the program that made it, and silently by no other.
    - name: A held keychain item is read silently by no other program
      shell: bash
      env:
        PURLIS_TEST_THROWAWAY_KEYCHAIN: "1"
      # Red unless each test really ran and passed: it leaves a marker only then.
      run: |
        rm -rf target/tests-that-really-ran
        tools/tests-ran.sh -- cargo test --locked -p purlis-core --lib -- secrets::keyhold::held_by_the_keychain::
        for ran in held-item-read-by-no-other-program item-another-program-holds-refused; do
          test -f "target/tests-that-really-ran/$ran" || { echo "::error::$ran did not really run"; exit 1; }
        done
    # purlis-app's own sandbox tests on macOS (M74.1): the window's side of the wrap, the sandbox
    # picker and the engine's sandbox. Tickets 1, 2 and 4 name theirs here as they land.
    - name: purlis-app's sandbox tests on macOS
      if: inputs.purlis-app == 'true'
      shell: bash
      run: |
        mkdir -p app/dist
        tools/tests-ran.sh -- cargo test --locked -p purlis-app --lib -- sandboxing:: sandboxchoose:: yoursandbox:: enginesandbox::
    # What Seatbelt refused while the probe ran, from the system's log, for a red run's reader.
    - name: What the sandbox refused
      if: failure()
      shell: bash
      run: log show --last 15m --style compact --predicate 'eventMessage CONTAINS "studio-probe" AND eventMessage CONTAINS "deny"' | tail -100 || true
