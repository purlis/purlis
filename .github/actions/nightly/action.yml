# **One entry of the nightly list** (M74.1, T1.1-09). Main's scheduler (`nightly-branch.yml` on
# main) checks out the branch and runs each entry of `.github/nightly-on-<branch>.txt` through
# this action, on the entry's runner. An entry's steps live here, on the branch, so a ticket adds
# its nightly without touching main. A composite action cannot read `secrets`: an entry that needs
# one takes it as an input, which main's workflow passes.
#
# A name this action does not know fails, so a typo in the list is a red night, not a silent one.
name: Nightly entry
description: Runs one entry of the nightly list on this runner.
inputs:
  entry:
    description: The entry's name, as the list writes it.
    required: true
runs:
  using: composite
  steps:
    - name: An entry this action knows
      if: ${{ !contains(fromJSON('["sandbox-scenarios", "existing-macos-sandbox-tests", "harness-rerecord-pinned", "harness-rerecord-latest"]'), inputs.entry) }}
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
      run: |
        echo "::error::$ENTRY is not an entry .github/actions/nightly knows"
        exit 1
    # The sandbox scenarios, on Linux or macOS (ticket 54 fills the nightly's ×3 and shuffle).
    - if: inputs.entry == 'sandbox-scenarios'
      uses: ./.github/actions/sandbox-scenarios
    # The existing macOS sandbox test targets against the branch, failing on red.
    - if: inputs.entry == 'existing-macos-sandbox-tests'
      uses: ./.github/actions/macos-sandbox-tests
      with:
        purlis-app: "true"
    # Each harness re-recorded against the stand-in model (T1.1-03), at its pinned version and at
    # its latest release, and diffed against its checked-in recording: drift opens a
    # `harness-drift` issue, and a refused call whose recording changed is red, which the list's
    # `kind: escape` files as a public p0 security issue (Q301).
    - if: inputs.entry == 'harness-rerecord-pinned'
      uses: ./.github/actions/harness-recordings
      with:
        at: pinned
        compare: "true"
        github-token: ${{ github.token }}
    - if: inputs.entry == 'harness-rerecord-latest'
      uses: ./.github/actions/harness-recordings
      with:
        at: latest
        compare: "true"
        github-token: ${{ github.token }}
