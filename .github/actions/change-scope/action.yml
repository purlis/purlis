# Which of CI's scopes this change needs (#3505): `tools/ci-scope.mjs` reads the change against
# the commit it is measured by (`change-base`) and says, for each scope, `true` or `false`. A pull
# request is scoped, and a draft runs no heavy scope (#7335); any other event runs every scope.
#
# The job's checkout must have `fetch-depth: 2`. The runner's own Node runs the script: it reads
# git and files, and needs no package.
name: Change scope
description: Says which of CI's scopes (rust, web, app, scenario, stories, tools, docs) a change needs.
outputs:
  rust:
    description: The Rust suite, fmt and clippy, licences and advisories, the recorded behaviour.
    value: ${{ steps.scope.outputs.rust }}
  web:
    description: The type check, lint, format check, npm licences and vitest.
    value: ${{ steps.scope.outputs.web }}
  app:
    description: The app built as it ships, and the Linux cold start.
    value: ${{ steps.scope.outputs.app }}
  scenario:
    description: The scenario specs on macOS and Linux.
    value: ${{ steps.scope.outputs.scenario }}
  stories:
    description: Every component story (`stories.yml`).
    value: ${{ steps.scope.outputs.stories }}
  tools:
    description: The tools' own tests.
    value: ${{ steps.scope.outputs.tools }}
  docs:
    description: The docs site.
    value: ${{ steps.scope.outputs.docs }}
  web-parts:
    description: The parts of the web job this change needs, as JSON.
    value: ${{ steps.scope.outputs.web-parts }}
  stories-browsers:
    description: The browsers the stories run in, as JSON. WebKit alone on a ready pull request, both on every other run and on a pull request labelled update-baselines.
    value: ${{ steps.scope.outputs.stories-browsers }}
  listen-shim:
    description: Whether a pull request needs the listen shim job.
    value: ${{ steps.scope.outputs.listen-shim }}
  browser-engine:
    description: Whether a pull request needs the browser engine's macOS job.
    value: ${{ steps.scope.outputs.browser-engine }}
  confinement:
    description: Whether a pull request needs the studio confinement's macOS job.
    value: ${{ steps.scope.outputs.confinement }}
  parity:
    description: Whether a pull request needs the parity job.
    value: ${{ steps.scope.outputs.parity }}
  bench:
    description: Whether a pull request needs the latency bench.
    value: ${{ steps.scope.outputs.bench }}
  outcome-bars:
    description: Whether a pull request needs the Skill studio's outcome bars.
    value: ${{ steps.scope.outputs.outcome-bars }}
runs:
  using: composite
  steps:
    - id: base
      uses: ./.github/actions/change-base
    - id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ steps.base.outputs.sha }}
        # A draft runs no heavy scope (the ready gate, #7335). Empty on any other event.
        DRAFT: ${{ github.event.pull_request.draft }}
        # The pull request's labels: `update-baselines` runs Chromium's stories as well, so the
        # run can draw its pictures (the queue draws none).
        LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      run: node tools/ci-scope.mjs "$EVENT" "$BASE" "$DRAFT" "$LABELS"
