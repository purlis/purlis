<title>Sidebar Views Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throw away. Four questions from the operator's triage (points 1, 2, 6, 7, 9a),
  each with 2-3 variants, switched by the floating bar at the bottom (or keys: 1-4 pick the
  question, left/right cycle its variant). The URL hash keeps the picks: #q1=A&q2=B&...
  Theme: Purlis dark appearance (crates/purlis-core/src/theme/built-in/purlis/theme.json, main).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the real app shell (title bar, rail, two activity bars, side panels as grey tiles on the window, main + bottom pane); the prototype bar floats over it. */
:root {
  /* Purlis palette (theme.json, dark appearance) */
  --behind: #121215;
  --window: #17171b;
  --panel: #1d1d22;
  --code: #202026;
  --card: #24242a;
  --chosen: #2a2a31;
  --card-button: #2f2f37;
  --ink: #e6e4ec;
  --body: #c9c7d2;
  --label: #a09eab;
  --quiet: #91909d;
  --faint: #74727f;
  --gutter: #55535f;
  --lavender: #a99cf0;
  --lavender-text: #c3baf5;
  --lavender-fill: #6d58bb;
  --lavender-fill-hover: #745fc3;
  --lavender-surface: #292735;
  --lavender-selected: #2a2936;
  --accent-wash: #a99cf024;
  --accent-wash-strong: #a99cf03a;
  --amber: #e5c08a;
  --green: #8fc79a;
  --blue: #9ec1f5;
  --red: #f0aaa2;
  --needs-you: #f0aaa5;
  --icon-teal: #7cd1c6;
  --icon-pink: #eea8b7;
  --icon-orange: #efac98;
  --icon-purple: #c6b3ee;
  --icon-blue: #92c4f2;
  --icon-green: #acca91;
  --shadow: #00000099;

  /* Semantic roles, as the theme maps them */
  --surface-base: var(--window);
  --surface-raised: var(--panel);   /* parts.panel.root.fill */
  --surface-overlay: var(--card);
  --surface-hover: var(--chosen);
  --control-base: var(--card);
  --control-hover: var(--chosen);
  --control-count: var(--chosen);
  --text-primary: var(--ink);
  --text-secondary: var(--body);
  --text-muted: var(--label);
  --text-quiet: var(--quiet);
  --text-faint: var(--faint);
  --list-selected: var(--lavender-selected);
  --accent: var(--lavender);
  --accent-text: var(--lavender-text);
  --accent-fill: var(--lavender-fill);

  /* Geometry: radius.sm/md 7, control 8, lg 10, xl/panel 12, control 28, gutter 8 */
  --r-sm: 7px;
  --r-ctl: 8px;
  --r-lg: 10px;
  --r-xl: 12px;
  --gap: 8px;
  --ctl: 28px;

  --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-md: 13px;

  /* prototype-only chrome (deliberately not Purlis) */
  --proto-bg: #e6e4ec;
  --proto-fg: #17171b;
  --proto-dim: #55535f;
  --proto-on: #17171b;
  --proto-on-fg: #e6e4ec;

  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--surface-base); color: var(--text-secondary); font: 400 var(--fs-md)/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: 38px 1fr; background: var(--surface-base); position: relative; }
.titlebar { display: flex; align-items: center; gap: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-width: 0; }
.lights { display: flex; gap: 8px; margin-right: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--card-button); display: block; }
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--text-primary); font-weight: 500; height: var(--ctl); padding: 0 8px; border-radius: var(--r-ctl); line-height: normal; }
.crumb:hover { background: var(--surface-overlay); }
.crumb .pj { width: 18px; height: 18px; border-radius: 5px; background: var(--lavender-fill); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.sep { color: var(--text-faint); }
.strip { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
.tb-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.needs-pill { height: 22px; padding: 0 9px; border-radius: 11px; background: var(--needs-you); color: var(--window); font-size: var(--fs-xs); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }

/* workspace chip, Q4 decides the chosen look; every state keeps the same box */
.chip { position: relative; height: var(--ctl); padding: 0 10px; border-radius: var(--r-ctl); color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-md); line-height: normal; white-space: nowrap; transition: background-color .15s, color .15s; }
.chip .nm { display: inline-flex; flex-direction: column; }
.chip .nm::after { content: attr(data-n); font-weight: 600; height: 0; visibility: hidden; overflow: hidden; } /* reserves the bold width so nothing moves */
.chip .wdot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.chip .wdot.amber { background: var(--amber); }
.chip .wdot.none { background: transparent; }
.chip:hover, .chip.f-hover { background: var(--surface-overlay); color: var(--text-primary); }
.chip.f-focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip.new { animation: pop .5s ease-out; }
@keyframes pop { from { background: var(--accent-wash-strong); } }
/* A: accent wash */
[data-q4="A"] .chip.on { background: var(--accent-wash); color: var(--text-primary); }
[data-q4="A"] .chip.on:hover, [data-q4="A"] .chip.on.f-hover { background: var(--accent-wash-strong); }
/* B: accent bar under the name */
[data-q4="B"] .chip.on { color: var(--text-primary); }
[data-q4="B"] .chip.on::before { content: ""; position: absolute; left: 10px; right: 10px; bottom: 1px; height: 2px; border-radius: 2px; background: var(--accent); }
/* C: bold text, subtle fill */
[data-q4="C"] .chip.on { color: var(--text-primary); background: var(--surface-raised); }
[data-q4="C"] .chip.on .nm span { font-weight: 600; }
[data-q4="C"] .chip.on:hover, [data-q4="C"] .chip.on.f-hover { background: var(--surface-hover); }

.body { display: flex; min-height: 0; padding-bottom: var(--gap); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.rail { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 4px; padding-left: max(0px, env(safe-area-inset-left, 0px)); }
.proj { width: 30px; height: 30px; border-radius: var(--r-lg); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--text-muted); background: var(--surface-overlay); position: relative; }
.proj.on { background: var(--lavender-fill); color: #fff; }
.proj .bdg { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--needs-you); box-shadow: 0 0 0 2px var(--window); }
.abar { width: 40px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding-block: 4px 2px; }
.abar .grp { display: flex; flex-direction: column; gap: 4px; }
.ab { width: 32px; height: 32px; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--text-quiet); position: relative; }
.ab:hover { background: var(--surface-overlay); color: var(--text-primary); }
.ab.on { background: var(--accent-wash); color: var(--accent-text); }
.ab .cnt { position: absolute; right: 1px; top: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--needs-you); color: var(--window); font-size: 10px; font-weight: 600; line-height: 15px; text-align: center; }
.ab .cnt.acc { background: var(--accent); }
.tile { background: var(--surface-raised); border-radius: var(--r-xl); overflow: hidden; min-height: 0; min-width: 0; }
.side { width: 276px; flex: none; display: flex; flex-direction: column; gap: var(--gap); background: none; border-radius: 0; overflow: visible; }
.side > .tile { flex: 1 1 0; }
.side > .tile.half { flex: 0 0 210px; }
.center { flex: 1 1 0; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; margin-inline: var(--gap); }
.mainpane { flex: 1 1 0; display: flex; flex-direction: column; position: relative; }
.bottompane { flex: 0 0 120px; display: flex; flex-direction: column; }
.rside { width: 276px; flex: none; margin-right: 0; }
@media (max-width: 1180px) { .rside { display: none; } }
@media (max-width: 860px) { .side { width: 230px; } .rail { display: none; } }

/* pane header (main / bottom) */
.phead { height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 10px; flex: none; }
.ptab { height: 26px; padding: 0 10px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: var(--fs-sm); }
.ptab.on { background: var(--code); color: var(--text-primary); }
.ptab .n { color: var(--text-faint); }
.pbody { flex: 1 1 0; min-height: 0; overflow: auto; background: var(--code); margin: 0 6px 6px; border-radius: var(--r-lg); padding: 14px 16px; position: relative; }
.term { font: 12px/1.6 var(--mono); color: var(--text-secondary); white-space: pre; }
.term .p { color: var(--accent-text); }
.term .ok { color: var(--green); }
.term .dim { color: var(--text-faint); }
.msg { max-width: 68ch; display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.msg .who { font-size: var(--fs-xs); color: var(--text-faint); font-weight: 500; }
.msg .txt { color: var(--text-secondary); }
.msg.me .txt { color: var(--text-primary); }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* ---------- sidebar view anatomy (Q1) ---------- */
.view { height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; background: var(--surface-raised); scrollbar-width: thin; scrollbar-color: #e6e4ec33 transparent; }
.vhead { position: sticky; top: 0; z-index: 3; background: var(--surface-raised); display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 8px; }
.trow { display: flex; align-items: center; gap: 6px; min-height: 28px; }
.trow h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; color: var(--text-primary); white-space: nowrap; line-height: normal; }
.trow .count { height: 18px; min-width: 20px; padding: 0 6px; border-radius: 9px; background: var(--control-count); color: var(--text-muted); font-size: var(--fs-xs); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.acts { margin-left: auto; display: flex; gap: 2px; }
.ib { width: 24px; height: 24px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-quiet); }
.ib:hover { background: var(--surface-overlay); color: var(--text-primary); }
.field { height: var(--ctl); border-radius: var(--r-ctl); background: var(--control-base); display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--text-quiet); min-width: 0; }
.field:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
.field input { flex: 1 1 0; min-width: 0; border: 0; outline: 0; background: none; color: var(--text-primary); font-size: var(--fs-sm); }
.field input::placeholder { color: var(--text-quiet); }
.field .kbd { font-size: 10px; color: var(--text-faint); font-family: var(--mono); }
.tok { height: 18px; padding: 0 6px; border-radius: 5px; background: var(--accent-wash); color: var(--accent-text); font-size: var(--fs-xs); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-ctl); background: var(--surface-base); }
.seg button { flex: 1 1 0; height: 22px; border-radius: 6px; font-size: var(--fs-sm); color: var(--text-muted); white-space: nowrap; padding: 0 6px; }
.seg button:hover { color: var(--text-primary); }
.seg button.on { background: var(--surface-overlay); color: var(--text-primary); }
.utabs { display: flex; gap: 14px; padding: 0 2px; }
.utabs button { position: relative; height: 22px; font-size: var(--fs-sm); color: var(--text-muted); }
.utabs button.on { color: var(--text-primary); }
.utabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; border-radius: 2px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.fchip { height: 22px; padding: 0 8px; border-radius: var(--r-sm); background: var(--surface-overlay); color: var(--text-muted); font-size: var(--fs-xs); display: inline-flex; align-items: center; gap: 5px; }
.fchip:hover { color: var(--text-primary); }
.fchip.on { background: var(--accent-wash); color: var(--accent-text); }
.fchip b { font-weight: 500; color: inherit; opacity: .75; font-variant-numeric: tabular-nums; }

.grp { padding-bottom: 6px; }
.ghead { display: flex; align-items: center; justify-content: space-between; height: 26px; padding: 0 12px; font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); font-weight: 500; background: var(--surface-raised); position: sticky; top: var(--hh, 0px); z-index: 2; }
.ghead .gc { font-variant-numeric: tabular-nums; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin: 0 4px; border-radius: var(--r-sm); color: var(--text-secondary); cursor: default; min-width: 0; }
.row:hover { background: var(--surface-hover); }
.row.sel { background: var(--list-selected); color: var(--text-primary); }
.row .rcol { display: flex; flex-direction: column; min-width: 0; flex: 1 1 0; }
.row .rt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rs { font-size: var(--fs-xs); color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rm { font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--gutter); }
.dot.run { background: var(--blue); }
.dot.wait { background: var(--amber); }
.dot.needs { background: var(--needs-you); }
.dot.done { background: var(--green); }
.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--window); flex: none; }
.pav { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none; }
[data-q1="C"] .row .pav { align-self: flex-start; margin-top: 4px; }
.cb { width: 15px; height: 15px; border-radius: 4px; background: var(--card-button); flex: none; display: grid; place-items: center; color: #fff; }
.cb.done { background: var(--accent-fill); }
.row.isdone .rt { color: var(--text-faint); text-decoration: line-through; }
.vfoot { padding: 10px 12px 14px; font-size: var(--fs-xs); color: var(--text-faint); }

/* A: stacked head, sticky groups, comfortable rows (defaults above) */
[data-q1="A"] .row .rs, [data-q1="B"] .row .rs { display: none; }
/* B: one-line head, groups scroll away, dense rows */
[data-q1="B"] .vhead { gap: 6px; padding: 6px 8px 6px 10px; }
[data-q1="B"] .vhead .trow .field { flex: 1 1 0; height: 24px; }
[data-q1="B"] .trow .acts { margin-left: 0; }
[data-q1="B"] .ghead { position: static; height: 22px; padding-top: 6px; text-transform: none; letter-spacing: 0; font-size: var(--fs-xs); color: var(--text-quiet); }
[data-q1="B"] .row { height: 24px; font-size: var(--fs-sm); }
[data-q1="B"] .row.tall { height: 24px; }
[data-q1="B"] .seg button { height: 20px; font-size: var(--fs-xs); }
[data-q1="B"] .fchip { height: 20px; }
[data-q1="B"] .grp { padding-bottom: 2px; }
/* C: counted head, banded sticky groups, two-line rows */
[data-q1="C"] .ghead { margin: 2px 6px 4px; border-radius: var(--r-sm); background: var(--surface-overlay); height: 24px; padding: 0 8px; color: var(--text-muted); text-transform: none; letter-spacing: 0; font-size: var(--fs-sm); top: calc(var(--hh, 0px) + 2px); }
[data-q1="C"] .row { height: 42px; align-items: center; }
[data-q1="C"] .row .rt { color: var(--text-primary); }
[data-q1="C"] .row.isdone .rt { color: var(--text-faint); }
[data-q1="C"] .row .rm { align-self: flex-start; margin-top: 7px; }
[data-q1="C"] .row .dot { align-self: flex-start; margin-top: 8px; }
[data-q1="C"] .row .av, [data-q1="C"] .row .cb { align-self: flex-start; margin-top: 4px; }
[data-q1="C"] .row .av { width: 24px; height: 24px; margin-top: 2px; }

/* ---------- explorer (Q2) ---------- */
.trow .branch { font-size: var(--fs-xs); color: var(--text-faint); font-family: var(--mono); }
.picker { height: var(--ctl); border-radius: var(--r-ctl); background: var(--surface-base); display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--text-primary); font-size: var(--fs-sm); width: 100%; text-align: left; }
.picker:hover { background: var(--surface-overlay); }
.picker.static { cursor: default; }
.picker.static:hover { background: var(--surface-base); }
.picker .br { color: var(--text-faint); font-family: var(--mono); font-size: var(--fs-xs); }
.picker .chev { margin-left: auto; color: var(--text-quiet); }
.menu { position: absolute; left: 10px; right: 10px; z-index: 6; background: var(--surface-overlay); border-radius: var(--r-lg); box-shadow: 0 10px 30px var(--shadow); padding: 4px; }
.menu .mi { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--r-sm); width: 100%; text-align: left; font-size: var(--fs-sm); color: var(--text-secondary); }
.menu .mi:hover { background: var(--surface-hover); color: var(--text-primary); }
.menu .mi.on { color: var(--text-primary); }
.menu .mi .ck { margin-left: auto; color: var(--accent-text); }
.menu .msep { height: 4px; }
.tree .row { height: 24px; gap: 4px; font-size: var(--fs-sm); padding-right: 8px; }
.tree .tw { width: 14px; display: grid; place-items: center; color: var(--text-faint); flex: none; }
.tree .fi { color: var(--text-muted); }
.tree .fi.f { color: var(--text-faint); }
.tree .git { margin-left: auto; font-size: 10px; font-family: var(--mono); color: var(--amber); }
.tree .git.a { color: var(--green); }
.tree .repo { height: 28px; font-weight: 500; color: var(--text-primary); }
.tree .repo .br { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); font-family: var(--mono); font-weight: 400; }
.tree .repo .chg { font-size: 10px; color: var(--amber); font-family: var(--mono); }
.hl { color: var(--accent-text); }
.hint { font-size: var(--fs-xs); color: var(--text-faint); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.4; }
.hint .lnk { color: var(--accent-text); display: inline-flex; align-items: center; gap: 3px; }
.hint .lnk:hover { text-decoration: underline; }
.hint .sc { height: 18px; padding: 0 6px; border-radius: 5px; background: var(--surface-base); color: var(--text-muted); display: inline-flex; align-items: center; }
.halfhead { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; position: sticky; top: 0; background: var(--surface-raised); z-index: 2; }
.halfhead h3 { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--text-primary); }
.scopechips { display: flex; flex-wrap: wrap; gap: 4px; }
.hit { font: 12px/1.5 var(--mono); color: var(--text-muted); padding: 2px 12px 2px 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit mark { background: var(--accent-wash-strong); color: var(--text-primary); border-radius: 3px; padding: 0 1px; }

/* ---------- action results (Q3) ---------- */
.notice { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start; background: var(--surface-overlay); border-radius: var(--r-lg); padding: 10px 8px 10px 12px; margin-bottom: 16px; max-width: 640px; }
.notice .ic { color: var(--green); margin-top: 1px; }
.notice .nt { color: var(--text-primary); font-weight: 500; }
.notice .ns { grid-column: 2; color: var(--text-muted); font-size: var(--fs-sm); }
.notice .nacts { grid-column: 2; display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.notice .x { grid-row: 1; grid-column: 3; }
.btn { height: 26px; padding: 0 10px; border-radius: var(--r-ctl); background: var(--card-button); color: var(--text-primary); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-hover); }
.btn.pri { background: var(--accent-fill); color: #fff; }
.btn.pri:hover { background: var(--lavender-fill-hover); }
.btn.ghost { background: none; color: var(--text-muted); padding: 0 6px; }
.btn.ghost:hover { color: var(--text-primary); background: var(--surface-hover); }
.details { grid-column: 2 / 4; margin-top: 6px; background: var(--code); border-radius: var(--r-sm); padding: 8px 10px; font: 11px/1.6 var(--mono); color: var(--text-muted); white-space: pre-wrap; word-break: break-word; }

function stateLine() {
  const v = S.v[S.q];
  if (S.q === 'q1') return `left <b>Chats</b> · right <b>${VIEWS[S.right] ? VIEWS[S.right].title : 'closed'}</b> · head <b>sticky</b> · groups <b>${v === 'B' ? 'scroll away' : 'sticky'}</b> · rows <b>${v === 'B' ? '24px' : v === 'C' ? '42px two-line' : '30px'}</b> · title <b>${v === 'B' ? 'shares its row with search' : 'own row'}</b>`;
  if (S.q === 'q2') { const many = S.repos > 1; const sc = v === 'B' ? (S.pickRepo === '*' ? 'Workspace' : 'Branch') : scopeWord(S.exScope); return `repos <b>${S.repos}</b> · ${v === 'A' ? `expanded <b>${[...S.repoOpen].join(', ') || 'none'}</b>` : v === 'B' ? `picker <b>${S.pickRepo === '*' ? 'All repos' : S.pickRepo}</b>` : `tree <b>${S.selRepo}</b>`} · filter <b>${esc(S.filter.explorer || '—')}</b> in <b>${many ? sc : 'Branch'}</b> · Search scope <b>${(SEARCH_SCOPES.find(s => s[0] === (S.tab.search || 'branch')) || [])[1]}</b>`; }
  if (S.q === 'q3') return `ran <b>${S.ran ? 'New workspace git-ci-cd' : 'nothing yet'}</b> · notice <b>${S.notice ? 'shown' : '—'}</b> · toast <b>${S.toast ? 'showing ' + S.toast.ms / 1000 + 's (hover pauses)' : '—'}</b> · Notices badge <b>${badge()}</b> · popover <b>${S.pop ? 'open' : 'closed'}</b>`;
  return `current <b>${S.cur}</b> · chosen <b>${Q.q4.v[v]}</b> · hover <b>card fill + primary text</b> · box <b>fixed (bold width reserved)</b>`;
}
function renderProto() {
  const q = S.q, keys = Object.keys(Q[q].v), v = S.v[q];
  const scen = q === 'q2' ? `<span class="scen">Repos <button class="${S.repos === 1 ? 'on' : ''}" data-repos="1">1</button><button class="${S.repos === 3 ? 'on' : ''}" data-repos="3">3</button></span>`
    : q === 'q3' ? `<span class="scen"><button data-run="1">${S.ran ? 'Run again' : 'Run'}: New workspace</button></span>`
    : q === 'q1' ? `<span class="scen">Right view ${['personas', 'memory', 'todos'].map(r => `<button class="${S.right === r ? 'on' : ''}" data-rv="${r}">${VIEWS[r].title}</button>`).join('')}</span>` : '';
  document.getElementById('proto').innerHTML = `<div class="l1"><div class="qs">${Object.keys(Q).map(k => `<button class="${k === q ? 'on' : ''}" data-q="${k}">${k.toUpperCase()}<i>${S.v[k]}</i></button>`).join('')}</div>
  <button class="arrow" data-step="-1" aria-label="Previous variant">${I('left', 14, 2.2)}</button><span class="vl">${v} <small>(${Q[q].v[v]})</small> <small>${keys.indexOf(v) + 1}/${keys.length}</small></span><button class="arrow" data-step="1" aria-label="Next variant">${I('right', 14, 2.2)}</button>${scen}</div>
  <div class="l2"><b>${Q[q].label}</b> · ${stateLine()}</div>`;
}
function render() {
  const app = document.getElementById('app');
  app.dataset.q1 = S.v.q1; app.dataset.q4 = S.v.q4;
  renderTitle(); renderBody(); renderProto(); saveHash();
}

/* ---------- actions ---------- */
let toastTimer = null;
function runCreate() {
  S.ran = true;
  if (!S.ws.includes('git-ci-cd')) S.ws.push('git-ci-cd');
  S.fresh = 'git-ci-cd';
  S.notices.results = [{ t: 'Workspace git-ci-cd is ready', s: 'No vision yet. Add one so its chats know what it is for.', unseen: true }];
  S.notices.unseen = 1; S.notice = null; S.toast = null; S.noticeDetails = false; S.popDetails = false;
  clearTimeout(toastTimer);
  const v = S.v.q3;
  if (v === 'A') { S.notice = true; S.pop = false; }
  else if (v === 'B') { S.pop = false; S.toast = { ms: 8000 }; armToast(); }
  else { S.pop = true; }
  render();
  setTimeout(() => { S.fresh = null; }, 600);
}
function armToast() {
  clearTimeout(toastTimer);
  const start = Date.now(); let left = S.toast.ms;
  const tick = () => {
    const t = document.getElementById('toast');
    if (!S.toast) return;
    if (t && t.matches(':hover')) { toastTimer = setTimeout(tick, 200); return; }
    left -= 200;
    if (left <= 0) { S.toast = null; render(); return; }
    toastTimer = setTimeout(tick, 200);
  };
  toastTimer = setTimeout(tick, 200);
}
function stepVariant(d) {
  const keys = Object.keys(Q[S.q].v); const i = keys.indexOf(S.v[S.q]);
  S.v[S.q] = keys[(i + d + keys.length) % keys.length];
  if (S.q === 'q3') runCreate(); else render();
}
function setQ(q) {
  S.q = q; S.pop = false; S.toast = null;
  if (q === 'q2') S.left = 'explorer';
  if (q === 'q1' && S.left !== 'chats') S.left = 'chats';
  if (q === 'q3') { S.left = 'chats'; runCreate(); return; }
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-sel],[data-dir],[data-repo],[data-selrepo],[data-chip]');
  if (!t) { if (S.pop && !e.target.closest('.pop')) { S.pop = false; render(); } return; }
  const d = t.dataset;
  if (d.q) return setQ(d.q);
  if (d.step) return stepVariant(+d.step);
  if (d.repos) { S.repos = +d.repos; if (S.repos === 1) { S.selRepo = 'purlis'; S.pickRepo = 'purlis'; } return render(); }
  if (d.run) return runCreate();
  if (d.rv) { S.right = d.rv; return render(); }
  if (d.ws) { S.cur = d.ws; return render(); }
  if (d.ab) {
    const [side, id] = d.ab.split(':');
    if (side === 'l') {
      if (id === 'files' || id === 'repos') S.half = S.half === id ? null : id;
      else S.left = id;
    } else if (id === 'bell') { S.pop = !S.pop; if (S.pop) S.notices.results.forEach(r => r.unseen = false), S.notices.unseen = 0; }
    else S.right = S.right === id ? null : id;
    return render();
  }
  if (d.openpop) { S.pop = true; S.toast = null; S.notices.unseen = 0; return render(); }
  if (d.closetoast) { S.toast = null; return render(); }
  if (d.dismiss) { S.notice = null; return render(); }
  if (d.details) { if (d.details === 'n') S.noticeDetails = !S.noticeDetails; else S.popDetails = !S.popDetails; return render(); }
  if (d.tab) { S.tab[d.tab] = d.val; return render(); }
  if (d.chip) { const s = S.chipOn[d.chip] || (S.chipOn[d.chip] = new Set()); s.has(d.val) ? s.delete(d.val) : s.add(d.val); return render(); }
  if (d.sel) { S.sel[d.sel] = d.val; return render(); }
  if (d.dir) { S.open.has(d.dir) ? S.open.delete(d.dir) : S.open.add(d.dir); return render(); }
  if (d.repo) { S.selRepo = d.repo; S.repoOpen.has(d.repo) ? S.repoOpen.delete(d.repo) : S.repoOpen.add(d.repo); return render(); }
  if (d.selrepo) { S.selRepo = d.selrepo; return render(); }
  if (d.exscope) { S.exScope = d.exscope; return render(); }
  if (d.picker) { S.pickerOpen = !S.pickerOpen; return render(); }
  if (d.pick) { S.pickRepo = d.pick; S.pickerOpen = false; return render(); }
  if (d.gosearch) { S.tab.search = d.gosearch; S.left = 'search'; S.filter.search = S.filter.explorer || 'background'; return render(); }
  if (d.sscope) { S.tab.search = d.sscope; return render(); }
});
document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.filter; if (!id) return;
  S.filter[id] = e.target.value;
  if (id === 'todos' || id === 'search') return;
  const body = document.querySelector(`[data-body="${id}"]`);
  if (body) body.innerHTML = id === 'explorer' ? (() => { const tmp = document.createElement('div'); tmp.innerHTML = explorerHTML(); return tmp.querySelector('[data-body]').innerHTML; })() : viewBody(id);
  renderProto();
});
document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) {
    if (e.key === 'Enter' && el.dataset.filter === 'todos' && el.value.trim()) { TODOS[0][1].unshift([el.value.trim(), 'you']); S.filter.todos = ''; render(); document.getElementById('f-todos').focus(); }
    if (e.key === 'Escape') el.blur();
    return;
  }
  if (e.key === 'ArrowRight') stepVariant(1);
  else if (e.key === 'ArrowLeft') stepVariant(-1);
  else if (['1', '2', '3', '4'].includes(e.key)) setQ('q' + e.key);
  else if (e.key === 'Escape' && S.pop) { S.pop = false; render(); }
});
window.addEventListener('resize', measure);

if (S.q === 'q3') { S.left = 'chats'; runCreate(); } else { if (S.q === 'q2') S.left = 'explorer'; render(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
