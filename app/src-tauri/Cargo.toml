[package]
name = "purlis-app"
version.workspace = true
description = "charter, the desktop app"
authors = ["Purlis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "purlis_app_lib"
# Only the Rust library the program links. Tauri's template also asks for a `staticlib` and a
# `cdylib`, which only an iOS or Android build loads, and purlis builds for neither. Every build
# paid for them: the app's crate, the largest in the workspace, archived and linked whole twice
# more, and sccache never caches a crate that emits a `cdylib`, so the macOS scenario legs
# compiled it afresh on every run however the cache stood (#3742).
crate-type = ["rlib"]

# The app's program keeps its name: the keyring writer (`secrets::keyhold::APP_BINARY`), the
# e2e runs and the release steps find it by it. Renaming the program is not the crate's rename.
[[bin]]
name = "charter-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
purlis-core.workspace = true
# The generated Bidi_Control table a name's direction marks are dropped by (SK-49).
purlis-unicode.workspace = true
# The session host the window starts with its own binary and is the first client of (#1997).
purlis-host.workspace = true
# purlis's own wrap of a chat on Linux (#1040): the app answers the hidden `_sandbox` itself, so
# the program that starts a chat can wrap it.
purlis-linux-sandbox.workspace = true
# What the window speaks to its session host: the link, its scope and its credential (#1997).
purlis-session-protocol = { path = "../../crates/session-protocol" }
# A file tab's image preview crosses to the window as base64 (FM-2).
base64 = "0.23"
# A browser view's frames, whole, handed to its canvas (#2012). The version the session protocol uses.
bytes = "1"
# About Charter: the running version's section of the repository's CHANGELOG.md.
changelog.workspace = true
# `wscmd::create` is handed the moment the workspace was made, because `charter workspace
# create` stamps it into the manifest and the two implementations must stamp the same field.
# The same spelling `purlis-cli` uses, so one version of chrono is in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "2"
# The one dialog shown before Tauri is built (`refuse_beside_the_old_app`): the native dialog
# the dialog plugin itself draws through, at the version it already brings in.
rfd = { version = "0.16", default-features = false }
# The app moving itself (ADR 0042). Its signature check is an ordinary dependency
# of the plugin, not a feature, so there is no build of it that skips verification.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "time", "rt"] }
# Where a bundle of a project's code is kept while it crosses to a runner (#2046), removed with it.
tempfile.workspace = true
# What the app notices goes to the diagnostic log `purlis_core::applog` installs (#647): a
# file that rotates daily, and standard error. The version purlis-core uses.
tracing = "0.1"
# A file row's Copy absolute path (FM-10) says a Windows path without the `\\?\` prefix
# `canonicalize` gives it. The version tauri-plugin-opener already brings in.
dunce = "1.0.5"
# A vault's Copy (charter-app#236): the core puts the value on the system clipboard itself, so
# it never reaches the window, and marks it for clipboard histories to leave out. Text only.
arboard = { version = "3.6.1", default-features = false }
# What that Copy remembers instead of the value: a digest, to clear the clipboard a minute later
# only while it still holds what was copied. The version purlis-core already uses.
sha2 = "0.11"
# The plane changing under the window (charter-app#264): the todos a terminal closed, a workspace
# another process made. notify is the standard cross-platform watcher (FSEvents, inotify,
# ReadDirectoryChangesW). Its events are folded into bursts by hand (`watchset.rs`), not by
# notify-debouncer-full, which drops a file made and removed inside one fold (#1139).
notify = "8.2"

# The theme specimen's picture (#2330, `specimen.rs`): WebKit's own snapshot of the hidden
# window's webview, as a PNG. The crates and versions wry already brings in on macOS, with the
# few more of their features the snapshot and the PNG need, so nothing new is in the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString", "NSValue"] }
# The system's Increase contrast, read as a window is created (#2582, `syscontrast.rs`): two more
# features of the same crate, no crate new to the tree (operator, 2026-10-18).
# The window's colour, read back for the scenario tests (#2760), takes more of its features: the
# `e2e` feature turns those on (#2836), since only that build reads it.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSWorkspace"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

# The desktop portal, asked on the session bus before GTK asks it (charter-app#24,
# `portal.rs`). The version `tauri-plugin-single-instance` already brings in on Linux, so
# nothing new is in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
# rfd's GTK backend on Linux, as the dialog plugin enables it.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
zbus = "6.1"
# Whose charter the instance lock is (`instance.rs`), by user id. The version purlis-core
# already uses.
rustix = { version = "1", features = ["process"] }
# The theme specimen's picture (#2330, `specimen.rs`): WebKitGTK's snapshot of the hidden
# window's webview, written as a PNG by cairo. The versions wry and GTK already bring in.
webkit2gtk = "=2.0.2"
cairo-rs = { version = "0.22", features = ["png"] }

[lints]
workspace = true

[features]
# What a scenario test needs inside the app: WebdriverIO's embedded WebDriver server, and its
# plugin for running code in the window. Never in a build anyone is given.
#
# It carries the plane fence too, and that half is not about WebDriver. The scenario run
# starts this binary from a checkout that sits inside the operator's own plane, so a config
# that forgets to pin `$CHARTER_ROOT` resolves that plane and records into it — which is
# charter-app#129. A fenced app dies at the first touch instead of quietly succeeding.
#
# And the commands only a scenario test asks (`ipc_commands.rs`'s `e2e_only`, #2836), with what
# they alone need: the window's colour read back on macOS (`nativewindow/drawn.rs`) takes the
# app's windows, their colour and its sRGB form, more features of a crate already in the tree.
e2e = [
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
    "purlis-core/fenced",
    "objc2-app-kit/objc2-core-foundation",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSColor",
    "objc2-app-kit/NSColorSpace",
    "objc2-app-kit/NSResponder",
    "objc2-app-kit/NSWindow",
]

[dev-dependencies]
# Tauri's mock runtime, to invoke commands through the app's real ACL (`ipc.rs`, ADR 0052).
tauri = { version = "2", features = ["test", "tray-icon"] }
# Fenced for `cargo test --workspace`, which is the invocation that compiles and runs this
# crate's tests — and the one named in charter-app#129.
purlis-core = { workspace = true, features = ["fenced", "test-support"] }
stand-in.workspace = true
# The UI RPC's list of commands no link serves (`session_protocol::ui::WINDOW_ONLY`, HP-6), so
# the client generated for the link leaves out the same ones; and an in-memory link to a session
# host, for the tests of chats run in one (#1998).
purlis-session-protocol = { path = "../../crates/session-protocol", features = ["any-stream"] }
# A program that stands in for a terminal's, behind the session host (#1998).
purlis-host = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# A screenshot's pixels, read to tell a value kept out was painted over (#2243): the version
# purlis-browser-engine's tests read them with.
png = "0.18"
# A vault's clipboard clear is tested on tokio's paused clock, not a real minute.
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
