<title>Project Switcher Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* PROTOTYPE (M66 wayfinder). Throwaway: three ways to switch project and workspace without two full-width
   strips, in a mock purlis window drawn in the Purlis (Figma) palette. Layout concept: the window fills the
   page; only the chrome around the work changes per variant; a switcher bar at the bottom. */
:root {
  --behind: #121215; --window: #17171b; --panel: #1d1d22; --card: #24242a; --hover: #2a2a31; --line: #2f2f37;
  --text: #e6e4ec; --text-2: #c9c7d2; --muted: #a09eab; --quiet: #8a8896; --faint: #6f6d7a;
  --accent: #a99cf0; --accent-text: #c3baf5; --wash: rgba(169,156,240,.12); --amber: #e5c08a; --amber-wash: rgba(229,192,138,.12);
  --switch-bg: #e6e4ec; --switch-fg: #17171b;
  --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
/* This mock commits to the Figma design's one dark appearance (the Figma file draws no light one). */
html, body { height: 100%; }
body { margin: 0; background: var(--behind); color: var(--text); font: 13px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 72px; box-sizing: border-box; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.win { height: 100%; min-height: 540px; background: var(--window); border-radius: 12px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; position: relative; }
.win.rail { grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
.win.rail > .titlebar { grid-column: 1 / -1; }
.titlebar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 78px; color: var(--muted); }
.lights { position: absolute; left: 14px; top: 14px; display: flex; gap: 7px; } .lights i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a42; }
.titlebar .grow { flex: 1; }
.pill { height: 24px; padding: 0 10px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.pill.amber { background: var(--amber-wash); color: var(--amber); }
.pill.accent { background: var(--wash); color: var(--accent-text); }
.crumb { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 4px 0 6px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; color: var(--text-2); font-weight: 500; }
.crumb:hover, .crumb[aria-expanded="true"] { background: var(--card); }
.crumb .sep { color: var(--faint); margin: 0 4px; }
.crumb .chev { color: var(--quiet); margin-left: 4px; }
.crumb .needs { margin-left: 6px; }
.needs { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--amber-wash); color: var(--amber); font-size: 11px; display: inline-grid; place-items: center; font-weight: 600; }
.mark { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 600 10px var(--font-ui); flex: none; }

.chats { display: flex; align-items: center; gap: 4px; padding: 0 8px 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.chat { height: 29px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--quiet); white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chat[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: 500; }
.chat:hover { color: var(--text); }
.chat .live { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chat .wait { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.ctx { height: 29px; padding: 0 8px 0 6px; border-radius: 8px; border: 0; background: var(--panel); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500; flex: none; margin-right: 6px; }
.ctx:hover, .ctx[aria-expanded="true"] { background: var(--card); }
.ctx .sep { color: var(--faint); }
.addchat { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; flex: none; }

.body { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 8px; padding: 0 8px 8px; min-height: 0; }
.side, .work { background: var(--panel); border-radius: 12px; padding: 14px; min-height: 0; overflow: auto; }
.side h4 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.side .item { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--text-2); cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; }
.side .item[aria-current="true"] { background: var(--wash); color: var(--text); }
.side .item:hover { background: var(--card); }
.side .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work { color: var(--muted); font: 12.5px/21px var(--font-mono); white-space: pre-wrap; }
.work b { color: var(--text); font-family: var(--font-ui); font-size: 14px; display: block; margin-bottom: 8px; }
@media (max-width: 760px) { .body { grid-template-columns: 1fr; } .side { display: none; } }

/* rail variant */
.railcol { grid-row: 2 / -1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 0 10px; }
.railbtn { position: relative; width: 36px; height: 36px; border-radius: 9px; border: 0; cursor: pointer; display: grid; place-items: center; font: 600 11px var(--font-ui); }
.railbtn[aria-current="true"] { box-shadow: 0 0 0 2px var(--window), 0 0 0 3.5px var(--accent); }
.railbtn .needs { position: absolute; right: -5px; top: -5px; height: 16px; min-width: 16px; font-size: 10px; background: #3b3222; }
.railbtn.add { background: transparent; color: var(--muted); font-size: 18px; }
.railbtn.add:hover { background: var(--card); }
.win.rail .chats, .win.rail .body { grid-column: 2; }
.win.docked, .win:has(.body.docked) { grid-template-rows: auto minmax(0, 1fr); }
.win.rail.docked .railcol { grid-row: 2; }
.win.rail.docked .body { grid-column: 2; grid-row: 2; }
.body.docked { padding-top: 0; }
.workcol { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
/* The first tab starts exactly at the panel's left edge, and the chosen tab flares into the panel with
   inverse corners on each side, so tab and panel read as one piece (the first tab has no left flare: the
   panel's corner is square under it). */
.dtabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 8px 0 0; }
.dtab { position: relative; }
.dtab[aria-selected="true"]::before, .dtab[aria-selected="true"]::after { content: ""; position: absolute; bottom: 0; width: 8px; height: 8px; pointer-events: none; }
.dtab[aria-selected="true"]::before { left: -8px; background: radial-gradient(circle at 0 0, transparent 8px, var(--panel) 8.5px); }
.dtab[aria-selected="true"]::after { right: -8px; background: radial-gradient(circle at 100% 0, transparent 8px, var(--panel) 8.5px); }
.dtab:first-child[aria-selected="true"]::before { display: none; }
.dtabs { padding-right: 8px; } .dtabs > .dtab:first-child { margin-left: 0; } .dtabs > .dtab + .dtab { margin-left: 6px; }
.dtab { height: 31px; max-width: 240px; padding: 0 10px 0 12px; border: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--quiet); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
/* An unselected tab's hover is a pill inset from the strip's floor, never touching the panel, so only the
   chosen tab ever joins it. */
.dtab:hover { color: var(--text); }
.dtab { isolation: isolate; }
.dtab:not([aria-selected="true"]):hover::before { content: ""; position: absolute; inset: 3px 0 5px; border-radius: 7px; background: var(--card); z-index: -1; }
/* Selection changes colour and fill only, never weight or padding, so no tab changes width and none of
   its neighbours moves when the selection does. */
.dtab[aria-selected="true"] { background: var(--panel); color: var(--text); }
.dtab .dl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dtab .dx { color: var(--faint); font-size: 12px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 5px; }
.dtab .dx:hover { background: var(--hover); color: var(--text); }
.dtab .live, .dtab .wait { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dtab .live { background: var(--accent); } .dtab .wait { background: var(--amber); }
.dtabs .addchat { align-self: center; }
.body.docked .work { border-radius: 12px; }
.body.docked .work.first { border-top-left-radius: 0; }
.sbtn { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; margin-right: 2px; }
.sbtn:hover { background: var(--card); color: var(--text); }
.railpeek .railcol { height: 100%; }
.win.rail .railcol { height: 100%; }
/* Sidebar motion: the rail's column closes or opens (the content slides with it) while the rail itself
   slides and fades; the peek slides in from the edge. */
.win.rail { --ease: cubic-bezier(.22, .8, .24, 1); transition: grid-template-columns 260ms var(--ease); }
.win.rail .railcol { transition: transform 260ms var(--ease), opacity 200ms ease; }
.win.rail.rail-closing { grid-template-columns: 0px minmax(0, 1fr); }
.win.rail.rail-closing .railcol { transform: translateX(-56px); opacity: 0; }
.win.rail.rail-opening-start { grid-template-columns: 0px minmax(0, 1fr); transition: none; }
.win.rail.rail-opening-start .railcol { transform: translateX(-56px); opacity: 0; transition: none; }
.win.rail .railcol { overflow: visible; min-width: 0; }
.railpeek.enter { animation: peek-in 220ms cubic-bezier(.22, .8, .24, 1); }
.railpeek.leaving { animation: peek-out 200ms ease forwards; }
@keyframes peek-in { from { transform: translateX(-100%); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes peek-out { to { transform: translateX(-100%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .win.rail, .win.rail .railcol { transition: none; } .railpeek, .railpeek.leaving { animation: none; } }
.sep2 { color: var(--faint); margin: 0 6px 0 2px; }
.wstrip { display: inline-flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; max-width: 62%; }
.wchip { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--quiet); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 13px; }
.wchip:hover { color: var(--text); background: var(--card); }
.wchip.here { color: var(--text); background: var(--card); }
.wchip.ghost { color: var(--muted); border: 1px dashed var(--line); }
.wchip .needs { height: 16px; min-width: 16px; font-size: 10px; }
.wall { width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--quiet); cursor: pointer; display: grid; place-items: center; flex: none; margin-left: 2px; }
.wall:hover, .wall[aria-expanded="true"] { background: var(--card); color: var(--text); }
/* A workspace switch slides every part that belongs to the workspace (side panel, work, right panel,
   bottom halves) together, one direction, one timing; the bars, the rail and the title bar stay put. */
.body.slide-next > .side, .body.slide-next > .workcol, .body.slide-next > .rpanel, .body.slide-next .bhalf { animation: slide-next 260ms cubic-bezier(.22,.8,.24,1); }
.body.slide-prev > .side, .body.slide-prev > .workcol, .body.slide-prev > .rpanel, .body.slide-prev .bhalf { animation: slide-prev 260ms cubic-bezier(.22,.8,.24,1); }
@media (prefers-reduced-motion: reduce) { .body[class*=slide-] > *, .body[class*=slide-] .bhalf { animation: none !important; } }
.side.withdock { display: flex; flex-direction: column; padding-bottom: 8px; overflow: hidden; }
.side.withdock .sidelist { flex: 1; min-height: 0; overflow: auto; }
.sidelist.slide-next { animation: slide-next 260ms cubic-bezier(.22,.8,.24,1); }
.sidelist.slide-prev { animation: slide-prev 260ms cubic-bezier(.22,.8,.24,1); }
@keyframes slide-next { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide-prev { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
.dock { display: flex; align-items: center; gap: 4px; padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); flex: none; }
.dockrow { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; scroll-padding: 0 4px; }
.dockbtn { position: relative; width: 34px; height: 34px; flex: none; border: 0; border-radius: 9px; background: transparent; cursor: pointer; display: grid; place-items: center; }
.dockbtn .dini { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 10px var(--font-ui); background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); opacity: .75; }
.dockbtn:hover { background: var(--card); } .dockbtn:hover .dini { opacity: 1; }
.dockbtn.here { background: var(--hover); } .dockbtn.here .dini { opacity: 1; }
.dockbtn .ddot { position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px var(--panel); }
.dockbtn.add { color: var(--muted); font-size: 16px; }
@media (prefers-reduced-motion: reduce) { .sidelist.slide-next, .sidelist.slide-prev { animation: none; } }
.body.docked.act-column { grid-template-columns: 44px 240px minmax(0, 1fr) 44px; }
.body.docked.act-tabs { grid-template-columns: 240px minmax(0, 1fr) 44px; }
.body.docked.act-column.rightopen { grid-template-columns: 44px 240px minmax(0, 1fr) 300px 44px; }
.body.docked.act-tabs.rightopen { grid-template-columns: 240px minmax(0, 1fr) 300px 44px; }
/* Bottom panel: under the side panel, the work and the right panel, between the two bars; each bottom
   icon opens its own half, and one half alone takes the whole width. */
.body.docked { grid-template-rows: minmax(0, 1fr); }
.body.docked.bottomopen { grid-template-rows: minmax(0, 1fr) minmax(160px, 34%); }
.body.docked .actbar { grid-row: 1 / -1; }
.body.docked .side, .body.docked .workcol, .body.docked .rpanel { grid-row: 1; }
.bpanel { grid-row: 2; grid-column: 2 / -2; display: flex; gap: 8px; min-height: 0; }
.body.docked.act-tabs .bpanel { grid-column: 1 / -2; }
@keyframes bp-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.bhalf { flex: 1; min-width: 0; background: var(--panel); border-radius: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.bhead { display: flex; align-items: center; padding: 10px 10px 6px 14px; }
.bhead b { flex: 1; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.bbody { overflow: auto; padding: 0 12px 12px; }
.bcols { display: grid; grid-template-columns: minmax(180px, 34%) minmax(0, 1fr); gap: 14px; }
@media (prefers-reduced-motion: reduce) { .bhalf.enter { animation: none; } }
.rpanel { background: var(--panel); border-radius: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
/* Motion plays only for the part that just opened; a re-render of anything else never replays it. */
.rpanel.enter { animation: rp-in 240ms cubic-bezier(.22,.8,.24,1); }
.bhalf.enter { animation: bp-in 220ms cubic-bezier(.22,.8,.24,1); }
@keyframes rp-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.rhead { display: flex; align-items: center; padding: 12px 10px 8px 14px; }
.rhead b { flex: 1; font-size: 13px; }
.icon-x { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--quiet); cursor: pointer; }
.icon-x:hover { background: var(--card); color: var(--text); }
.rbody { overflow: auto; padding: 0 10px 12px; display: grid; gap: 8px; align-content: start; }
.ask { background: var(--card); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.asktop { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; } .asktop .quiet { color: var(--quiet); font-size: 11.5px; }
.askline { color: var(--amber); font-size: 12px; }
.askq { color: var(--text-2); font-size: 12.5px; }
.askact { display: flex; gap: 6px; margin-top: 4px; }
.btn-sm { height: 24px; padding: 0 10px; border: 0; border-radius: 7px; background: var(--hover); color: var(--text); cursor: pointer; font-size: 12px; }
.btn-sm.primary { background: var(--wash); color: var(--accent-text); }
.tadd { height: 30px; border: 0; border-radius: 8px; background: var(--window); padding: 0 10px; color: var(--text); }
.tadd::placeholder { color: var(--faint); }
.todo { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; color: var(--text-2); cursor: pointer; font-size: 13px; }
.todo input { accent-color: var(--accent); margin-top: 3px; }
.todo .done { color: var(--faint); text-decoration: line-through; }
.tree .tw { width: 12px; color: var(--quiet); font-size: 10px; flex: none; }
.gm { margin-left: auto; font: 600 10.5px var(--font-mono); color: var(--amber); }
.gm.add { color: #8fc79a; }
.chg .gm { margin-left: 0; width: 14px; flex: none; }
.chg .name { display: flex; gap: 6px; align-items: baseline; }
.cpath { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.cnum { font: 11px var(--font-mono); color: var(--quiet); flex: none; }
.hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); font-size: 11px; }
.msg { width: 100%; resize: none; border: 0; border-radius: 8px; background: var(--window); color: var(--text); padding: 8px 10px; font: 12.5px var(--font-ui); }
.msg::placeholder { color: var(--faint); }
.savebar { margin: 6px 0 4px; }
.btn-save { width: 100%; height: 28px; border: 0; border-radius: 8px; background: var(--wash); color: var(--accent-text); cursor: pointer; font-weight: 500; }
.grp { margin: 12px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--quiet); }
.sidelist.viewin { animation: view-in 180ms ease-out; }
@keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .rpanel.enter, .sidelist.viewin { animation: none; } }
.actbar { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0 6px; min-height: 0; }
.actbar .actgap { flex: 1; min-height: 12px; }

.actbar.right { padding-top: 2px; }
.actgap { flex: 1; }

.act:hover { background: var(--card); color: var(--text); }

// D: B's rail for projects; the title bar names the project and holds the workspace switcher (⌘P), one column.

function pinBtn(p, w) {

function render() {

// Hiding slides the rail out to the left while its column closes and the content follows it; showing does the

const SLIDE_MS = 260;

function go(i) { st.v = (i + NV) % NV; st.open = false; try { localStorage.setItem("proto-switcher-variant", st.v); } catch (e) {} render(); }

document.addEventListener("click", e => {
  const tb = e.target.closest("input[data-todo]"); if (tb) { st.todos[+tb.dataset.todo][1] = tb.checked; return render(); }

// A sideways swipe (two-finger trackpad or shift-wheel) over the side panel moves to the next or previous

let swipeAcc = 0, swipeDone = false, swipeQuiet = 0;
function stepPin(dir) {

  const here = pins.findIndex(x => x.w === st.w);
  const i = here < 0 ? (dir > 0 ? 0 : pins.length - 1) : (here + dir + pins.length) % pins.length;

document.addEventListener("wheel", e => {
