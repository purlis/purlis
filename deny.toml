# https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive crates Tauri pulls in (unic-*, proc-macro-error) are reported upstream, not here.
# Anything charter depends on directly still fails the check.
unmaintained = "workspace"
ignore = [
  # Every zip 4.x release is yanked. tauri-plugin-updater, up to its newest 2.x, still asks
  # for zip 4, and only on Windows, which purlis does not ship yet (docs/platforms.md). purlis's
  # own zip reader (purlis-browser-engine) is on zip 9. This entry goes when the updater moves.
  { crate = "zip@4.6.1", reason = "Windows-only dependency of tauri-plugin-updater, which still requires zip 4" },
  # The same zip 4 also has three extraction advisories from 2026-10 (SUID bits kept, symlink
  # targets outside the destination, permissions applied through symlinks), fixed only in zip 9.
  # The updater compiles zip in on Windows alone, and it extracts only an update whose minisign
  # signature it has already checked (ADR 0042). These go with the entry above (#2263).
  { id = "RUSTSEC-2026-0367", reason = "zip 4 in tauri-plugin-updater: Windows-only, extracts signed updates only (#2263)" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 in tauri-plugin-updater: Windows-only, extracts signed updates only (#2263)" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 in tauri-plugin-updater: Windows-only, extracts signed updates only (#2263)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  # Inflector, which tauri-specta uses to name the generated TypeScript.
  "BSD-2-Clause",
  # File-level copyleft, used by Servo crates under Tauri (cssparser, selectors).
  "MPL-2.0",
  # libloading, under the tray icon's Linux appindicator binding. Permissive, OSI approved
  # and FSF free — the same terms as the BSD-2-Clause already allowed, minus a clause.
  "ISC",
  # webpki-root-certs: Mozilla's CA root list, packaged as data, under the updater's HTTP
  # client (ADR 0042). It is what TLS checks the update endpoint's certificate against,
  # and the manifest is unsigned, so this list is part of what keeps a hostile network from
  # serving one. CDLA-Permissive-2.0 is the Linux Foundation's permissive licence for data: use,
  # modify and share, with no copyleft and no obligation beyond keeping the licence text.
  "CDLA-Permissive-2.0",
  # arboard and its Windows backend clipboard-win: the system clipboard a vault's Copy writes
  # to (#236). The Boost licence is permissive, OSI approved and FSF free, and asks only that
  # the licence text travel with source copies — nothing of it for a binary.
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
