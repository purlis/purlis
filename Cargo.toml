[workspace]
resolver = "3"
members = ["crates/purlis-core", "crates/purlis-cli", "crates/fake-harness", "crates/persona-statistics", "crates/extension-probe", "crates/studio-probe", "crates/check-probe", "crates/release-manifest", "crates/changelog", "crates/stand-in", "crates/session-protocol", "crates/same-user", "crates/terminal", "crates/browser-engine", "crates/host", "crates/linux-sandbox", "crates/skills", "crates/skill-grader", "crates/unicode", "crates/scale-project", "crates/crash-handler", "crates/cluster-doctor", "app/src-tauri"]
# Plain `cargo test` and `cargo clippy` cover the crates that need no built frontend.
# The app crate compiles `app/dist` into itself, so it is checked through `npm run tauri`.
default-members = ["crates/purlis-core", "crates/purlis-cli", "crates/fake-harness", "crates/persona-statistics", "crates/extension-probe", "crates/studio-probe", "crates/check-probe", "crates/release-manifest", "crates/changelog", "crates/stand-in", "crates/session-protocol", "crates/same-user", "crates/terminal", "crates/browser-engine", "crates/host", "crates/linux-sandbox", "crates/skills", "crates/skill-grader", "crates/unicode", "crates/scale-project", "crates/crash-handler", "crates/cluster-doctor"]
# Third-party crates patched in below, under their own licences: built as dependencies, never
# linted or tested as the workspace's own (vendor/tauri-plugin-wdio-webdriver/PURLIS.md).
exclude = ["vendor"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/purlis/purlis"

[workspace.dependencies]
purlis-core = { path = "crates/purlis-core" }
# What each release of the app brought: About Charter and the release body both read it.
changelog = { path = "crates/changelog" }
# Test-only: the one way a test writes a program it is about to run (charter-app#81).
stand-in = { path = "crates/stand-in" }
# Whether a socket's peer, a directory or a file is this user's alone (FD-6).
purlis-same-user = { path = "crates/same-user" }
# A program in its own pseudo-terminal and the engine that keeps its screen, linked without the
# rest of the core: a session host owns terminals with it alone (#1995).
purlis-terminal = { path = "crates/terminal" }
# The session host (`purlisd`): its socket, credentials and the protocol it serves, linked by the
# window and by `purlis serve` without the rest of the core (#1997).
purlis-host = { path = "crates/host" }
purlis-browser-engine = { path = "crates/browser-engine" }
# purlis's own sandbox on Linux: Landlock, a seccomp filter and its supervisor (#1040).
purlis-linux-sandbox = { path = "crates/linux-sandbox" }
# The app's out-of-process crash handler (#5691, ruling O9): a companion process that writes a
# minidump of a native crash for Reports to send on the next launch.
purlis-crash-handler = { path = "crates/crash-handler" }
# What a cluster lacks for the cluster operator, shared with the operator's own doctor (#4492).
purlis-cluster-doctor = { path = "crates/cluster-doctor" }
# What a chat's skill set is, and why: the one crate that works skills out (SK-1, #2764).
purlis-skills = { path = "crates/skills" }
# purlis's one rule for a character a reader does not see, and its one mark, generated (SK-49).
purlis-unicode = { path = "crates/unicode" }
# The session protocol, whose browser acts a chat's browser tools also speak (#2013).
purlis-session-protocol = { path = "crates/session-protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# The terminal a chat runs in; fake-harness opens one the way the host does (`--leave-terminal`).
portable-pty = "0.9"

[workspace.lints.rust]
# `deny`, not `forbid`, for exactly five audited blocks, each by the operator's ruling:
# 1. `purlis_core::executor::inherit_nothing_else`, the `pre_exec` that closes every inherited
#    descriptor in an extension's program (2026-09-23: "Allow one audited block");
# 2. `purlis_same_user`'s `ancestry::pidinfo::read`, the `proc_pidinfo` call that reads a
#    process's parent and start time in-process on macOS instead of running `/bin/ps`
#    (D-1407-8, 2026-10-07: a second audited block, in purlis-same-user, for `proc_pidinfo`).
# 3. `purlis_linux_sandbox`'s `linux::notify::raw`, the seccomp notification calls of the Linux
#    sandbox's supervisor (2026-10-16, #1040: one more small, isolated, audited module).
# 4. `purlis-app`'s `specimen::photograph::snapshot`, WebKit's snapshot of the theme specimen's
#    webview on macOS (2026-10-17, #2330: a fourth audited block, for the specimen snapshot).
# 5. `purlis-crash-handler`'s `attach::on_crash`, the one call of crash-handler's `unsafe fn`
#    `make_crash_event` that attaches the native crash handler (2026-11-10, #5691: the operator's
#    "go" to own minidumper-child's glue, at the cost of one commented `unsafe` call).
# `forbid` cannot be allowed anywhere, even there.
# `crates/purlis-core/tests/it/five_unsafe_blocks.rs` fails the build if `unsafe` or an allow of
# this lint appears anywhere else.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Named rather than left to `all`, so that what the `clippy.toml` files disallow is refused
# and not merely mentioned. It does nothing in a crate with no `clippy.toml` to configure it.
disallowed_methods = "deny"
# The same, for the macros a `clippy.toml` names: `eprintln!` in purlis-core and the app (#647).
disallowed_macros = "deny"
# Each audited `unsafe` block says why it is sound, and so would any other.
undocumented_unsafe_blocks = "deny"

# Debug info that says which file and line, and nothing about variables. A `cargo test` links
# over two hundred test binaries, and each one carries the full debug info of every crate it
# links; that is most of what linking them costs and most of what a `target/` weighs. A panic's
# backtrace reads the same with line tables. A debugger shows no variables, so a session that
# wants one asks for them for that build: `CARGO_PROFILE_DEV_DEBUG=full cargo build`.
[profile.dev]
debug = "line-tables-only"

# persona-statistics is an extension's program, and charter hashes an extension's whole directory
# and refuses one past 64 MiB (`extension::MOST_TREE_BYTES`). It links purlis-core, and on Linux a
# debug build carries every crate's debug info inside the binary, which is past that. Its tests
# run the debug build through the real registry, so the debug build is stripped of debug info,
# as the release build is.
[profile.dev.package.persona-statistics]
strip = "debuginfo"

# What every mutant of the nightly mutation run is built with, chosen by `profile = "mutants"` in
# `.cargo/mutants.toml` (the cargo-mutants book's own recommendation). The test profile without
# debug info: on 2026-10-03 a mutant's build was 90-120 s of its 131 s, most of it linking
# purlis-core's test binaries, and no mutation verdict reads a backtrace (#1200).
[profile.mutants]
inherits = "test"
debug = "none"

# `panic = "unwind"`, so that an Objective-C exception AppKit raises under one of tao's callbacks
# (a paste's `sendEvent:`) unwinds to NSApplication, which reports it and goes on; under
# `abort` it took the app down (tao#1354, ADR 0092 amended 2026-11-03). A Rust panic still ends
# the process: each shipped binary calls `purlis_core::panicend::fatal` first in its `main`.
#
# Thin LTO across sixteen codegen units, the link every dev channel build already ships with:
# one fat pass over one unit no longer fit the hosted runners (the macOS job past its 90 minutes,
# the Linux runner shut down mid-link), every night from 2026-11-02 (#4833, ADR 0092 amended
# 2026-11-06).
#
# Line tables in a packed dSYM beside each binary, and the binary itself still stripped: what the
# Report intake symbolicates a native crash's stack with, sent by `release.yml`'s `symbols` job
# and never shipped in a bundle (#5692, ADR 0092 amended 2026-11-10).
[profile.release]
codegen-units = 16
debug = "line-tables-only"
lto = "thin"
opt-level = 3
panic = "unwind"
split-debuginfo = "packed"
strip = true

# The app crate is optimised at level 1, everything else at `release`'s 3 (ADR 0092 amended
# 2026-11-07, #5277). At 3, `purlis_app_lib` alone took one rustc to 14.4 GB, past a 16 GB
# runner with the rest of the build beside it; at 1 the whole build peaked at 6.6 GB, with cold
# start and the outcome bars unchanged. `dev-release` inherits this table with the rest.
[profile.release.package.purlis-app]
opt-level = 1

# What a dev channel build is compiled with (ADR 0092, #1429). It inherits `release`, whose link
# is now the same thin LTO across sixteen codegen units (ADR 0092 amended 2026-11-06), so the two
# differ only in the name a build reports. `opt-level`, `panic`, `strip` and the app crate's
# `opt-level` above are `release`'s, by inheritance, and nothing else may be set here. A stable
# build, a build started by hand and the nightly profile guard all use `release` itself.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16

# The scenario tests' embedded WebDriver server (the app's `e2e` feature only, in no build anyone
# is given), patched so a window holding an artifact's child webview stays reachable: upstream
# 1.5.1 loses any window with a second webview in it (vendor/tauri-plugin-wdio-webdriver/PURLIS.md).
[patch.crates-io]
tauri-plugin-wdio-webdriver = { path = "vendor/tauri-plugin-wdio-webdriver" }
