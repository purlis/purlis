[workspace]
resolver = "3"
members = ["crates/purlis-core", "crates/purlis-cli", "crates/fake-harness", "crates/persona-statistics", "crates/extension-probe", "crates/studio-probe", "crates/release-manifest", "crates/changelog", "crates/stand-in", "crates/session-protocol", "crates/same-user", "crates/terminal", "crates/browser-engine", "crates/host", "crates/linux-sandbox", "crates/skills", "crates/unicode", "app/src-tauri"]
# Plain `cargo test` and `cargo clippy` cover the crates that need no built frontend.
# The app crate compiles `app/dist` into itself, so it is checked through `npm run tauri`.
default-members = ["crates/purlis-core", "crates/purlis-cli", "crates/fake-harness", "crates/persona-statistics", "crates/extension-probe", "crates/studio-probe", "crates/release-manifest", "crates/changelog", "crates/stand-in", "crates/session-protocol", "crates/same-user", "crates/terminal", "crates/browser-engine", "crates/host", "crates/linux-sandbox", "crates/skills", "crates/unicode"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/purlis/purlis"

[workspace.dependencies]
purlis-core = { path = "crates/purlis-core" }
# What each release of the app brought: About Charter and the release body both read it.
changelog = { path = "crates/changelog" }
# Test-only: the one way a test writes a program it is about to run (charter-app#81).
stand-in = { path = "crates/stand-in" }
# Whether a socket's peer, a directory or a file is this user's alone (FD-6).
purlis-same-user = { path = "crates/same-user" }
# A program in its own pseudo-terminal and the engine that keeps its screen, linked without the
# rest of the core: a session host owns terminals with it alone (#1995).
purlis-terminal = { path = "crates/terminal" }
# The session host (`purlisd`): its socket, credentials and the protocol it serves, linked by the
# window and by `purlis serve` without the rest of the core (#1997).
purlis-host = { path = "crates/host" }
purlis-browser-engine = { path = "crates/browser-engine" }
# purlis's own sandbox on Linux: Landlock, a seccomp filter and its supervisor (#1040).
purlis-linux-sandbox = { path = "crates/linux-sandbox" }
# What a chat's skill set is, and why: the one crate that works skills out (SK-1, #2764).
purlis-skills = { path = "crates/skills" }
# purlis's one rule for a character a reader does not see, and its one mark, generated (SK-49).
purlis-unicode = { path = "crates/unicode" }
# The session protocol, whose browser acts a chat's browser tools also speak (#2013).
purlis-session-protocol = { path = "crates/session-protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# The terminal a chat runs in; fake-harness opens one the way the host does (`--leave-terminal`).
portable-pty = "0.9"

[workspace.lints.rust]
# `deny`, not `forbid`, for exactly four audited blocks, each by the operator's ruling:
# 1. `purlis_core::executor::inherit_nothing_else`, the `pre_exec` that closes every inherited
#    descriptor in an extension's program (2026-09-23: "Allow one audited block");
# 2. `purlis_same_user`'s `ancestry::pidinfo::read`, the `proc_pidinfo` call that reads a
#    process's parent and start time in-process on macOS instead of running `/bin/ps`
#    (D-1407-8, 2026-10-07: a second audited block, in purlis-same-user, for `proc_pidinfo`).
# 3. `purlis_linux_sandbox`'s `linux::notify::raw`, the seccomp notification calls of the Linux
#    sandbox's supervisor (2026-10-16, #1040: one more small, isolated, audited module).
# 4. `purlis-app`'s `specimen::photograph::snapshot`, WebKit's snapshot of the theme specimen's
#    webview on macOS (2026-10-17, #2330: a fourth audited block, for the specimen snapshot).
# `forbid` cannot be allowed anywhere, even there.
# `crates/purlis-core/tests/four_unsafe_blocks.rs` fails the build if `unsafe` or an allow of
# this lint appears anywhere else.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Named rather than left to `all`, so that what the `clippy.toml` files disallow is refused
# and not merely mentioned. It does nothing in a crate with no `clippy.toml` to configure it.
disallowed_methods = "deny"
# The same, for the macros a `clippy.toml` names: `eprintln!` in purlis-core and the app (#647).
disallowed_macros = "deny"
# Each audited `unsafe` block says why it is sound, and so would any other.
undocumented_unsafe_blocks = "deny"

# Debug info that says which file and line, and nothing about variables. A `cargo test` links
# over two hundred test binaries, and each one carries the full debug info of every crate it
# links; that is most of what linking them costs and most of what a `target/` weighs. A panic's
# backtrace reads the same with line tables. A debugger shows no variables, so a session that
# wants one asks for them for that build: `CARGO_PROFILE_DEV_DEBUG=full cargo build`.
[profile.dev]
debug = "line-tables-only"

# persona-statistics is an extension's program, and charter hashes an extension's whole directory
# and refuses one past 64 MiB (`extension::MOST_TREE_BYTES`). It links purlis-core, and on Linux a
# debug build carries every crate's debug info inside the binary, which is past that. Its tests
# run the debug build through the real registry, so the debug build is stripped of debug info,
# as the release build is.
[profile.dev.package.persona-statistics]
strip = "debuginfo"

# What every mutant of the nightly mutation run is built with, chosen by `profile = "mutants"` in
# `.cargo/mutants.toml` (the cargo-mutants book's own recommendation). The test profile without
# debug info: on 2026-10-03 a mutant's build was 90-120 s of its 131 s, most of it linking
# purlis-core's test binaries, and no mutation verdict reads a backtrace (#1200).
[profile.mutants]
inherits = "test"
debug = "none"

# What CI builds and runs the Rust suite with (`ci.yml`, `rust`): the test profile, so debug
# assertions and overflow checks stay on, at opt-level 1 for the workspace and 2 for its
# dependencies. Unoptimised, the suite's CPU-bound tests (the theme engine's colour tuning, the
# browser engine's large pages, the guards' linear-time bounds) took 4.3x the CPU they take at
# opt-level 1, and their summed time on a runner went from 24 to 102 minutes between 2026-10-11
# and 10-27 while the test count rose 60%. Dependencies change rarely and come from the Rust
# cache, so their optimisation costs a build only when Cargo.lock moves.
[profile.ci-test]
inherits = "test"
opt-level = 1

[profile.ci-test.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# What a dev channel build is compiled with (ADR 0092, #1429). `release` with a lighter link:
# thin LTO across sixteen codegen units instead of one fat pass over one unit. `opt-level`,
# `panic` and `strip` are `release`'s, by inheritance, and nothing else may be set here. A stable
# build, a build started by hand and the nightly profile guard all use `release` itself.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16
