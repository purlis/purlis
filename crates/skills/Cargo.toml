[package]
name = "purlis-skills"
description = "What a chat's skill set is, and why: the skills model, the effective set each chat gets with the route and origin of every skill, and the reason each left-out skill is left out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# A project skill's `<name>.toml` beside its folder (ADR 0099 §2).
toml = { version = "1.1", features = ["preserve_order"] }
# ... and written keeping every other key and comment in it.
toml_edit = "0.25"
serde.workspace = true
# A `SKILL.md`'s frontmatter, parsed as the YAML it is before purlis hands a harness only the keys
# it knows to be safe (SK-8, #2771). Pure Rust; no encodings beyond UTF-8.
yaml-rust2 = { version = "0.13", default-features = false }
# A grant is written beside the file and renamed over it, never half-written.
tempfile.workspace = true

# A skill's folder and its `SKILL.md` are opened through the handle of the folder above them,
# never through a link (SK-36).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
# `moving::hook`, a test's way into a move at the instants a swap would land, for another crate's
# tests of what moves a skill (purlis-core's delete and restore, SK-48). Only tests turn it on.
test-support = []

[lints]
workspace = true
