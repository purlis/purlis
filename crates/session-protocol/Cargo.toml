[package]
name = "purlis-session-protocol"
version.workspace = true
description = "charter's session protocol: versioned, multiplexed, flow-controlled, over any ordered byte stream"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The runtime the host and the app already use, and its own codec and compat crates.
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
futures = "0.3"
bytes = "1"
# A keystroke that is not UTF-8 crosses the session protocol's JSON whole, as base64 (FD-26).
base64 = "0.23"
# The multiplexer (ADR 0068 §4): Yamux, per-stream credit over one ordered byte stream.
yamux = "0.14"
# Each scope's credential (FD-6): minted from the OS generator, proved by an HMAC-SHA256 over
# a fresh challenge, compared in constant time, written by a rename from a `0600` temporary
# file through the checked directory's descriptor (`purlis_same_user::PrivateDirectory`, #992).
# The same crates purlis-core mints and checks a chat's token and keys its MACs with.
getrandom = "0.4"
subtle = "2"
hmac = "0.13"
sha2 = "0.11"
# The link between two hosts (ADR 0078 §3, #2042): Noise `XX`, `25519_ChaChaPoly_BLAKE2s`,
# through the crate ADR 0078 names, with only that suite's primitives built in. Licence
# Apache-2.0 OR MIT. Added by the operator's ruling of 2026-10-15.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
# A link key's private half is wiped from memory when it is dropped.
zeroize = "1"

[target."cfg(unix)".dependencies]
# Whether a connection's peer, and the credentials' directory and files, are this user's alone
# (FD-6): the same checks as each plane's hook socket.
purlis-same-user.workspace = true

[features]
# `link::serve_any`: serve a link over any stream, skipping the uid check. For this crate's own
# tests only, which turn it on from `[dev-dependencies]`, so no build of the host has it. CI's
# `tools/release-features.mjs` fails a change that puts it in a release build (#2216).
any-stream = []
# `charter-session-bench`'s runtime, the one the crate's tests use (SC-16). Only the bench asks for
# it, so the library's own dependencies stay what its users ask for.
bench = ["tokio/rt-multi-thread"]

[[bin]]
name = "charter-session-bench"
required-features = ["bench"]

[dev-dependencies]
purlis-session-protocol = { path = ".", features = ["any-stream"] }
# The heap of the test process, measured, so a memory bound is a measured one.
dhat = "0.3"
# The multiplexer's own constants, for the bounds the tests compute.
yamux = "0.14"
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"] }

# Every integration test but two as modules of one binary (#3613, #3752): each `tests/*.rs` was a
# binary of its own that linked the whole graph, 37 of them. `tests/it/main.rs` fails on a `.rs`
# left straight under `tests/`, and on a file in `tests/it/` it does not name. The two dhat
# tests stay binaries of their own, found by Cargo as before: their allocator is the process's.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
