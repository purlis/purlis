[package]
name = "purlis-browser-engine"
description = "The engine a browser runs on: a pinned Chrome for Testing, verified before it runs, started over an inherited pipe with no port, and ended with its host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# A failure purlis cannot answer to anyone is a warning in the host's log (#2839): the crate
# the core already links, so the tree gains no crate.
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# The archive's digest, checked against the pin before a byte of it is unpacked.
sha2 = "0.11"
# An engine manifest that did not ship inside this build is taken only with a Sigstore bundle
# that verifies offline against the trusted root this build ships (ADR 0042, amended for #2073).
# Sigstore's own Rust verifier, without its default crypto backend (aws-lc) or any HTTP client:
# its cryptography is `ring`, which rustls already links, through `sigstore-crypto`'s provider,
# and RustCrypto's P-256 for the one check `ring` does not offer: an ECDSA signature over a
# digest, which is how Sigstore checks the signature over a signed file.
# Pinned exactly: it is before 1.0, so a new release is read before it is taken.
sigstore-verify = { version = "=0.15.0", default-features = false }
ring = "0.17"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# Chrome for Testing ships as a zip. Only the deflate reader, on the zlib-rs backend flate2
# already links; the one crate it adds is typed-path, its path handling.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The one download: core's own client and features, so the tree gains no crate.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
# When a manifest was issued, read as RFC 3339.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# A screenshot's blanked fields are painted over in purlis, not in the page: the engine's PNG is
# decoded and encoded again. The version the app's icons already link, so the tree gains no crate.
png = "0.18"
# Which site a page is on (its registrable domain, by the public suffix list), so a screenshot
# paints over what it cannot read only on the site a text was kept out on (#2303, the person's
# ruling of 2026-10-17). The list is compiled in; no download.
psl = "2.1"
# A screenshot arrives from the engine as base64. The workspace's version.
base64 = "0.23"
# A login's values are wiped from memory when the login is dropped (#2016). The workspace's
# version, already in the tree through `secrecy`.
zeroize = "1"

[target."cfg(unix)".dependencies]
# A data folder is this user's alone: the repo's one copy of that check.
purlis-same-user.workspace = true
# posix_spawn with dup2 file actions puts the DevTools pipe at descriptors 3 and 4 without a
# `pre_exec` (the workspace denies `unsafe`); killpg ends the engine's process group. The
# version purlis-same-user already links, so the tree gains no crate.
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal"] }

[features]
# What only the crate's own tests reach (#2028): never built into purlis.
test-support = []

[dev-dependencies]
# The crate's own tests build it with what only they reach.
purlis-browser-engine = { path = ".", features = ["test-support"] }
tempfile.workspace = true
minisign = "0.10"
stand-in.workspace = true

[lints]
workspace = true
