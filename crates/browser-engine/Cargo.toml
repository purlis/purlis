[package]
name = "purlis-browser-engine"
description = "The engine a browser runs on: a pinned Chrome for Testing, verified before it runs, started over an inherited pipe with no port, and ended with its host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# The archive's digest, checked against the pin before a byte of it is unpacked.
sha2 = "0.11"
# The signature over an engine manifest that did not ship inside this build (ADR 0042's tool).
minisign-verify = "0.2"
# Chrome for Testing ships as a zip. Only the deflate reader, on the zlib-rs backend flate2
# already links; the one crate it adds is typed-path, its path handling.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The one download: core's own client and features, so the tree gains no crate.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
# When a manifest was issued, read as RFC 3339.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# A screenshot's blanked fields are painted over in purlis, not in the page: the engine's PNG is
# decoded and encoded again. The version the app's icons already link, so the tree gains no crate.
png = "0.18"
# A screenshot arrives from the engine as base64. The workspace's version.
base64 = "0.23"

[target."cfg(unix)".dependencies]
# A data folder is this user's alone: the repo's one copy of that check.
purlis-same-user.workspace = true
# posix_spawn with dup2 file actions puts the DevTools pipe at descriptors 3 and 4 without a
# `pre_exec` (the workspace denies `unsafe`); killpg ends the engine's process group. The
# version purlis-same-user already links, so the tree gains no crate.
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal"] }

[dev-dependencies]
tempfile.workspace = true
minisign = "0.10"
stand-in.workspace = true

[lints]
workspace = true
