<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Two-step sign-in</title></head>
<body>
  <h1>Two-step sign-in</h1>
  <!-- The site's own verifier is its server (`/verify-code`): no seed is in this page. -->
  <form action="/verify-code" method="get">
    <label>Authentication code
      <input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
    <button type="submit">Verify</button>
  </form>
</body></html>
