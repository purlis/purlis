<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A frame that moves to another site</title>
<style>
  body { margin: 0; }
  iframe { position: absolute; left: 0; top: 100px; width: 300px; height: 150px; border: 0; }
</style></head>
<body>
  <p>The page's own text</p>
  <iframe title="Moving frame" src="/opened.html"></iframe>
  <script>
    // Half a second after the load, the frame goes to another site: a process of its own.
    addEventListener('load', () => {
      setTimeout(() => {
        document.querySelector('iframe').src = 'http://other.test/advert.html';
      }, 500);
    });
  </script>
</body></html>
