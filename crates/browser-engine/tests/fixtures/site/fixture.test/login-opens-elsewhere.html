<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
  <h1>Sign in</h1>
  <form action="account.html" method="get">
    <label>User name <input name="username" autocomplete="username"></label>
    <label>Password <input type="password" name="password" id="password"></label>
    <button type="submit">Sign in</button>
  </form>
  <script>
    // Sent, it opens a window on another site, one it can reach, and the form goes on.
    document.getElementById('password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') window.open('http://other.test/landed.html', 'beside');
    });
  </script>
</body></html>
