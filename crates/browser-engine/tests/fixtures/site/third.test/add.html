<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>An inner pad</title>
<style>
  body { margin: 0; background: white; }
  button { margin: 10px; width: 80px; height: 36px; }
</style></head>
<body>
  <p id="count">Count: 0</p>
  <button onclick="const c = document.getElementById('count'); c.textContent = 'Count: ' + (Number(c.textContent.slice(7)) + 1)">Add one</button>
</body></html>
