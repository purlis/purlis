<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Drawn apart</title>
<style>
  body { margin: 0; }
  canvas, img { display: block; margin: 8px; }
</style></head>
<body>
  <canvas id="drawn" width="300" height="60" aria-hidden="true"></canvas>
  <img id="copied" width="300" height="60" alt="">
  <script>
    // The page draws into a canvas, and copies the canvas into an image.
    const canvas = document.getElementById('drawn');
    const pen = canvas.getContext('2d');
    pen.fillStyle = 'rgb(255, 0, 0)';
    pen.fillRect(0, 0, 300, 60);
    document.getElementById('copied').src = canvas.toDataURL();
  </script>
</body></html>
