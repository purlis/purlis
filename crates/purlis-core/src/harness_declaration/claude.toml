# Claude Code, as charter ships it (ADR 0073 §3). Read by the same reader as a project's
# `harnesses/<name>.toml`; a project may not take this name.
#
# Every fact here was measured on one version of Claude Code, and this file is where purlis reads
# it: `Harness` answers each from here (`crates/purlis-core/src/harness.rs`, FD-14b).
name = "claude"
title = "Claude Code"
program = "claude"
# `CLAUDE_CONFIG_DIR`, `CLAUDE_CODE_*`.
env = ["CLAUDE_*"]
login = "set CLAUDE_CONFIG_DIR and run /login inside Claude Code"
tested = "2.1.283"

[session]
# `--session-id` is reported at SessionStart as given (Claude Code 2.1.272, C1).
chosen_by = "purlis"
new = ["--session-id", "{id}", "--name", "{name}"]
resume = ["--resume", "{id}", "--name", "{name}"]
named_by = ["--session-id", "--resume", "-r", "--continue", "-c", "--fork-session"]

[terminal]
# ESC CR is a new line in the input, unsent (SI-4).
newline = "\u001b\r"
# `[Pasted text #N +M lines]` over 800 characters or at 4 lines or more.
paste_drawn_whole = { lines = 3, chars = 800 }
ready_to_type = "on-start"

[levels]
terminal = true
# The bundled plugin, loaded for this session alone (ADR 0050).
hooks = true

[sign_in]
# A Claude plan through Claude Code's own /login; an Anthropic key; Bedrock or Vertex.
kinds = ["subscription", "api-key", "cloud"]
# Read out of its sandbox as purlis compiles it (#2037): purlis denies its sign-in file in the
# config folder to the commands its Bash tool runs and to its Read and Edit tools.
kept_from_commands = "no: on macOS and on a runner purlis cannot keep Claude Code's sign-in from the commands it runs"

[folders]
# Its settings, its sign-in and its conversations.
config_env = "CLAUDE_CONFIG_DIR"

[conversation]
# One transcript per session, under a folder named after the directory it ran in: `{cwd_key}`,
# made again from the chat's directory where it comes back (`harness_declaration::cwd_key`).
file = "{config}/projects/{cwd_key}/{id}.jsonl"

[capabilities]
reports_its_process = "yes"
reports_its_start_before_the_first_prompt = "yes"
keeps_conversations_by_directory = "yes"
reports_waiting = "yes"
resumes_by_id = "yes"
per_chat_plugins = "yes"
mcp_servers = "yes"
