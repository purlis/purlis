# The limits key table (M75 slice 08; spec §5.1; review round 3, C3 S5).
#
# Every `[policy.limits]` key, named one by one: spec §5.1's wildcards `asks.cool-off-*` and
# `runners.pool-*` are expanded, one key per number today. Slice 12 types `[policy.limits]`
# against this table, so a key that is not here makes the file broken.
#
# - `key`: `<family>.<kebab>`. `dispatch.*` keep `dispatchlimits::Limit::key()`'s spellings
#   (Q315.4); the other names are proposed (review round 1).
# - `shipped`: the value in the shipped default, today's value: a whole number in `unit`;
#   "none" for no cap (off until set); "by-memory" for a value read from the device's memory.
# - `loosens`: the direction that loosens it, "raised" or "lowered" (review round 1, S-B8). The
#   value in force is the stricter of committed and accepted.
# - `source`: the ruling that names the key.
# - `inventory`: the #6970 row it comes from, which `docs/research/policy-inventory-map.tsv`
#   maps to a key of this table; empty for a key no row of the inventory holds.
#
# `tests/it/every_inventory_row_is_mapped.rs` checks it.

