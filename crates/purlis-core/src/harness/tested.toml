# The shipped table of corrections and loss lists (design §3.11, T1a-33, #6782), read by
# `purlis_core::harness::tested`. One `[[entry]]` per harness × model provider declaration
# (× model pattern, where a model behaves apart from its provider's others):
#
#   harness         a harness purlis ships: claude, codex, opencode
#   provider        a model provider declaration's id
#   model           optional: a model pattern
#   grade           optional, only where it overrides the rule: blocked, native, supported, degraded
#   losses          what the pair loses, each a word; the window's words for one are window copy
#   source          required: "measured on <YYYY-MM-DD>, <harness version>" or "reported: <link>"
#   asks_for_usage  a Chat Completions pair only, and required there
#
# An entry names no wire format: the pair's is the first of the harness's `[route] formats`
# (`harness_declaration/<name>.toml`) that the provider serves, and a pair sharing none is
# refused.
# A harness's last tested version is its declaration's `tested` field
# (`harness_declaration/<name>.toml`), never restated here.

# Claude Code × Anthropic: the losses behind a base URL that isn't Anthropic's, which the key
# proxy's route is (D6640-R2 §18). purlis never sets the fast-mode skip variable.
[[entry]]
harness = "claude"
provider = "anthropic"
losses = [
  # Background tasks run on the main model unless the `haiku` variable names one.
  "background-on-main-model-unless-haiku",
  # Remote Control and voice dictation are off.
  "remote-control-and-voice-off",
  # `/fast` says it is disabled by the organization.
  "fast-disabled",
  # Fine-grained tool streaming is off.
  "tool-streaming-off",
  # `/feedback` saves locally.
  "feedback-local",
  # The HIPAA configuration doesn't cover the session.
  "hipaa-not-covered",
]
source = "reported: https://code.claude.com/docs/en/llm-gateway-protocol"
