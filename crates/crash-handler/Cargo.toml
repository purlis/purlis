[package]
name = "purlis-crash-handler"
description = "The app's out-of-process crash handler (ADR 0083, ruling O9): a companion process that writes a minidump when the app crashes natively, for Reports to send on the next launch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# No dependency on purlis-core but for a test: the handler is a process of its own, started again from the app's
# binary, and it only writes a file. Reports reads the file on the next launch.
[dependencies]
# The companion process and the crash handler it attaches, over EmbarkStudios' crash-handler and
# minidumper (and rust-minidump's minidump-writer under it): pure Rust, macOS, Windows and Linux in
# one, the stack sentry-rust-minidump and tauri-plugin-sentry use. The glue between them is ours
# (#5691): crash-handler 0.8 answers a crashing child's exception as unhandled, which 0.7 did not.
# Its one `unsafe` call, `make_crash_event`, is the workspace's fifth audited block.
crash-handler = "0.8"
minidumper = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# A real crash's minidump, made here, is what Reports takes its stack out of: the test that only
# that stack leaves (ruling (b), #5691) is here, where real crashes are made, not in the core.
purlis-core.workspace = true
# To read the memory a real minidump holds, and show none of it is in the report.
minidump = "0.27"
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
