[package]
name = "release-manifest"
version.workspace = true
description = "The updater manifest a release publishes, and the guards it has to pass first"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# The release workflow runs `cargo run -p release-manifest`; `weekly-users` is the other bin.
default-run = "release-manifest"

[dependencies]
purlis-core.workspace = true
serde_json.workspace = true
# The verifier tauri-plugin-updater itself uses, at the version already in Cargo.lock through
# it — so what this refuses at release time is exactly what the app would refuse on a laptop.
minisign-verify = "0.3"
# `sign-runner-image` signs the runner image's line with the updater's key in the release
# environment (#2749); the tests make a keypair in memory and throw it away, so no key and
# nothing derived from one is ever committed to this repository.
minisign = "0.10"

[lints]
workspace = true
