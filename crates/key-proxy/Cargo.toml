[package]
name = "purlis-key-proxy"
description = "purlis's key proxy: a listener per run on 127.0.0.1 that a harness sends its model calls to, on a two-thread runtime of its own (V36's shared passthrough crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Linked by the desktop's binary (`purlis-app`, whose session host starts it) and the runner's
# (`purlis`), never by the session host's crate: `purlis-host` starts it through a trait the
# binary supplies (`purlis_host::ProxiesKeys`), so the host links no HTTP code.
[dependencies]
# Its own runtime: two worker threads, named, never the host's current-thread runtime (R-054).
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
# hyper's own HTTP/1 server connection is the parser (D6640-C2 §1): no framing parser of its own.
hyper = { version = "1.12", features = ["client", "http1", "server"] }
# `client-proxy-system`: the outbound proxy is hyper-util's own matcher, `Matcher::from_system()`,
# reading the proxy variables of this process's environment and then the OS's proxy settings, no
# PAC file (T1a-60, C-16).
hyper-util = { version = "0.1.21", features = ["client-proxy", "client-proxy-system", "tokio"] }
http-body-util = "0.1"
bytes = "1"
# How an upstream is reached (T1a-60): purlis-core's `Outbound` connects, and its
# `upstream::trust` client verifies against the OS trust store (R-056), one path for both
# binaries; the window's copy for what a failure names (W81); and a run's route with the checks
# of each request against it, core's allowlist and URL join (T1a-08).
purlis-core.workspace = true
# TLS to the upstream on that client config: the rustls purlis-core links, on `ring`, and
# tokio-rustls with no provider of its own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
# The Messages error shape a failure is answered in, its `purlis:` message escaped as JSON.
serde_json.workspace = true
# The run's 256-bit token, from the operating system's generator: the version
# purlis-session-protocol already links.
getrandom = "0.4"
# The token's comparison in constant time (R-063): the version rustls and ring already bring.
subtle = "2.6"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
