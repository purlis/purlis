[package]
name = "purlis-host"
version.workspace = true
description = "purlis's session host (`purlisd`): its socket, its credentials and the session protocol it serves"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Not purlis-core: the host is linked by the app and by `purlis serve`, and what it adds to
# either is the session protocol and the same-user checks, nothing of git, HTTP or the keyring
# (`tests/it/the_host_links_no_git_http_or_keyring_code.rs`).
[dependencies]
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[target."cfg(unix)".dependencies]
purlis-session-protocol = { path = "../session-protocol" }
# The programs it hosts: each in a terminal of its own, with nothing of git, HTTP or the keyring
# (#1995), its views followed without a thread (#1998).
purlis-terminal.workspace = true
bytes = "1"
futures = "0.3"
# A program's id where the client names none: a ULID, as a chat's is (ADR 0066). The version
# the core mints chats' with.
ulid = "3"
# The digest of the name a window keeps, which a relay names the window by to the other host,
# never the name (#2623): the version purlis-session-protocol already links.
sha2 = "0.11"
purlis-same-user.workspace = true
# The lines a held project's hooks write, handed on to the window as they are (#2000).
serde_json.workspace = true
# The host record's lines (#2007).
serde.workspace = true
# `O_NOFOLLOW` for the host's lock and its host record, and the signal that ends what a host
# left running (#2007): the version purlis-same-user already links.
nix = { version = "0.31", default-features = false, features = ["fs", "signal"] }
# Where a bundle of code is kept while it crosses the link (#2046), removed with it.
tempfile.workspace = true

[features]
# `standin`: a program that stands in for a terminal's, for tests of what drives the host.
test-support = []

[dev-dependencies]
purlis-host = { path = ".", features = ["test-support"] }
# In-memory links for the tests of what the host does with its programs (`link::serve_any`).
purlis-session-protocol = { path = "../session-protocol", features = ["any-stream"] }
tempfile.workspace = true
serde_json.workspace = true
bytes = "1"
# `test-util`: a link renewed ahead of its limit, an hour on, in the runtime's virtual time.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }

# Every integration test as a module of one binary (#3613, #3752): each `tests/*.rs` was a binary
# of its own that linked the whole graph, 32 of them. `tests/it/main.rs` fails on a `.rs` left
# straight under `tests/`, and on a file in `tests/it/` it does not name.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
